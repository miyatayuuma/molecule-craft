name: Resonance visual inspection frames

on:
  push:
    branches:
      - work/nitro-ozone-resonance-visual-polish

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Upload focused visual frames
        uses: actions/upload-artifact@v4
        with:
          name: resonance-visual-inspection
          path: test-results
          if-no-files-found: error
          retention-days: 7
      - name: Remove local captures and temporary workflow
        run: |
          git rm -r test-results .github/workflows/resonance-visual-inspection.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove local browser validation captures"
          git push origin HEAD:work/nitro-ozone-resonance-visual-polish
