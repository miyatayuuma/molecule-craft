name: Temporary workspace target persistence validation

on:
  push:
    branches:
      - fix/craft-workspace-target-id

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Workspace persistence regressions
        run: |
          node tests/workspace-save.test.mjs
          node tests/workspace-persistence.test.mjs
      - name: Refresh generated PWA if source hash changed
        run: |
          if ! node scripts/build-precache.mjs --check; then
            node scripts/build-precache.mjs
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add precache-manifest.js sw.js
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m "Refresh PWA for workspace target validation"
              git push origin HEAD:fix/craft-workspace-target-id
            fi
          fi
      - name: Verify generated PWA
        run: |
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
      - name: Diff whitespace
        run: git diff --check origin/main...HEAD
