name: Temporary regenerate chemistry visual assets
on:
  push:
    branches:
      - task/encyclopedia-chemistry-detail-visual-grammar-work
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Regenerate collection assets
        run: |
          node scripts/build-collection-assets.mjs
          git diff --exit-code origin/main -- assets/models/molecule-sulfur-dioxide.svg assets/models/molecule-sulfur-trioxide.svg assets/models/molecule-sulfuric-acid.svg
          node tests/special-bonds-check.mjs
          node tests/resonance-formal-charge.test.mjs
          node tests/encyclopedia-chemistry-visuals.test.mjs
      - name: Refresh PWA
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models sw.js precache-manifest.js
          if git diff --cached --quiet; then
            echo "Generated assets already current"
            exit 0
          fi
          git commit -m "Refresh chemistry visual assets"
          git push
