name: Update complexity PWA artifacts

on:
  push:
    branches:
      - audit/computation-complexity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate PWA assets
        run: node scripts/build-precache.mjs
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- src/pwa-assets.generated.js sw.js; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pwa-assets.generated.js sw.js
          git commit -m "Regenerate PWA assets for hint complexity fix"
          git push
