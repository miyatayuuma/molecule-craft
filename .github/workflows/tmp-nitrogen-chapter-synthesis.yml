name: Nitrogen chapter branch synthesis

on:
  push:
    branches: [field/nitrogen-chapter-completion]

permissions:
  contents: write

jobs:
  synthesize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply presentation and validation integration
        run: node scripts/tmp-nitrogen-chapter-synthesis.mjs
      - name: Regenerate current FIELD developer map
        run: node scripts/export-field-map.mjs
      - name: Regenerate verified PWA release
        run: node scripts/build-precache.mjs
      - name: Remove branch-only synthesis tooling
        run: |
          rm scripts/tmp-nitrogen-chapter-synthesis.mjs
          rm .github/workflows/tmp-nitrogen-chapter-synthesis.yml
      - name: Commit generated chapter completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Nitrogen FIELD chapter presentation"
          git push
