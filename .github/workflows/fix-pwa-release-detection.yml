name: Temporary PWA release detection fix
on:
  push:
    branches:
      - fix-pwa-release-detection
permissions:
  contents: write
jobs:
  patch-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip pwa release fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make top-level service worker change every release
        run: |
          node <<'NODE'
          const fs=require('fs');
          const buildPath='scripts/build-precache.mjs';
          let b=fs.readFileSync(buildPath,'utf8');
          const before="const version=sha(JSON.stringify(entries)+(await readFile(new URL('sw.js',root),'utf8'))).slice(0,16);\nawait writeFile(new URL('precache-manifest.js',root),`// Generated by scripts/build-precache.mjs; do not edit.\\nself.PRECACHE_VERSION=${JSON.stringify(version)};\\nself.PRECACHE_FILES=${JSON.stringify(entries,null,2)};\\n`);";
          const after="const assetVersion=sha(JSON.stringify(entries)).slice(0,16),swURL=new URL('sw.js',root);\nlet sw=await readFile(swURL,'utf8');\nconst marker=`/* PRECACHE_ASSET_VERSION:${assetVersion} */`;\nif(/\\/\\* PRECACHE_ASSET_VERSION:[0-9a-f]{16} \\*\\//.test(sw))sw=sw.replace(/\\/\\* PRECACHE_ASSET_VERSION:[0-9a-f]{16} \\*\\//,marker);else sw=`${marker}\\n${sw}`;\nawait writeFile(swURL,sw);\nconst version=sha(JSON.stringify(entries)+sw).slice(0,16);\nawait writeFile(new URL('precache-manifest.js',root),`// Generated by scripts/build-precache.mjs; do not edit.\\nself.PRECACHE_VERSION=${JSON.stringify(version)};\\nself.PRECACHE_FILES=${JSON.stringify(entries,null,2)};\\n`);";
          if(!b.includes(before))throw new Error('build-precache release block not found');
          b=b.replace(before,after);fs.writeFileSync(buildPath,b);

          const testPath='tests/pwa.test.mjs';
          let t=fs.readFileSync(testPath,'utf8');
          const sourceBefore="const source=await read('sw.js'),pwaSource=(await read('src/pwa.js')).toString(),precache=await read('precache-manifest.js'),context={self:{}};runInNewContext(precache.toString(),context);";
          const sourceAfter="const source=await read('sw.js'),sourceText=source.toString(),buildSource=(await read('scripts/build-precache.mjs')).toString(),pwaSource=(await read('src/pwa.js')).toString(),precache=await read('precache-manifest.js'),context={self:{}};runInNewContext(precache.toString(),context);";
          if(!t.includes(sourceBefore))throw new Error('pwa test source declaration not found');
          t=t.replace(sourceBefore,sourceAfter);
          const testMarker="const entries=context.self.PRECACHE_FILES,paths=new Set(entries.map(e=>e.path));";
          if(!t.includes(testMarker))throw new Error('pwa test insertion point not found');
          t=t.replace(testMarker,`${testMarker}\nassert.match(buildSource,/PRECACHE_ASSET_VERSION/,'Precache build must stamp the top-level service worker each release');\nconst assetVersion=sha(Buffer.from(JSON.stringify(entries))).slice(0,16);\nassert.match(sourceText,new RegExp('^/\\\\* PRECACHE_ASSET_VERSION:'+assetVersion+' \\\\*/'),'Service worker stamp must match current asset set');\nassert.equal(context.self.PRECACHE_VERSION,sha(Buffer.from(JSON.stringify(entries)+sourceText)).slice(0,16),'Precache version must include stamped service worker bytes');`);
          fs.writeFileSync(testPath,t);
          NODE
      - run: node scripts/build-precache.mjs
      - run: node scripts/check-repository-hygiene.mjs
      - run: node tests/pwa.test.mjs
      - name: Commit fix and generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-precache.mjs sw.js precache-manifest.js tests/pwa.test.mjs
          git commit -m "Fix PWA release detection [skip pwa release fix]"
          git push
