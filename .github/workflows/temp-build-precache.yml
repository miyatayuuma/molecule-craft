name: Temporary rebuild PWA precache
on:
  push:
    branches:
      - task/encyclopedia-content-architecture-review
permissions:
  contents: write
jobs:
  rebuild:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild generated PWA artifacts
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          if git diff --cached --quiet; then
            echo "PWA artifacts already current"
            exit 0
          fi
          git commit -m "Refresh generated PWA precache"
          git push
