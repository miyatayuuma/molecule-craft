name: Task B final validation

on:
  push:
    branches: [task-b-loadout-comparison-ux-v1]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align CO2 regression with behavioral preview
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/veil-ui-check.mjs')
          text=path.read_text()
          old="q('open-supply').click();q('shell-propellant').click();assert.match(q('tank-comparison').textContent,/8回/);"
          new="q('open-supply').click();q('shell-propellant').click();assert.equal(q('tank-comparison').dataset.previewKind,'propellant');const shotRows=q('tank-comparison').lastElementChild;assert.equal(shotRows.firstElementChild.querySelectorAll('i').length,8,'Current CO₂ ghost shows eight remaining BURST shots');assert.equal(shotRows.lastElementChild.querySelectorAll('i').length,9,'Candidate CO₂ loadout shows nine full-tank BURST shots');"
          if old not in text:
              raise SystemExit('Expected legacy CO2 comparison assertion not found')
          path.write_text(text.replace(old,new))
          PY
      - name: Syntax and focused tests
        run: |
          node --check src/veil/loadout-preview.js
          node --check src/veil/supply.js
          node tests/loadout-preview.test.mjs
          node tests/molecule-roles.test.mjs
      - name: Veil UI regression
        run: |
          npm install --no-save --no-package-lock jsdom@26
          node tests/veil-ui-check.mjs ./node_modules/jsdom/lib/api.js
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: Verify generated PWA release is current
        run: |
          node scripts/build-precache.mjs
          git diff --exit-code -- sw.js precache-manifest.js
          node tests/pwa.test.mjs
      - name: Commit Task B regression contract
        shell: bash
        run: |
          if git diff --quiet -- tests/veil-ui-check.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/veil-ui-check.mjs
          git commit -m "Update Veil regression for behavioral loadout preview"
          git push
