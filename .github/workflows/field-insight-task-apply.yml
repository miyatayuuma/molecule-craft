name: FIELD insight task apply

on:
  push:
    branches: [fix/field-insight-engagement-gate-v2]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply focused task patch
        run: node scripts/apply-field-insight-engagement-task.mjs
      - name: FIELD insight and frontier regressions
        run: |
          node tests/field-insight-engagement.test.mjs
          node tests/field-frontier-insight.test.mjs
          node tests/molecule-frontier.test.mjs
          node tests/signal-eligibility.test.mjs
          node tests/expedition-insights.test.mjs
          node tests/expedition-challenges.test.mjs
      - name: Oxygen and thermal regressions
        run: |
          node tests/oxygen-field-integration.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
      - name: Browser startup
        run: node tests/browser-startup.test.mjs
      - name: Repository hygiene
        run: node tests/repository-hygiene.test.mjs
      - name: Refresh PWA
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
      - name: Whitespace check
        run: git diff --check
      - name: Commit patched production files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/repository-validation.yml
          git add src/veil/insights.js src/veil/expedition-run.js src/veil/resources.js src/veil/ui.js tests/field-frontier-insight.test.mjs tests/field-insight-engagement.test.mjs sw.js precache-manifest.js
          git commit -m "Gate FIELD graph insights behind exploration engagement"
          git push
