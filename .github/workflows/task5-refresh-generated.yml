name: Task 5 refresh generated artifacts

on:
  push:
    branches: [field-task5-deep-oxygen-routes]

permissions:
  contents: write

jobs:
  refresh:
    # Temporary branch-only generator/validation harness; removed before PR delivery.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate canonical artifacts
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: Task 5 focused validation
        run: |
          node tests/deep-oxygen-routes.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/expedition-core.test.mjs
          node scripts/export-field-expansion-proposal.mjs --check
          node scripts/build-precache.mjs --check
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet -- docs/maps/current-field.svg sw.js precache-manifest.js; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maps/current-field.svg sw.js precache-manifest.js
          git commit -m "Refresh Task 5 generated artifacts"
          git push
