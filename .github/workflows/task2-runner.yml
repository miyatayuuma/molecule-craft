name: Task 2 branch runner

on:
  push:
    branches:
      - work/task2-ho-economy

permissions:
  contents: write

jobs:
  apply-generate-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply Task 2 transforms
        id: apply
        shell: bash
        run: |
          if [[ ! -f .github/task2.py ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python .github/task2.py
          python .github/task2-fix.py
          rm -f .github/task2.py .github/task2-fix.py
          echo "applied=true" >> "$GITHUB_OUTPUT"
      - name: Regenerate developer map and PWA assets
        if: steps.apply.outputs.applied == 'true'
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: Focused economy and map validation
        if: steps.apply.outputs.applied == 'true'
        run: |
          node tests/h-economy-balance.test.mjs
          node tests/hc-revisit-routes.test.mjs
          node tests/field-map-export.test.mjs
      - name: Freshness and hygiene
        if: steps.apply.outputs.applied == 'true'
        run: |
          node scripts/export-field-map.mjs --check
          node scripts/build-precache.mjs --check
          node scripts/check-repository-hygiene.mjs
          git diff --check
      - name: Commit implementation
        if: steps.apply.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tune stock-dependent H/O field economy"
          git push
