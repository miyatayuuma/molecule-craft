name: Apply FIELD Insight compatibility fix

on:
  push:
    branches: [feature/field-insight-discovery-balance]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Preserve launch-local legacy frontier contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/veil/resources.js')
          text=path.read_text()
          old="base.selectedCandidateId=seed.id;base.seedId=seed.id;base.hotDestination=seed.hotDestination;base.activeForRun=launchRegion===seed.hotDestination;base.weightingRegion=ensured.reason==='selected'&&lastSeedSelection?.weighting?.regionAffinity?.region?lastSeedSelection.weighting.regionAffinity.region:'persistent-seed';"
          new="const legacyLaunchSelection=ensured.reason==='selected'&&!!lastSeedSelection?.weighting?.regionAffinity?.region;base.selectedCandidateId=seed.id;base.seedId=seed.id;base.hotDestination=seed.hotDestination;base.activeForRun=legacyLaunchSelection||launchRegion===seed.hotDestination;base.weightingRegion=legacyLaunchSelection?lastSeedSelection.weighting.regionAffinity.region:'persistent-seed';"
          if text.count(old)!=1:
              raise SystemExit(f'expected one compatibility target, found {text.count(old)}')
          path.write_text(text.replace(old,new))
          PY
      - name: Refresh verified offline release
        run: node scripts/build-precache.mjs
      - name: Commit source fix and generated release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veil/resources.js sw.js precache-manifest.js
          git commit -m "Preserve launch-local frontier compatibility"
          git push
