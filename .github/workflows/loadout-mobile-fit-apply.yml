name: Apply LOADOUT mobile fit fix

on:
  push:
    branches: [work/loadout-mobile-fit-destination-toggle-final]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/loadout-mobile-fit-destination-toggle-final
          fetch-depth: 0
      - name: Apply focused implementation and regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          supply=Path('src/veil/supply.js')
          s=supply.read_text()
          old="let selectedUse='propellant',selectedId=null,anchorsKey='',announcement='',viewer=null,viewerKey='',viewerGeneration=0,launchPointer=null,launchStart=null,launchDragged=0,launchActive=null,launchOpen=false,launchItems=[],launchBusy=false,requestedDestinationId=null;"
          new="let selectedUse='propellant',selectedId=null,anchorsKey='',announcement='',viewer=null,viewerKey='',viewerGeneration=0,launchPointer=null,launchStart=null,launchDragged=0,launchTapStartedOpen=false,launchActive=null,launchOpen=false,launchItems=[],launchBusy=false,requestedDestinationId=null;"
          assert old in s
          s=s.replace(old,new,1)
          old="const launchHandle=document.createElement('button');launchHandle.type='button';launchHandle.id='collector-launch-handle';launchHandle.setAttribute('aria-label','探索機をドラッグして出発地点を選ぶ');"
          new="const launchHandle=document.createElement('button');launchHandle.type='button';launchHandle.id='collector-launch-handle';launchHandle.setAttribute('aria-label','探索機をドラッグして出発地点を選ぶ');launchHandle.setAttribute('aria-expanded','false');launchHandle.setAttribute('aria-controls','expedition-destinations');"
          assert old in s
          s=s.replace(old,new,1)
          old="launchOpen=show;shellMap.classList.toggle('launch-selecting',show);"
          new="launchOpen=show;launchHandle.setAttribute('aria-expanded',String(show));shellMap.classList.toggle('launch-selecting',show);"
          assert old in s
          s=s.replace(old,new,1)
          old="const pointer=launchPointer;launchPointer=null;launchStart=null;launchDragged=0;"
          new="const pointer=launchPointer;launchPointer=null;launchStart=null;launchDragged=0;launchTapStartedOpen=false;"
          assert old in s
          s=s.replace(old,new,1)
          old="if(launchPointer!==null||resources.blocked||!canOpen()||event.button!==undefined&&event.button!==0)return;event.preventDefault();launchPointer=event.pointerId;launchStart={x:event.clientX,y:event.clientY};launchDragged=0;showLaunchDestinations(true);"
          new="if(launchPointer!==null||launchBusy||requestedDestinationId!==null||resources.blocked||!canOpen()||event.button!==undefined&&event.button!==0)return;event.preventDefault();launchTapStartedOpen=launchOpen;launchPointer=event.pointerId;launchStart={x:event.clientX,y:event.clientY};launchDragged=0;showLaunchDestinations(true);"
          assert old in s
          s=s.replace(old,new,1)
          old="const id=launchActive?.id??null,wasTap=launchDragged<8;resetLaunchGesture({keepDestinations:!cancel&&!id&&wasTap});if(cancel)return;if(id)requestDestinationLaunch(id);"
          new="const id=launchActive?.id??null,wasTap=launchDragged<8,wasOpen=launchTapStartedOpen;resetLaunchGesture({keepDestinations:!cancel&&!id&&wasTap&&!wasOpen});if(cancel)return;if(wasTap&&wasOpen&&!id)return;if(id)requestDestinationLaunch(id);"
          assert old in s
          s=s.replace(old,new,1)
          old="launchHandle.addEventListener('keydown',event=>{if(event.key==='Escape'){resetLaunchGesture();return;}if(event.key!=='Enter'&&event.key!==' ')return;event.preventDefault();showLaunchDestinations(!launchOpen);if(launchOpen)(launchItems.find(item=>item.checkpoint)??launchItems[0])?.node.focus();});"
          new="launchHandle.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!launchBusy&&requestedDestinationId===null)resetLaunchGesture();return;}if(event.key!=='Enter'&&event.key!==' ')return;event.preventDefault();if(launchBusy||requestedDestinationId!==null||resources.blocked||!canOpen())return;showLaunchDestinations(!launchOpen);if(launchOpen)(launchItems.find(item=>item.checkpoint)??launchItems[0])?.node.focus();});"
          assert old in s
          s=s.replace(old,new,1)
          supply.write_text(s)

          workstation=Path('src/veil/loadout-workstation.js')
          w=workstation.read_text()
          marker="@media(max-width:370px){#supply-dialog .collector-shell-map{height:194px!important}"
          assert marker in w
          mobile="""@media(max-width:520px) and (orientation:portrait){#supply-dialog .sheet-header{padding:11px 16px}#supply-dialog .sheet-body{padding:12px 14px 14px;gap:8px}#supply-dialog .collector-shell-map{height:184px!important}#supply-dialog .loadout-element-stock{grid-template-columns:54px minmax(0,1fr);align-items:center;gap:6px;margin:2px 0 0;padding:5px 7px;border-radius:11px}#supply-dialog .loadout-element-stock-title{font-size:8px;line-height:1.05;letter-spacing:.08em;white-space:nowrap}#supply-dialog .loadout-stock-elements{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}#supply-dialog .loadout-element-token{min-height:42px;column-gap:4px;padding:3px 4px;border-radius:9px}#supply-dialog .loadout-element-token>.atom-preview{width:20px;height:20px}#supply-dialog .loadout-element-token[data-loadout-stock-element='H']>.atom-preview{width:17px;height:17px}#supply-dialog .loadout-element-token>strong{font-size:12px}#supply-dialog .loadout-element-token>small{font-size:9px}#supply-dialog .tank-detail{gap:7px;padding:9px 10px}#supply-dialog .tank-molecules{gap:6px;padding-bottom:3px}#supply-dialog .tank-molecules button{grid-template-rows:46px auto 10px;min-height:96px;padding:4px 5px}#supply-dialog .tank-molecules button img{width:68px;height:46px}#supply-dialog .tank-inspector{gap:7px;min-height:142px}#supply-dialog .tank-model #tank-model-host .model-stage{height:108px}}\n"""
          w=w.replace(marker,mobile+marker.replace('194px','176px'),1)
          old="#supply-dialog .loadout-stock-elements{grid-template-columns:repeat(4,minmax(0,1fr))!important}}\n@media(prefers-reduced-motion:reduce)"
          new="#supply-dialog .loadout-stock-elements{grid-template-columns:repeat(4,minmax(0,1fr))!important}#supply-dialog .sheet-body{padding:9px 10px 10px;gap:6px}#supply-dialog .loadout-element-stock{grid-template-columns:50px minmax(0,1fr);padding:4px 6px;gap:5px}#supply-dialog .tank-molecules button{grid-template-rows:42px auto 10px;min-height:90px}#supply-dialog .tank-molecules button img{height:42px}#supply-dialog .tank-inspector{min-height:132px}#supply-dialog .tank-model #tank-model-host .model-stage{height:96px}}\n@media(max-width:340px) and (max-height:680px){#supply-dialog .collector-shell-map{height:164px!important}#supply-dialog .sheet-header{padding:8px 10px}#supply-dialog .sheet-body{padding:7px 8px 8px;gap:5px}#supply-dialog .loadout-element-stock{grid-template-columns:48px minmax(0,1fr);padding:4px 5px;gap:4px}#supply-dialog .loadout-element-token{min-height:38px;padding:2px 3px}#supply-dialog .loadout-element-token>.atom-preview{width:18px;height:18px}#supply-dialog .loadout-element-token[data-loadout-stock-element='H']>.atom-preview{width:16px;height:16px}#supply-dialog .tank-detail{gap:5px;padding:7px 8px}#supply-dialog .tank-molecules button{grid-template-rows:40px auto 9px;min-height:86px}#supply-dialog .tank-molecules button img{height:40px}#supply-dialog .tank-inspector{min-height:120px;gap:5px}#supply-dialog .tank-model #tank-model-host .model-stage{height:88px}}\n@media(prefers-reduced-motion:reduce)"
          assert old in w
          w=w.replace(old,new,1)
          workstation.write_text(w)

          pointer=Path('tests/launch-pointer-lifecycle.test.mjs')
          p=pointer.read_text()
          old="assert.match(source,/function endLaunch\\(event,cancel=false\\)[\\s\\S]*?resetLaunchGesture\\(\\{keepDestinations:!cancel&&!id&&wasTap\\}\\);/,'pointerup/pointercancel must finish through centralized cleanup without changing tap-open behavior');"
          new="assert.match(source,/function endLaunch\\(event,cancel=false\\)[\\s\\S]*?wasOpen=launchTapStartedOpen;resetLaunchGesture\\(\\{keepDestinations:!cancel&&!id&&wasTap&&!wasOpen\\}\\);[\\s\\S]*?if\\(wasTap&&wasOpen&&!id\\)return;/,'pointerup/pointercancel must preserve drag behavior while a second idle machine tap closes destination mode');"
          assert old in p
          p=p.replace(old,new,1)
          insert="assert.match(source,/if\\(launchPointer!==null\\|\\|launchBusy\\|\\|requestedDestinationId!==null\\|\\|resources\\.blocked/,'Busy or pending launch state must reject machine pointer toggles');\nassert.match(source,/aria-expanded','Destination mode must expose its expanded state to keyboard and assistive technology');\n"
          anchor="assert.match(source,/launchHandle\\.addEventListener\\('pointercancel',event=>endLaunch\\(event,true\\)\\)/,'pointercancel must cancel the gesture');\n"
          assert anchor in p
          p=p.replace(anchor,anchor+insert,1)
          pointer.write_text(p)

          workflow=Path('.github/workflows/repository-validation.yml')
          y=workflow.read_text()
          old="          node tests/loadout-transfer-browser.test.mjs\n          node tests/loadout-launch-regression.test.mjs"
          new="          node tests/loadout-transfer-browser.test.mjs\n          node tests/loadout-mobile-fit-toggle-browser.test.mjs\n          node tests/loadout-launch-regression.test.mjs"
          assert old in y
          workflow.write_text(y.replace(old,new,1))
          PY
          cat > tests/loadout-mobile-fit-toggle-browser.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import {createServer} from 'node:http';
          import {mkdtemp,readFile,rm} from 'node:fs/promises';
          import {spawn,spawnSync} from 'node:child_process';
          import {extname,join,normalize,resolve} from 'node:path';
          import {tmpdir} from 'node:os';
          import {fileURLToPath} from 'node:url';

          const root=resolve(fileURLToPath(new URL('..',import.meta.url))),types={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.mjs':'text/javascript; charset=utf-8','.json':'application/json','.css':'text/css; charset=utf-8','.svg':'image/svg+xml','.png':'image/png','.webmanifest':'application/manifest+json'};
          const server=createServer(async(req,res)=>{try{const pathname=decodeURIComponent(new URL(req.url,'http://localhost').pathname),relative=pathname==='/'?'index.html':pathname.replace(/^\/+/,''),file=normalize(join(root,relative));if(!file.startsWith(root)){res.writeHead(403).end();return;}const body=await readFile(file);res.writeHead(200,{'content-type':types[extname(file)]??'application/octet-stream','cache-control':'no-store'});res.end(body);}catch{res.writeHead(404).end('not found');}});
          await new Promise(done=>server.listen(0,'127.0.0.1',done));const {port}=server.address(),origin=`http://127.0.0.1:${port}`;
          let chrome='';for(const command of ['google-chrome','chromium','chromium-browser']){const found=spawnSync('which',[command],{encoding:'utf8'});if(found.status===0&&found.stdout.trim()){chrome=found.stdout.trim();break;}}assert.ok(chrome,'Chromium is required for LOADOUT mobile fit validation');
          const profile=await mkdtemp(join(tmpdir(),'molecule-craft-loadout-mobile-fit-')),debugPort=9237,pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));let child=null,socket=null;
          try{
            child=spawn(chrome,['--headless=new','--no-sandbox','--disable-gpu','--disable-background-networking',`--user-data-dir=${profile}`,`--remote-debugging-port=${debugPort}`,'about:blank'],{stdio:['ignore','ignore','pipe']});let tabs=null;
            for(let attempt=0;attempt<160;attempt++){try{const response=await fetch(`http://127.0.0.1:${debugPort}/json/list`);if(response.ok){tabs=await response.json();if(tabs.length)break;}}catch{}await pause(100);}assert.ok(tabs?.length,'DevTools endpoint did not become ready');
            socket=new WebSocket(tabs.find(tab=>tab.type==='page')?.webSocketDebuggerUrl??tabs[0].webSocketDebuggerUrl);await new Promise((ok,fail)=>{const timer=setTimeout(()=>fail(new Error('DevTools websocket timeout')),5000);socket.addEventListener('open',()=>{clearTimeout(timer);ok();},{once:true});socket.addEventListener('error',fail,{once:true});});
            let sequence=0;const pending=new Map();socket.addEventListener('message',event=>{const message=JSON.parse(event.data);if(message.id&&pending.has(message.id)){const task=pending.get(message.id);pending.delete(message.id);message.error?task.reject(new Error(message.error.message)):task.resolve(message.result);}});const send=(method,params={})=>new Promise((ok,fail)=>{const id=++sequence;pending.set(id,{resolve:ok,reject:fail});socket.send(JSON.stringify({id,method,params}));});const evaluate=async expression=>{const response=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(response.exceptionDetails)throw new Error(response.exceptionDetails.exception?.description??response.exceptionDetails.text);return response.result?.value;};const waitFor=async(expression,message,attempts=140)=>{for(let i=0;i<attempts;i++){try{if(await evaluate(expression))return;}catch{}await pause(100);}throw new Error(message);};
            const viewport=async(width,height,mobile=true)=>{await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile});await pause(160);};const point=selector=>evaluate(`(()=>{const r=document.querySelector(${JSON.stringify(selector)})?.getBoundingClientRect();return r&&{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};})()`);const tap=async selector=>{const p=await point(selector);assert.ok(p);await send('Input.dispatchMouseEvent',{type:'mousePressed',x:p.x,y:p.y,button:'left',buttons:1,clickCount:1});await send('Input.dispatchMouseEvent',{type:'mouseReleased',x:p.x,y:p.y,button:'left',buttons:0,clickCount:1});};
            await send('Runtime.enable');await send('Page.enable');await viewport(390,844,true);await send('Page.navigate',{url:origin+'/'});await waitFor("document.querySelector('#open-collection')?.textContent?.includes('0/129')",'Application did not initialize');
            const seeded=await evaluate(`(async()=>{const {createResources}=await import('/src/veil/resources.js');const records=await fetch('/data/molecules.json').then(r=>r.json());const r=createResources({storage:localStorage});r.setCatalog(records);r.state.progress.regions=['veil','carbon','oxygen'];r.state.progress.checkpoint='oxygen';r.state.progress.foundElements=['H','C','O'];r.state.recipes=['hydrogen','methane','oxygen','water'];Object.assign(r.state.elements,{H:1200,C:600,O:900,N:0});for(const [use,id] of [['propellant','hydrogen'],['fuel','methane'],['oxidizer','oxygen'],['coolant','water']])if(!r.setLoadoutTank(use,id))return false;return r.save();})()`);assert.equal(seeded,true);
            await send('Page.reload',{ignoreCache:true});await waitFor("document.querySelector('#open-collection')?.textContent?.includes('0/129')",'Application did not restore after seed');await evaluate("document.querySelector('#open-supply').click()");await waitFor("document.querySelector('#supply-dialog')?.open&&document.querySelector('#loadout-element-stock')&&!document.querySelector('#loadout-element-stock').hidden",'LOADOUT did not open');await pause(350);
            const inspect=()=>evaluate(`(()=>{const rect=n=>{const r=n?.getBoundingClientRect();return r&&{left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};const d=document.querySelector('#supply-dialog'),stock=document.querySelector('#loadout-element-stock'),map=document.querySelector('#supply-dialog .collector-shell-map'),handle=document.querySelector('#collector-launch-handle'),tokens=[...document.querySelectorAll('[data-loadout-stock-element]')].filter(n=>!n.hidden);return{viewport:{w:innerWidth,h:innerHeight},dialog:rect(d),scrollY:Math.max(0,d.scrollHeight-d.clientHeight),scrollX:Math.max(0,d.scrollWidth-d.clientWidth),map:rect(map),stock:rect(stock),handle:rect(handle),detail:rect(document.querySelector('#tank-detail')),cards:rect(document.querySelector('#tank-molecules')),tokenCount:tokens.length,tokenFont:tokens[0]?parseFloat(getComputedStyle(tokens[0].querySelector('strong')).fontSize):0,atom:tokens[0]?rect(tokens[0].querySelector('.atom-preview')):null};})()`);
            const results={};results.p390=await inspect();assert.ok(results.p390.scrollY<=1,`390x844 LOADOUT must fit without vertical scroll: ${JSON.stringify(results.p390)}`);assert.ok(results.p390.stock.left>=results.p390.dialog.left-1&&results.p390.stock.right<=results.p390.dialog.right+1);assert.ok(results.p390.tokenFont>=11&&results.p390.atom.width>=16,'BASE STOCK must remain readable');assert.ok(results.p390.handle.width>=64&&results.p390.handle.height>=64,'machine launch target must stay comfortably tappable');
            await viewport(360,780,true);results.p360=await inspect();assert.ok(results.p360.scrollY<=1,`360 portrait LOADOUT must fit without vertical scroll: ${JSON.stringify(results.p360)}`);assert.ok(results.p360.scrollX<=1);
            await viewport(320,640,true);results.p320=await inspect();assert.ok(results.p320.scrollX<=1,'small portrait must not create horizontal overflow');assert.ok(results.p320.scrollY<=150,`small portrait overflow must remain bounded and operable: ${JSON.stringify(results.p320)}`);assert.ok(results.p320.handle.width>=64&&results.p320.stock.left>=results.p320.dialog.left-1&&results.p320.stock.right<=results.p320.dialog.right+1);
            await viewport(1000,760,false);results.wide=await inspect();assert.ok(results.wide.scrollX<=1);assert.ok(results.wide.map.height>=198,'desktop/wide machine geometry must retain existing scale');
            await viewport(390,844,true);await pause(120);await tap('#collector-launch-handle');await waitFor("document.querySelector('#expedition-destinations')?.getAttribute('aria-hidden')==='false'",'first machine tap did not open destination mode');assert.equal(await evaluate("document.querySelector('#collector-launch-handle').getAttribute('aria-expanded')"),'true');await tap('#collector-launch-handle');await waitFor("document.querySelector('#expedition-destinations')?.getAttribute('aria-hidden')==='true'",'second machine tap did not close destination mode');assert.equal(await evaluate("document.querySelector('#collector-launch-handle').getAttribute('aria-expanded')"),'false');assert.equal(await evaluate("document.querySelector('#shell-propellant').style.opacity"),'1','closing destination mode must restore equipment presentation');
            await tap('#collector-launch-handle');await waitFor("document.querySelector('#expedition-destinations')?.getAttribute('aria-hidden')==='false'",'destination mode did not reopen');await evaluate("document.querySelector('#expedition-destinations [data-region=veil]').click()");await waitFor("document.querySelector('#veil-view')?.hidden===false",'destination button did not launch FIELD');await evaluate("document.querySelector('#veil-return').click()");await waitFor("document.querySelector('#veil-view')?.hidden===true",'normal return did not complete',180);await evaluate("document.querySelector('#open-supply').click()");await waitFor("document.querySelector('#supply-dialog')?.open",'LOADOUT did not reopen after return');await pause(220);
            const start=await point('#collector-launch-handle'),target=await point('#expedition-destinations [data-region=carbon]');assert.ok(start&&target);await send('Input.dispatchMouseEvent',{type:'mousePressed',x:start.x,y:start.y,button:'left',buttons:1,clickCount:1});for(let i=1;i<=4;i++)await send('Input.dispatchMouseEvent',{type:'mouseMoved',x:start.x+(target.x-start.x)*i/4,y:start.y+(target.y-start.y)*i/4,button:'left',buttons:1});await send('Input.dispatchMouseEvent',{type:'mouseReleased',x:target.x,y:target.y,button:'left',buttons:0,clickCount:1});await waitFor("document.querySelector('#veil-view')?.hidden===false",'machine swipe did not relaunch FIELD');assert.equal(await evaluate("document.querySelector('#veil-region-name')?.textContent?.includes('Carbon')||document.body.dataset.mode==='veil'"),true);
            console.log('LOADOUT mobile fit metrics',JSON.stringify(results));
          }finally{try{socket?.close();}catch{}try{child?.kill('SIGKILL');}catch{}await pause(100);server.close();await rm(profile,{recursive:true,force:true});}
          console.log('LOADOUT mobile fit/toggle Chromium regression passed: portrait fit, compact readable stock, tap toggle, destination button launch, normal return and swipe relaunch.');
          EOF
      - name: Regenerate PWA and run focused regression suite
        run: |
          node scripts/build-precache.mjs
          node tests/loadout-workstation.test.mjs
          node tests/loadout-transfer-browser.test.mjs
          node tests/loadout-mobile-fit-toggle-browser.test.mjs
          node tests/launch-pointer-lifecycle.test.mjs
          node tests/launch-selector.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/issue-122-launch-route.test.mjs
          node tests/launch-request.test.mjs
          node tests/launch-transaction.test.mjs
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Commit focused fix
        run: |
          rm .github/workflows/loadout-mobile-fit-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix LOADOUT mobile fit and destination toggle"
          git push origin HEAD:work/loadout-mobile-fit-destination-toggle-final
          git push origin --delete tmp-ignore fix/loadout-mobile-fit-destination-toggle fix/loadout-mobile-fit-destination-toggle-work fix/loadout-mobile-fit-destination-toggle-v2 work/loadout-mobile-fit-destination-toggle || true
