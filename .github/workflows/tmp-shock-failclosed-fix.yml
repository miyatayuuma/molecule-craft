name: Temporary SHOCK fail-closed fix
on:
  push:
    branches:
      - work/shock-unit-foundation
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore fail-closed loadout authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/veil/resources.js')
          text=p.read_text()
          old="function selectedLoadout(){const selected={...initialSelectedLoadout(),...(state.loadout?.tanks??{})};for(const use of Object.keys(TANK_USES)){const id=selected[use];if(id!==null&&(!state.recipes.includes(id)||!fitsTank(id,use)))selected[use]=null;}return selected;}"
          new="function selectedLoadout(){return {...initialSelectedLoadout(),...(state.loadout?.tanks??{})};}"
          assert old in text, 'selectedLoadout sanitization marker missing'
          p.write_text(text.replace(old,new,1))

          p=Path('tests/shock-unit.test.mjs')
          text=p.read_text()
          old="// Persisted unsupported selections fail closed at the application authority.\n{\n  const state=createInitialResourcesState();state.recipes=['hydrogen'];state.loadout.tanks.shock='hydrogen';const storage=memoryStorage(JSON.stringify(state)),r=createResources({storage});r.setCatalog(molecules);assert.equal(r.selectedLoadout().shock,null);\n}"
          new="// Persisted unsupported selections fail closed instead of silently falling back.\n{\n  const state=createInitialResourcesState();state.recipes=['hydrogen'];state.loadout.tanks.shock='hydrogen';const storage=memoryStorage(JSON.stringify(state)),r=createResources({storage});r.setCatalog(molecules);assert.equal(r.selectedLoadout().shock,'hydrogen');assert.equal(r.launchFillPlan({includeWorkspace:false}).status,'IMPOSSIBLE');assert.deepEqual(r.tankCatalog('shock'),[]);\n}"
          assert old in text, 'unsupported SHOCK selection test marker missing'
          p.write_text(text.replace(old,new,1))
          PY
      - name: Regenerate PWA
        run: node scripts/build-precache.mjs
      - name: Validate fail-closed launch and SHOCK regression
        run: |
          node tests/shock-unit.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/launch-transaction.test.mjs
          node tests/loadout-mobile-fit-toggle-browser.test.mjs
          node tests/dock-foundation.test.mjs
          node tests/tank-upgrades.test.mjs
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '199175422+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add src/veil/resources.js tests/shock-unit.test.mjs precache-manifest.js sw.js
          git diff --cached --quiet || git commit -m 'Preserve fail-closed loadout selections with SHOCK'
          git push origin HEAD:work/shock-unit-foundation
