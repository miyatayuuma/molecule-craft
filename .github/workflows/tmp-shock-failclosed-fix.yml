name: Temporary SHOCK final contract cleanup
on:
  push:
    branches:
      - work/shock-unit-foundation
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Update narrow FIELD source contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/source-contracts.test.mjs')
          text=p.read_text()
          old="assert.match(veilCss, /@media\\(max-width:370px\\)\\{\\.veil-chain-block\\{display:none\\}/);"
          new="assert.match(veilCss, /@media\\(max-width:370px\\)\\{[^@]*?\\.veil-chain-block\\{display:none\\}/,'Narrow FIELD HUD must keep chain block hidden inside the 370px media contract');"
          assert old in text, 'narrow FIELD source-contract marker missing'
          p.write_text(text.replace(old,new,1))
          PY
      - name: Validate final SHOCK contracts
        run: |
          node tests/source-contracts.test.mjs
          node tests/shock-unit.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/launch-transaction.test.mjs
          node tests/loadout-mobile-fit-toggle-browser.test.mjs
          node tests/dock-foundation.test.mjs
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Commit test contract and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-shock-failclosed-fix.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '199175422+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add tests/source-contracts.test.mjs .github/workflows/tmp-shock-failclosed-fix.yml
          git commit -m 'Align narrow FIELD source contract with SHOCK HUD'
          git push origin HEAD:work/shock-unit-foundation
