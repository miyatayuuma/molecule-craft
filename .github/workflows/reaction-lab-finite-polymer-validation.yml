name: Reaction Lab finite polymer validation
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'src/*polymer*'
      - 'src/reaction-lab-viewer.js'
      - 'src/app.js'
      - 'src/collection-ui.js'
      - 'src/craft-connections.js'
      - 'tests/*polymer*'
      - 'tests/reaction-lab-browser.test.mjs'
      - 'tests/reaction-lab-legacy-removal.test.mjs'
      - 'tests/material-progression-browser.test.mjs'
      - 'scripts/compare-polymer-performance.mjs'
      - 'scripts/profile-reaction-lab-stage-b.mjs'
      - 'scripts/compare-reaction-lab-stage-b.mjs'
      - 'docs/polymer-integrated-production-closure.md'
      - 'tests/helpers/material-progression-fixture.mjs'
      - 'scripts/*polymer*'
      - 'scripts/polymer-structure-svg.mjs'
      - 'scripts/build-collection-assets.mjs'
      - 'scripts/polymer-fragment-authority.mjs'
      - 'data/polymer-fragment-authority.json'
      - 'data/polymer-encyclopedia.json'
      - 'data/polymers.json'
      - 'assets/models/polymer-*.svg'
      - 'scripts/check-polymer-completion-evidence.mjs'
      - 'index.html'
      - 'styles.css'
      - 'docs/architecture.md'
      - 'docs/task7-polymer-structure-visuals.md'
      - 'docs/task8-polymer-encyclopedia-review.md'
      - 'docs/planning/polymer-presentation-rebaseline.md'
      - 'precache-manifest.js'
      - 'sw.js'
      - '.github/workflows/reaction-lab-finite-polymer-validation.yml'
permissions:
  contents: read
jobs:
  finite-validation:
    if: ${{ github.event_name != 'pull_request' || (!contains(github.event.pull_request.title, '[TASK12C3-DIAGNOSTIC-ONLY]') && !contains(github.event.pull_request.title, '[TASK12C4-PREFLIGHT]') && !contains(github.event.pull_request.title, '[TASK12C4-DIAGNOSTIC-ONLY]') && !contains(github.event.pull_request.title, '[TASK12C5-PREFLIGHT]') && !contains(github.event.pull_request.title, '[TASK12C5-DIAGNOSTIC-ONLY]') && github.event.action != 'edited') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Japanese screenshot font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Finite completion, chemistry and discovery regressions
        run: node --test tests/reaction-lab-legacy-removal.test.mjs tests/polymerization-routes.test.mjs tests/reaction-lab-polymerization.test.mjs tests/reaction-lab-polymerization-fixtures.test.mjs tests/reaction-lab-polymer-discovery.test.mjs tests/polymer-catalog.test.mjs tests/polymer-collection.test.mjs tests/polymer-collection-persistence.test.mjs tests/engineering-fabrication.test.mjs
      - name: All 25 finite routes — 3D graph and geometry validation
        env:
          TASK11_GEOMETRY_EVIDENCE_DIR: ${{ runner.temp }}/polymer-3d-layout
        run: node --test tests/polymer-fragment-3d-layout.test.mjs
      - name: Production pointer path and 390×844 visual QA
        env:
          POLYMER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/reaction-lab-polymer-browser.test.mjs
      - name: Production pointer path and representative desktop QA
        env:
          POLYMER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: POLYMER_DESKTOP=1 node tests/reaction-lab-polymer-browser.test.mjs
      - name: Integrated gameplay, discovery, Engineering and FIELD E2E — mobile
        env:
          POLYMER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TASK10_EVIDENCE_DIR: ${{ runner.temp }}/task10-journey
        run: node tests/material-progression-browser.test.mjs
      - name: Integrated gameplay, discovery, Engineering and FIELD E2E — desktop
        env:
          MATERIAL_PROGRESS_DESKTOP: '1'
          POLYMER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TASK10_EVIDENCE_DIR: ${{ runner.temp }}/task10-journey
        run: node tests/material-progression-browser.test.mjs
      - name: Prepare immutable Task ⑩ main baseline
        env:
          POLYMER_BASELINE_SHA: 4bc202c0eb1f51de0350c3a0b4be36c7178cba53
        run: |
          git cat-file -e "$POLYMER_BASELINE_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/polymer-task10-baseline" "$POLYMER_BASELINE_SHA"
          echo "POLYMER_CANDIDATE_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
          echo "POLYMER_BASELINE_SHA=$POLYMER_BASELINE_SHA" >> "$GITHUB_ENV"
      - name: Profile Task ⑩ main baseline — mobile
        env:
          POLYMER_PROFILE_ONLY: '1'
          POLYMER_ROOT: ${{ runner.temp }}/polymer-task10-baseline
          POLYMER_EVIDENCE_DIR: ${{ runner.temp }}/polymer-performance/baseline/mobile
          POLYMER_SOURCE_SHA: 4bc202c0eb1f51de0350c3a0b4be36c7178cba53
        run: node tests/reaction-lab-polymer-browser.test.mjs
      - name: Profile Task ⑪ candidate — mobile
        env:
          POLYMER_PROFILE_ONLY: '1'
          POLYMER_ROOT: ${{ github.workspace }}
          POLYMER_EVIDENCE_DIR: ${{ runner.temp }}/polymer-performance/candidate/mobile
          POLYMER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/reaction-lab-polymer-browser.test.mjs
      - name: Profile Task ⑩ main baseline — desktop
        env:
          POLYMER_PROFILE_ONLY: '1'
          POLYMER_DESKTOP: '1'
          POLYMER_ROOT: ${{ runner.temp }}/polymer-task10-baseline
          POLYMER_EVIDENCE_DIR: ${{ runner.temp }}/polymer-performance/baseline/desktop
          POLYMER_SOURCE_SHA: 4bc202c0eb1f51de0350c3a0b4be36c7178cba53
        run: node tests/reaction-lab-polymer-browser.test.mjs
      - name: Profile Task ⑪ candidate — desktop
        env:
          POLYMER_PROFILE_ONLY: '1'
          POLYMER_DESKTOP: '1'
          POLYMER_ROOT: ${{ github.workspace }}
          POLYMER_EVIDENCE_DIR: ${{ runner.temp }}/polymer-performance/candidate/desktop
          POLYMER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/reaction-lab-polymer-browser.test.mjs
      - name: Validate trial-weighted performance comparison
        run: node --test tests/compare-polymer-performance.test.mjs
      - name: Compare same-condition completion performance
        env:
          POLYMER_BASELINE_SHA: 4bc202c0eb1f51de0350c3a0b4be36c7178cba53
          POLYMER_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/compare-polymer-performance.mjs
          "$RUNNER_TEMP/polymer-performance/baseline/mobile/performance-390.json"
          "$RUNNER_TEMP/polymer-performance/baseline/desktop/performance-1280.json"
          "$RUNNER_TEMP/polymer-performance/candidate/mobile/performance-390.json"
          "$RUNNER_TEMP/polymer-performance/candidate/desktop/performance-1280.json"
          "$RUNNER_TEMP/polymer-performance/comparison.json"
      - name: Gate finite completion resource evidence
        run: node scripts/check-polymer-completion-evidence.mjs
      - name: Collection, hygiene, offline integrity
        run: |
          node tests/collection-polymer-browser.test.mjs
          TASK8_EXPORT_VISUAL_QA=1 node tests/polymer-structure-visual-browser.test.mjs
          node scripts/check-repository-hygiene.mjs
          node scripts/polymer-fragment-authority.mjs
          node tests/polymer-fragment-authority.test.mjs
          node scripts/build-collection-assets.mjs
          node tests/polymer-structure-svg.test.mjs
          node tests/polymer-catalog.test.mjs
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          git diff --exit-code -- assets/models precache-manifest.js sw.js
          node --test tests/pwa.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reaction-lab-finite-polymer-validation-evidence
          path: |
            test-results/reaction-lab-polymer-simplification
            test-results/task8-polymer-visual-qa
            ${{ runner.temp }}/polymer-3d-layout
            ${{ runner.temp }}/task10-journey
            ${{ runner.temp }}/polymer-performance
          if-no-files-found: error
          retention-days: 90
  stage-b-performance-comparison:
    if: ${{ github.event_name != 'pull_request' || (!contains(github.event.pull_request.title, '[TASK12C4-PREFLIGHT]') && !contains(github.event.pull_request.title, '[TASK12C5-PREFLIGHT]') && !contains(github.event.pull_request.title, '[TASK12C5-DIAGNOSTIC-ONLY]') && (github.event.action != 'edited' || (github.event.changes.title != null && (contains(github.event.pull_request.title, '[TASK12C3-DIAGNOSTIC-ONLY]') || contains(github.event.pull_request.title, '[TASK12C4-DIAGNOSTIC-ONLY]'))))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage B comparison contract tests
        run: node --test tests/compare-reaction-lab-stage-b.test.mjs tests/stage-b-runner-telemetry.test.mjs tests/stage-b-trace-attribution.test.mjs tests/chromium-trace-recorder.test.mjs tests/stage-b-diagnostic-finalization.test.mjs tests/diagnostic-preflight-contract.test.mjs tests/finite-polymer-diagnostic.test.mjs tests/reaction-lab-polymer-timing-probe.test.mjs tests/compare-polymer-performance.test.mjs
      - name: Prepare immutable Task ⑩ main baseline
        env:
          POLYMER_BASELINE_SHA: 4bc202c0eb1f51de0350c3a0b4be36c7178cba53
        run: |
          git cat-file -e "$POLYMER_BASELINE_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/polymer-task10-stage-b-baseline" "$POLYMER_BASELINE_SHA"
          echo "POLYMER_BASELINE_SHA=$POLYMER_BASELINE_SHA" >> "$GITHUB_ENV"
          echo "POLYMER_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Profile Task ⑩ main baseline — warm-up + four trials
        if: ${{ !contains(github.event.pull_request.title, '[TASK12C3-DIAGNOSTIC-ONLY]') && !contains(github.event.pull_request.title, '[TASK12C4-DIAGNOSTIC-ONLY]') }}
        env:
          POLYMER_ROOT: ${{ runner.temp }}/polymer-task10-stage-b-baseline
          POLYMER_SOURCE_SHA: 4bc202c0eb1f51de0350c3a0b4be36c7178cba53
          STAGE_B_PROFILE_LABEL: baseline
          STAGE_B_PROFILE_OUTPUT: ${{ runner.temp }}/stage-b-performance/baseline.json
          STAGE_B_DEBUG_PORT: 9277
        run: node scripts/profile-reaction-lab-stage-b.mjs
      - name: Profile Task ⑪ candidate — warm-up + four trials
        if: ${{ !contains(github.event.pull_request.title, '[TASK12C3-DIAGNOSTIC-ONLY]') && !contains(github.event.pull_request.title, '[TASK12C4-DIAGNOSTIC-ONLY]') }}
        env:
          POLYMER_ROOT: ${{ github.workspace }}
          POLYMER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STAGE_B_PROFILE_LABEL: candidate
          STAGE_B_PROFILE_OUTPUT: ${{ runner.temp }}/stage-b-performance/candidate.json
          STAGE_B_DEBUG_PORT: 9278
        run: node scripts/profile-reaction-lab-stage-b.mjs
      - name: Compare same-condition Stage B performance
        if: ${{ !contains(github.event.pull_request.title, '[TASK12C3-DIAGNOSTIC-ONLY]') && !contains(github.event.pull_request.title, '[TASK12C4-DIAGNOSTIC-ONLY]') }}
        run: node scripts/compare-reaction-lab-stage-b.mjs "$RUNNER_TEMP/stage-b-performance/baseline.json" "$RUNNER_TEMP/stage-b-performance/candidate.json" "$RUNNER_TEMP/stage-b-performance/comparison.json"
      - name: Diagnostic-only runner and browser pause attribution — Task ⑩ baseline
        if: ${{ contains(github.event.pull_request.title, '[TASK12C3-DIAGNOSTIC-ONLY]') || contains(github.event.pull_request.title, '[TASK12C4-DIAGNOSTIC-ONLY]') }}
        env:
          POLYMER_ROOT: ${{ runner.temp }}/polymer-task10-stage-b-baseline
          POLYMER_SOURCE_SHA: 4bc202c0eb1f51de0350c3a0b4be36c7178cba53
          STAGE_B_PROFILE_LABEL: baseline-diagnostic
          STAGE_B_PROFILE_MODE: diagnostic
          STAGE_B_PROFILE_OUTPUT: ${{ runner.temp }}/stage-b-performance/diagnostic-baseline.json
          STAGE_B_DEBUG_PORT: 9279
        run: node scripts/profile-reaction-lab-stage-b.mjs
      - name: Diagnostic-only runner and browser pause attribution — Task ⑪ candidate
        if: ${{ contains(github.event.pull_request.title, '[TASK12C3-DIAGNOSTIC-ONLY]') || contains(github.event.pull_request.title, '[TASK12C4-DIAGNOSTIC-ONLY]') }}
        env:
          POLYMER_ROOT: ${{ github.workspace }}
          POLYMER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STAGE_B_PROFILE_LABEL: candidate-diagnostic
          STAGE_B_PROFILE_MODE: diagnostic
          STAGE_B_PROFILE_OUTPUT: ${{ runner.temp }}/stage-b-performance/diagnostic-candidate.json
          STAGE_B_DEBUG_PORT: 9280
        run: node scripts/profile-reaction-lab-stage-b.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task10-task11-stage-b-performance-comparison
          path: ${{ runner.temp }}/stage-b-performance
          if-no-files-found: error
          retention-days: 90
  diagnostic-preflight:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 345 && github.event.pull_request.head.ref == 'work/reaction-lab-ci-stability-recovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deterministic diagnostic harness gates
        run: |
          gate_artifact_dir="$RUNNER_TEMP/reaction-lab-diagnostic-preflight"
          mkdir -p "$gate_artifact_dir"
          set +e
          node --test tests/stage-b-runner-telemetry.test.mjs tests/stage-b-trace-attribution.test.mjs tests/chromium-trace-recorder.test.mjs tests/compare-reaction-lab-stage-b.test.mjs tests/compare-polymer-performance.test.mjs tests/stage-b-diagnostic-finalization.test.mjs tests/diagnostic-preflight-contract.test.mjs tests/finite-polymer-diagnostic.test.mjs > "$gate_artifact_dir/deterministic-gates.tap" 2>&1
          gate_status=$?
          cat "$gate_artifact_dir/deterministic-gates.tap"
          exit "$gate_status"
      - name: Record checked-out source authority
        env:
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIAGNOSTIC_BASELINE_SHA: 4bc202c0eb1f51de0350c3a0b4be36c7178cba53
        run: |
          CHECKED_OUT_SOURCE_SHA="$(git rev-parse HEAD)"
          echo "DIAGNOSTIC_SOURCE_SHA=$CHECKED_OUT_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_EXPECTED_PR_HEAD_SHA=$EXPECTED_PR_HEAD_SHA" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_BASELINE_SHA=$DIAGNOSTIC_BASELINE_SHA" >> "$GITHUB_ENV"
      - name: Renderer counter and trace capability preflight — no Stage B campaign
        env:
          DIAGNOSTIC_GITHUB_EVENT_SHA: ${{ github.sha }}
          DIAGNOSTIC_PREFLIGHT_OUTPUT: ${{ runner.temp }}/reaction-lab-diagnostic-preflight/preflight.json
        run: node scripts/preflight-reaction-lab-diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task12c5-renderer-identity-preflight
          path: ${{ runner.temp }}/reaction-lab-diagnostic-preflight
          if-no-files-found: error
          retention-days: 90
  finite-root-cause-diagnostic:
    if: ${{ (contains(github.event.pull_request.title, '[TASK12C3-DIAGNOSTIC-ONLY]') || contains(github.event.pull_request.title, '[TASK12C4-DIAGNOSTIC-ONLY]')) && (github.event.action != 'edited' || github.event.changes.title != null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Trace desktop reduced-motion completion pause
        env:
          POLYMER_PROFILE_ONLY: '1'
          POLYMER_DESKTOP: '1'
          POLYMER_PAUSE_DIAGNOSTIC: '1'
          POLYMER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POLYMER_EVIDENCE_DIR: ${{ runner.temp }}/finite-pause-diagnostic
        run: node tests/reaction-lab-polymer-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-desktop-reduced-motion-pause-diagnostic
          path: ${{ runner.temp }}/finite-pause-diagnostic
          if-no-files-found: warn
          retention-days: 90
