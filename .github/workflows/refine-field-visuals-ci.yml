name: Refine field visuals validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate PWA precache
        run: node scripts/build-precache.mjs
      - name: Validate expedition field changes
        run: |
          node --check src/veil/renderer.js
          node tests/oxygen-routes.test.mjs
          node tests/veil.test.mjs
          node tests/veil-playthrough.test.mjs
          node tests/veil-loss-particles.test.mjs
          node tests/veil-return-effects.test.mjs
          node tests/pwa.test.mjs
      - name: Remove temporary workflow and run hygiene check
        run: |
          git rm .github/workflows/refine-field-visuals-ci.yml
          node scripts/check-repository-hygiene.mjs
      - name: Commit generated outputs
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js .github/workflows/refine-field-visuals-ci.yml
          git commit -m "Regenerate precache and validate field visuals"
          git push origin HEAD:${{ github.head_ref }}
