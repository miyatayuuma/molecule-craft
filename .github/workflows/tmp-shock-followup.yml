name: Temporary SHOCK follow-up
on:
  push:
    branches:
      - work/shock-unit-charge-foundation
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply SHOCK browser regression follow-up
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/veil/loadout-workstation.js')
          text=p.read_text()
          old="#supply-dialog .collector-shell-map:has(#shell-propellant[data-active=true]) .loadout-pulse-label,#supply-dialog .collector-shell-map:has(#shell-fuel[data-active=true]) .loadout-fuel-label,#supply-dialog .collector-shell-map:has(#shell-oxidizer[data-active=true]) .loadout-oxidizer-label,#supply-dialog .collector-shell-map:has(#shell-coolant[data-active=true]) .loadout-coolant-label{color:#f0fdff;text-shadow:0 1px 4px #000,0 0 9px #83dbe477}"
          new="#supply-dialog .collector-shell-map:has(#shell-propellant[data-active=true]) .loadout-pulse-label,#supply-dialog .collector-shell-map:has(#shell-shock[data-active=true]) .loadout-shock-label,#supply-dialog .collector-shell-map:has(#shell-fuel[data-active=true]) .loadout-fuel-label,#supply-dialog .collector-shell-map:has(#shell-oxidizer[data-active=true]) .loadout-oxidizer-label,#supply-dialog .collector-shell-map:has(#shell-coolant[data-active=true]) .loadout-coolant-label{color:#f0fdff;text-shadow:0 1px 4px #000,0 0 9px #83dbe477}"
          assert old in text, 'SHOCK active-label marker missing'
          text=text.replace(old,new,1)
          old2="#supply-dialog:has(#shell-propellant[data-active='true']) #tank-detail-title:after{content:'PULSE'}#supply-dialog:has(#shell-fuel[data-active='true']) #tank-detail-title:after{content:'FUEL'}#supply-dialog:has(#shell-oxidizer[data-active='true']) #tank-detail-title:after{content:'O₂'}#supply-dialog:has(#shell-coolant[data-active='true']) #tank-detail-title:after{content:'COOLANT'}"
          new2="#supply-dialog:has(#shell-propellant[data-active='true']) #tank-detail-title:after{content:'PULSE'}#supply-dialog:has(#shell-shock[data-active='true']) #tank-detail-title:after{content:'SHOCK'}#supply-dialog:has(#shell-fuel[data-active='true']) #tank-detail-title:after{content:'FUEL'}#supply-dialog:has(#shell-oxidizer[data-active='true']) #tank-detail-title:after{content:'O₂'}#supply-dialog:has(#shell-coolant[data-active='true']) #tank-detail-title:after{content:'COOLANT'}"
          assert old2 in text, 'SHOCK detail-title marker missing'
          p.write_text(text.replace(old2,new2,1))

          p=Path('tests/loadout-mobile-fit-toggle-browser.test.mjs')
          text=p.read_text()
          old="r.state.progress.regions=['veil','carbon','oxygen'];r.state.progress.checkpoint='oxygen';r.state.progress.foundElements=['H','C','O'];r.state.recipes=['hydrogen','methane','oxygen','water'];Object.assign(r.state.elements,{H:1200,C:600,O:900,N:0});for(const [use,id] of [['propellant','hydrogen'],['fuel','methane'],['oxidizer','oxygen'],['coolant','water']])if(!r.setLoadoutTank(use,id))return false;"
          new="r.state.progress.regions=['veil','carbon','oxygen'];r.state.progress.checkpoint='oxygen';r.state.progress.choCompleted=true;r.state.progress.foundElements=['H','C','O','N'];r.state.recipes=['hydrogen','methane','oxygen','water','nitromethane'];Object.assign(r.state.elements,{H:1200,C:600,O:900,N:300});for(const [use,id] of [['propellant','hydrogen'],['shock','nitromethane'],['fuel','methane'],['oxidizer','oxygen'],['coolant','water']])if(!r.setLoadoutTank(use,id))return false;"
          assert old in text, 'mobile seed marker missing'
          text=text.replace(old,new,1)
          old="const results={};results.p390=await inspect();assert.ok(results.p390.scrollY<=1,`390x844 LOADOUT must fit without vertical scroll: ${JSON.stringify(results.p390)}`);assert.ok(results.p390.stock.left>=results.p390.dialog.left-1&&results.p390.stock.right<=results.p390.dialog.right+1);assert.ok(results.p390.tokenFont>=11&&results.p390.atom.width>=16,'BASE STOCK must remain readable');assert.ok(results.p390.handle.width>=64&&results.p390.handle.height>=64,'machine launch target must stay comfortably tappable');"
          new="const results={};results.p390=await inspect();assert.ok(results.p390.scrollY<=1,`390x844 LOADOUT must fit without vertical scroll: ${JSON.stringify(results.p390)}`);assert.ok(results.p390.stock.left>=results.p390.dialog.left-1&&results.p390.stock.right<=results.p390.dialog.right+1);assert.ok(results.p390.tokenFont>=11&&results.p390.atom.width>=16,'BASE STOCK must remain readable');assert.ok(results.p390.handle.width>=64&&results.p390.handle.height>=64,'machine launch target must stay comfortably tappable');const shockHit=await point(\".loadout-slot-path[data-use='shock']\");assert.ok(shockHit&&shockHit.w>=44&&shockHit.h>=30,'SHOCK LOADOUT hit target must remain distinct and tappable');await tap(\".loadout-slot-path[data-use='shock']\");await waitFor(\"getComputedStyle(document.querySelector('#tank-detail-title'),'::after').content.includes('SHOCK')\",'SHOCK detail did not become visible');assert.equal(await evaluate(\"[...document.querySelectorAll('#tank-molecules button')].some(b=>b.textContent.includes('CH3NO2')||b.textContent.includes('CH₃NO₂'))\"),true,'Nitromethane must be available in discovered SHOCK choices');"
          assert old in text, 'mobile p390 marker missing'
          text=text.replace(old,new,1)
          old="await tap('#collector-launch-handle');await waitFor(\"document.querySelector('#expedition-destinations')?.getAttribute('aria-hidden')==='false'\",'destination mode did not reopen');await evaluate(\"document.querySelector('#expedition-destinations [data-region=veil]').click()\");await waitFor(\"document.querySelector('#veil-view')?.hidden===false\",'destination button did not launch FIELD');await evaluate(\"document.querySelector('#veil-return').click()\");"
          new="await tap('#collector-launch-handle');await waitFor(\"document.querySelector('#expedition-destinations')?.getAttribute('aria-hidden')==='false'\",'destination mode did not reopen');await evaluate(\"document.querySelector('#expedition-destinations [data-region=veil]').click()\");await waitFor(\"document.querySelector('#veil-view')?.hidden===false\",'destination button did not launch FIELD');await waitFor(\"!document.querySelector('#veil-shock')?.hidden&&document.querySelector('#veil-shock-count')?.textContent==='3 / 3'\",'FIELD SHOCK HUD did not launch with three Nitromethane charges');const beforeShock=await evaluate(\"(()=>{const s=JSON.parse(localStorage.getItem('molecule-craft.resources.v1'));return Object.fromEntries(['propellant','fuel','oxidizer','coolant'].map(use=>[use,s.tanks[use].amount]));})()\");await tap('#veil-shock');await waitFor(\"document.querySelector('#veil-shock-count')?.textContent==='2 / 3'\",'first SHOCK charge did not decrement');await tap('#veil-shock');await tap('#veil-shock');await waitFor(\"document.querySelector('#veil-shock-count')?.textContent==='0 / 3'&&document.querySelector('#veil-shock')?.getAttribute('aria-disabled')==='true'\",'SHOCK zero-charge guard did not become visible');const afterShock=await evaluate(\"(()=>{const s=JSON.parse(localStorage.getItem('molecule-craft.resources.v1'));return Object.fromEntries(['propellant','fuel','oxidizer','coolant'].map(use=>[use,s.tanks[use].amount]));})()\");assert.deepEqual(afterShock,beforeShock,'SHOCK input must not consume PULSE, DRIVE, O2 or coolant');await evaluate(\"document.querySelector('#veil-return').click()\");"
          assert old in text, 'FIELD launch marker missing'
          text=text.replace(old,new,1)
          old="await waitFor(\"document.querySelector('#veil-view')?.hidden===false\",'machine swipe did not relaunch FIELD');assert.equal(await evaluate(\"document.querySelector('#veil-region-name')?.textContent?.includes('Carbon')||document.body.dataset.mode==='veil'\"),true);"
          new="await waitFor(\"document.querySelector('#veil-view')?.hidden===false\",'machine swipe did not relaunch FIELD');assert.equal(await evaluate(\"document.querySelector('#veil-region-name')?.textContent?.includes('Carbon')||document.body.dataset.mode==='veil'\"),true);await waitFor(\"document.querySelector('#veil-shock-count')?.textContent==='3 / 3'\",'relaunch did not auto-synthesize the missing SHOCK charges');"
          assert old in text, 'relaunch marker missing'
          p.write_text(text.replace(old,new,1))
          PY
      - name: Regenerate PWA
        run: node scripts/build-precache.mjs
      - name: Focused SHOCK and browser validation
        run: |
          node tests/shock-unit.test.mjs
          node tests/loadout-workstation.test.mjs
          node tests/loadout-mobile-fit-toggle-browser.test.mjs
          node tests/browser-startup.test.mjs
          node tests/launch-transaction.test.mjs
          node tests/expedition-core.test.mjs
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Commit follow-up
        shell: bash
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '199175422+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add src/veil/loadout-workstation.js tests/loadout-mobile-fit-toggle-browser.test.mjs precache-manifest.js sw.js
          git diff --cached --quiet || git commit -m 'Validate SHOCK mobile loadout and field controls'
          git push origin HEAD:work/shock-unit-charge-foundation
