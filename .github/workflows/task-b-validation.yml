name: Task B validation

on:
  push:
    branches: [task-b-loadout-comparison-ux-v1]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Focused preview and role tests
        run: |
          node --check src/veil/loadout-preview.js
          node --check src/veil/supply.js
          node tests/loadout-preview.test.mjs
          node tests/molecule-roles.test.mjs
      - name: Veil UI regression
        run: |
          npm install --no-save --no-package-lock jsdom@26
          node tests/veil-ui-check.mjs "$(node -p \"require.resolve('jsdom/lib/api.js')\")"
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: Rebuild PWA release
        run: node scripts/build-precache.mjs
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Commit generated PWA release
        shell: bash
        run: |
          if git diff --quiet -- sw.js precache-manifest.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git commit -m "Refresh Task B PWA precache"
          git push
