name: Temporary precache regeneration
on:
  push:
    branches:
      - direct-explorer-launch
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip precache]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-precache.mjs
      - name: Commit generated manifest
        run: |
          if git diff --quiet -- precache-manifest.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precache-manifest.js
          git commit -m "chore: regenerate PWA precache [skip precache]"
          git push
