name: FIELD Insight balance validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  field-insight-balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Persistent Seed and site lifecycle
        run: node tests/field-insight-discovery-balance.test.mjs
      - name: Destination rotation, yield calibration and stock balance
        run: node --test tests/insight-destination-rotation.test.mjs
      - name: Desktop and mobile player-facing regression
        run: node tests/field-insight-discovery-browser.test.mjs
      - name: Repository hygiene
        run: node tests/repository-hygiene.test.mjs
      - name: Generated PWA freshness
        run: node scripts/build-precache.mjs --check
