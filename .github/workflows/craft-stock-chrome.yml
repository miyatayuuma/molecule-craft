name: Craft stock chrome
on:
  push:
    branches: [craft-stock-badges-cleanup-icon]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply stock badges and cleanup icon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              assert old in text, f'missing pattern in {path}: {old[:90]!r}'
              p.write_text(text.replace(old,new,1))

          # Remove the duplicated top stock row but retain the Collector Shell entry.
          replace('index.html',
            '<div class="resource-bar" aria-label="採集した素材"><div class="resource-stock"><span>H <b id="resource-h">0</b></span><span id="stock-c" hidden>C <b id="resource-c">0</b></span><span id="stock-o" hidden>O <b id="resource-o">0</b></span></div><button id="open-supply" class="collector-access" type="button" aria-label="収集殻とタンクを開く"><i aria-hidden="true"></i><span>収集殻</span></button></div>',
            '<div class="resource-bar"><button id="open-supply" class="collector-access" type="button" aria-label="収集殻とタンクを開く"><i aria-hidden="true"></i><span>収集殻</span></button></div>')

          # Make cleanup an icon-only affordance. Long-press semantics stay in ARIA and existing control logic.
          replace('index.html',
            '<button id="clear-all" class="hold-clear" type="button" aria-label="1秒長押しでクラフト中の原子を片付ける" title="1秒長押しで片付ける"><span>片付ける</span><small>長押し</small></button>',
            '<button id="clear-all" class="hold-clear icon-button" type="button" aria-label="1秒長押しでクラフト中の原子をBASE STOCKへ戻して片付ける"><svg class="cleanup-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="7" cy="6.5" r="1.7"/><circle cx="12" cy="5" r="1.7"/><circle cx="17" cy="6.5" r="1.7"/><path d="M12 9v5m-2.4-2.2L12 14.2l2.4-2.4M5.5 15.5h13l-1.2 4H6.7z"/></svg></button>')

          # Replace hidden element-name captions with live stock counts on every insertion button.
          names={'H':'水素','C':'炭素','N':'窒素','O':'酸素','F':'フッ素','P':'リン','S':'硫黄','Cl':'塩素'}
          for symbol,name in names.items():
              old=f'<strong>{symbol}</strong><small>{name}</small></button>'
              new=f'<strong>{symbol}</strong><small class="element-stock" data-element-stock="{symbol}">0</small></button>'
              replace('index.html',old,new)

          # Stock rendering belongs with the element palette so all eight elements behave consistently.
          p=Path('src/element-progression.js'); text=p.read_text()
          marker='// Enhance, never replace, the static HTML palette.'
          assert marker in text
          helper="""export function syncElementStocks(root = document, elements = {}) {\n  for (const button of root.querySelectorAll('#element-palette [data-element]')) {\n    const symbol=button.dataset.element,stock=button.querySelector('[data-element-stock]');\n    if(!stock)continue;\n    const count=Math.max(0,Number(elements[symbol]??0));\n    stock.textContent=String(count);button.dataset.stockCount=String(count);\n    button.disabled=button.hidden||count<=0;\n    const item=ELEMENT_UNLOCKS.find(item=>item.symbol===symbol);\n    if(item)button.setAttribute('aria-label',`${item.name}（${symbol}） 在庫 ${count}`);\n  }\n}\n\n"""
          text=text.replace(marker,helper+marker,1)
          old='button.hidden=!visible(item.symbol)||!available.has(item.symbol)||!canUse(item.symbol);button.disabled=button.hidden;'
          new="button.hidden=!visible(item.symbol)||!available.has(item.symbol)||!canUse(item.symbol);button.disabled=button.hidden||Number(button.dataset.stockCount??0)<=0;"
          assert old in text
          p.write_text(text.replace(old,new,1))

          # Keep counts live while atoms move between BASE STOCK and the craft workspace.
          replace('src/app.js',
            "import { createElementPalette } from './element-progression.js?v=36';",
            "import { createElementPalette, syncElementStocks } from './element-progression.js?v=36';")
          replace('src/app.js',
            'const craftWorkspace=createCraftWorkspace({molecule,placements,resources});',
            'const syncCraftStock=()=>syncElementStocks(document,resources.state.elements);\nconst craftWorkspace=createCraftWorkspace({molecule,placements,resources,onStockChange:syncCraftStock});')
          replace('src/app.js',
            "const elementPalette=createElementPalette(document,{canUse:symbol=>resources.canUseElement(symbol),explorationHint:()=>!resources.canUseElement('C')?'CはH Veilの奥で見つかる':!resources.canUseElement('O')?'Oは炭素の群れの奥で見つかる':''});",
            "const elementPalette=createElementPalette(document,{canUse:symbol=>resources.canUseElement(symbol),explorationHint:()=>!resources.canUseElement('C')?'CはH Veilの奥で見つかる':!resources.canUseElement('O')?'Oは炭素の群れの奥で見つかる':''});syncCraftStock();")

          p=Path('src/craft-workspace.js'); text=p.read_text()
          text=text.replace('export function createCraftWorkspace({molecule,placements,resources}){','export function createCraftWorkspace({molecule,placements,resources,onStockChange=()=>{}}){',1)
          reps={
            'const atom=molecule.addAtom(element);placements.set(atom.id,{position});return atom;':'const atom=molecule.addAtom(element);placements.set(atom.id,{position});onStockChange();return atom;',
            'for(const [index,atomId] of expanded.ids.entries())placements.set(atomId,{position:positions[index]});\n    return expanded;':'for(const [index,atomId] of expanded.ids.entries())placements.set(atomId,{position:positions[index]});\n    onStockChange();return expanded;',
            'resources.refund(costOf([atom]));molecule.removeAtom(id);placements.delete(id);return true;':'resources.refund(costOf([atom]));molecule.removeAtom(id);placements.delete(id);onStockChange();return true;',
            'resources.refund(costOf(molecule.atoms));molecule.clear();placements.clear();':'resources.refund(costOf(molecule.atoms));molecule.clear();placements.clear();onStockChange();',
            'for(const id of removed)placements.delete(id);\n    return snapshot;':'for(const id of removed)placements.delete(id);\n    onStockChange();return snapshot;',
            'for(const [id,position] of saved.positions)placements.set(id,{position:position.clone()});\n    }\n    return true;':'for(const [id,position] of saved.positions)placements.set(id,{position:position.clone()});\n    }\n    onStockChange();return true;'
          }
          for old,new in reps.items():
              assert old in text, f'craft workspace pattern missing: {old[:70]}'
              text=text.replace(old,new,1)
          p.write_text(text)

          # Expedition/tank operations also change BASE STOCK, so use the same renderer there.
          replace('src/veil/supply.js',
            "import { expeditionUseFor,loadedCombustionSummary } from './propulsion-guide.js';",
            "import { expeditionUseFor,loadedCombustionSummary } from './propulsion-guide.js';\nimport { syncElementStocks } from '../element-progression.js?v=36';")
          replace('src/veil/supply.js',
            "const state=resources.state;for(const element of ['H','C','O']){q(`resource-${element.toLowerCase()}`).textContent=state.elements[element];if(element!=='H')q(`stock-${element.toLowerCase()}`).hidden=!resources.canUseElement(element);}",
            'const state=resources.state;syncElementStocks(document,state.elements);')

          # The cleanup pass must not hide the new stock badges.
          replace('src/game-shell.js',
            "    '.element-button small','#molecule-iupac','#tank-next-hint','.tank-explanation','#tank-affordability','#tank-charge-result','#oxygen-route-guide',",
            "    '#molecule-iupac','#tank-next-hint','.tank-explanation','#tank-affordability','#tank-charge-result','#oxygen-route-guide',")

          # Visual tuning: compact stock badges and an icon that matches adjacent 44px controls.
          p=Path('styles.css'); text=p.read_text()
          old='.element-button{display:flex;flex:0 0 64px;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid color-mix(in srgb,var(--element-color) 65%,#243749);background:color-mix(in srgb,var(--element-color) 12%,#122232);border-radius:14px}.element-button strong{font-size:25px;font-weight:750}.element-button small{color:#b6c9d8}.element-button:hover{background:color-mix(in srgb,var(--element-color) 25%,#122232)}'
          new='.element-button{display:flex;flex:0 0 64px;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid color-mix(in srgb,var(--element-color) 65%,#243749);background:color-mix(in srgb,var(--element-color) 12%,#122232);border-radius:14px}.element-button strong{font-size:25px;font-weight:750;line-height:1}.element-button .element-stock{min-width:24px;color:#b6c9d8;font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}.element-button[data-stock-count="0"] .element-stock{opacity:.55}.element-button:hover{background:color-mix(in srgb,var(--element-color) 25%,#122232)}.cleanup-icon{display:block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}'
          assert old in text
          p.write_text(text.replace(old,new,1))

          # With only Collector Shell left in this row, align it as a compact top action.
          p=Path('veil.css'); text=p.read_text()
          old='.resource-bar{display:flex;align-items:center;gap:10px;padding:7px 14px;background:#0b1825;border-bottom:1px solid #263d4c;font-variant-numeric:tabular-nums;flex-wrap:wrap}.resource-stock{display:flex;gap:12px;color:#a8c9dd;font-size:12px}.resource-stock b{color:#ebfaff;font-size:15px}'
          new='.resource-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:5px 14px;background:#0b1825;border-bottom:1px solid #263d4c;font-variant-numeric:tabular-nums;flex-wrap:wrap}'
          assert old in text
          p.write_text(text.replace(old,new,1))

          # Static regression coverage for the new information hierarchy.
          Path('tests/craft-stock-chrome.test.mjs').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\ntest('craft stock lives on atom buttons and cleanup is icon only',()=>{\n  const html=fs.readFileSync('index.html','utf8');\n  const shell=fs.readFileSync('src/game-shell.js','utf8');\n  const palette=fs.readFileSync('src/element-progression.js','utf8');\n  const workspace=fs.readFileSync('src/craft-workspace.js','utf8');\n  assert.equal(html.includes('class=\\"resource-stock\\"'),false);\n  for(const symbol of ['H','C','N','O','F','P','S','Cl'])assert.match(html,new RegExp(`data-element-stock=\\"${symbol}\\"`));\n  const clear=html.match(/<button id=\\"clear-all\\"[\\s\\S]*?<\\/button>/)?.[0]??'';\n  assert.match(clear,/cleanup-icon/);assert.equal(clear.includes('片付ける'),false);assert.equal(clear.includes('長押し'),false);\n  assert.equal(shell.includes('.element-button small'),false);\n  assert.match(palette,/export function syncElementStocks/);\n  assert.match(workspace,/onStockChange/);\n});\n""")
          PY
      - name: Regenerate offline release
        run: node scripts/build-precache.mjs
      - name: Stock chrome regression
        run: node --test tests/craft-stock-chrome.test.mjs
      - name: Source contracts
        run: node tests/source-contracts.test.mjs
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: Commit result and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/craft-stock-chrome.yml
          git config user.name "miyatayuuma"
          git config user.email "115095547+miyatayuuma@users.noreply.github.com"
          git add -A
          git commit -m "Move craft stock counts into atom buttons"
          git push origin HEAD:craft-stock-badges-cleanup-icon
