name: Apply launch stabilization task

on:
  push:
    branches: [work/loadout-explore-integrated-regression]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply production cleanup and regressions
        run: |
          node scripts/apply-launch-stabilization.mjs
          node scripts/fix-launch-stabilization-test.mjs
          node scripts/fix-supply-tanks-current-contract.mjs
      - name: Targeted launch validation
        run: |
          node tests/loadout-shortage-confirmation.test.mjs
          node tests/loadout-schematic.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/issue-122-launch-route.test.mjs
          node tests/launch-request.test.mjs
          node tests/launch-transaction.test.mjs
          node tests/launch-selector.test.mjs
          node tests/launch-pointer-lifecycle.test.mjs
          node tests/supply-tanks.test.mjs
          node tests/browser-startup.test.mjs
      - name: Legacy relay absence
        run: |
          ! grep -R "commitRebalancedLaunchFill\|commitEmptyLaunchFill\|preserveSupplyDuringPrepare\|installLoadoutShortageUI" src tests
          ! grep -R "function launch(){return requestExpeditionLaunch" src
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: Generate and verify PWA
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
      - name: Whitespace check
        run: git diff --check
      - name: Commit applied task
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests precache-manifest.js sw.js
          git commit -m "Stabilize LOADOUT launch regression flow"
          git push
