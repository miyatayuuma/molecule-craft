name: Temporary resonance browser sequencing patch
on:
  push:
    branches:
      - fix/nitro-ozone-craft-resonance-reachability
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refresh PWA artifacts for resonance reachability change
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Commit generated PWA artifacts
        run: |
          if git diff --quiet -- sw.js precache-manifest.js; then
            echo "PWA artifacts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git commit -m "Refresh PWA artifacts for resonance completion"
          git push
