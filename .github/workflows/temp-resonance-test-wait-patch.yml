name: Temporary resonance browser sequencing patch
on:
  push:
    branches:
      - fix/nitro-ozone-craft-resonance-reachability
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Distinguish settlement from discovery UI lock
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/resonance-craft-interaction-browser.test.mjs')
          s=p.read_text()
          old="    locked:interactionLocked(),\\n    shared:sharedVisuals.length,"
          new="    locked:interactionLocked(),\\n    settling:!!relaxation||!!bondTransition||!!frameTransition,\\n    shared:sharedVisuals.length,"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old="await waitFor(`globalThis.__resonanceCraftDebug.snapshot().locked===false`,`${source.atomId}-${target.atomId}: CRAFT did not unlock after bond formation`,{attempts:220});};"
          new="if(expectedOrder===2)await waitFor(`globalThis.__resonanceCraftDebug.snapshot().settling===false`,`${source.atomId}-${target.atomId}: resonance settlement did not finish`,{attempts:220});else await waitFor(`globalThis.__resonanceCraftDebug.snapshot().locked===false`,`${source.atomId}-${target.atomId}: CRAFT did not unlock after bond formation`,{attempts:220});};"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check tests/resonance-craft-interaction-browser.test.mjs
          git diff --check
      - name: Commit sequencing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/resonance-craft-interaction-browser.test.mjs
          git commit -m "Separate resonance settlement from discovery UI lock"
          git push
