name: Temporary resonance browser sequencing patch
on:
  push:
    branches:
      - fix/nitro-ozone-craft-resonance-reachability
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reset production resource workspace between browser scenarios
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/resonance-craft-interaction-browser.test.mjs')
          s=p.read_text()
          old="const openEmptyCraft=async()=>{await openSeed();await evaluate(`localStorage.removeItem('molecule-craft.workspace.v1');true`);await send('Page.navigate',{url:`${origin}/__resonance_craft__`});"
          seed="""const openEmptyCraft=async()=>{await openSeed();const reset=await evaluate(`(async()=>{localStorage.clear();const {createResources}=await import('/src/veil/resources.js');const records=await fetch('/data/molecules.json').then(r=>r.json());const r=createResources({storage:localStorage});r.setCatalog(records);r.state.progress.choCompleted=true;r.state.progress.regions=['veil','carbon','oxygen','frontier','nitrogen'];r.state.progress.checkpoint='nitrogen';r.state.progress.foundElements=['H','C','O','N'];Object.assign(r.state.elements,{H:500,C:500,O:500,N:500});r.state.workspace=null;return r.save();})()`);assert.equal(reset,true,'Fresh resource/workspace seed failed');await send('Page.navigate',{url:`${origin}/__resonance_craft__`});"""
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,seed,1)
          p.write_text(s)
          PY
          node --check tests/resonance-craft-interaction-browser.test.mjs
          git diff --check
      - name: Commit browser reset fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/resonance-craft-interaction-browser.test.mjs
          git commit -m "Reset CRAFT resource workspace between resonance scenarios"
          git push
