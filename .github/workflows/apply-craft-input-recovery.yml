name: Apply CRAFT input recovery

on:
  push:
    branches:
      - codex/craft-input-freeze-recovery

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply scoped recovery changes
        run: |
          python3 scripts/apply-craft-input-recovery.py
          python3 scripts/fix-craft-input-test-fixture.py
      - name: Validate CRAFT recovery and adjacent contracts
        run: |
          node tests/craft-controls-ui.test.mjs
          node tests/craft-history.test.mjs
          node tests/craft-input-recovery.test.mjs
          node tests/craft-undo-contract.test.mjs
          node tests/incomplete-carbon-geometry.test.mjs
          node tests/structure-settlement-check.mjs
          node tests/source-contracts.test.mjs
          node tests/repository-hygiene.test.mjs
      - name: Refresh generated PWA artifacts
        run: node scripts/build-precache.mjs
      - name: Validate PWA and whitespace
        run: |
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix CRAFT interaction recovery"
          git push
