name: Refresh PWA precache

on:
  push:
    branches: [main, fix/combustion-residual-consumption]

permissions:
  contents: write

jobs:
  refresh-precache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Runtime
        run: node --version
      - name: Apply combustion residual fix
        if: github.ref_name == 'fix/combustion-residual-consumption'
        run: node scripts/apply-combustion-residual-fix.mjs
      - name: Capture focused unit validation
        if: github.ref_name == 'fix/combustion-residual-consumption'
        shell: bash
        run: |
          set +e
          node --test tests/combustion-residual-consumption.test.mjs > tests/combustion-debug.txt 2>&1
          status=$?
          cat tests/combustion-debug.txt
          echo "FOCUSED_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Focused Chromium validation
        if: github.ref_name == 'fix/combustion-residual-consumption' && env.FOCUSED_STATUS == '0'
        run: node tests/combustion-residual-browser.test.mjs
      - name: Rebuild verified offline release
        run: node scripts/build-precache.mjs
      - name: Commit generated release when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Precache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veil/engine.js src/veil/resources.js src/veil/ui.js src/veil/growth.js tests/generic-propulsion.test.mjs .github/workflows/repository-validation.yml sw.js precache-manifest.js tests/combustion-debug.txt
          git commit -m "Fix residual combustion consumption"
          git push
