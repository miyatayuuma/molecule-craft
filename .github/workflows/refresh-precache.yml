name: Refresh PWA precache

on:
  push:
    branches: [main, fix/combustion-residual-consumption]

permissions:
  contents: write

jobs:
  refresh-precache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Runtime
        run: node --version
      - name: Accept canonical numeric-leading molecule ids
        if: github.ref_name == 'fix/combustion-residual-consumption'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const path='src/veil/resources-persistence.js',before="/^[A-Za-z][A-Za-z0-9-]*$/",after="/^[A-Za-z0-9][A-Za-z0-9-]*$/",source=await readFile(path,'utf8');
          if(!source.includes(before))throw new Error('resource id validator pattern not found');
          await writeFile(path,source.replace(before,after));
          NODE
      - name: Capture focused unit validation
        if: github.ref_name == 'fix/combustion-residual-consumption'
        shell: bash
        run: |
          set +e
          node --test tests/combustion-residual-consumption.test.mjs > tests/combustion-debug.txt 2>&1
          status=$?
          cat tests/combustion-debug.txt
          echo "FOCUSED_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Focused Chromium validation
        if: github.ref_name == 'fix/combustion-residual-consumption' && env.FOCUSED_STATUS == '0'
        run: node tests/combustion-residual-browser.test.mjs
      - name: Rebuild verified offline release
        run: node scripts/build-precache.mjs
      - name: Commit generated release when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Precache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve numeric-leading molecule fuel state"
          git push
