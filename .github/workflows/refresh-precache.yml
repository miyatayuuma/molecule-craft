name: Refresh PWA precache

on:
  push:
    branches: [main, work/h-economy-audit]

permissions:
  contents: write

jobs:
  refresh-precache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Runtime
        run: node --version
      - name: Focused H economy validation
        run: |
          node tests/h-economy-balance.test.mjs
          node tests/hc-revisit-routes.test.mjs
          node tests/expedition-core.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
      - name: Rebuild current FIELD developer map
        run: node scripts/export-field-map.mjs
      - name: Rebuild verified offline release
        run: node scripts/build-precache.mjs
      - name: Commit generated release when needed
        shell: bash
        run: |
          if git diff --quiet -- sw.js precache-manifest.js docs/maps/current-field.svg; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js docs/maps/current-field.svg
          git commit -m "Refresh H economy generated artifacts"
          git push
