name: Polymer growth continuity validation
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/*polymer*'
      - 'src/reaction-lab-viewer.js'
      - 'tests/*polymer*'
      - 'src/polymer-growth-plan.js'
      - 'scripts/summarize-polymer-growth-profile.mjs'
      - 'docs/polymer-growth-continuity.md'
      - 'docs/architecture.md'
      - 'precache-manifest.js'
      - 'sw.js'
      - '.github/workflows/polymer-scale-up-validation.yml'
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Japanese screenshot font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Bounded plan, chemistry and discovery regressions
        run: node --test tests/polymer-growth-plan.test.mjs tests/polymerization-routes.test.mjs tests/reaction-lab-polymerization.test.mjs tests/reaction-lab-polymerization-fixtures.test.mjs tests/reaction-lab-polymer-discovery.test.mjs tests/polymer-catalog.test.mjs tests/polymer-collection.test.mjs tests/polymer-collection-persistence.test.mjs tests/engineering-fabrication.test.mjs
      - name: Production pointer path and 390×844 visual QA
        run: node tests/reaction-lab-polymer-browser.test.mjs
      - name: Production pointer path and representative desktop QA
        run: POLYMER_DESKTOP=1 node tests/reaction-lab-polymer-browser.test.mjs
      - name: Summarize measured PE presentation performance
        run: node scripts/summarize-polymer-growth-profile.mjs
      - name: Collection, hygiene, offline integrity
        run: |
          node tests/collection-polymer-browser.test.mjs
          node scripts/check-repository-hygiene.mjs
          node scripts/build-precache.mjs --check
          node --test tests/pwa.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polymer-growth-continuity-evidence
          path: test-results/polymer-growth-continuity
          if-no-files-found: error
          retention-days: 14
