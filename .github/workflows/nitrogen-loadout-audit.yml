name: Nitrogen LOADOUT role audit

on:
  push:
    branches: [work/nitrogen-loadout-role-balance]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/nitrogen-loadout-role-balance
          fetch-depth: 0
      - name: Regenerate PWA
        run: node scripts/build-precache.mjs
      - name: Nitrogen LOADOUT role and FIELD regressions
        run: |
          node tests/nitrogen-loadout-balance.test.mjs
          node tests/loadout-preview.test.mjs
          node tests/propulsion-differentiation.test.mjs
          node tests/propulsion-profiles.test.mjs
          node tests/nitrogen-field-integration.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/generic-propulsion.test.mjs
          node tests/hc-revisit-routes.test.mjs
          node tests/oxygen-loadout-evaluation.test.mjs
          node tests/h-economy-balance.test.mjs
      - name: LOADOUT browser and launch regressions
        run: |
          node tests/nitrogen-loadout-balance-browser.test.mjs
          node tests/loadout-mobile-fit-toggle-browser.test.mjs
          node tests/loadout-transfer-browser.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/launch-pointer-lifecycle.test.mjs
          node tests/launch-request.test.mjs
          node tests/launch-transaction.test.mjs
      - name: Generated output and whitespace checks
        run: |
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit generated PWA outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add precache-manifest.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh PWA after Nitrogen LOADOUT balance"
            git push origin HEAD:work/nitrogen-loadout-role-balance
          fi
