name: Task thermal Nitrogen wall

on:
  push:
    branches: [field/thermal-nitrogen-wall]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply balance patch
        run: |
          node scripts/apply-thermal-nitrogen-wall.mjs
          node scripts/tune-thermal-nitrogen-wall.mjs
      - name: Focused FIELD regressions
        run: |
          node tests/oxygen-frontier-wall.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/expedition-challenges.test.mjs
      - name: Regenerate FIELD map and PWA outputs
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: Commit production result
        shell: bash
        run: |
          rm scripts/apply-thermal-nitrogen-wall.mjs scripts/tune-thermal-nitrogen-wall.mjs .github/workflows/task-thermal-nitrogen-wall.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Strengthen thermal wall before Nitrogen"
          git push
