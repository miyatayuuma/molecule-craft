name: Task encyclopedia focus-edge implementation
on:
  push:
    branches:
      - task/encyclopedia-focus-edge-relation-motion
permissions:
  contents: write
jobs:
  implement:
    if: ${{ github.event.head_commit.message == 'Run focus-edge implementation workflow v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply implementation
        run: node scripts/task-focus-edge-impl.mjs
      - name: Refresh generated PWA assets
        run: node scripts/build-precache.mjs
      - name: Focused validation
        run: |
          node tests/encyclopedia-graph-ui.test.mjs
          node tests/encyclopedia-transition-browser.test.mjs
          node tests/encyclopedia-visible-transition-browser.test.mjs
          node tests/molecule-graph.test.mjs
          node tests/browser-startup.test.mjs
          node scripts/check-repository-hygiene.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/encyclopedia-graph-view.js tests/encyclopedia-graph-ui.test.mjs tests/encyclopedia-transition-browser.test.mjs precache-manifest.js sw.js
          git commit -m "Implement focus-edge relation direction motion"
          git push origin HEAD:task/encyclopedia-focus-edge-relation-motion
