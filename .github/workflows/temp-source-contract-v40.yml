name: Temporary source contract update

on:
  push:
    branches: [fix/encyclopedia-spatial-transition-regression]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/encyclopedia-spatial-transition-regression
      - name: Update collection module source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/source-contracts.test.mjs')
          text=path.read_text()
          old="assert.match(craftConnections, /await import\\('\\.\\/collection-ui\\.js\\?v=39'\\)/);"
          new="assert.match(craftConnections, /await import\\('\\.\\/collection-ui\\.js\\?v=40'\\)/);"
          if old not in text:
              raise SystemExit('v39 source contract pattern not found')
          path.write_text(text.replace(old,new,1))
          PY
          node tests/source-contracts.test.mjs
      - name: Commit source contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/source-contracts.test.mjs
          git commit -m "Update collection module source contract"
          git push
