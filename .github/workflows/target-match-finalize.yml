name: Target Match finalizer

on:
  push:
    branches:
      - task/craft-target-match

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: task/craft-target-match
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove temporary diagnostics
        run: rm -f target-match-ci.log
      - name: Target Match and related CRAFT tests
        run: |
          node --test tests/craft-target-match.test.mjs
          node tests/craft-target-hint.test.mjs
          node tests/craft-target-satisfaction.test.mjs
          node tests/craft-controls-ui.test.mjs
          node tests/craft-history.test.mjs
          node tests/craft-input-recovery.test.mjs
          node tests/game-shell-recovery.test.mjs
          node tests/craft-target-colors.test.mjs
          node tests/craft-tearoff.test.mjs
      - name: Generate PWA precache
        run: node scripts/build-precache.mjs
      - name: Repository hygiene and diff check
        run: |
          node tests/repository-hygiene.test.mjs
          git diff --check
      - name: Commit generated precache
        run: |
          if git diff --quiet -- sw.js precache-manifest.js target-match-ci.log; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A sw.js precache-manifest.js target-match-ci.log
          git commit -m "Refresh PWA precache for target match"
          git push origin HEAD:task/craft-target-match
