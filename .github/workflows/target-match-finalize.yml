name: Target Match finalizer

on:
  push:
    branches:
      - task/craft-target-match

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: task/craft-target-match
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Target Match and related CRAFT tests
        run: |
          set +e
          status=0
          {
            echo '=== craft-target-match ==='
            node --test tests/craft-target-match.test.mjs || status=1
            echo '=== craft-target-hint ==='
            node tests/craft-target-hint.test.mjs || status=1
            echo '=== craft-target-satisfaction ==='
            node tests/craft-target-satisfaction.test.mjs || status=1
            echo '=== craft-target ==='
            node tests/craft-target.test.mjs || status=1
            echo '=== unified-craft-target ==='
            node tests/unified-craft-target.test.mjs || status=1
            echo '=== craft-tearoff ==='
            node tests/craft-tearoff.test.mjs || status=1
            echo '=== craft-history ==='
            node tests/craft-history.test.mjs || status=1
            echo '=== craft-target-undo-derived ==='
            node tests/craft-target-undo-derived.test.mjs || status=1
          } > target-match-ci.log 2>&1
          cat target-match-ci.log
          exit $status
      - name: Commit diagnostics on failure
        if: failure()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add target-match-ci.log
          git commit -m "Capture target match CI diagnostics"
          git push origin HEAD:task/craft-target-match
      - name: Generate PWA precache
        if: success()
        run: node scripts/build-precache.mjs
      - name: Repository hygiene and diff check
        if: success()
        run: |
          node tests/repository-hygiene.test.mjs
          git diff --check
      - name: Commit generated precache
        if: success()
        run: |
          if git diff --quiet -- sw.js precache-manifest.js; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sw.js precache-manifest.js
          git commit -m "Refresh PWA precache for target match"
          git push origin HEAD:task/craft-target-match
