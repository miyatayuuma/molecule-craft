name: apply-collector-shell-entry
on:
  push:
    branches: [fix/collector-shell-entry]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace obsolete collector entry icon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); html=p.read_text()
          old='<button id="open-supply" class="collector-access" type="button" aria-label="収集殻とタンクを開く"><i aria-hidden="true"></i><span>収集殻</span></button>'
          new='<button id="open-supply" class="collector-access" type="button" aria-label="収集殻とタンクを開く"><img src="./assets/collector-shell.png" alt="" aria-hidden="true"><span>収集殻</span></button>'
          if old not in html: raise SystemExit('old collector entry not found')
          html=html.replace(old,new,1)
          html=html.replace('styles.css?v=43','styles.css?v=44',1)
          html=html.replace('src/pwa.js?v=31','src/pwa.js?v=32',1)
          p.write_text(html)

          p=Path('styles.css'); css=p.read_text()
          old='.resource-bar .collector-access{margin-left:auto;display:flex;align-items:center;gap:8px;border-color:#49768b;background:#102f40;color:#d8f5ff}.collector-access i{position:relative;width:24px;height:24px;border:1px solid #87cad9;border-radius:50%;box-shadow:inset 0 0 0 5px #173f50}.collector-access i:before,.collector-access i:after{content:\'\';position:absolute;background:#87cad9}.collector-access i:before{width:30px;height:1px;left:-4px;top:11px}.collector-access i:after{width:1px;height:30px;left:11px;top:-4px}'
          new='.resource-bar .collector-access{margin-left:auto;display:flex;align-items:center;gap:8px;border-color:#49768b;background:#102f40;color:#d8f5ff}.collector-access img{display:block;width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 5px #0007)}'
          if old not in css: raise SystemExit('old collector icon CSS not found')
          p.write_text(css.replace(old,new,1))

          p=Path('src/pwa.js'); src=p.read_text()
          if "EXPECTED_LOADER_REV='31'" not in src: raise SystemExit('loader rev 31 not found')
          p.write_text(src.replace("EXPECTED_LOADER_REV='31'","EXPECTED_LOADER_REV='32'",1))

          p=Path('tests/source-contracts.test.mjs'); t=p.read_text()
          t=t.replace('styles.css?v=43','styles.css?v=44').replace('src/pwa.js?v=31','src/pwa.js?v=32')
          t=t.replace(r'styles\.css\?v=43',r'styles\.css\?v=44').replace(r'src\/pwa\.js\?v=31',r'src\/pwa\.js\?v=32')
          p.write_text(t)
          p=Path('tests/pwa.test.mjs'); t=p.read_text().replace("EXPECTED_LOADER_REV='31'","EXPECTED_LOADER_REV='32'")
          p.write_text(t)
          PY
      - name: Validate UI and PWA
        run: |
          node --check src/pwa.js
          npm install --prefix /tmp/mc-jsdom jsdom@26
          node tests/source-contracts.test.mjs
          node tests/mobile-ui-check.mjs /tmp/mc-jsdom/node_modules/jsdom/lib/api.js
          node scripts/build-precache.mjs
          node tests/pwa.test.mjs
          node scripts/check-repository-hygiene.mjs
          git diff --check
          ! grep -F '<i aria-hidden="true"></i><span>収集殻</span>' index.html
          ! grep -F '.collector-access i{' styles.css
      - name: Commit implementation
        run: |
          rm .github/workflows/apply-collector-shell-entry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use current collector shell asset in craft entry"
          git push
