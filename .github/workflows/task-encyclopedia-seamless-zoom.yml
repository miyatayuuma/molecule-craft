name: Apply Encyclopedia seamless molecule zoom
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/encyclopedia-seamless-molecular-zoom
      - name: Apply production integration
        run: |
          python scripts/task-encyclopedia-seamless-zoom.py
          python scripts/task-encyclopedia-browser-seed.py
      - name: Focused Encyclopedia validation
        run: |
          node tests/encyclopedia-graph-ui.test.mjs
          node --test tests/encyclopedia-molecule-transition.test.mjs
          node tests/encyclopedia-transition-browser.test.mjs
          node tests/collection.test.mjs
          node tests/collection-expansion.test.mjs
          node tests/browser-startup.test.mjs
          node tests/source-contracts.test.mjs
      - name: Refresh PWA artifacts
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          rm scripts/task-encyclopedia-seamless-zoom.py
          rm scripts/task-encyclopedia-browser-seed.py
          git diff --check
      - name: Commit production changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/collection-ui.js src/collection-viewer.js src/encyclopedia-graph-view.js src/encyclopedia-molecule-transition.js tests/encyclopedia-graph-ui.test.mjs tests/encyclopedia-molecule-transition.test.mjs tests/encyclopedia-transition-browser.test.mjs docs/architecture.md precache-manifest.js sw.js scripts/task-encyclopedia-seamless-zoom.py scripts/task-encyclopedia-browser-seed.py
          git commit -m "Make Encyclopedia molecular zoom seamless"
          git push origin HEAD:fix/encyclopedia-seamless-molecular-zoom
