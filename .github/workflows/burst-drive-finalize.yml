name: Finalize BURST DRIVE differentiation

on:
  push:
    branches: [codex/burst-drive-differentiation]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply focused FIELD patch
        run: node scripts/apply-propulsion-differentiation.mjs
      - name: Regenerate developer map
        run: node scripts/export-field-map.mjs
      - name: Regenerate PWA artifacts last
        run: node scripts/build-precache.mjs
      - name: Focused propulsion differentiation
        run: node tests/propulsion-differentiation.test.mjs
      - name: FIELD regressions
        run: |
          node tests/field-map-export.test.mjs
          node tests/oxygen-field-integration.test.mjs
          node tests/deep-oxygen-routes.test.mjs
          node tests/hc-revisit-routes.test.mjs
          node tests/h-economy-balance.test.mjs
      - name: Propulsion regressions
        run: |
          node tests/expedition-core.test.mjs
          node tests/generic-propulsion.test.mjs
      - name: Thermal regressions
        run: |
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
      - name: Repository hygiene
        run: node tests/repository-hygiene.test.mjs
      - name: Generated artifact freshness
        run: |
          node scripts/export-field-map.mjs --check
          node scripts/build-precache.mjs --check
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Whitespace check
        run: git diff --check
      - name: Commit finalized implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Differentiate BURST and DRIVE in FIELD"
          git push origin HEAD:codex/burst-drive-differentiation
