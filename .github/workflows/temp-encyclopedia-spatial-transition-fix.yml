name: Temporary Encyclopedia transition fix

on:
  push:
    branches: [fix/encyclopedia-spatial-transition-regression]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/encyclopedia-spatial-transition-regression
      - name: Patch transition geometry and return preparation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              text=text.replace(old,new,count)
              p.write_text(text)

          # Transition proxy: morph its rectangle/mask instead of non-uniformly scaling the whole molecule visual.
          replace('src/encyclopedia-molecule-transition.js',
            ".encyclopedia-molecule-transition{position:fixed;z-index:10030;pointer-events:none;transform-origin:top left;will-change:transform}.encyclopedia-molecule-transition img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 18px #0009)}",
            ".encyclopedia-molecule-transition{position:fixed;z-index:10030;pointer-events:none;overflow:hidden;will-change:left,top,width,height,border-radius}.encyclopedia-molecule-transition img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;filter:drop-shadow(0 10px 18px #0009)}")
          replace('src/encyclopedia-molecule-transition.js',
            "export const encyclopediaVisualRect=rectOf;\nexport function encyclopediaDetailVisualRect(host){",
            "export const encyclopediaVisualRect=rectOf;\nexport function encyclopediaTransitionRectKeyframes(from,to,{fromRadius='0px',toRadius='0px'}={}){\n  return [\n    {left:`${from.left}px`,top:`${from.top}px`,width:`${from.width}px`,height:`${from.height}px`,borderRadius:fromRadius},\n    {left:`${to.left}px`,top:`${to.top}px`,width:`${to.width}px`,height:`${to.height}px`,borderRadius:toRadius},\n  ];\n}\nexport function encyclopediaDetailVisualRect(host){")
          replace('src/encyclopedia-molecule-transition.js',
            "const transitionPortal=(document,visual,explicit)=>explicit??visual?.closest?.('dialog[open]')??document.querySelector?.('dialog[open]')??document.body;\n",
            "const transitionPortal=(document,visual,explicit)=>explicit??visual?.closest?.('dialog[open]')??document.querySelector?.('dialog[open]')??document.body;\nconst visualPresentation=(node,win,{fit='contain',radius=null}={})=>{const computed=win?.getComputedStyle?.(node),candidate=(computed?.objectFit||node?.style?.objectFit||'').trim();return{objectFit:['contain','cover'].includes(candidate)?candidate:fit,borderRadius:radius??computed?.borderRadius??node?.style?.borderRadius??'0px'};};\n")
          replace('src/encyclopedia-molecule-transition.js',
            "function begin({id,direction,sourceVisual,sourceRect=rectOf(sourceVisual),sourceImage=null,sourceSurface=null}={}){",
            "function begin({id,direction,sourceVisual,sourceRect=rectOf(sourceVisual),sourceImage=null,sourceSurface=null,sourceFit=null,sourceRadius=null}={}){")
          replace('src/encyclopedia-molecule-transition.js',
            "source.alt=destination.alt='';source.src=sourceImage||imageFromVisual(sourceVisual,assetFor(id));destination.src=assetFor(id);Object.assign(proxy.style,{left:`${sourceRect.left}px`,top:`${sourceRect.top}px`,width:`${sourceRect.width}px`,height:`${sourceRect.height}px`});proxy.append(source,destination);",
            "source.alt=destination.alt='';source.src=sourceImage||imageFromVisual(sourceVisual,assetFor(id));destination.src=assetFor(id);const sourcePresentation=visualPresentation(sourceVisual,win,{fit:sourceFit??'contain',radius:sourceRadius});source.style.objectFit=sourcePresentation.objectFit;source.style.objectPosition='center';Object.assign(proxy.style,{left:`${sourceRect.left}px`,top:`${sourceRect.top}px`,width:`${sourceRect.width}px`,height:`${sourceRect.height}px`,borderRadius:sourcePresentation.borderRadius});proxy.append(source,destination);")
          replace('src/encyclopedia-molecule-transition.js',
            "const handle={token,id,direction,from:{...sourceRect},source,destination,proxy,sourceSurface:null,ready:null,to:null};",
            "const handle={token,id,direction,from:{...sourceRect},source,destination,proxy,sourceSurface:null,ready:null,to:null,sourcePresentation,targetPresentation:null};")
          replace('src/encyclopedia-molecule-transition.js',
            "async function attach(handle,{targetVisual,targetRect=rectOf(targetVisual),targetImage=null,targetSurface=null}={}){\n    if(!handle||state.handle!==handle||handle.token!==serial)return false;if(!targetRect){cancel({owner:handle.direction==='to-detail'?'detail':'graph'});return false;}state.phase=handle.direction==='to-detail'?'opening':'closing';",
            "async function attach(handle,{targetVisual,targetRect=rectOf(targetVisual),targetImage=null,targetSurface=null,targetFit=null,targetRadius=null}={}){\n    if(!handle||state.handle!==handle||handle.token!==serial)return false;if(!targetRect){cancel({owner:handle.direction==='to-detail'?'detail':'graph'});return false;}const targetPresentation=visualPresentation(targetVisual,win,{fit:targetFit??'contain',radius:targetRadius});handle.targetPresentation=targetPresentation;handle.destination.style.objectFit=targetPresentation.objectFit;handle.destination.style.objectPosition='center';state.phase=handle.direction==='to-detail'?'opening':'closing';")
          replace('src/encyclopedia-molecule-transition.js',
            "if(targetImage)updateDestinationImage(handle,targetImage);const ready=await handle.ready;",
            "updateDestinationImage(handle,targetImage??assetFor(handle.id));const ready=await handle.ready;")
          replace('src/encyclopedia-molecule-transition.js',
            "const {from}=handle,dx=targetRect.left-from.left,dy=targetRect.top-from.top,sx=targetRect.width/from.width,sy=targetRect.height/from.height;",
            "const {from}=handle,keyframes=encyclopediaTransitionRectKeyframes(from,targetRect,{fromRadius:handle.sourcePresentation?.borderRadius??'0px',toRadius:targetPresentation.borderRadius});")
          replace('src/encyclopedia-molecule-transition.js',
            "const animation=state.proxy?.animate?.([{transform:'translate(0,0) scale(1,1)'},{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`}],{duration,easing,fill:'forwards'});",
            "const animation=state.proxy?.animate?.(keyframes,{duration,easing,fill:'forwards'});")

          # One-shot hidden Graph preparation: return target is already focused/centered before its final rect is measured.
          replace('src/encyclopedia-graph-view.js',
            "host,graph,records,stateOptions,focusId,highlightId=null,onFocus=()=>{},onDetail=()=>{},onCraft=()=>{},previousPositions=new Map(),previousVisibleIds=new Set(),win=globalThis.window,",
            "host,graph,records,stateOptions,focusId,highlightId=null,onFocus=()=>{},onDetail=()=>{},onCraft=()=>{},previousPositions=new Map(),previousVisibleIds=new Set(),suppressMotion=false,win=globalThis.window,")
          replace('src/encyclopedia-graph-view.js',
            "if(previous&&!reduceMotion&&node.animate){",
            "if(previous&&!reduceMotion&&!suppressMotion&&node.animate){")
          replace('src/encyclopedia-graph-view.js',
            "if(!reduceMotion)runGraphGeometryMotion(graphMotion,geometryTweens,{win});",
            "if(!reduceMotion&&!suppressMotion)runGraphGeometryMotion(graphMotion,geometryTweens,{win});")

          replace('src/collection-ui.js',
            "import {ENCYCLOPEDIA_MOTION,renderEncyclopediaGraph} from './encyclopedia-graph-view.js?v=3';\nimport {createMoleculeTransitionController,encyclopediaDetailVisualRect,encyclopediaVisualRect} from './encyclopedia-molecule-transition.js?v=1';",
            "import {ENCYCLOPEDIA_MOTION,renderEncyclopediaGraph} from './encyclopedia-graph-view.js?v=4';\nimport {createMoleculeTransitionController,encyclopediaDetailVisualRect,encyclopediaVisualRect} from './encyclopedia-molecule-transition.js?v=2';")
          replace('src/collection-ui.js',
            "let graphFocusId=null,graphHighlightId=null,lastGraphPositions=new Map(),lastGraphVisibleIds=new Set();",
            "let graphFocusId=null,graphHighlightId=null,lastGraphPositions=new Map(),lastGraphVisibleIds=new Set(),suppressNextGraphMotion=false;")
          replace('src/collection-ui.js',
            "sourceImage:moleculeAsset(id),sourceSurface:sourceNode?.closest?.('.graph-stage')});",
            "sourceImage:moleculeAsset(id),sourceSurface:sourceNode?.closest?.('.graph-stage'),sourceFit:'cover',sourceRadius:'50%'});")
          replace('src/collection-ui.js',
            "moleculeTransition.attach(handle,{targetVisual:host,targetRect:to,targetImage:detailViewer?.snapshot?.()??null})",
            "moleculeTransition.attach(handle,{targetVisual:host,targetRect:to,targetImage:detailViewer?.snapshot?.()??null,targetFit:'contain',targetRadius:'0px'})")
          replace('src/collection-ui.js',
            "sourceImage:detailViewer?.snapshot?.()??moleculeAsset(currentId)});",
            "sourceImage:detailViewer?.snapshot?.()??moleculeAsset(currentId),sourceFit:'contain',sourceRadius:'0px'});")
          replace('src/collection-ui.js',
            "currentDetail=null;graphFocusId=currentId;graphHighlightId=null;renderBook();dialog.scrollTop=listScroll;",
            "currentDetail=null;graphFocusId=currentId;graphHighlightId=null;suppressNextGraphMotion=true;renderBook();dialog.scrollTop=listScroll;")
          replace('src/collection-ui.js',
            "moleculeTransition.attach(handle,{targetVisual:target,targetRect:to,targetImage:moleculeAsset(currentId),targetSurface})",
            "moleculeTransition.attach(handle,{targetVisual:target,targetRect:to,targetImage:moleculeAsset(currentId),targetSurface,targetFit:'cover',targetRadius:'50%'})")
          replace('src/collection-ui.js',
            "function renderGraph(){\n    ensureGraphFocus();\n    const result=renderEncyclopediaGraph({",
            "function renderGraph(){\n    ensureGraphFocus();\n    const suppressMotion=suppressNextGraphMotion;suppressNextGraphMotion=false;\n    const result=renderEncyclopediaGraph({")
          replace('src/collection-ui.js',
            "previousPositions:lastGraphPositions,previousVisibleIds:lastGraphVisibleIds,\n      onFocus:id=>focusGraph(id)",
            "previousPositions:lastGraphPositions,previousVisibleIds:lastGraphVisibleIds,suppressMotion,\n      onFocus:id=>focusGraph(id)")
          replace('src/craft-connections.js',"import('./collection-ui.js?v=39')","import('./collection-ui.js?v=40')")

          # Unit regression: geometry is rect-morphed and image fit/mask semantics encode crop/contain without scaleX/scaleY.
          p=Path('tests/encyclopedia-molecule-transition.test.mjs'); text=p.read_text()
          text=text.replace("animate(){let cancelled=false;return{cancel(){cancelled=true;},get cancelled(){return cancelled;},finished:Promise.resolve()};}","animate(keyframes=[],options={}){this.lastAnimation={keyframes,options};let cancelled=false;return{cancel(){cancelled=true;},get cancelled(){return cancelled;},finished:Promise.resolve()};}")
          old="const handle=controller.begin({id:'a',direction:'to-detail',sourceVisual:source});assert.ok(handle);"
          new="const handle=controller.begin({id:'a',direction:'to-detail',sourceVisual:source,sourceFit:'cover',sourceRadius:'50%'});assert.ok(handle);"
          if old not in text: raise SystemExit('unit forward begin pattern missing')
          text=text.replace(old,new,1)
          old="const pending=controller.attach(handle,{targetVisual:target,targetRect:{left:330,top:170,width:220,height:179}});assert.equal(controller.snapshot().phase,'opening');assert.equal(controller.snapshot().owner,'transition');await pending;"
          new="const pending=controller.attach(handle,{targetVisual:target,targetRect:{left:330,top:170,width:220,height:179},targetFit:'contain',targetRadius:'0px'});assert.equal(controller.snapshot().phase,'opening');assert.equal(controller.snapshot().owner,'transition');await pending;assert.equal(handle.source.style.objectFit,'cover');assert.equal(handle.destination.style.objectFit,'contain');assert.deepEqual(handle.proxy.lastAnimation.keyframes.map(frame=>frame.transform),[undefined,undefined],'proxy geometry must not use non-uniform transform scaling');assert.equal(handle.proxy.lastAnimation.keyframes[0].borderRadius,'50%');assert.equal(handle.proxy.lastAnimation.keyframes[1].borderRadius,'0px');"
          if old not in text: raise SystemExit('unit forward attach pattern missing')
          text=text.replace(old,new,1)
          old="const handle=controller.begin({id:'b',direction:'to-graph',sourceVisual:source,sourceImage:'detail-b.png'});assert.equal(controller.snapshot().moleculeId,'b');controller.updateDestinationImage(handle,'b.svg');await controller.attach(handle,{targetVisual:target});assert.equal(controller.snapshot().owner,'graph');"
          new="const handle=controller.begin({id:'b',direction:'to-graph',sourceVisual:source,sourceImage:'detail-b.png',sourceFit:'contain',sourceRadius:'0px'});assert.equal(controller.snapshot().moleculeId,'b');controller.updateDestinationImage(handle,'b.svg');await controller.attach(handle,{targetVisual:target,targetFit:'cover',targetRadius:'50%'});assert.equal(handle.source.style.objectFit,'contain');assert.equal(handle.destination.style.objectFit,'cover');assert.deepEqual(handle.proxy.lastAnimation.keyframes.map(frame=>frame.transform),[undefined,undefined]);assert.equal(handle.proxy.lastAnimation.keyframes[1].borderRadius,'50%');assert.equal(controller.snapshot().owner,'graph');"
          if old not in text: raise SystemExit('unit reverse pattern missing')
          text=text.replace(old,new,1)
          p.write_text(text)

          # Visible browser regression: inspect proxy geometry mode, fit hierarchy and target-centered Graph preparation.
          p=Path('tests/encyclopedia-visible-transition-browser.test.mjs'); text=p.read_text()
          text=text.replace("const frame=await evaluate(`(async()=>{const p=document.querySelector('.encyclopedia-molecule-transition');if(!p)return null;const animation=p.getAnimations().find(a=>(a.effect?.getTiming?.().duration??0)>0);if(!animation)return null;animation.pause();const duration=Number(animation.effect.getTiming().duration);animation.currentTime=duration*${progress};await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const rect=p.getBoundingClientRect(),style=getComputedStyle(p),source=p.querySelector('.transition-source');return{rect:{left:rect.left,top:rect.top,width:rect.width,height:rect.height},duration,currentTime:Number(animation.currentTime),opacity:Number(style.opacity),visibility:style.visibility,transform:style.transform,paintReady:p.dataset.paintReady,parentIsDialog:p.parentElement===document.querySelector('#collection-dialog'),sourceReady:!!source?.complete&&source.naturalWidth>0,reduced:matchMedia('(prefers-reduced-motion: reduce)').matches};})()`);",
            "const frame=await evaluate(`(async()=>{const p=document.querySelector('.encyclopedia-molecule-transition');if(!p)return null;const animation=p.getAnimations().find(a=>(a.effect?.getTiming?.().duration??0)>0);if(!animation)return null;animation.pause();const duration=Number(animation.effect.getTiming().duration);animation.currentTime=duration*${progress};await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const rect=p.getBoundingClientRect(),style=getComputedStyle(p),source=p.querySelector('.transition-source'),destination=p.querySelector('.transition-destination'),keyframes=animation.effect.getKeyframes().map(frame=>({left:frame.left??null,top:frame.top??null,width:frame.width??null,height:frame.height??null,transform:frame.transform??null,borderRadius:frame.borderRadius??null}));return{rect:{left:rect.left,top:rect.top,width:rect.width,height:rect.height},duration,currentTime:Number(animation.currentTime),opacity:Number(style.opacity),visibility:style.visibility,transform:style.transform,sourceFit:getComputedStyle(source).objectFit,destinationFit:getComputedStyle(destination).objectFit,keyframes,paintReady:p.dataset.paintReady,parentIsDialog:p.parentElement===document.querySelector('#collection-dialog'),sourceReady:!!source?.complete&&source.naturalWidth>0,reduced:matchMedia('(prefers-reduced-motion: reduce)').matches};})()`);")
          text=text.replace("assert.ok(frame,`${name}: transform animation must exist`);","assert.ok(frame,`${name}: geometry animation must exist`);assert.equal(frame.transform,'none',`${name}: proxy must not apply scaleX/scaleY to molecule geometry`);assert.ok(frame.keyframes.every(keyframe=>!keyframe.transform||keyframe.transform==='none'),`${name}: transition keyframes must morph rect/mask instead of non-uniform transform scaling`);")
          text=text.replace("const waitOwner=owner=>waitFor(`document.body.dataset.encyclopediaMoleculeOwner===${JSON.stringify(owner)}`,`owner did not settle on ${owner}`,{attempts:100,delay:30});",
            "const waitOwner=owner=>waitFor(`document.body.dataset.encyclopediaMoleculeOwner===${JSON.stringify(owner)}`,`owner did not settle on ${owner}`,{attempts:100,delay:30});\n  const focusBySearch=async(name,id)=>{await evaluate(`(()=>{const input=document.querySelector('.graph-search');input.value=${JSON.stringify(name)};input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));return true;})()`);await waitFor(`document.querySelector('.graph-node.focus')?.dataset.graphId===${JSON.stringify(id)}`,`Graph did not focus ${id}`);await new Promise(r=>setTimeout(r,650));};")
          text=text.replace("const mid=await proxyFrame(.5,`${prefix}-graph-to-detail-mid`);",
            "assert.equal(start.sourceFit,'cover',`${prefix}: Graph source crop must be represented by cover, not stretched geometry`);assert.equal(start.destinationFit,'contain',`${prefix}: Detail destination must preserve molecule aspect with contain`);const mid=await proxyFrame(.5,`${prefix}-graph-to-detail-mid`);")
          old="const to=await waitFor(`(()=>{const visual=document.querySelector('.graph-node.focus .graph-focus-thumbnail'),r=visual?.getBoundingClientRect();return r&&r.width>0&&{left:r.left,top:r.top,width:r.width,height:r.height};})()`,`${prefix}: Graph destination rect missing`),start=await proxyFrame(0,`${prefix}-detail-to-graph-start`);"
          new="const prepared=await waitFor(`(()=>{const node=document.querySelector('.graph-node.focus'),visual=node?.querySelector('.graph-focus-thumbnail'),r=visual?.getBoundingClientRect();if(!r||!r.width)return null;const motion=node.getAnimations().filter(a=>(a.effect?.getTiming?.().duration??0)>0&&a.playState!=='finished').length;return{id:node.dataset.graphId,motion,rect:{left:r.left,top:r.top,width:r.width,height:r.height}};})()`,`${prefix}: prepared Graph destination missing`),to=prepared.rect;assert.equal(prepared.motion,0,`${prefix}: return target must be rendered directly at final centered geometry without hidden Graph navigation motion`);const start=await proxyFrame(0,`${prefix}-detail-to-graph-start`);"
          if old not in text: raise SystemExit('visible reverse prepared pattern missing')
          text=text.replace(old,new,1)
          text=text.replace("const mid=await proxyFrame(.5,`${prefix}-detail-to-graph-mid`);",
            "assert.equal(start.sourceFit,'contain',`${prefix}: Detail source must preserve molecule aspect with contain`);assert.equal(start.destinationFit,'cover',`${prefix}: Graph destination crop must be represented by cover, not stretched geometry`);const mid=await proxyFrame(.5,`${prefix}-detail-to-graph-mid`);")
          old="await playProxy();await waitOwner('graph');await capture(`${prefix}-detail-to-graph-end`);return to;"
          new="await playProxy();await waitOwner('graph');const landed=await graphRect();await new Promise(r=>setTimeout(r,620));const settled=await graphRect();assert.ok(distance(center(landed),center(to))<1.5,`${prefix}: handoff must land on the prepared centered target`);assert.ok(distance(center(settled),center(to))<1.5,`${prefix}: target must not perform a second centering move after handoff`);await capture(`${prefix}-detail-to-graph-end`);return to;"
          if old not in text: raise SystemExit('visible reverse settle pattern missing')
          text=text.replace(old,new,1)
          text=text.replace("discoveredMolecules:['hydrogen','oxygen','n-butane','isobutane']","discoveredMolecules:['methylcyclohexane','benzene','n-butane','isobutane']")
          old="await runForward('desktop');await runBack('desktop');\n\n  await send('Emulation.setDeviceMetricsOverride',{width:390,height:844,deviceScaleFactor:1,mobile:true});"
          new="await runForward('desktop');await runBack('desktop');\n  await focusBySearch('メチルシクロヘキサン','methylcyclohexane');await runForward('desktop-methylcyclohexane');await runBack('desktop-methylcyclohexane');\n  await focusBySearch('ベンゼン','benzene');await runForward('desktop-benzene');await runBack('desktop-benzene');\n\n  await send('Emulation.setDeviceMetricsOverride',{width:390,height:844,deviceScaleFactor:1,mobile:true});"
          if old not in text: raise SystemExit('visible desktop sequence pattern missing')
          text=text.replace(old,new,1)
          old="assert.equal(await evaluate(`matchMedia('(prefers-reduced-motion: reduce)').matches`),false,'mobile normal-motion fixture must remain non-reduced');\n  await runForward('mobile');await runBack('mobile');"
          new="assert.equal(await evaluate(`matchMedia('(prefers-reduced-motion: reduce)').matches`),false,'mobile normal-motion fixture must remain non-reduced');\n  await focusBySearch('メチルシクロヘキサン','methylcyclohexane');await runForward('mobile-methylcyclohexane');await runBack('mobile-methylcyclohexane');"
          if old not in text: raise SystemExit('visible mobile sequence pattern missing')
          text=text.replace(old,new,1)
          text=text.replace("console.log('Encyclopedia visible transition passed: top-layer painted proxy, decoded source, strict position+scale midpoint, desktop/mobile forward+reverse, reduced motion.');","console.log('Encyclopedia visible transition passed: aspect-preserving rect/mask morph, target-centered reverse preparation without post-handoff motion, methylcyclohexane/benzene desktop, methylcyclohexane mobile, reduced motion.');")
          p.write_text(text)

          # Current-molecule regression: prev/next and isomer returns must also have no hidden focus motion.
          p=Path('tests/encyclopedia-transition-browser.test.mjs'); text=p.read_text()
          old="await new Promise(r=>setTimeout(r,60));assert.equal(await evaluate(`document.body.dataset.encyclopediaMoleculeId`),currentAfterNav);"
          new="await new Promise(r=>setTimeout(r,60));assert.equal(await evaluate(`document.body.dataset.encyclopediaMoleculeId`),currentAfterNav);const preparedCurrentReturn=await evaluate(`(()=>{const node=document.querySelector('.graph-node.focus');return{id:node?.dataset.graphId,motion:node?[...node.getAnimations()].filter(a=>(a.effect?.getTiming?.().duration??0)>0&&a.playState!=='finished').length:-1};})()`);assert.equal(preparedCurrentReturn.id,currentAfterNav);assert.equal(preparedCurrentReturn.motion,0,'prev/next Detail return must prepare the current molecule directly at final Graph focus geometry');"
          if old not in text: raise SystemExit('current nav return pattern missing')
          text=text.replace(old,new,1)
          old="host.dispatchEvent(new PointerEvent('pointerdown',o));host.dispatchEvent(new PointerEvent('pointerup',o));})()`);for(let i=0;i<30;i++){"
          new="host.dispatchEvent(new PointerEvent('pointerdown',o));host.dispatchEvent(new PointerEvent('pointerup',o));})()`);await new Promise(r=>setTimeout(r,60));const preparedIsomerReturn=await evaluate(`(()=>{const node=document.querySelector('.graph-node.focus');return{id:node?.dataset.graphId,motion:node?[...node.getAnimations()].filter(a=>(a.effect?.getTiming?.().duration??0)>0&&a.playState!=='finished').length:-1};})()`);assert.equal(preparedIsomerReturn.id,isomerId);assert.equal(preparedIsomerReturn.motion,0,'isomer Detail return must prepare the current isomer directly at final Graph focus geometry');for(let i=0;i<30;i++){"
          if old not in text: raise SystemExit('isomer return pattern missing')
          text=text.replace(old,new,1)
          p.write_text(text)

          PY
          node scripts/build-precache.mjs
      - name: Run targeted transition regressions
        env:
          ENCYCLOPEDIA_CAPTURE: '1'
        run: |
          node --test tests/encyclopedia-molecule-transition.test.mjs
          node tests/encyclopedia-graph-ui.test.mjs
          node tests/encyclopedia-transition-browser.test.mjs
          node tests/encyclopedia-visible-transition-browser.test.mjs
          node scripts/build-precache.mjs --check
      - name: Commit fix and generated PWA outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/encyclopedia-molecule-transition.js src/encyclopedia-graph-view.js src/collection-ui.js src/craft-connections.js tests/encyclopedia-molecule-transition.test.mjs tests/encyclopedia-transition-browser.test.mjs tests/encyclopedia-visible-transition-browser.test.mjs sw.js precache-manifest.js
          git commit -m "Fix Encyclopedia spatial transition regressions"
          git push
