name: Task 5 artifact generation

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Generate canonical artifacts
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- docs/maps/current-field.svg precache-manifest.js sw.js; then
            echo "Generated artifacts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maps/current-field.svg precache-manifest.js sw.js
          git commit -m "Regenerate FIELD map and PWA artifacts"
          git push origin HEAD:${{ github.head_ref }}
