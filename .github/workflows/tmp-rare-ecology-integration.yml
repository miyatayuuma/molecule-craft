name: Temporary Rare ecology integration validation

on:
  push:
    branches: [field/post-core-rare-ecology-foundation]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refresh generated FIELD map
        run: node scripts/export-field-map.mjs
      - name: Refresh PWA artifacts
        run: node scripts/build-precache.mjs
      - name: Rare ecology integration
        run: |
          node tests/rare-ecology.test.mjs
          node tests/rare-ecology-browser.test.mjs
          node tests/field-runtime-allowlist.test.mjs
          node tests/field-map-export.test.mjs
          node tests/element-authority-n-foundation.test.mjs
          node tests/resources-persistence.test.mjs
          node tests/nitrogen-world-awakening.test.mjs
          node tests/nitrogen-field-integration.test.mjs
          node tests/shock-unit.test.mjs
          node tests/inventory-depletion.test.mjs
          node tests/repository-hygiene.test.mjs
      - name: Verify generated artifacts
        run: |
          node scripts/export-field-map.mjs --check
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet -- docs/maps/current-field.svg sw.js precache-manifest.js; then
            echo "Generated artifacts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maps/current-field.svg sw.js precache-manifest.js
          git commit -m "Refresh Rare ecology FIELD map and PWA artifacts"
          git push
