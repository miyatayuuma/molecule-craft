name: Temporary incomplete carbon validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Runtime
        run: node --version
      - name: Incomplete carbon regression
        run: node tests/incomplete-carbon-geometry.test.mjs
      - name: Existing bonding regressions
        run: node tests/bond-state.test.mjs
      - name: Existing structure relaxation regressions
        run: node tests/structure-relaxation.test.mjs
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: Rebuild PWA precache
        run: node scripts/build-precache.mjs
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Commit generated PWA release when needed
        shell: bash
        run: |
          if git diff --quiet -- sw.js precache-manifest.js; then
            echo "Precache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git commit -m "Refresh PWA precache manifest"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
