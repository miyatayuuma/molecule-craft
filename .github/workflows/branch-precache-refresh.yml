name: Branch precache refresh

on:
  push:
    branches:
      - work/launch-transaction-rollback

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/launch-transaction-rollback
      - run: node scripts/build-precache.mjs
      - name: Commit generated PWA artifacts
        run: |
          if git diff --quiet -- precache-manifest.js sw.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precache-manifest.js sw.js
          git commit -m "Refresh generated PWA artifacts"
          git push origin HEAD:work/launch-transaction-rollback
