name: Issue 110 validation
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check src/app.js
          node --check src/craft-history.js
          node --check src/craft-controls.js
          node --check src/craft-panel.js
      - name: Undo history tests
        run: node --test tests/craft-history.test.mjs tests/craft-undo-contract.test.mjs tests/craft-controls-ui.test.mjs tests/craft-target-undo-derived.test.mjs
      - name: Related regressions
        run: |
          node tests/craft-workspace.test.mjs
          node tests/workspace-save.test.mjs
          node tests/source-contracts.test.mjs
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
