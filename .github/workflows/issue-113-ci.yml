name: Issue 113 validation

on:
  push:
    branches: [issue-113-db-bootstrap-regression]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check src/chemistry.js
          node --check tests/issue-113-regression.test.mjs
      - name: Regression tests
        run: node --test tests/issue-113-regression.test.mjs tests/collection.test.mjs tests/loadout-launch-regression.test.mjs tests/pending-craft.test.mjs tests/source-contracts.test.mjs
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
