name: Issue 122 launch audit

on:
  push:
    branches: [audit/issue-122-launch-route]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install DOM harness dependency
        run: npm install --no-save --package-lock=false jsdom@26
      - name: Production destination to EXPLORE harness
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('tests/veil-ui-check.mjs').read_text()
          source=source.replace(",loadMoleculeDatabase:async()=>({ok:true})","")
          old="q('open-supply').click();assert.equal(q('supply-dialog').open,true);q('launch-veil').click();await settle();"
          new="q('open-supply').click();assert.equal(q('supply-dialog').open,true);q('collector-launch-handle').dispatchEvent(new game.window.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));const auditDestination=q('expedition-destinations').querySelector('[data-region=veil]');assert.ok(auditDestination);auditDestination.click();await settle();"
          assert old in source
          source=source.replace(old,new,1)
          marker="assert.equal(game.run('veilUI.active'),true);"
          assert marker in source
          source=source.replace(marker,marker+"console.log('Issue #122 production destination relay reached active EXPLORE.');process.exit(0);",1)
          Path('tests/veil-ui-check-audit.mjs').write_text(source)
          PY
          node tests/veil-ui-check-audit.mjs "$PWD/node_modules/jsdom/lib/api.js"
      - name: Focused launch regressions
        if: always()
        run: |
          node tests/issue-122-launch-route.test.mjs
          node tests/loadout-preview.test.mjs
          node tests/issue-119-regression.test.mjs
          node tests/issue-113-regression.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/launch-transition.test.mjs
          node tests/launch-pointer-lifecycle.test.mjs
          node tests/launch-dialog-lock.test.mjs
          node tests/craft-connections.test.mjs
          node tests/repository-hygiene.test.mjs
