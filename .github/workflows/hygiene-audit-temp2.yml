name: Temporary focused hygiene scan

on:
  push:
    branches:
      - chore/repository-hygiene-audit

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Focused report
        shell: bash
        run: |
          echo '=== CATALOG LITERALS ==='
          git grep -n -E '(^|[^0-9])(129|130|135)([^0-9]|$)' -- '*.js' '*.mjs' '*.json' '*.md' '*.yml' '*.yaml' | grep -v '^data/molecules.json:' || true
          echo '=== LEGACY TERMS ==='
          git grep -n -Ei '\b(legacy|compat|obsolete|deprecated|warp)\b' -- src || true
          echo '=== LAUNCH DOM ==='
          git grep -n -E 'expedition-anchor|launch-veil|\.click\(\)|dispatchEvent\(' -- src index.html tests || true
          echo '=== RESONANCE OLD NAMING ==='
          git grep -n -E 'legacySharedBond|sharedBondCurves|distributedResonanceBondLines|resonance.*arc|arc.*resonance' -- src scripts tests || true
          echo '=== LEARNING NOTE OUTSIDE DB ==='
          git grep -n 'learningNote' -- . ':(exclude)data/molecules.json' || true
