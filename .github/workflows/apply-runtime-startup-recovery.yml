name: apply-runtime-startup-recovery
on:
  push:
    branches: [fix/runtime-startup-recovery]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply shell and startup recovery
        run: python .github/runtime-recovery.py
      - name: Validate runtime recovery
        shell: bash
        run: |
          node --check src/app.js
          node --check src/pwa.js
          npm install --prefix /tmp/mc-jsdom jsdom@26 >/dev/null
          node tests/source-contracts.test.mjs
          node tests/mobile-ui-check.mjs /tmp/mc-jsdom/node_modules/jsdom/lib/api.js
          node tests/craft-target-display.test.mjs
          node tests/workspace-save.test.mjs
          node scripts/build-precache.mjs
          node tests/pwa.test.mjs
          node scripts/check-repository-hygiene.mjs
          git diff --check
      - name: Commit runtime recovery
        run: |
          rm .github/workflows/apply-runtime-startup-recovery.yml .github/runtime-recovery.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover mixed PWA shell and isolate craft startup"
          git push
