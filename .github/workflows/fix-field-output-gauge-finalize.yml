name: FIELD output gauge finalizer

on:
  push:
    branches:
      - fix/field-output-gauge

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/field-output-gauge
          fetch-depth: 0
      - name: Apply focused HUD semantics fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing {label}')
              return text.replace(old, new, 1)

          path = Path('src/veil/ui.js')
          text = path.read_text()
          text = replace_once(
              text,
              "thermal=q('veil-thermal'),speedMeterFill=q('veil-heat-meter'),speedMeter=speedMeterFill?.parentElement,audio=createVeilAudio()",
              "thermal=q('veil-thermal'),outputMeterFill=q('veil-heat-meter'),outputMeter=outputMeterFill?.parentElement,audio=createVeilAudio()",
              'meter bindings',
          )
          text = replace_once(
              text,
              "if(speedMeter){speedMeter.id='veil-speed-meter';speedMeter.removeAttribute('aria-hidden');speedMeter.setAttribute('role','meter');speedMeter.setAttribute('aria-label','現在速度');speedMeter.setAttribute('aria-valuemin','0');}",
              "if(outputMeter){outputMeter.id='veil-output-meter';outputMeter.removeAttribute('aria-hidden');outputMeter.setAttribute('role','meter');outputMeter.setAttribute('aria-label','推進出力');outputMeter.setAttribute('aria-valuemin','0');outputMeter.setAttribute('aria-valuemax','100');}",
              'meter accessibility',
          )
          text = replace_once(
              text,
              "if(speedMeterFill)speedMeterFill.id='veil-speed-meter-fill';",
              "if(outputMeterFill)outputMeterFill.id='veil-output-meter-fill';",
              'meter fill id',
          )
          text = replace_once(
              text,
              "speedMax=propulsionSpeedMax(run.config),speed=Math.max(0,run.player.speed),speedRatio=speedMax?Math.max(0,Math.min(1,speed/speedMax)):0,activeThermalNotice=thermalNotice&&run.time<thermalNoticeUntil",
              "outputMax=propulsionSpeedMax(run.config),output=Math.max(0,run.player.speed),outputRatio=outputMax?Math.max(0,Math.min(1,output/outputMax)):0,activeThermalNotice=thermalNotice&&run.time<thermalNoticeUntil",
              'output ratio',
          )
          text = replace_once(
              text,
              "q('veil-heat').textContent='SPEED';thermal.setAttribute('aria-label',`熱状態 ${thermalLabels[thermalState]}。熱 ${Math.round(run.heat)}%。`);if(speedMeter){speedMeter.setAttribute('aria-valuemax',String(speedMax));speedMeter.setAttribute('aria-valuenow',String(speed));}if(speedMeterFill)speedMeterFill.style.transform=`scaleX(${speedRatio})`;",
              "q('veil-heat').textContent='OUTPUT';thermal.setAttribute('aria-label',`熱状態 ${thermalLabels[thermalState]}。熱 ${Math.round(run.heat)}%。`);if(outputMeter){const percent=Math.round(outputRatio*100);outputMeter.setAttribute('aria-valuenow',String(percent));outputMeter.setAttribute('aria-valuetext',`${percent}%`);}if(outputMeterFill)outputMeterFill.style.transform=`scaleX(${outputRatio})`;",
              'HUD output semantics',
          )
          if "textContent='SPEED'" in text or "aria-label','現在速度'" in text or "veil-speed-meter" in text:
              raise SystemExit('speed semantics survived FIELD HUD')
          path.write_text(text)

          path = Path('tests/propulsion-hud-source.test.mjs')
          text = path.read_text()
          text = replace_once(text, "assert.match(ui,/speed=Math\\.max\\(0,run\\.player\\.speed\\)/,'FIELD HUD reads canonical run.player.speed');", "assert.match(ui,/output=Math\\.max\\(0,run\\.player\\.speed\\)/,'FIELD OUTPUT reads the propulsion-side run.player.speed state, not final displacement');", 'output source test')
          text = replace_once(text, "assert.match(ui,/speedMax=propulsionSpeedMax\\(run\\.config\\)/,'FIELD HUD scale is configuration-derived');", "assert.match(ui,/outputMax=propulsionSpeedMax\\(run\\.config\\)/,'FIELD OUTPUT scale is configuration-derived');", 'output max test')
          text = replace_once(text, "assert.match(ui,/speedMeter\\.id='veil-speed-meter'/);", "assert.match(ui,/outputMeter\\.id='veil-output-meter'/);", 'output id test')
          text = replace_once(text, "assert.match(ui,/speedMeter\\.setAttribute\\('role','meter'\\)/);", "assert.match(ui,/outputMeter\\.setAttribute\\('role','meter'\\)/);", 'output meter role test')
          text = replace_once(text, "assert.match(ui,/aria-valuemax/);assert.match(ui,/aria-valuenow/);", "assert.match(ui,/outputMeter\\.setAttribute\\('aria-label','推進出力'\\)/);assert.match(ui,/outputMeter\\.setAttribute\\('aria-valuemax','100'\\)/);assert.match(ui,/aria-valuenow/);", 'output accessibility test')
          text = replace_once(text, "assert.match(ui,/q\\('veil-heat'\\)\\.textContent='SPEED'/,'Primary quantitative bar is explicitly labeled SPEED');", "assert.match(ui,/q\\('veil-heat'\\)\\.textContent='OUTPUT'/,'Primary quantitative bar is explicitly labeled OUTPUT');\nassert.doesNotMatch(ui,/textContent='SPEED'|aria-label','現在速度'|veil-speed-meter/,'FIELD HUD must not present propulsion state as actual speed');", 'output visible label test')
          text = replace_once(text, "console.log('Propulsion HUD source contract passed: max PULSE dots, canonical speed meter, thermal states, coolant feedback, DRIVE/BURST bindings, and responsive bounds.');", "console.log('Propulsion HUD source contract passed: max PULSE dots, propulsion OUTPUT meter, thermal states, coolant feedback, DRIVE/BURST bindings, and responsive bounds.');", 'test summary')
          path.write_text(text)
          PY
      - name: Regenerate PWA artifacts
        run: node scripts/build-precache.mjs
      - name: Focused validation
        run: |
          node tests/propulsion-hud-source.test.mjs
          node tests/generic-propulsion.test.mjs
          node tests/coolant-feedback.test.mjs
          node tests/source-contracts.test.mjs
          node tests/repository-hygiene.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit focused change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veil/ui.js tests/propulsion-hud-source.test.mjs precache-manifest.js sw.js
          git commit -m "Present FIELD propulsion as output"
          git push origin HEAD:fix/field-output-gauge
