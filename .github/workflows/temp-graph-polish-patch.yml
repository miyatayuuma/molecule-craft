name: Temporary Graph polish patch

on:
  push:
    branches: [work/encyclopedia-graph-thumbnail-label-polish]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/encyclopedia-graph-thumbnail-label-polish
      - name: Tighten Graph thumbnail fill and stabilize visual capture
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/encyclopedia-graph-view.js')
          text = source.read_text()
          old = ".graph-focus-thumbnail{position:absolute;z-index:1;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);max-width:none;"
          new = ".graph-focus-thumbnail{position:absolute;z-index:1;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);max-width:none;"
          if old not in text:
              raise SystemExit('Graph thumbnail source pattern not found')
          source.write_text(text.replace(old, new, 1))

          test = Path('tests/encyclopedia-graph-thumbnail-label-browser.test.mjs')
          text = test.read_text()
          old = "if(await evaluate(`!!document.querySelector('.graph-node.focus.registered .graph-focus-thumbnail')`))break;}\n  const inspect=()=>evaluate"
          new = "if(await evaluate(`!!document.querySelector('.graph-node.focus.registered .graph-focus-thumbnail')`))break;}\n  await pause(650);\n  const inspect=()=>evaluate"
          if old not in text:
              raise SystemExit('Initial visual wait pattern not found')
          text = text.replace(old, new, 1)
          old = "const desktop=await inspect();await screenshot('desktop-methylcyclohexane.png');console.log('Encyclopedia Graph desktop metrics',JSON.stringify(desktop));"
          new = "const desktop=await inspect();await screenshot('desktop-methylcyclohexane.png');"
          if old not in text:
              raise SystemExit('Diagnostic metrics pattern not found')
          text = text.replace(old, new, 1)
          old = "assert.equal(mobile.neighborId,'methylcyclohexane','long name must remain a direct-neighbor label after navigation');assert.equal(mobile.neighborLabelOverlapsNode,false);"
          new = "assert.equal(mobile.neighborId,'methylcyclohexane','long name must remain a direct-neighbor label after navigation');assert(mobile.neighborImageRect.width/mobile.neighborRect.width>=.85,'mobile direct-neighbor structure should use most of its circular node');assert.equal(mobile.neighborLabelOverlapsNode,false);"
          if old not in text:
              raise SystemExit('Mobile direct-neighbor assertion pattern not found')
          test.write_text(text.replace(old, new, 1))
          PY
          node scripts/build-precache.mjs
      - name: Commit patch and generated PWA outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/encyclopedia-graph-view.js tests/encyclopedia-graph-thumbnail-label-browser.test.mjs sw.js precache-manifest.js
          git commit -m "Tighten Encyclopedia Graph thumbnail fill"
          git push
