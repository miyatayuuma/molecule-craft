name: Molecule graph whitespace fixer
on:
  push:
    branches: [design/molecule-graph-audit]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/molecule-graph-audit
      - name: Remove trailing whitespace
        run: sed -i 's/[[:space:]]\+$//' docs/molecule-graph-design.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/molecule-graph-design.md
          git commit -m "Fix molecule graph design whitespace"
          git push origin HEAD:design/molecule-graph-audit
