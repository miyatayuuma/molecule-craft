name: Task 5F refresh PWA

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-pwa:
    if: github.head_ref == 'task-5f-ctfe-electrical-treatment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Regenerate verified offline release
        run: node scripts/build-precache.mjs
      - name: Commit generated PWA artifacts
        run: |
          if git diff --quiet -- sw.js precache-manifest.js; then
            echo "PWA artifacts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git commit -m "Refresh PWA precache for Task 5F"
          git push origin HEAD:${{ github.head_ref }}
