name: Unify craft targets

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize craft target runtime
        run: python scripts/normalize-unified-craft-target-runtime.py
      - run: node --check src/veil/ui.js
      - run: node --check src/craft-panel.js
      - run: node --check src/app.js
      - run: node tests/unified-craft-target.test.mjs
      - run: node tests/craft-target.test.mjs
      - run: node tests/craft-chrome.test.mjs
      - run: node tests/source-contracts.test.mjs
      - run: node scripts/check-repository-hygiene.mjs
      - run: node scripts/build-precache.mjs
      - name: Commit normalized runtime
        shell: bash
        run: |
          if git diff --quiet -- src/veil/ui.js tests/unified-craft-target.test.mjs precache-manifest.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veil/ui.js tests/unified-craft-target.test.mjs precache-manifest.js
          git commit -m "Normalize unified craft target runtime"
          git push origin HEAD:${{ github.head_ref }}
