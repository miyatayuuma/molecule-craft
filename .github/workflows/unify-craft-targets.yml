name: Unify craft targets

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply unified craft target changes
        run: python scripts/apply-unified-craft-targets.py
      - run: node tests/unified-craft-target.test.mjs
      - run: node tests/craft-target.test.mjs
      - run: node tests/craft-chrome.test.mjs
      - run: node tests/source-contracts.test.mjs
      - run: node scripts/check-repository-hygiene.mjs
      - run: node scripts/build-precache.mjs
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- index.html styles.css veil.css src/app.js src/craft-connections.js src/craft-panel.js src/veil/ui.js tests/source-contracts.test.mjs tests/unified-craft-target.test.mjs precache-manifest.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css veil.css src/app.js src/craft-connections.js src/craft-panel.js src/veil/ui.js tests/source-contracts.test.mjs tests/unified-craft-target.test.mjs precache-manifest.js
          git commit -m "Unify craft targets and hide undiscovered names"
          git push origin HEAD:${{ github.head_ref }}
