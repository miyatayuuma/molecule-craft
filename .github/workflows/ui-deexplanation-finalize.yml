name: UI de-explanation finalizer

on:
  push:
    branches:
      - ui-deexplanation-pass

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui-deexplanation-pass
          fetch-depth: 0
      - name: Apply focused UI de-explanation pass
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path,text): Path(path).write_text(text)
          def exact(text,old,new,label):
              if old not in text:
                  raise SystemExit(f'missing exact block: {label}')
              return text.replace(old,new,1)

          # Pending blueprints: remove visible explanatory title/subtitle rather than replacing it with copy.
          path='src/pending-craft.js'; text=read(path)
          old="""    dialog=root.createElement('dialog');dialog.id='pending-crafts-dialog';dialog.className='sheet';dialog.setAttribute('aria-labelledby','pending-crafts-title');
    const header=root.createElement('header');header.className='sheet-header';
    const heading=root.createElement('div'),title=root.createElement('h2'),subtitle=root.createElement('p'),close=root.createElement('button');
    title.id='pending-crafts-title';title.textContent='未作成の設計図';subtitle.className='muted';subtitle.textContent='探索で見つけた、まだ作っていない分子';close.type='button';close.setAttribute('aria-label','未作成の設計図を閉じる');close.textContent='×';heading.append(title,subtitle);header.append(heading,close);"""
          new="""    dialog=root.createElement('dialog');dialog.id='pending-crafts-dialog';dialog.className='sheet';dialog.setAttribute('aria-label','設計図');
    const header=root.createElement('header');header.className='sheet-header';
    const close=root.createElement('button');
    close.type='button';close.setAttribute('aria-label','設計図を閉じる');close.textContent='×';header.append(close);"""
          text=exact(text,old,new,'pending visible explanation')
          text=exact(text,"access.setAttribute('aria-label',ids.length?`未作成の設計図 ${ids.length}件`:'未作成の設計図なし')","access.setAttribute('aria-label',ids.length?`設計図 ${ids.length}件`:'設計図なし')",'pending access label')
          write(path,text)

          # LOADOUT: direct stock state instead of prose shortage status.
          path='src/veil/loadout-workstation.js'; text=read(path)
          pattern=r"function shortageRatio\(chips\)\{.*?\n\}\n\nfunction syncStockPreview\(preview\)\{.*?\n\}\n\nfunction observeStockPreview"
          replacement="""function syncStockPreview(preview){
  if(!preview)return;
  const chips=[...preview.children].filter(node=>node.dataset?.sufficient!==undefined);
  if(!chips.length){preview.hidden=true;return;}
  const insufficient=chips.some(chip=>chip.dataset.sufficient==='false');
  preview.hidden=!insufficient;
  for(const chip of chips){chip.hidden=false;chip.dataset.stockState=chip.dataset.sufficient==='false'?'short':'ready';}
  if(insufficient)preview.setAttribute('aria-label','必要元素');else preview.removeAttribute('aria-label');
}

function observeStockPreview"""
          text,n=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('missing stock preview functions')
          text=text.replace("#supply-dialog #loadout-stock-preview{display:grid!important;grid-template-columns:1fr!important;width:min(330px,calc(100% - 44px));min-height:0!important;margin:8px auto 0;padding:0!important}","#supply-dialog #loadout-stock-preview{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:7px;width:min(330px,calc(100% - 44px));min-height:0!important;margin:8px auto 0;padding:0!important}")
          text=re.sub(r"\n#supply-dialog \.loadout-shortage-status\{[^\n]*\}\n#supply-dialog \.loadout-shortage-status>i\{[^\n]*\}\n#supply-dialog \.loadout-shortage-status>i>b\{[^\n]*\}","\n#supply-dialog #loadout-stock-preview>[data-sufficient]{min-width:0;padding:6px 8px;border:1px solid #34505d;border-radius:9px;background:#0b202b;color:#c9d8dd;font-variant-numeric:tabular-nums;text-align:center}\n#supply-dialog #loadout-stock-preview>[data-sufficient='true']{opacity:.42}\n#supply-dialog #loadout-stock-preview>[data-sufficient='false']{border-color:#b97856;box-shadow:inset 0 0 0 1px #b9785633,0 0 9px #b9785622;color:#f0d2bf}",text,count=1)
          text=text.replace("#supply-dialog .loadout-shortage-status{gap:8px;font-size:9.5px}","#supply-dialog #loadout-stock-preview{grid-template-columns:repeat(2,minmax(0,1fr))!important}")
          text=text.replace(",#supply-dialog .loadout-shortage-status>i>b","")
          if 'loadout-shortage-status' in text or '材料不足' in text: raise SystemExit('explanatory workstation shortage survived')
          write(path,text)

          # LOADOUT: canonical have/need state, no explanatory shortage sentences, keep chosen destination visible.
          path='src/veil/supply.js'; text=read(path)
          text=exact(text,"return Object.entries(plan?.missing??{}).map(([element,row])=>({element,count:Math.max(0,(row?.need??0)-(row?.have??0))})).filter(item=>item.count>0);","return Object.entries(plan?.missing??{}).map(([element,row])=>({element,have:Math.max(0,row?.have??0),need:Math.max(0,row?.need??0)})).filter(item=>item.have<item.need);",'canonical shortage state')
          text=exact(text,"partialGo.type='button';partialGo.className='primary';partialGo.textContent='この量で出る';","partialGo.type='button';partialGo.className='primary';partialGo.textContent='出発';",'partial action label')
          text=exact(text,"const confirmation=launchConfirmationState(plan);partialRows.replaceChildren();partialPanel.dataset.fillState=confirmation.zeroFill?'ZERO':'PARTIAL';partialGo.textContent=confirmation.zeroFill?'この状態で出る':'この量で出る';\n    if(confirmation.zeroFill){const blocked=document.createElement('strong');blocked.textContent='搭載できません';blocked.dataset.fillUnavailable='true';Object.assign(blocked.style,{fontSize:'15px',lineHeight:'1.4',color:'#f1f7f9'});partialRows.append(blocked);}","const confirmation=launchConfirmationState(plan);partialRows.replaceChildren();partialPanel.dataset.fillState=confirmation.zeroFill?'ZERO':'PARTIAL';partialGo.textContent='出発';",'zero-fill prose')
          old="""    if(confirmation.shortages.length){const shortage=document.createElement('p');shortage.dataset.launchShortage='true';shortage.textContent=`${confirmation.shortages.map(item=>`${item.element} が${item.count}個`).join('、')}足りません`;Object.assign(shortage.style,{margin:'2px 0 0',fontSize:'13px',fontWeight:'800',lineHeight:'1.45',color:'#ffd0a3',overflowWrap:'anywhere'});partialRows.append(shortage);}"""
          new="""    if(confirmation.shortages.length){const shortages=document.createElement('div');shortages.dataset.launchShortage='true';Object.assign(shortages.style,{display:'flex',gap:'7px',flexWrap:'wrap',margin:'2px 0 0'});for(const item of confirmation.shortages){const chip=document.createElement('span'),element=document.createElement('strong'),amount=document.createElement('b'),track=document.createElement('i'),fill=document.createElement('em');chip.dataset.element=item.element;Object.assign(chip.style,{display:'grid',gridTemplateColumns:'auto auto',alignItems:'center',gap:'6px',padding:'5px 7px',border:'1px solid #b97856',borderRadius:'9px',background:'#1d1817',fontVariantNumeric:'tabular-nums'});element.textContent=item.element;amount.textContent=`${item.have} / ${item.need}`;Object.assign(amount.style,{fontSize:'12px',fontWeight:'800'});Object.assign(track.style,{gridColumn:'1 / -1',display:'block',height:'3px',borderRadius:'3px',background:'#4b3026',overflow:'hidden'});Object.assign(fill.style,{display:'block',height:'100%',transformOrigin:'left',transform:`scaleX(${item.need?Math.min(1,item.have/item.need):0})`,background:'#d9956f'});track.append(fill);chip.append(element,amount,track);shortages.append(chip);}partialRows.append(shortages);}"""
          text=exact(text,old,new,'shortage prose block')
          old="""  function resetLaunchGesture({keepDestinations=false}={}){
    const pointer=launchPointer;launchPointer=null;launchStart=null;launchDragged=0;
    try{if(pointer!==null)launchHandle.releasePointerCapture(pointer);}catch{}
    if(!keepDestinations)showLaunchDestinations(false);resetLaunchPosition();
  }"""
          new="""  function resetLaunchGesture({keepDestinations=false}={}){
    const pointer=launchPointer;launchPointer=null;launchStart=null;launchDragged=0;
    try{if(pointer!==null)launchHandle.releasePointerCapture(pointer);}catch{}
    if(!keepDestinations){showLaunchDestinations(false);resetLaunchPosition();}else launchHandle.style.cursor='grab';
  }"""
          text=exact(text,old,new,'launch reset')
          old="""  function launchDestination(id){
    resetLaunchGesture();if(!canOpen()||resources.blocked)return false;const select=q('expedition-anchor'),option=[...select.options].find(item=>item.value===id);if(!option)return false;select.value=id;select.dispatchEvent(new window.Event('change',{bubbles:true}));q('launch-veil').click();return true;
  }"""
          new="""  function launchDestination(id){
    const target=launchItems.find(item=>item.id===id);if(!target||!canOpen()||resources.blocked)return false;resetLaunchGesture({keepDestinations:true});setLaunchActive(target);showLaunchDestinations(true);shellCanvas.style.transition=reduced?'none':'transform .12s ease';shellCanvas.style.transform=`translate(${target.x}px,${target.y}px)`;const select=q('expedition-anchor'),option=[...select.options].find(item=>item.value===id);if(!option)return false;select.value=id;select.dispatchEvent(new window.Event('change',{bubbles:true}));q('launch-veil').click();return true;
  }"""
          text=exact(text,old,new,'launch destination selection retention')
          if '搭載できません' in text or '足りません' in text: raise SystemExit('explanatory launch shortage survived')
          write(path,text)

          # FIELD signifiers: behavior instead of unexplained triangle/double-ring shapes.
          path='src/veil/renderer.js'; text=read(path)
          old="""      ctx.strokeStyle='#bde6db';ctx.globalAlpha=.45;ctx.lineWidth=1;ctx.beginPath();ctx.arc(OXYGEN_REWARD.x,OXYGEN_REWARD.y,OXYGEN_REWARD.radius+15,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;"""
          new="""      // Reward convergence is shown as oxygen-colored motes physically streaming inward, not a marker glyph.
      const rewardGlow=ctx.createRadialGradient(OXYGEN_REWARD.x,OXYGEN_REWARD.y,0,OXYGEN_REWARD.x,OXYGEN_REWARD.y,OXYGEN_REWARD.radius*1.2);rewardGlow.addColorStop(0,'rgba(255,148,77,.16)');rewardGlow.addColorStop(1,'rgba(255,148,77,0)');ctx.fillStyle=rewardGlow;ctx.fillRect(OXYGEN_REWARD.x-OXYGEN_REWARD.radius*1.2,OXYGEN_REWARD.y-OXYGEN_REWARD.radius*1.2,OXYGEN_REWARD.radius*2.4,OXYGEN_REWARD.radius*2.4);for(let i=0;i<9;i++){const phase=(run.time*.18+i/9)%1,r=OXYGEN_REWARD.radius*(1.05-phase*.82),a=i*2.399+run.time*.12;ctx.globalAlpha=.16+phase*.48;ctx.fillStyle='#ff944d';ctx.beginPath();ctx.arc(OXYGEN_REWARD.x+Math.cos(a)*r,OXYGEN_REWARD.y+Math.sin(a)*r,1.5+phase*2.1,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;"""
          text=exact(text,old,new,'reward ring')
          old="""      for(const signal of run.map.signals)if(!signal.ready){
        const pulse=(run.time*.7)%1,radius=18+pulse*34;ctx.strokeStyle='#f1d28b';ctx.globalAlpha=(1-pulse)*.42;ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(signal.x,signal.y,radius,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=.7;ctx.beginPath();for(let i=0;i<3;i++){const a=run.time*.4+i*Math.PI*2/3;i?ctx.lineTo(signal.x+Math.cos(a)*9,signal.y+Math.sin(a)*9):ctx.moveTo(signal.x+Math.cos(a)*9,signal.y+Math.sin(a)*9);}ctx.closePath();ctx.stroke();ctx.globalAlpha=1;
      }"""
          new="""      for(const signal of run.map.signals)if(!signal.ready){
        // Signals read as emission: a live core plus paired wavefronts, never an abstract triangle marker.
        const pulse=(run.time*.7)%1,core=ctx.createRadialGradient(signal.x,signal.y,0,signal.x,signal.y,14);core.addColorStop(0,'rgba(241,210,139,.8)');core.addColorStop(.22,'rgba(241,210,139,.3)');core.addColorStop(1,'rgba(241,210,139,0)');ctx.fillStyle=core;ctx.globalAlpha=.8;ctx.fillRect(signal.x-14,signal.y-14,28,28);ctx.fillStyle='#f1d28b';ctx.beginPath();ctx.arc(signal.x,signal.y,2.6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f1d28b';ctx.lineWidth=1.3;for(let wave=0;wave<3;wave++){const phase=(pulse+wave/3)%1,radius=9+phase*42;ctx.globalAlpha=(1-phase)*.36;ctx.beginPath();ctx.arc(signal.x,signal.y,radius,-.72,.72);ctx.stroke();ctx.beginPath();ctx.arc(signal.x,signal.y,radius,Math.PI-.72,Math.PI+.72);ctx.stroke();}ctx.globalAlpha=1;
      }"""
          text=exact(text,old,new,'signal triangle')
          write(path,text)

          # Tests: lock de-explanatory contracts and destination continuity.
          path='tests/pending-craft.test.mjs'; text=read(path)
          text=exact(text,"assert.match(pendingSource,/`未作成の設計図 \\${ids\\.length}件`/,'accessible pending count remains on the navigation button');","assert.match(pendingSource,/`設計図 \\${ids\\.length}件`/,'accessible pending count remains concise on the navigation button');\nassert.doesNotMatch(pendingSource,/未作成の設計図|探索で見つけた、まだ作っていない分子/,'pending blueprints must not explain their state with visible prose');",'pending test copy')
          write(path,text)

          path='tests/loadout-shortage-confirmation.test.mjs'; text=read(path)
          text=exact(text,"assert.equal(shortage(state,'H').count,plan.missing.H.need-plan.missing.H.have,'shortage count must come from canonical plan.missing');","assert.deepEqual(shortage(state,'H'),{element:'H',have:plan.missing.H.have,need:plan.missing.H.need},'shortage state must expose canonical have / need');",'shortage test H')
          text=exact(text,"for(const element of ['H','C','O'])assert.equal(shortage(state,element).count,plan.missing[element].need-plan.missing[element].have);","for(const element of ['H','C','O'])assert.deepEqual(shortage(state,element),{element,have:plan.missing[element].have,need:plan.missing[element].need});",'shortage test multi')
          text=exact(text,"  assert.match(source,/搭載できません/);assert.match(source,/dataset\\.launchShortage/);assert.match(source,/item\\.actual} \\/ \\$\\{item\\.requested/,'quantity is presented as actual / requested rather than percentage-only');","  assert.doesNotMatch(source,/搭載できません|足りません/,'visible shortage state must not use explanatory prose');assert.match(source,/dataset\\.launchShortage/);assert.match(source,/item\\.actual} \\/ \\$\\{item\\.requested/,'tank quantity is presented as actual / requested');assert.match(source,/item\\.have} \\/ \\$\\{item\\.need/,'element shortage is presented directly as have / need');",'shortage source contract')
          text=text.replace("console.log('LOADOUT shortage confirmation passed: FULL silence, canonical PARTIAL quantities/shortages, zero-fill, multi-element shortage, preview/commit parity, responsive layout and legacy terminology guard.');","console.log('LOADOUT shortage confirmation passed: direct have/need state, no explanatory shortage prose, zero-fill, preview/commit parity and responsive layout.');")
          write(path,text)

          path='tests/loadout-workstation.test.mjs'; text=read(path)
          text=text.replace("import assert from 'node:assert/strict';","import assert from 'node:assert/strict';\nimport {readFile} from 'node:fs/promises';",1)
          text += """

test('LOADOUT stock preview exposes element state without an explanatory shortage banner',async()=>{
  const source=await readFile(new URL('../src/veil/loadout-workstation.js',import.meta.url),'utf8');
  assert.doesNotMatch(source,/材料不足|loadout-shortage-status/);
  assert.match(source,/chip\.dataset\.stockState=chip\.dataset\.sufficient==='false'\?'short':'ready'/);
  assert.match(source,/preview\.setAttribute\('aria-label','必要元素'\)/);
  assert.match(source,/\[data-sufficient='false'\]/,'insufficient element chips receive direct visual state');
});
"""
          write(path,text)

          path='tests/launch-selector.test.mjs'; text=read(path)
          insertion="""assert.match(source,/resetLaunchGesture\(\{keepDestinations:true\}\)/,'Destination launch must preserve selector context through shortage confirmation');
assert.match(source,/shellCanvas\.style\.transform=`translate\(\$\{target\.x\}px,\$\{target\.y\}px\)`/,'Explorer must stay parked on the selected destination while launch state is evaluated');
"""
          text=exact(text,"assert.match(source,/shellCanvas\\.style\\.transform=`translate/,'The visible explorer must follow the drag');\n","assert.match(source,/shellCanvas\\.style\\.transform=`translate/,'The visible explorer must follow the drag');\n"+insertion,'launch selector test')
          write(path,text)

          path='tests/ui-symbols.test.mjs'; text=read(path)
          text=exact(text,"const [supply,craftPanel]=await Promise.all([\n  readFile(new URL('src/veil/supply.js',root),'utf8'),\n  readFile(new URL('src/craft-panel.js',root),'utf8'),\n]);","const [supply,craftPanel,renderer]=await Promise.all([\n  readFile(new URL('src/veil/supply.js',root),'utf8'),\n  readFile(new URL('src/craft-panel.js',root),'utf8'),\n  readFile(new URL('src/veil/renderer.js',root),'utf8'),\n]);",'ui symbols imports')
          text=exact(text,"assert.match(craftPanel,/💡/,'Idea state must be visible without tutorial copy');\n","assert.match(craftPanel,/💡/,'Idea state must be visible without tutorial copy');\nassert.match(renderer,/Signals read as emission/,'FIELD signals use emitted wavefront behavior');\nassert.match(renderer,/Reward convergence is shown as oxygen-colored motes/,'FIELD reward uses converging resource behavior');\nassert.doesNotMatch(renderer,/run\\.time\\*\\.4\\+i\\*Math\\.PI\\*2\\/3/,'FIELD signals must not render an unexplained triangle glyph');\nassert.doesNotMatch(renderer,/OXYGEN_REWARD\\.radius\\+15/,'FIELD reward must not render as an unexplained ring marker');\n",'ui symbol field tests')
          text=text.replace("console.log('UI symbol contracts passed: flame combustion cue, burst-count ticks, continuous other tanks, and idea bulbs.');","console.log('UI symbol contracts passed: semantic propulsion/idea cues plus behavioral FIELD signal and reward signifiers.');")
          write(path,text)

          path='.github/workflows/repository-validation.yml'; text=read(path)
          anchor="""      - name: Generated PWA freshness
        run: node scripts/build-precache.mjs --check
"""
          addition="""      - name: UI de-explanation regressions
        run: |
          node tests/loadout-shortage-confirmation.test.mjs
          node tests/loadout-workstation.test.mjs
          node tests/launch-selector.test.mjs
          node tests/launch-pointer-lifecycle.test.mjs
          node tests/ui-symbols.test.mjs
      - name: Generated PWA freshness
        run: node scripts/build-precache.mjs --check
"""
          text=exact(text,anchor,addition,'repository validation UI tests')
          write(path,text)
          PY
      - name: Regenerate canonical PWA artifacts
        run: node scripts/build-precache.mjs
      - name: Focused validation
        run: |
          node tests/pending-craft.test.mjs
          node tests/loadout-shortage-confirmation.test.mjs
          node tests/loadout-workstation.test.mjs
          node tests/launch-selector.test.mjs
          node tests/launch-pointer-lifecycle.test.mjs
          node tests/ui-symbols.test.mjs
          node tests/loadout-preview.test.mjs
          node tests/loadout-card-order.test.mjs
          node tests/generic-propulsion.test.mjs
          node tests/propulsion-hud-source.test.mjs
          node tests/source-contracts.test.mjs
          node tests/repository-hygiene.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit focused changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pending-craft.js src/veil/loadout-workstation.js src/veil/supply.js src/veil/renderer.js tests/pending-craft.test.mjs tests/loadout-shortage-confirmation.test.mjs tests/loadout-workstation.test.mjs tests/launch-selector.test.mjs tests/ui-symbols.test.mjs .github/workflows/repository-validation.yml precache-manifest.js sw.js
          git commit -m "Remove explanatory UI from FIELD and LOADOUT"
          git push origin HEAD:ui-deexplanation-pass
