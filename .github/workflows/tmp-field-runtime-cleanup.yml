name: Temporary FIELD runtime cleanup validation

on:
  push:
    branches: [field/runtime-cleanup-legacy-rare-survey]

permissions:
  contents: write

jobs:
  validate-and-refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refresh generated FIELD map
        run: node scripts/export-field-map.mjs
      - name: Refresh PWA artifacts
        run: node scripts/build-precache.mjs
      - name: FIELD runtime cleanup regressions
        run: |
          node tests/field-runtime-allowlist.test.mjs
          node tests/field-hazard-taxonomy.test.mjs
          node tests/field-map-export.test.mjs
          node tests/nitrogen-field-map.test.mjs
          node tests/nitrogen-field-integration.test.mjs
          node tests/nitrogen-world-awakening.test.mjs
          node tests/resources-persistence.test.mjs
          node tests/expedition-insights.test.mjs
          node tests/shock-unit.test.mjs
          node tests/nitrogen-chapter-browser.test.mjs
      - name: Verify generated artifacts
        run: |
          node scripts/export-field-map.mjs --check
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet -- docs/maps/current-field.svg sw.js precache-manifest.js; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maps/current-field.svg sw.js precache-manifest.js
          git commit -m "Refresh FIELD map and PWA artifacts"
          git push
