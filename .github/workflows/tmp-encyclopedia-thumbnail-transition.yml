name: Temporary Encyclopedia thumbnail transition patch

on:
  push:
    branches:
      - feat/encyclopedia-thumbnail-transitions

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/encyclopedia-thumbnail-transitions
          fetch-depth: 0
      - name: Apply thumbnail transition patch
        run: python3 scripts/tmp-encyclopedia-thumbnail-transition-patch.py
      - name: Focused validation
        run: |
          node tests/encyclopedia-graph-ui.test.mjs
          node tests/collection.test.mjs
          node tests/collection-expansion.test.mjs
          node tests/browser-startup.test.mjs
          node tests/source-contracts.test.mjs
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          node tests/repository-hygiene.test.mjs
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/collection-ui.js src/encyclopedia-graph-view.js styles.css tests/encyclopedia-graph-ui.test.mjs precache-manifest.js sw.js
          git commit -m 'Unify Encyclopedia Graph Detail thumbnail navigation'
          git push origin HEAD:feat/encyclopedia-thumbnail-transitions
