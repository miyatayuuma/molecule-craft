name: LOADOUT back finalizer

on:
  push:
    branches:
      - fix/loadout-back-clears-destination

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/loadout-back-clears-destination
          fetch-depth: 0
      - name: Apply focused fix
        run: |
          python - <<'PY'
          from pathlib import Path

          supply = Path('src/veil/supply.js')
          text = supply.read_text()
          old = "partialBack.addEventListener('click',()=>{partialPanel.hidden=true;});"
          new = "partialBack.addEventListener('click',()=>{partialPanel.hidden=true;resetLaunchGesture();});"
          if old not in text:
              raise SystemExit('partialBack handler not found')
          supply.write_text(text.replace(old, new, 1))

          test = Path('tests/launch-selector.test.mjs')
          text = test.read_text()
          anchor = "assert.match(source,/shellCanvas\\.style\\.transform=`translate\\(\\$\\{target\\.x\\}px,\\$\\{target\\.y\\}px\\)`/,'Explorer must stay parked on the selected destination while launch state is evaluated');"
          addition = anchor + "\nassert.match(source,/partialBack\\.addEventListener\\('click',\\(\\)=>\\{partialPanel\\.hidden=true;resetLaunchGesture\\(\\);\\}\\)/,'Back from shortage confirmation must clear destination highlight and recenter the explorer');"
          if anchor not in text:
              raise SystemExit('launch selector test anchor not found')
          test.write_text(text.replace(anchor, addition, 1))
          PY
      - name: Regenerate PWA artifacts
        run: node scripts/build-precache.mjs
      - name: Focused validation
        run: |
          node tests/launch-selector.test.mjs
          node tests/launch-pointer-lifecycle.test.mjs
          node tests/loadout-shortage-confirmation.test.mjs
          node tests/repository-hygiene.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veil/supply.js tests/launch-selector.test.mjs precache-manifest.js sw.js
          git commit -m "Clear LOADOUT destination when backing out"
          git push origin HEAD:fix/loadout-back-clears-destination
