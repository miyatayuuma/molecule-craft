name: Task 205 branch finalizer

on:
  push:
    branches:
      - task/nitrogen-field-geometry

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[task205-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: task/nitrogen-field-geometry
          fetch-depth: 0
      - name: Connect Nitrogen cargo to existing FIELD HUD and capture preview
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const path='src/veil/ui.js';
          let source=await readFile(path,'utf8');
          const importNeedle="import { renderCraftTargetAtoms } from '../craft-panel.js?v=3';\n";
          if(!source.includes("import { MANAGED_ELEMENTS } from './resources-persistence.js';")){
            if(!source.includes(importNeedle))throw new Error('ui import anchor changed');
            source=source.replace(importNeedle,`${importNeedle}import { MANAGED_ELEMENTS } from './resources-persistence.js';\n`);
          }
          const lossOld="const LOST_CARGO_ELEMENTS=['H','C','O'];";
          const lossNew='const LOST_CARGO_ELEMENTS=MANAGED_ELEMENTS;';
          if(source.includes(lossOld))source=source.replace(lossOld,lossNew);
          else if(!source.includes(lossNew))throw new Error('capture loss element anchor changed');
          const hudOld="q('veil-minerals').textContent=[['C',run.collectedElements.C],['O',run.collectedElements.O]].filter(([el])=>resources.canUseElement(el)||run.foundElements.includes(el)).map(([el,n])=>`${el} ${n}`).join(' · ');";
          const hudNew="q('veil-minerals').textContent=['C','N','O'].map(el=>[el,run.collectedElements[el]??0]).filter(([el])=>resources.canUseElement(el)||run.foundElements.includes(el)).map(([el,n])=>`${el} ${n}`).join(' · ');";
          if(source.includes(hudOld))source=source.replace(hudOld,hudNew);
          else if(!source.includes(hudNew))throw new Error('FIELD HUD element anchor changed');
          await writeFile(path,source,'utf8');
          NODE
      - name: Regenerate runtime-derived assets
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: Focused Task 3 checks
        run: |
          node tests/field-map-export.test.mjs
          node tests/nitrogen-field-map.test.mjs
          node tests/nitrogen-field-integration.test.mjs
          node scripts/build-precache.mjs --check
      - name: Commit generated and UI changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/veil/ui.js docs/maps/current-field.svg precache-manifest.js sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[task205-auto] finalize Nitrogen FIELD UI and generated assets"
          git push origin HEAD:task/nitrogen-field-geometry
