name: Exploration craft emblem

on:
  push:
    branches: [exploration-craft-emblem]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exploration-craft-emblem
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply craft emblem to progression prompts
        run: |
          python - <<'PY'
          from pathlib import Path

          emblem = '<svg class="craft-emblem" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M9 9L23 13L14 24Z"/><circle class="craft-emblem-a" cx="9" cy="9" r="4.4"/><circle class="craft-emblem-b" cx="23" cy="13" r="4.7"/><circle class="craft-emblem-c" cx="14" cy="24" r="3.9"/></svg>'

          index = Path('index.html')
          text = index.read_text()
          old = '<button id="cho-goal-action" class="cho-goal-action" type="button" hidden>作り方を見る</button>'
          new = f'<button id="cho-goal-action" class="cho-goal-action craft-emblem-action" type="button" hidden>{emblem}<span id="cho-goal-label"></span></button>'
          if old not in text:
              raise SystemExit('cho-goal-action markup not found')
          text = text.replace(old, new, 1)
          old = '<button id="veil-to-craft" type="button">Hが集まった · H₂を作りに戻る ↗</button>'
          new = f'<button id="veil-to-craft" class="craft-emblem-action" type="button">{emblem}<span id="veil-to-craft-label">H₂</span></button>'
          if old not in text:
              raise SystemExit('veil-to-craft markup not found')
          text = text.replace(old, new, 1)
          index.write_text(text)

          ui = Path('src/veil/ui.js')
          text = ui.read_text()
          old = "q('cho-goal-action').hidden=!goal.id;q('cho-goal-action').textContent=goal.id?`⚒ ${formula(goal.id)}`:'';"
          new = "const goalAction=q('cho-goal-action');goalAction.hidden=!goal.id;q('cho-goal-label').textContent=goal.id?formula(goal.id):'';goalAction.setAttribute('aria-label',goal.id?`${formula(goal.id)}をクラフト`:'');"
          if old not in text:
              raise SystemExit('goal action update not found')
          text = text.replace(old, new, 1)
          old = "q('veil-craft-prompt').hidden=!ready;if(ready){const record=resources.record(goal.id);q('veil-to-craft').textContent=`↩ ⚒ ${record?.formula??'◉'}`;}"
          new = "q('veil-craft-prompt').hidden=!ready;if(ready){const record=resources.record(goal.id),label=record?.formula??'◉';q('veil-to-craft-label').textContent=label;q('veil-to-craft').setAttribute('aria-label',`${label}をクラフトするため戻る`);}"
          if old not in text:
              raise SystemExit('veil craft prompt update not found')
          text = text.replace(old, new, 1)
          ui.write_text(text)

          css = Path('veil.css')
          text = css.read_text()
          block = '''\n/* Shared molecule emblem for craft entry points. */\n.craft-emblem-action{display:inline-flex;align-items:center;justify-content:center;gap:8px}\n.craft-emblem-action .craft-emblem{width:25px;height:25px;flex:none;overflow:visible;filter:drop-shadow(0 0 5px #75dfce38)}\n.craft-emblem-action .craft-emblem path{fill:none;stroke:#75dfce;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n.craft-emblem-action .craft-emblem-a{fill:#e9f4f9}.craft-emblem-action .craft-emblem-b{fill:#67d9c7}.craft-emblem-action .craft-emblem-c{fill:#ed7f82}\n#cho-goal-action.craft-emblem-action{min-height:42px;padding:6px 12px}\n.veil-prompt .craft-emblem-action{gap:9px;padding:10px 18px;font-size:13px}\n'''
          if '/* Shared molecule emblem for craft entry points. */' not in text:
              text += block
          css.write_text(text)

          test = Path('tests/craft-emblem.test.mjs')
          current = test.read_text() if test.exists() else ''
          test.write_text('''import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport path from 'node:path';\n\nfunction runtimeText(dir='src'){\n  let out='';\n  for(const entry of fs.readdirSync(dir,{withFileTypes:true})){\n    const file=path.join(dir,entry.name);\n    if(entry.isDirectory())out+=runtimeText(file);\n    else if(/\\.js$/.test(entry.name))out+=fs.readFileSync(file,'utf8');\n  }\n  return out;\n}\n\ntest('all craft entry points use the molecule emblem instead of hammer glyphs',()=>{\n  const index=fs.readFileSync('index.html','utf8');\n  const source=runtimeText();\n  assert.equal((index+source).includes('⚒'),false);\n  assert.match(index,/id="tank-craft-molecule"[^>]*craft-emblem-action/);\n  assert.match(index,/id="cho-goal-action"[^>]*craft-emblem-action/);\n  assert.match(index,/id="veil-to-craft"[^>]*craft-emblem-action/);\n  assert.match(index,/id="cho-goal-label"/);\n  assert.match(index,/id="veil-to-craft-label"/);\n});\n''')
          PY
      - name: Regenerate offline release
        run: node scripts/build-precache.mjs
      - name: Craft emblem regression
        run: node --test tests/craft-emblem.test.mjs
      - name: Source contracts
        run: node tests/source-contracts.test.mjs
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: Commit result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/exploration-craft-emblem.yml
          git add index.html src/veil/ui.js veil.css tests/craft-emblem.test.mjs precache-manifest.js
          git commit -m "Use molecule emblem for progression craft prompts"
          git push
