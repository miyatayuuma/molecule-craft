name: Temporary resonance interaction validation
on:
  push:
    branches:
      - fix/nitro-ozone-craft-resonance-reachability
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resonance interaction and regressions
        run: |
          node --check src/app.js
          node tests/resonance-formal-charge.test.mjs
          node tests/bond-state.test.mjs
          node tests/resonance-craft-interaction-browser.test.mjs
          node tests/resonance-visual-browser.test.mjs
          node tests/special-bonds-check.mjs
          node tests/aromatic-rendering-check.mjs vendor/three/three.module.min.js
          node --test tests/craft-target-match.test.mjs
          node --test tests/craft-target-hint.test.mjs
          node tests/craft-target-hint-browser.test.mjs
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Upload resonance CRAFT frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonance-craft-interaction
          path: test-results/resonance-craft-interaction
          if-no-files-found: ignore
          retention-days: 7
