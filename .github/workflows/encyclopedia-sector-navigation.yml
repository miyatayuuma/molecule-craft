name: Encyclopedia sector navigation patch

on:
  push:
    branches:
      - feat/encyclopedia-sector-navigation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix Encyclopedia sector navigation runtime import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/encyclopedia-sector-navigation
          fetch-depth: 0
      - name: Fix runtime import and validate known-sector path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          view=Path('src/encyclopedia-graph-view.js')
          s=view.read_text()
          old="import {GRAPH_NODE_STATE,adjacentGraphSectorAnchor,buildVisibleGraphProjection,canonicalGraphPositions,graphNodePresentation,layoutFocusNeighborhood,searchKnownGraphNodes} from './encyclopedia-graph.js?v=2';"
          new="import {GRAPH_NODE_STATE,adjacentGraphSectorAnchor,buildVisibleGraphProjection,canonicalGraphPositions,graphNodePresentation,graphNodeState,layoutFocusNeighborhood,searchKnownGraphNodes} from './encyclopedia-graph.js?v=2';"
          if old not in s: raise SystemExit('runtime import anchor missing')
          view.write_text(s.replace(old,new,1))
          PY
          node tests/encyclopedia-graph-ui.test.mjs
          node tests/browser-startup.test.mjs
          node tests/source-contracts.test.mjs
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          node tests/repository-hygiene.test.mjs
          git diff --check
      - name: Commit import fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/encyclopedia-graph-view.js precache-manifest.js sw.js
          git commit -m 'Fix sector navigation runtime import'
          git push origin HEAD:feat/encyclopedia-sector-navigation
