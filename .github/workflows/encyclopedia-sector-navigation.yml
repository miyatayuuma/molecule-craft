name: Encyclopedia sector navigation patch

on:
  push:
    branches:
      - feat/encyclopedia-sector-navigation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Move sector nav controls off graph nodes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/encyclopedia-sector-navigation
          fetch-depth: 0
      - name: Move navigation controls and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          view=Path('src/encyclopedia-graph-view.js')
          s=view.read_text()
          old=".graph-sector-jump{position:absolute;z-index:7;top:50%;width:34px;height:52px;min-height:0;padding:0;border:0;background:#0a172499;color:#9fc7d2;font-size:28px;line-height:1;border-radius:17px;transform:translateY(-50%);opacity:.62;backdrop-filter:blur(3px)}.graph-sector-jump:hover,.graph-sector-jump:focus-visible{opacity:1;background:#173246dd}.graph-sector-jump.previous{left:6px}.graph-sector-jump.next{right:6px}"
          new=".graph-sector-jump{position:absolute;z-index:7;bottom:8px;width:34px;height:34px;min-height:0;padding:0;border:0;background:#0a172499;color:#9fc7d2;font-size:25px;line-height:1;border-radius:17px;opacity:.62;backdrop-filter:blur(3px)}.graph-sector-jump:hover,.graph-sector-jump:focus-visible{opacity:1;background:#173246dd}.graph-sector-jump.previous{left:8px}.graph-sector-jump.next{right:8px}"
          if old not in s: raise SystemExit('sector nav css anchor missing')
          view.write_text(s.replace(old,new,1))
          PY
          node tests/encyclopedia-graph-ui.test.mjs
          node tests/browser-startup.test.mjs
          node tests/source-contracts.test.mjs
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          node tests/repository-hygiene.test.mjs
          git diff --check
      - name: Commit navigation placement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/encyclopedia-graph-view.js precache-manifest.js sw.js
          git commit -m 'Keep sector navigation clear of graph nodes'
          git push origin HEAD:feat/encyclopedia-sector-navigation
