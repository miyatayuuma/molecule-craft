name: Resonance readability follow-up

on:
  push:
    branches:
      - work/resonance-readability-note-cleanup

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply readability and note cleanup patch
        run: |
          perl -0pi -e "s/  const noteKeys=/    const noteKeys=/; s/  if\(noteTexts\.length\)/    if(noteTexts.length)/" scripts/patch-resonance-readability-followup.mjs
          node scripts/patch-resonance-readability-followup.mjs
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const path='tests/encyclopedia-chemistry-visuals.test.mjs';
          let source=await readFile(path,'utf8');
          const line=source.split('\n').find(line=>line.includes('Chemistry detail visuals use the aromatic accent authority'));
          if(!line)throw new Error('Shared accent authority assertion not found');
          source=source.replace(line,"assert.match(visualSource,/AROMATIC_STYLE\\.cssColor/,'Chemistry detail visuals use the aromatic accent authority');");
          await writeFile(path,source);
          NODE
      - name: Regenerate molecule thumbnails
        run: node scripts/build-collection-assets.mjs
      - name: Refresh PWA precache
        run: node scripts/build-precache.mjs
      - name: Focused validation
        run: |
          node tests/encyclopedia-chemistry-visuals.test.mjs
          node tests/special-bonds-check.mjs
          node tests/aromatic-rendering-check.mjs vendor/three/three.module.min.js
          node tests/encyclopedia-chemistry-visual-browser.test.mjs
          node tests/resonance-formal-charge.test.mjs
          node tests/craft-target-satisfaction.test.mjs
          node --test tests/craft-target-hint.test.mjs
          node --test tests/craft-target-match.test.mjs
          node tests/resonance-craft-interaction-browser.test.mjs
          node tests/resonance-visual-browser.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
      - name: Upload player-facing validation frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonance-readability-followup
          path: |
            test-results/encyclopedia-chemistry-visuals
            test-results/resonance-craft-interaction
            test-results/resonance-visual
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary validation plumbing
        if: success()
        run: |
          rm -rf test-results
          rm -f scripts/patch-resonance-readability-followup.mjs
          rm -f .github/workflows/resonance-readability-followup.yml
      - name: Diff hygiene
        if: success()
        run: git diff --check
      - name: Commit implementation and generated artifacts
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Polish resonance readability and remove repeated notes'
          git push origin HEAD:work/resonance-readability-note-cleanup
