name: Temporary direct explorer tests
on:
  push:
    branches:
      - direct-explorer-launch
permissions:
  contents: read
jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip explorer tests]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-repository-hygiene.mjs
      - run: node tests/launch-selector.test.mjs
      - run: node tests/ui-symbols.test.mjs
      - run: node tests/supply-production.test.mjs
      - run: node tests/supply-tanks.test.mjs
      - run: node tests/expedition-core.test.mjs
      - run: node tests/veil.test.mjs
      - run: node tests/source-contracts.test.mjs
      - run: node tests/pwa.test.mjs
      - name: Install browser-test DOM
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Run production Veil UI integration
        run: node tests/veil-ui-check.mjs "$(node -p \"require.resolve('jsdom/lib/api.js')\")"
