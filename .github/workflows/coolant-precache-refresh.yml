name: Coolant precache refresh

on:
  push:
    branches:
      - field/coolant-learning-zone

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: field/coolant-learning-zone
          fetch-depth: 0
      - name: Refresh generated PWA artifacts
        run: node scripts/build-precache.mjs
      - name: Commit artifacts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git rm .github/workflows/coolant-precache-refresh.yml
          git commit -m "Refresh PWA artifacts for coolant learning"
          git push origin HEAD:field/coolant-learning-zone
