name: Issue 104 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Issue 104 regression checks
        run: |
          node --check src/craft-connections.js
          node tests/loadout-launch-regression.test.mjs
          node tests/craft-connections.test.mjs
          node tests/supply-tanks.test.mjs
          node tests/launch-dialog-lock.test.mjs
          node scripts/check-repository-hygiene.mjs
