name: Frontier critical follow-up

on:
  push:
    branches:
      - work/field-insight-frontier-integration

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add temporary critical frontier fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/field-insight-frontier-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Suppress unspawned frontier when critical insight becomes ready
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('src/veil/resources.js')
          source=path.read_text()
          old="""  function frontierSignal(region){\n    if(!frontierRun)return null;\n"""
          new="""  function suppressFrontierInsightForCritical(){\n    if(!frontierRun||frontierRun.reason||frontierRun.opportunityCreated)return false;\n    frontierRun.reason='critical-pending';return true;\n  }\n  function frontierSignal(region){\n    if(!frontierRun)return null;\n"""
          if old not in source: raise SystemExit('frontierSignal insertion point not found')
          source=source.replace(old,new,1)
          old="setFrontierGraph(graph){frontierGraph=graph??null;return !!frontierGraph;},frontierInsightDiagnostics:"
          new="setFrontierGraph(graph){frontierGraph=graph??null;return !!frontierGraph;},suppressFrontierInsightForCritical,frontierInsightDiagnostics:"
          if old not in source: raise SystemExit('frontier API insertion point not found')
          path.write_text(source.replace(old,new,1))

          path=Path('src/veil/ui.js')
          source=path.read_text()
          old="function offerProgressionInsights(){if(!run)return;for(const id of resources.progressionInsightCandidates({cargo:run.collectedElements,foundElements:run.foundElements}))offerInsight(id);}"
          new="function offerProgressionInsights(){if(!run)return;const ids=resources.progressionInsightCandidates({cargo:run.collectedElements,foundElements:run.foundElements});if(ids.length)resources.suppressFrontierInsightForCritical();for(const id of ids)offerInsight(id);}"
          if old not in source: raise SystemExit('offerProgressionInsights replacement point not found')
          path.write_text(source.replace(old,new,1))

          path=Path('tests/field-frontier-insight.test.mjs')
          source=path.read_text()
          marker="// Empty frontier is a normal FIELD run: no DB-wide or legacy regional recipe\n"
          block="""// A critical insight that becomes ready after launch still owns the run before\n// the Graph opportunity is emitted. This closes the cargo/thermal readiness race.\n{\n  const value=make(),{target,roll}=expandableChoice(value,'oxygen');value.prepareExpedition({region:'oxygen',rng:()=>roll});assert.equal(value.frontierInsightDiagnostics().selectedCandidateId,target.id);\n  value.state.progress.driveThermalInterruptions=2;const critical=value.progressionInsightCandidates({cargo:{H:8},foundElements:[]});assert.ok(critical.includes('water'),'water becomes critical-ready during the expedition');\n  assert.equal(value.suppressFrontierInsightForCritical(),true);assert.equal(value.frontierInsightDiagnostics().reason,'critical-pending');const signal=value.signal('oxygen',0,0);assert.ok(signal.bonus&&!signal.recipe,'unspawned Graph opportunity stays suppressed once critical progression becomes ready');\n}\n\n"""
          if marker not in source: raise SystemExit('test insertion point not found')
          path.write_text(source.replace(marker,block+marker,1))
          PY
          node scripts/build-precache.mjs
      - name: Validate frontier and repository regressions
        run: |
          node tests/molecule-frontier.test.mjs
          node tests/field-frontier-insight.test.mjs
          node tests/expedition-insights.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/repository-hygiene.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/veil/resources.js src/veil/ui.js tests/field-frontier-insight.test.mjs sw.js precache-manifest.js
          git commit -m 'Prioritize critical insight over pending frontier'
          git push origin HEAD:work/field-insight-frontier-integration
