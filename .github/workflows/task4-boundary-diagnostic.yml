name: Task4 candidate wait-attribution capture
on:
  push:
    branches: [diagnostic/task4-candidate-wait-proof]
permissions:
  contents: read
jobs:
  bounded-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen runtime and prepare immutable baseline
        run: |
          git diff --exit-code 0036e0f68f8fcce863d05fe2073950ad15461642 -- src styles.css index.html data vendor
      - name: Frozen candidate mobile — one profile batch, normal tracing only
        if: ${{ !cancelled() }}
        env:
          TASK4_BOUNDARY_DIAGNOSTIC: '1'
          POLYMER_PROFILE_ONLY: '1'
          POLYMER_SOURCE_SHA: 0036e0f68f8fcce863d05fe2073950ad15461642
          POLYMER_EVIDENCE_DIR: ${{ runner.temp }}/task4-boundary/candidate
        run: node tests/reaction-lab-polymer-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: task4-candidate-wait-attribution-capture
          path: ${{ runner.temp }}/task4-boundary
          retention-days: 30
