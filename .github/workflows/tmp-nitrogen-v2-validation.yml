name: Nitrogen v2 task validation
on:
  push:
    branches: [field/nitrogen-v2-core-awakening]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Nitrogen v2 and World Awakening
        run: |
          node tests/field-hazard-taxonomy.test.mjs
          node tests/nitrogen-world-awakening.test.mjs
          node tests/nitrogen-field-integration.test.mjs
          node tests/nitrogen-chapter-progression.test.mjs
          node tests/nitrogen-chapter-completion.test.mjs
          node tests/nitrogen-loadout-balance.test.mjs
          node tests/nitrogen-visual-identity.test.mjs
          node tests/shock-unit.test.mjs
          node tests/rare-survey.test.mjs
      - name: Expedition and loadout regressions
        run: |
          node tests/expedition-core.test.mjs
          node tests/oxygen-routes.test.mjs
          node tests/oxygen-field-integration.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/resources-persistence.test.mjs
          node tests/tank-upgrades.test.mjs
          node tests/loadout-workstation.test.mjs
          node tests/loadout-launch-regression.test.mjs
      - name: Generate FIELD map
        run: |
          node scripts/export-field-map.mjs
          node tests/field-map-export.test.mjs
          node tests/nitrogen-field-map.test.mjs
          node scripts/export-field-map.mjs --check
      - name: Refresh PWA
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- docs/maps/current-field.svg precache-manifest.js sw.js; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/maps/current-field.svg precache-manifest.js sw.js
          git commit -m "Refresh Nitrogen v2 generated artifacts"
          git push
