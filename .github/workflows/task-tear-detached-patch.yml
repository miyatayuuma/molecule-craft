name: Apply detached tear-off integration
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/craft-tearoff-detached-drag
      - name: Apply production patch
        run: python scripts/task-tear-detached-patch.py
      - name: Focused validation
        run: |
          node tests/craft-tearoff.test.mjs
          node --test tests/craft-detached-drag.test.mjs
          node tests/craft-workspace.test.mjs
          node tests/craft-history.test.mjs
          node tests/craft-input-recovery.test.mjs
          node tests/craft-controls-ui.test.mjs
          node tests/craft-target-satisfaction.test.mjs
          node --test tests/craft-target-match.test.mjs
          node tests/browser-startup.test.mjs
          node tests/source-contracts.test.mjs
      - name: Refresh PWA artifacts
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          rm scripts/task-tear-detached-patch.py
          rm .github/workflows/task-tear-detached-patch.yml
          git diff --check
      - name: Commit production changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Polish detached fragment tear-off drag"
          git push origin HEAD:fix/craft-tearoff-detached-drag
