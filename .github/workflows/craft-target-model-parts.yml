name: craft-target-model-parts
on:
  push:
    branches:
      - craft-target-model-parts
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: craft-target-model-parts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply target model patch
        run: python scripts/tmp-target-model-patch.py
      - name: Focused validation
        run: |
          node --check src/craft-panel.js
          node tests/craft-decomposition.test.mjs
          node tests/craft-workspace.test.mjs
          node tests/source-contracts.test.mjs
      - name: Offline and hygiene validation
        run: |
          node scripts/build-precache.mjs
          node tests/pwa.test.mjs
          node scripts/check-repository-hygiene.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/craft-target-model-parts.yml scripts/tmp-target-model-patch.py
          git add -A
          git commit -m "Show target parts as model chips"
          git push origin HEAD:craft-target-model-parts
