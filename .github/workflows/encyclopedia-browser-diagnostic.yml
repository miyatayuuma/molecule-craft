name: Encyclopedia browser diagnostic

on:
  push:
    branches:
      - fix/encyclopedia-graph-load

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create direct module probe
        run: |
          cat > browser-module-probe.html <<'EOF'
          <!doctype html><meta charset="utf-8"><body><p>probe</p><script type="module" src="./src/collection-ui.js?v=37"></script>
          EOF
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/server.log
          exit 1
      - name: Capture Chrome parse error
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo 'Chrome executable not found'; exit 1; }
          "$CHROME" --version
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 --enable-logging=stderr --v=1 --dump-dom http://127.0.0.1:4173/browser-module-probe.html >/tmp/probe.html 2>/tmp/probe.log || true
          grep -E 'CONSOLE|SyntaxError|collection-ui' /tmp/probe.log | tail -n 80 || true
          echo '--- source lines ---'
          nl -ba src/collection-ui.js | sed -n '1,220p'
          exit 1
