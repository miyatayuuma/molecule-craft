name: Encyclopedia browser diagnostic

on:
  push:
    branches:
      - fix/encyclopedia-graph-load

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check changed module syntax
        run: |
          for file in src/collection-ui.js src/encyclopedia-graph.js src/encyclopedia-graph-view.js src/molecule-graph.js src/craft-connections.js; do
            echo "--- $file ---"
            node --check "$file"
          done
      - name: Create module probe
        run: |
          cat > browser-module-probe.html <<'EOF'
          <!doctype html><meta charset="utf-8"><body><pre id="out"></pre><script type="module">
          const out=document.querySelector('#out');
          const mods=[
            './src/molecule-graph.js?v=2',
            './src/encyclopedia-graph.js?v=1',
            './src/encyclopedia-graph-view.js?v=1',
            './src/collection-state.js?v=36',
            './src/collection-ui.js?v=37',
          ];
          for(const mod of mods){
            try{await import(mod);out.textContent+=`${mod} OK\n`;}
            catch(error){out.textContent+=`${mod} FAIL ${error?.name}: ${error?.message}\n${error?.stack??''}\n`;}
          }
          </script>
          EOF
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          echo $! >/tmp/server.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/server.log
          exit 1
      - name: Locate Chrome parse failure
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo 'Chrome executable not found'; exit 1; }
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/mc-chrome about:blank >/tmp/cdp-chrome.log 2>&1 &
          CHROME_PID=$!
          for i in {1..40}; do curl -fsS http://127.0.0.1:9222/json/list >/tmp/tabs.json && break; sleep .25; done
          node --input-type=module <<'NODE'
          const tabs=await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const socket=new WebSocket(tabs[0].webSocketDebuggerUrl);let seq=0;
          const pending=new Map();
          const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});socket.send(JSON.stringify({id,method,params}));});
          socket.addEventListener('message',event=>{
            const msg=JSON.parse(event.data);
            if(msg.id&&pending.has(msg.id)){const job=pending.get(msg.id);pending.delete(msg.id);msg.error?job.reject(msg.error):job.resolve(msg.result);return;}
            if(msg.method==='Debugger.scriptFailedToParse')console.log('SCRIPT_FAILED',JSON.stringify({url:msg.params.url,startLine:msg.params.startLine,startColumn:msg.params.startColumn,endLine:msg.params.endLine,endColumn:msg.params.endColumn}));
            if(msg.method==='Runtime.exceptionThrown')console.log('EXCEPTION',JSON.stringify(msg.params.exceptionDetails));
          });
          await new Promise(resolve=>socket.addEventListener('open',resolve,{once:true}));
          await send('Debugger.enable');await send('Runtime.enable');await send('Page.enable');
          await send('Page.navigate',{url:'http://127.0.0.1:4173/browser-module-probe.html'});
          await new Promise(resolve=>setTimeout(resolve,4500));
          socket.close();
          NODE
          kill "$CHROME_PID" || true
      - name: Probe module imports in Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:4173/browser-module-probe.html >/tmp/probe.html 2>/tmp/probe.log || true
          sed -n '/<pre id="out">/,/<\/pre>/p' /tmp/probe.html
      - name: Load application in headless Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=6000 --enable-logging=stderr --v=1 --dump-dom http://127.0.0.1:4173/ >/tmp/dom.html 2>/tmp/chrome.log || true
          echo '--- relevant DOM ---'
          grep -oE '図鑑[^<]{0,20}|0/[0-9]+|図鑑を読み込めませんでした[^<]*' /tmp/dom.html || true
          echo '--- browser console / errors ---'
          grep -E 'CONSOLE|ERROR|Error|Failed|unavailable|Collection' /tmp/chrome.log | tail -n 120 || true
          python3 - <<'PY'
          from pathlib import Path
          dom=Path('/tmp/dom.html').read_text(errors='replace')
          assert '図鑑を読み込めませんでした。原子からの制作は続けられます。' not in dom, 'collection startup failure is visible'
          assert '0/129' in dom, 'production denominator did not initialize to 129'
          PY
