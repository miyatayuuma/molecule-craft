name: Insight claimability task patch

on:
  push:
    branches: [fix/insight-claimability-consistency]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply focused production changes
        run: |
          python scripts/task-insight-claimability-patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/insight-claimability-consistency.test.mjs')
          s=p.read_text()
          old="const engagedRun=(overrides={})=>Object.assign({captured:false,region:'carbon',time:FIELD_INSIGHT_MIN_SECONDS+1,insightEngagementSatisfied:true,insightEngagementMaxDistance:FIELD_INSIGHT_MIN_DISTANCE+1,player:{x:0,y:0},collectedElements:{H:0,C:0,N:0,O:0},map:{signals:[]},events:[]},createInsightRunState(),overrides);"
          new="const engagedRun=(overrides={})=>Object.assign({},createInsightRunState(),{captured:false,region:'carbon',time:FIELD_INSIGHT_MIN_SECONDS+1,insightEngagementSatisfied:true,insightEngagementMaxDistance:FIELD_INSIGHT_MIN_DISTANCE+1,player:{x:0,y:0},collectedElements:{H:0,C:0,N:0,O:0},map:{signals:[]},events:[]},overrides);"
          if old not in s: raise SystemExit('engagedRun fixture target missing')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/signal-eligibility.test.mjs')
          s=p.read_text()
          old="""assert.match(uiSource,/const excludeIds=new Set\\(run\\.carriedInsights\\)/);\nassert.match(uiSource,/run\\.analysis\\?\\.id\\)excludeIds\\.add\\(run\\.analysis\\.id\\)/);\nassert.match(uiSource,/resources\\.signal\\(event\\.region,event\\.roll,event\\.choice,\\{excludeIds,runContext:run\\}\\)/);"""
          new="""assert.match(uiSource,/function currentInsightExcludeIds\\(\\)\\{const ids=new Set\\(run\\?\\.carriedInsights\\?\\?\\[\\]\\)/);\nassert.match(uiSource,/syncFieldInsightMarkerClaimability\\(run,signal=>resources\\.signalClaimability/);\nassert.match(uiSource,/resources\\.signal\\(event\\.region,event\\.roll,event\\.choice,\\{excludeIds,runContext:run,claimableOnly:true\\}\\)/);"""
          if old not in s: raise SystemExit('signal eligibility source contract target missing')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/nitrogen-chapter-progression.test.mjs')
          s=p.read_text()
          for old,new in [
            ("const normal=resource();normal.state.progress.choCompleted=true;normal.discover(NITROGEN_MOLECULE_ID);", "const normal=resource();normal.state.progress.choCompleted=true;normal.findElementForExpedition('N');normal.discover(NITROGEN_MOLECULE_ID);"),
            ("const lost=resource();lost.state.progress.choCompleted=true;lost.discover(NITROGEN_MOLECULE_ID);", "const lost=resource();lost.state.progress.choCompleted=true;lost.findElementForExpedition('N');lost.discover(NITROGEN_MOLECULE_ID);")
          ]:
            if old not in s: raise SystemExit('NH3 lifecycle fixture target missing')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Focused Insight and Nitrogen regressions
        run: |
          node tests/insight-claimability-consistency.test.mjs
          node tests/field-frontier-insight.test.mjs
          node tests/signal-eligibility.test.mjs
          node --test tests/nitrogen-chapter-progression.test.mjs
          node --test tests/nitrogen-field-integration.test.mjs
          node tests/element-authority-n-foundation.test.mjs
          node tests/inventory-depletion.test.mjs
          node tests/expedition-insights.test.mjs
      - name: Refresh verified PWA release
        run: node scripts/build-precache.mjs
      - name: Diff integrity
        run: git diff --check
      - name: Commit task changes
        shell: bash
        run: |
          git rm scripts/task-insight-claimability-patch.py .github/workflows/task-insight-claimability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix FIELD Insight claimability consistency"
          git push
