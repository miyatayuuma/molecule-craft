name: Lower LOADOUT molecule thumbnails

on:
  push:
    branches: [ui/loadout-molecule-thumbnails-lower]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/loadout-molecule-thumbnails-lower
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Move molecule thumbnails to tank lower edge
        shell: python
        run: |
          from pathlib import Path

          source = Path('src/veil/loadout-workstation.js')
          text = source.read_text()
          old = "#supply-dialog .loadout-molecule-pod{position:absolute;z-index:0;left:50%;top:0;width:145%;height:54px;transform:translate(-50%,-58%);"
          new = "#supply-dialog .loadout-molecule-pod{position:absolute;z-index:0;left:50%;top:100%;width:145%;height:54px;transform:translate(-50%,-58%);"
          assert old in text
          text = text.replace(old, new, 1)
          old = "#supply-dialog .port-propellant>.loadout-molecule-pod{width:175%;height:62px;top:0;transform:translate(-50%,-58%)}"
          new = "#supply-dialog .port-propellant>.loadout-molecule-pod{width:175%;height:62px;top:100%;transform:translate(-50%,-58%)}"
          assert old in text
          source.write_text(text.replace(old, new, 1))

          test = Path('tests/loadout-schematic.test.mjs')
          text = test.read_text()
          old = "assert.match(source,/\\.loadout-molecule-pod\\{[^}]*top:0[^}]*width:145%;height:54px"
          new = "assert.match(source,/\\.loadout-molecule-pod\\{[^}]*top:100%[^}]*width:145%;height:54px"
          assert old in text
          text = text.replace(old, new, 1)
          old = "assert.match(source,/\\.port-propellant>\\.loadout-molecule-pod\\{width:175%;height:62px/);"
          new = "assert.match(source,/\\.port-propellant>\\.loadout-molecule-pod\\{width:175%;height:62px;top:100%/);"
          assert old in text
          test.write_text(text.replace(old, new, 1))
      - name: Parse LOADOUT workstation
        run: node --check src/veil/loadout-workstation.js
      - name: Run focused LOADOUT tests
        run: node --test --test-name-pattern="current molecule display|responsive layout|launch gestures" tests/loadout-schematic.test.mjs
      - name: Run repository hygiene check
        run: node scripts/check-repository-hygiene.mjs
      - name: Commit validated position adjustment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veil/loadout-workstation.js tests/loadout-schematic.test.mjs
          git commit -m "Lower LOADOUT molecule thumbnails"
          git push
