name: Temporary resonance contributor fix
on:
  push:
    branches:
      - task/encyclopedia-chemistry-detail-visual-grammar-work
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply contributor fix
        run: |
          python .github/temp-fix-nitro-contributor.py
          python .github/temp-fix-browser-selector.py
          sed -i "s/encyclopedia-chemistry-visuals.js?v=1/encyclopedia-chemistry-visuals.js?v=2/" src/collection-ui.js
      - name: Validate chemistry diagrams
        run: |
          node tests/encyclopedia-chemistry-visuals.test.mjs
          node tests/encyclopedia-chemistry-visual-browser.test.mjs
          node tests/encyclopedia-content-browser.test.mjs
          node tests/resonance-formal-charge.test.mjs
          node tests/resonance-craft-interaction-browser.test.mjs
      - name: Refresh PWA
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/encyclopedia-chemistry-visuals.js src/collection-ui.js tests/encyclopedia-chemistry-visual-browser.test.mjs sw.js precache-manifest.js
          git commit -m "Fix Nitro resonance contributor B"
          git push
