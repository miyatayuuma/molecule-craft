name: Issue 119 verification

on:
  push:
    branches: [fix/issue-119-molecule-db-readiness]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: DB readiness and saved-state regressions
        run: |
          node tests/issue-119-regression.test.mjs
          node tests/issue-113-regression.test.mjs
          node tests/recognition.test.mjs
          node tests/collection.test.mjs
          node tests/craft-connections.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/supply-tanks.test.mjs
      - name: Protected adjacent contracts
        run: |
          node tests/completion-side-effects.test.mjs
          node tests/craft-undo-contract.test.mjs
          node tests/craft-target-hint.test.mjs
          node tests/source-contracts.test.mjs
          node tests/repository-hygiene.test.mjs
      - name: PWA verified-cache contract
        run: |
          node scripts/build-precache.mjs
          node tests/pwa.test.mjs
