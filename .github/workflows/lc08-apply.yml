name: LC-08 apply

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'legacy-cleanup-lc-08-craft-ui-final-sweep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply LC-08 cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:100]!r}')
              p.write_text(text.replace(old,new,expected))

          replace('index.html',
            '<div class="resource-bar"><button id="open-supply" class="collector-access" type="button" aria-label="収集殻とタンクを開く"><span>収集殻</span></button></div>',
            '<div class="resource-bar"><button id="open-supply" class="collector-access" type="button" aria-label="探索機を開く"></button></div>')
          replace('index.html',
            '          <button id="frame-structure" type="button" class="icon-button" aria-label="分子を画面に収める" title="分子を画面に収める">⛶</button>\n','')

          replace('src/craft-controls.js',
            '  canChangeStructure,refreshStructureList,findStructure,onStructureChange,onFrame,onUndo,onDelete,onClear,',
            '  canChangeStructure,refreshStructureList,findStructure,onStructureChange,onUndo,onDelete,onClear,')
          replace('src/craft-controls.js',
            "  document.querySelector('#frame-structure')?.addEventListener('click',onFrame);\n",'')
          replace('src/app.js',
            '    onFrame:requestStructureFrame,onUndo:undoCraft,onDelete:()=>{',
            '    onUndo:undoCraft,onDelete:()=>{')
          replace('src/game-shell.js',
            "  for(const selector of ['#structure-focus-label','#frame-structure','#open-info']){",
            "  for(const selector of ['#structure-focus-label','#open-info']){")

          replace('src/veil/supply.js',"access.querySelector('i')?.setAttribute('hidden','');",'')
          replace('src/veil/supply.js',"const accessLabel=access.querySelector('span');if(accessLabel)accessLabel.hidden=true;",'')

          replace('styles.css','.undo-cleanup{position:absolute;bottom:68px;right:14px;font-size:12px}','')
          replace('styles.css','.collector-access img{display:block;width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 5px #0007)}','')
          replace('styles.css','@media(max-width:430px){.collector-access span{font-size:11px}}','')

          replace('tests/craft-controls-ui.test.mjs',
            "  const undo=node('undo-cleanup'),clear=node('clear-all'),frame=node('frame-structure'),del=node('delete-selected'),actions=node('actions'),palette=node('palette'),focus=node('structure-focus'),viewer=node('viewer'),canvas=node('canvas'),help=node('help');",
            "  const undo=node('undo-cleanup'),clear=node('clear-all'),del=node('delete-selected'),actions=node('actions'),palette=node('palette'),focus=node('structure-focus'),viewer=node('viewer'),canvas=node('canvas'),help=node('help');")
          replace('tests/craft-controls-ui.test.mjs',"if(selector==='#frame-structure')return frame;",'')
          replace('tests/craft-controls-ui.test.mjs','[undo,clear,frame,del,actions,palette,focus,viewer,canvas,help]','[undo,clear,del,actions,palette,focus,viewer,canvas,help]')
          replace('tests/craft-controls-ui.test.mjs','onFrame(){},','')

          replace('tests/craft-chrome.test.mjs',
            "for(const id of ['structure-focus-label','frame-structure','open-info']){",
            "for(const id of ['structure-focus-label','open-info']){")
          replace('tests/craft-chrome.test.mjs',
            "assert.match(gameShell,/node\\.style\\.display='none'/,'Redundant craft chrome must be visually hidden without removing startup DOM dependencies');",
            "assert.doesNotMatch(index,/id=\"frame-structure\"/,'Legacy CRAFT frame button stays removed');\nassert.doesNotMatch(gameShell,/#frame-structure/,'Legacy frame button no longer needs startup hiding');\nassert.match(gameShell,/node\\.style\\.display='none'/,'Remaining redundant craft chrome stays visually hidden without removing startup DOM dependencies');")

          replace('tests/source-contracts.test.mjs',
            'assert.match(index, /id="frame-structure"/);',
            'assert.doesNotMatch(index, /id="frame-structure"/,\'Legacy CRAFT frame button stays removed\');')
          replace('tests/source-contracts.test.mjs',
            "assert.match(craftControls, /frame-structure'\\)\\?\\.addEventListener\\('click',onFrame\\)/);",
            "assert.doesNotMatch(craftControls,/frame-structure|onFrame/,'Legacy CRAFT frame button event contract stays removed');")
          replace('tests/source-contracts.test.mjs',
            'assert.match(index, /id="open-supply" class="collector-access"/);',
            'assert.match(index, /id="open-supply" class="collector-access"/);\nassert.doesNotMatch(index, /<span>収集殻<\\/span>/,\'Legacy collector access text label stays removed\');')
          replace('tests/source-contracts.test.mjs',
            "assert.doesNotMatch(styles,/\\.model-toolbar\\b|\\.model-zoom\\b/,'Removed collection model toolbar CSS stays removed');",
            "assert.doesNotMatch(styles,/\\.model-toolbar\\b|\\.model-zoom\\b/,'Removed collection model toolbar CSS stays removed');\nassert.doesNotMatch(styles,/\\.undo-cleanup\\b|\\.collector-access (?:img|span)\\b/,'Legacy hidden CRAFT/access chrome selectors stay removed');")
          PY
      - name: Relevant CRAFT tests
        run: |
          node tests/craft-controls-ui.test.mjs
          node tests/craft-chrome.test.mjs
          node tests/craft-stock-chrome.test.mjs
          node tests/craft-workspace.test.mjs
      - name: Source contracts
        run: node tests/source-contracts.test.mjs
      - name: Repository hygiene and reachability
        run: |
          node scripts/check-repository-hygiene.mjs
          node tests/repository-hygiene.test.mjs
      - name: Regenerate PWA closure
        run: node scripts/build-precache.mjs
      - name: Generated PWA freshness
        run: node scripts/build-precache.mjs --check
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Diff whitespace check
        run: git diff --check
      - name: Commit LC-08 change and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/lc08-apply.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Legacy Cleanup LC-08: remove stale CRAFT UI controls'
          git push origin HEAD:${{ github.head_ref }}
