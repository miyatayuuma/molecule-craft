name: Collector shell validation
on:
  push:
    branches:
      - replace-collector-shell-sprite
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/veil/collector-shell.js
      - run: node tests/launch-dialog-lock.test.mjs
      - run: node scripts/check-repository-hygiene.mjs
      - run: node scripts/build-precache.mjs
      - run: node tests/pwa.test.mjs
      - name: Commit generated offline assets and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/collector-shell-validation.yml
          git add precache-manifest.js sw.js
          git commit -m "Regenerate offline cache for collector shell sprite"
          git push
