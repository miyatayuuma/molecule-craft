name: Temporary runtime cleanup PWA refresh

on:
  push:
    branches: [field/runtime-cleanup-legacy-rare-survey]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/build-precache.mjs
      - run: |
          node tests/repository-hygiene.test.mjs
          node tests/field-runtime-allowlist.test.mjs
          node scripts/build-precache.mjs --check
          git diff --check
      - shell: bash
        run: |
          if git diff --quiet -- sw.js precache-manifest.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git commit -m "Refresh PWA precache manifest"
          git push
