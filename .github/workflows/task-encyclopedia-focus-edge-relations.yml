name: Implement Encyclopedia focus edge relations

on:
  push:
    branches:
      - task/encyclopedia-focus-edge-relations

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply focused relation edge implementation
        run: python3 .github/task-focus-edge-patch.py
      - name: Focus edge unit and browser regression
        run: |
          node tests/encyclopedia-graph-ui.test.mjs
          node tests/encyclopedia-transition-browser.test.mjs
          node tests/browser-startup.test.mjs
      - name: Refresh PWA generated assets
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
      - name: Repository hygiene and whitespace
        run: |
          node tests/repository-hygiene.test.mjs
          git diff --check
      - name: Commit implementation
        run: |
          rm .github/workflows/task-encyclopedia-focus-edge-relations.yml .github/task-focus-edge-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/encyclopedia-graph-view.js tests/encyclopedia-graph-ui.test.mjs tests/encyclopedia-transition-browser.test.mjs precache-manifest.js sw.js .github/workflows/task-encyclopedia-focus-edge-relations.yml .github/task-focus-edge-patch.py
          git commit -m "Add focused graph relation direction cues"
          git push origin HEAD:task/encyclopedia-focus-edge-relations
