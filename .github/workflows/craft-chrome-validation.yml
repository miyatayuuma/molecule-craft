name: Craft chrome validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/craft-chrome.test.mjs
      - run: node tests/source-contracts.test.mjs
      - run: node scripts/check-repository-hygiene.mjs
      - run: node scripts/build-precache.mjs
      - name: Commit generated precache
        shell: bash
        run: |
          if git diff --quiet -- precache-manifest.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precache-manifest.js
          git commit -m "Regenerate precache manifest"
          git push origin HEAD:${{ github.head_ref }}
