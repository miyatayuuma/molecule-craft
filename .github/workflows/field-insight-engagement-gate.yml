name: FIELD insight engagement gate patch

on:
  push:
    branches:
      - fix/field-insight-engagement-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/field-insight-engagement-gate
          fetch-depth: 0
      - name: Apply engagement gate
        run: python3 scripts/tmp-field-insight-patch.py
      - name: Validate engagement gate
        run: |
          node tests/field-frontier-insight.test.mjs
          node tests/expedition-insights.test.mjs
          node tests/signal-eligibility.test.mjs
          node tests/expedition-core.test.mjs
          node tests/source-contracts.test.mjs
          node tests/browser-startup.test.mjs
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          node tests/repository-hygiene.test.mjs
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/veil/insights.js src/veil/expedition-run.js src/veil/resources.js src/veil/ui.js tests/field-frontier-insight.test.mjs precache-manifest.js sw.js
          git commit -m 'Gate FIELD insights behind exploration activity'
          git push origin HEAD:fix/field-insight-engagement-gate
