name: Regenerate PWA once

on:
  push:
    branches:
      - fix/nitrogen-field-pickup-integration

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate PWA artifacts
        run: node scripts/build-precache.mjs
      - name: Commit generated artifacts and remove one-shot workflow
        run: |
          rm .github/workflows/regenerate-pwa-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js .github/workflows/regenerate-pwa-once.yml
          git commit -m "Regenerate PWA artifacts"
          git push
