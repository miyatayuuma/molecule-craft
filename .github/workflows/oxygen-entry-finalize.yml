name: Oxygen Entry final generated assets

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-generated-assets:
    if: github.head_ref == 'field-map-oxygen-entry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Regenerate canonical tracked assets
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: Verify Task 2 direct contracts
        run: |
          node tests/field-map-export.test.mjs
          node tests/vortex-route.test.mjs
          node scripts/export-field-map.mjs --check
          node scripts/export-field-expansion-proposal.mjs --check
          node scripts/check-repository-hygiene.mjs
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Commit generated assets and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oxygen-entry-finalize.yml
          git add docs/maps/current-field.svg precache-manifest.js
          git commit -m "Finalize Oxygen Entry generated assets"
          git push origin HEAD:${{ github.head_ref }}
