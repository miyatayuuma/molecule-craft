name: Task 205 regenerate proposal asset

on:
  push:
    branches:
      - task/nitrogen-field-geometry

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[task205-derived]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: task/nitrogen-field-geometry
          fetch-depth: 0
      - name: Regenerate proposal overlay and PWA assets
        run: |
          node scripts/export-field-expansion-proposal.mjs
          node scripts/build-precache.mjs
      - name: Verify derived assets
        run: |
          node tests/field-expansion-proposal.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
      - name: Commit derived assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/maps/field-expansion-proposal.svg precache-manifest.js sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[task205-derived] refresh map overlay and PWA assets"
          git push origin HEAD:task/nitrogen-field-geometry
