name: Task branch PWA refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-task-precache:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Rebuild verified offline release
        run: node scripts/build-precache.mjs
      - name: Commit generated release
        shell: bash
        run: |
          if git diff --quiet -- sw.js precache-manifest.js; then
            echo "Precache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git commit -m "Refresh PWA precache manifest"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
