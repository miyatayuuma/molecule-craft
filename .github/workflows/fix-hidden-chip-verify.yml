name: Hidden chip spawn verify

on:
  push:
    branches: [fix-hidden-chip-spawn]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-hidden-chip-spawn
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate offline release
        run: node scripts/build-precache.mjs
      - name: Regression test
        run: node --test tests/hidden-selection-chip.test.mjs
      - name: Source contracts
        run: node tests/source-contracts.test.mjs
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: Commit generated precache
        run: |
          if git diff --quiet -- precache-manifest.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precache-manifest.js
          git commit -m "Regenerate precache manifest"
          git push
