name: Temporary app version display validation

on:
  push:
    branches:
      - fix-visible-app-version

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-visible-app-version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate PWA release
        run: node scripts/build-precache.mjs
      - name: Test visible app version
        run: node tests/app-version.test.mjs
      - name: Test PWA
        run: node tests/pwa.test.mjs
      - name: Check repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: Commit generated release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate PWA release"
          git push origin HEAD:fix-visible-app-version
