name: Temporary Encyclopedia content review integration
on:
  push:
    branches:
      - task/encyclopedia-content-architecture-review
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply reviewed catalog and UI architecture
        run: |
          node scripts/apply-encyclopedia-content-review.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/repository-validation.yml')
          s=p.read_text()
          old='''      - name: Encyclopedia graph UI\n        run: |\n          node tests/encyclopedia-graph-ui.test.mjs\n          node tests/encyclopedia-graph-thumbnail-label.test.mjs\n          node tests/encyclopedia-graph-thumbnail-label-browser.test.mjs\n          node --test tests/encyclopedia-molecule-transition.test.mjs\n          node tests/encyclopedia-transition-browser.test.mjs\n'''
          new='''      - name: Encyclopedia graph UI\n        run: |\n          node tests/encyclopedia-content-architecture.test.mjs\n          node tests/encyclopedia-content-browser.test.mjs\n          node tests/encyclopedia-graph-ui.test.mjs\n          node tests/encyclopedia-graph-thumbnail-label.test.mjs\n          node tests/encyclopedia-graph-thumbnail-label-browser.test.mjs\n          node --test tests/encyclopedia-molecule-transition.test.mjs\n          node tests/encyclopedia-transition-browser.test.mjs\n'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          node tests/encyclopedia-content-architecture.test.mjs
          node tests/encyclopedia-content-browser.test.mjs
          node tests/collection.test.mjs
          node tests/collection-expansion.test.mjs
          node --test tests/encyclopedia-molecule-transition.test.mjs
          node tests/encyclopedia-transition-browser.test.mjs
      - name: Refresh PWA generated assets
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit integrated Encyclopedia review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/encyclopedia.json src/collection-ui.js .github/workflows/repository-validation.yml sw.js
          git commit -m "Integrate Encyclopedia content architecture review"
          git push
