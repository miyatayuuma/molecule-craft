name: Issue 115 validation

on:
  push:
    branches: [fix/issue-115-craft-undo-completion-boundaries]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression suite
        run: node --test tests/*.test.mjs
