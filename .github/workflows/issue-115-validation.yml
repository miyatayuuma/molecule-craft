name: Issue 115 validation

on:
  push:
    branches: [fix/issue-115-craft-undo-completion-boundaries]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild generated precache for validation
        run: node scripts/build-precache.mjs
      - name: Run Issue 115 and Issue 113 regression coverage
        run: node --test tests/craft-history.test.mjs tests/completion-side-effects.test.mjs tests/craft-connections.test.mjs tests/craft-undo-contract.test.mjs tests/source-contracts.test.mjs tests/pwa.test.mjs tests/issue-113-regression.test.mjs tests/loadout-launch-regression.test.mjs
