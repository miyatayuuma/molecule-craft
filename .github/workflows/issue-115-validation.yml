name: Issue 115 validation

on:
  push:
    branches: [fix/issue-115-craft-undo-completion-boundaries]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 57ea0f95764bf988c6416c1c666ece4ca2de8561
      - name: Package exact base main for local comparison
        run: tar --exclude=.git -czf /tmp/issue-115-base-main.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: issue-115-base-main-57ea0f9
          path: /tmp/issue-115-base-main.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run base regression suite
        run: node --test tests/*.test.mjs
