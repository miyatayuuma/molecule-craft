name: Temporary resonance validation
on:
  push:
    branches:
      - feature/resonance-formal-charge-nitro-ozone
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run resonance and compatibility regressions
        run: |
          node tests/resonance-formal-charge.test.mjs
          node tests/resonance-frontier-eligibility.test.mjs
          node tests/recognition.test.mjs
          node tests/special-bonds-check.mjs
          node tests/craft-target-match.test.mjs
          node tests/craft-target-hint.test.mjs
          node tests/molecule-graph.test.mjs
          node tests/collection.test.mjs
          node scripts/build-precache.mjs --check
      - name: Run real-browser resonance visuals
        run: node tests/resonance-visual-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resonance-visual
          path: test-results/resonance-visual
          if-no-files-found: ignore
          retention-days: 7
