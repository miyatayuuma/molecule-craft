name: Temporary resonance runner
on:
  push:
    branches:
      - feature/resonance-formal-charge-nitro-ozone
permissions:
  contents: read
jobs:
  audit-db:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare committed DB with generator output
        run: |
          cp data/molecules.json /tmp/committed-molecules.json
          node scripts/build-molecule-db.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('/tmp/committed-molecules.json','utf8'));
          const after=JSON.parse(fs.readFileSync('data/molecules.json','utf8'));
          const a=new Set(before.map(x=>x.id)),b=new Set(after.map(x=>x.id));
          console.log('COMMITTED_NOT_GENERATED',[...a].filter(x=>!b.has(x)));
          console.log('GENERATED_NOT_COMMITTED',[...b].filter(x=>!a.has(x)));
          NODE
