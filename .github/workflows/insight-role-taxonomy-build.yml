name: Insight role taxonomy build

on:
  push:
    branches: [codex/insight-role-taxonomy]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Taxonomy regressions
        run: |
          node tests/insight-category.test.mjs
          node tests/molecule-roles.test.mjs
          node tests/insight-presentation.test.mjs
          node tests/pending-craft.test.mjs
          node tests/veil-audio.test.mjs
          node tests/expedition-insights.test.mjs
      - name: Rebuild verified offline release
        run: node scripts/build-precache.mjs
      - name: Commit generated release when needed
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- sw.js precache-manifest.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git diff --cached --check
          git commit -m "Refresh PWA precache manifest"
          git push
