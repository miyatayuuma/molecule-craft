name: Issue 106 apply and verify

on:
  push:
    branches: [issue-106-pending-craft-route]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove legacy LOADOUT pending-craft coupling
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/veil/supply.js')
          lines = path.read_text().splitlines(keepends=True)
          out = []
          render_head = render_ui = event = 0
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("const hintIds={propellant:['hydrogen','carbon-dioxide']") and 'hintIds[selectedUse].find' in stripped:
                  render_head += 1
                  continue
              if "q('tank-next-hint').hidden=!hintId" in stripped and 'dataset.moleculeId' in stripped:
                  render_ui += 1
                  continue
              if "q('tank-next-hint').addEventListener('click'" in stripped:
                  event += 1
                  continue
              out.append(line)
          if (render_head, render_ui, event) != (1, 1, 1):
              raise SystemExit(f'unexpected legacy blocks: {render_head=}, {render_ui=}, {event=}')
          path.write_text(''.join(out))
      - name: Run Issue 106 regressions
        run: |
          node --test tests/pending-craft.test.mjs tests/craft-connections.test.mjs tests/loadout-schematic.test.mjs tests/loadout-launch-regression.test.mjs
          node tests/source-contracts.test.mjs
          node scripts/check-repository-hygiene.mjs
          git diff --check
      - name: Rebuild verified offline release
        run: node scripts/build-precache.mjs
      - name: Commit applied patch and generated release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veil/supply.js sw.js precache-manifest.js
          git commit -m "Remove LOADOUT pending craft coupling"
          git push
