name: Refresh branch PWA precache

on:
  push:
    branches: [loadout-shortage-confirmation-simplification]

permissions:
  contents: write

jobs:
  refresh-precache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild verified offline release
        run: node scripts/build-precache.mjs
      - name: Commit generated release when needed
        shell: bash
        run: |
          if git diff --quiet -- sw.js precache-manifest.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git commit -m "Refresh PWA precache manifest"
          git push
