name: DOCK precache temp

on:
  push:
    branches: [work/basic-dock-foundation]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/build-precache.mjs
      - name: Commit generated PWA release
        shell: bash
        run: |
          if git diff --quiet -- sw.js precache-manifest.js; then
            echo "Precache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git commit -m "Refresh DOCK PWA precache"
          git push
