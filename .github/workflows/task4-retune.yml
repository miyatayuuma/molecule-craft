name: Task 4 retune validator

on:
  push:
    branches: [field-task4-route-c-thermal]

permissions:
  contents: write

jobs:
  validate-and-generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Production thermal simulation
        run: node tests/oxygen-thermal-progression.test.mjs
      - name: Regenerate and verify maps
        run: |
          node scripts/export-field-map.mjs
          node scripts/export-field-map.mjs --check
          node scripts/export-field-expansion-proposal.mjs --check
      - name: Rebuild and verify PWA
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
      - name: Guardrails
        run: |
          node tests/repository-hygiene.test.mjs
          node tests/source-contracts.test.mjs
          git diff --check
      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maps/current-field.svg precache-manifest.js sw.js
          git commit -m "Refresh Route C thermal artifacts"
          git push
