name: Task 4 retune validator

on:
  push:
    branches: [field-task4-route-c-thermal]

permissions:
  contents: write

jobs:
  validate-and-generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply final local thermal candidate
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- src/veil/config.js tests/thermal-coolant.test.mjs
          python - <<'PY'
          from pathlib import Path

          p=Path('src/veil/oxygen-routes.js')
          s=p.read_text()
          s=s.replace("""  heatStops:freezeStops([\n    [-8870,1],[-9050,2],[-9150,4],[-9200,48],[-10480,48],\n    [-10510,32],[-10540,8],[-10560,0],[-10670,0],\n  ]),""","""  heatStops:freezeStops([\n    [-8870,1],[-9050,2],[-9200,4],[-9500,12],[-9700,32],[-9800,48],\n    [-10480,48],[-10510,32],[-10540,8],[-10560,0],[-10670,0],\n  ]),""")
          old="  return {heat,routeHeat,deepHeat,recovery,intensity:clamp(heat/48,0,1)};"
          new="  return {heat,routeHeat,deepHeat,recovery,intensity:clamp(heat/48,0,1),combustionHeatFactor:1+.38*clamp(routeHeat/48,0,1)};"
          assert old in s
          p.write_text(s.replace(old,new))

          p=Path('src/veil/universe.js')
          s=p.read_text()
          old="return {pressure:basePressure+vortex.y,flowX:baseFlowX+vortex.x,traversableRoutePressure:challenge?null:oxygenRoutePressure,heat:Math.max(challenge?.heat??0,environmentHeat),intensity:thermal.intensity,eddy:coolEddy,vortex:vortex.intensity};"
          new="return {pressure:basePressure+vortex.y,flowX:baseFlowX+vortex.x,traversableRoutePressure:challenge?null:oxygenRoutePressure,heat:Math.max(challenge?.heat??0,environmentHeat),combustionHeatFactor:thermal.combustionHeatFactor,intensity:thermal.intensity,eddy:coolEddy,vortex:vortex.intensity};"
          assert old in s
          p.write_text(s.replace(old,new))

          p=Path('src/veil/engine.js')
          s=p.read_text()
          old="heat:0,ambientHeat:0,coolantBuffer:0"
          new="heat:0,ambientHeat:0,combustionHeatFactor:1,coolantBuffer:0"
          assert old in s
          s=s.replace(old,new)
          old="run.heat+=p.combustion?THERMAL.heatPerSecond*(fuelPerformance?.heatFactor??1)*dt:-THERMAL.naturalCoolingPerSecond*dt;"
          new="run.heat+=p.combustion?THERMAL.heatPerSecond*(fuelPerformance?.heatFactor??1)*(run.combustionHeatFactor??1)*dt:-THERMAL.naturalCoolingPerSecond*dt;"
          assert old in s
          s=s.replace(old,new)
          old="const targetHeat=environment?clamp(environment.heat/32*100,0,150):0;run.ambientHeat+=(targetHeat-run.ambientHeat)*(1-Math.exp(-dt*(targetHeat>run.ambientHeat?1.2:.7)));"
          new="const targetHeat=environment?clamp(environment.heat/32*100,0,150):0;run.ambientHeat+=(targetHeat-run.ambientHeat)*(1-Math.exp(-dt*(targetHeat>run.ambientHeat?1.2:.7)));run.combustionHeatFactor=environment?.combustionHeatFactor??1;"
          assert old in s
          p.write_text(s.replace(old,new))

          p=Path('tests/oxygen-thermal-progression.test.mjs')
          s=p.read_text()
          old="""// Scenario D: Route B remains a DRIVE route, but its authored recovery is a\n// rational place to coast briefly and use ordinary natural cooling.\nconst bDrive=simulateRoute('oxygen-main',{combustion:true,recoveryCoastSeconds:.45});\nassert.ok(bDrive.recoveryCoast>=.45,'Route B traversal should use the authored recovery coast');"""
          new="""// Scenario D: Route B remains a sustained DRIVE route. Its authored recovery\n// is thermally quiet, but intended traversal does not require a cooling stop.\nconst bDrive=simulateRoute('oxygen-main',{combustion:true});"""
          assert old in s
          s=s.replace(old,new)
          insert="assert.ok(environmentAt({x:oxygenRouteCenterAtY(routeB,-10050),y:-10050}).combustionHeatFactor===1,'Route B keeps neutral combustion thermal load');\n"
          marker="assert.ok(environmentAt({x:oxygenRouteCenterAtY(routeB,-10050),y:-10050}).heat<5,'Route B remains mostly cool beside Route C');\n"
          assert marker in s
          s=s.replace(marker,marker+insert)
          p.write_text(s)

          p=Path('.github/workflows/repository-validation.yml')
          s=p.read_text()
          old="""      - name: Oxygen thermal progression\n        run: node tests/oxygen-thermal-progression.test.mjs\n"""
          new="""      - name: Thermal and expedition regressions\n        run: |\n          node tests/oxygen-thermal-progression.test.mjs\n          node tests/thermal-coolant.test.mjs\n          node tests/expedition-core.test.mjs\n"""
          assert old in s
          p.write_text(s.replace(old,new))
          PY
      - name: Focused thermal and expedition regressions
        run: |
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/expedition-core.test.mjs
      - name: Regenerate and verify maps
        run: |
          node scripts/export-field-map.mjs
          node scripts/export-field-map.mjs --check
          node scripts/export-field-expansion-proposal.mjs --check
      - name: Rebuild and verify PWA
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
      - name: Guardrails
        run: |
          node tests/field-map-export.test.mjs
          node tests/repository-hygiene.test.mjs
          node tests/source-contracts.test.mjs
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit final Task 4 candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/repository-validation.yml src/veil/config.js src/veil/engine.js src/veil/oxygen-routes.js src/veil/universe.js tests/oxygen-thermal-progression.test.mjs tests/thermal-coolant.test.mjs docs/maps/current-field.svg precache-manifest.js sw.js
          git diff --cached --quiet || git commit -m "Localize Route C combustion thermal load"
          git push
