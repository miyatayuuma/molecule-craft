name: Nitrogen browser assertion fix

on:
  push:
    branches: [field/nitrogen-chapter-completion]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove non-contract HUD assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/nitrogen-chapter-browser.test.mjs')
          s=p.read_text()
          old="const clCarry=await evaluate(`(()=>({cargo:globalThis.__nitrogenChapterRun.rareCargo.Cl,hud:document.querySelector('#veil-minerals')?.textContent??''}))()`);assert.equal(clCarry.cargo,1);assert.match(clCarry.hud,/RARE Cl 1/);"
          new="const clCarry=await evaluate(`globalThis.__nitrogenChapterRun.rareCargo.Cl`);assert.equal(clCarry,1,'Cl scan must enter run-local Rare cargo before settlement');"
          if old not in s: raise SystemExit('target assertion not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit browser acceptance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/nitrogen-chapter-browser.test.mjs
          git commit -m "Fix Nitrogen Cl browser acceptance contract"
          git push
