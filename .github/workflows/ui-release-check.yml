name: UI release check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh offline release
        run: node scripts/build-precache.mjs
      - name: Run tests
        run: |
          set -euo pipefail
          for test in tests/*.test.mjs; do node "$test"; done
          node scripts/check-repository-hygiene.mjs
      - name: Commit generated precache
        run: |
          if git diff --quiet -- precache-manifest.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precache-manifest.js
          git commit -m "Refresh PWA precache"
          git pull --rebase origin ${{ github.head_ref }}
          git push origin HEAD:${{ github.head_ref }}
