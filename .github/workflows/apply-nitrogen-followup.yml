name: Apply Nitrogen follow-up patch

on:
  push:
    branches:
      - fix/nitrogen-visual-identity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply focused production fixes
        run: python3 scripts/apply-nitrogen-followup.py
      - name: Focused Nitrogen and CRAFT regression
        run: |
          node tests/nitrogen-visual-identity.test.mjs
          node tests/nitrogen-chapter-progression.test.mjs
          node tests/nitrogen-field-integration.test.mjs
          node tests/nitrogen-field-pickup-browser.test.mjs
          node tests/craft-stock-chrome.test.mjs
      - name: Rebuild PWA release
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit follow-up fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/element-progression.js src/app.js src/veil/renderer.js index.html tests/nitrogen-field-pickup-browser.test.mjs tests/nitrogen-visual-identity.test.mjs sw.js precache-manifest.js
          git commit -m "Fix Nitrogen FIELD identity and CRAFT access"
          git push
