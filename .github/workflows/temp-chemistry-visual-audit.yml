name: Temporary chemistry visual implementation
on:
  push:
    branches:
      - task/encyclopedia-chemistry-detail-visual-grammar-work
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply production wiring
        run: python .github/temp-chemistry-impl.py
      - name: Regenerate Encyclopedia molecule assets
        run: node scripts/build-collection-assets.mjs
      - name: Run targeted visual and chemistry regressions
        run: |
          node tests/encyclopedia-chemistry-visuals.test.mjs
          node tests/special-bonds-check.mjs
          node tests/resonance-formal-charge.test.mjs
          node tests/bond-state.test.mjs
          node --test tests/craft-target-match.test.mjs
          node --test tests/craft-target-hint.test.mjs
          node tests/resonance-craft-interaction-browser.test.mjs
          node tests/resonance-visual-browser.test.mjs
          node tests/aromatic-rendering-check.mjs vendor/three/three.module.min.js
          node tests/encyclopedia-content-architecture.test.mjs
          node tests/encyclopedia-content-browser.test.mjs
          node tests/encyclopedia-chemistry-visual-browser.test.mjs
          node --test tests/encyclopedia-molecule-transition.test.mjs
          node tests/encyclopedia-transition-browser.test.mjs
      - name: Refresh and validate PWA
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git reset .github/workflows/temp-chemistry-visual-audit.yml .github/workflows/repository-validation.yml .github/temp-chemistry-impl.py test-results
          if git diff --cached --quiet; then
            echo "No implementation changes"
            exit 0
          fi
          git commit -m "Add Encyclopedia chemistry visual grammar"
          git push
