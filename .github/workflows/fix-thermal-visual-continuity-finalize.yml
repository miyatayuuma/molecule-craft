name: Thermal visual continuity finalizer

on:
  push:
    branches:
      - fix/thermal-visual-continuity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/thermal-visual-continuity
          fetch-depth: 0
      - name: Apply continuous thermal presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing {label}')
              return text.replace(old, new, 1)

          ui_path = Path('src/veil/ui.js')
          ui = ui_path.read_text()
          old = "const thermalState=run.overheated?'overheat':run.coolantActive?'cooling':run.heat>=THERMAL.hotThreshold?'hot':'normal',thermalLabels={normal:'通常',cooling:'自動冷却中',hot:'高温',overheat:'過熱停止'},thermalIndicators={normal:'',cooling:'❄ COOLING',hot:'♨ HOT',overheat:'♨ OVERHEAT'},outputMax=propulsionSpeedMax(run.config),output=Math.max(0,run.player.speed),outputRatio=outputMax?Math.max(0,Math.min(1,output/outputMax)):0,activeThermalNotice=thermalNotice&&run.time<thermalNoticeUntil;thermal.hidden=false;thermal.dataset.state=thermalState;thermal.style.background=thermalState==='cooling'?'#0a2828d1':thermalState==='hot'?'#34251ad6':'';q('veil-thermal-state').textContent=thermalState==='overheat'?thermalIndicators.overheat:activeThermalNotice?thermalNotice:thermalIndicators[thermalState];q('veil-heat').textContent='OUTPUT';thermal.setAttribute('aria-label',`熱状態 ${thermalLabels[thermalState]}。熱 ${Math.round(run.heat)}%。`);if(outputMeter){const percent=Math.round(outputRatio*100);outputMeter.setAttribute('aria-valuenow',String(percent));outputMeter.setAttribute('aria-valuetext',`${percent}%`);}if(outputMeterFill)outputMeterFill.style.transform=`scaleX(${outputRatio})`;"
          new = "const thermalState=run.overheated?'overheat':run.coolantActive?'cooling':run.heat>=THERMAL.hotThreshold?'hot':'normal',thermalLabels={normal:'通常',cooling:'自動冷却中',hot:'高温',overheat:'過熱停止'},thermalIndicators={normal:'',cooling:'❄ COOLING',hot:'♨ HOT',overheat:'♨ OVERHEAT'},heatRatio=Math.max(0,Math.min(1,run.heat/THERMAL.overheatThreshold)),thermalHue=Math.round(190-185*heatRatio),outputMax=propulsionSpeedMax(run.config),output=Math.max(0,run.player.speed),outputRatio=outputMax?Math.max(0,Math.min(1,output/outputMax)):0,activeThermalNotice=thermalNotice&&run.time<thermalNoticeUntil;thermal.hidden=false;thermal.dataset.state=thermalState;thermal.style.setProperty('--thermal-hue',String(thermalHue));thermal.style.setProperty('--thermal-intensity',heatRatio.toFixed(3));q('veil-thermal-state').textContent=thermalState==='overheat'?thermalIndicators.overheat:activeThermalNotice?thermalNotice:thermalIndicators[thermalState];q('veil-heat').textContent='OUTPUT';thermal.setAttribute('aria-label',`熱状態 ${thermalLabels[thermalState]}。熱 ${Math.round(run.heat)}%。`);if(outputMeter){const percent=Math.round(outputRatio*100);outputMeter.setAttribute('aria-valuenow',String(percent));outputMeter.setAttribute('aria-valuetext',`${percent}%`);}if(outputMeterFill)outputMeterFill.style.transform=`scaleX(${outputRatio})`;"
          ui = replace_once(ui, old, new, 'thermal HUD block')
          if "thermal.style.background=thermalState" in ui:
              raise SystemExit('discrete thermal background survived')
          ui_path.write_text(ui)

          css_path = Path('veil.css')
          css = css_path.read_text()
          old = ".veil-thermal{box-sizing:border-box;width:132px;padding:7px 9px;border:1px solid #48687980;border-radius:12px;background:#0a1b28c7;color:#a7c2cf;font-variant-numeric:tabular-nums;pointer-events:none}.veil-thermal>span{display:flex;align-items:center;justify-content:space-between;gap:8px}.veil-thermal b,.veil-thermal strong{font-size:9px;font-weight:600;letter-spacing:1px}.veil-thermal strong{color:#d7edf3}.veil-thermal>i{display:block;height:3px;margin:4px 0;overflow:hidden;border-radius:2px;background:#29404c}.veil-thermal>i span{display:block;width:100%;height:100%;transform:scaleX(0);transform-origin:left;background:#6ec7d1;transition:transform .12s linear}.veil-thermal small{display:block;overflow:hidden;text-overflow:ellipsis;color:#76aaa9;font-size:8px;letter-spacing:.5px;white-space:nowrap}.veil-thermal[data-state=cooling]{border-color:#77d8ce99;color:#9de9df;box-shadow:0 0 16px #54c8bb22}.veil-thermal[data-state=cooling]>i span{background:#80e3d6}.veil-thermal[data-state=hot]{border-color:#dc9b6288;color:#f0bd8f}.veil-thermal[data-state=hot]>i span{background:#e9a268}.veil-thermal[data-state=overheat]{border-color:#ef6767aa;color:#ffd0c9;background:#371a1bcc;box-shadow:0 0 19px #e9434333}.veil-thermal[data-state=overheat]>i span{background:#ef6262}@media(max-width:370px){.veil-thermal{width:110px;padding:5px 7px}}@media(max-height:500px){.veil-thermal{width:90px;padding:4px 6px}.veil-thermal small{display:none}.veil-thermal>i{margin-bottom:0}}@media(prefers-reduced-motion:reduce){.veil-thermal>i span{transition:none}}"
          new = ".veil-thermal{--thermal-hue:190;--thermal-intensity:0;position:relative;overflow:hidden;box-sizing:border-box;width:132px;padding:7px 9px;border:1px solid hsl(var(--thermal-hue) 72% 60% / calc(.28 + var(--thermal-intensity)*.58));border-radius:12px;background:linear-gradient(90deg,hsl(var(--thermal-hue) 68% 24% / calc(.08 + var(--thermal-intensity)*.30)),#0a1b28c7 72%);color:hsl(var(--thermal-hue) 68% calc(72% + var(--thermal-intensity)*18%));box-shadow:0 0 calc(4px + var(--thermal-intensity)*18px) hsl(var(--thermal-hue) 82% 55% / calc(.04 + var(--thermal-intensity)*.28));font-variant-numeric:tabular-nums;pointer-events:none;transition:border-color .12s linear,background .12s linear,color .12s linear,box-shadow .12s linear}.veil-thermal:after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:hsl(var(--thermal-hue) 82% 60% / .92);transform:scaleX(var(--thermal-intensity));transform-origin:left;transition:transform .12s linear,background .12s linear}.veil-thermal>span{display:flex;align-items:center;justify-content:space-between;gap:8px}.veil-thermal b,.veil-thermal strong{font-size:9px;font-weight:600;letter-spacing:1px}.veil-thermal strong{color:#d7edf3}.veil-thermal>i{display:block;height:3px;margin:4px 0;overflow:hidden;border-radius:2px;background:#29404c}.veil-thermal>i span{display:block;width:100%;height:100%;transform:scaleX(0);transform-origin:left;background:#6ec7d1;transition:transform .12s linear}.veil-thermal small{display:block;overflow:hidden;text-overflow:ellipsis;color:#76aaa9;font-size:8px;letter-spacing:.5px;white-space:nowrap}.veil-thermal[data-state=overheat] #veil-thermal-state{font-weight:800}@media(max-width:370px){.veil-thermal{width:110px;padding:5px 7px}}@media(max-height:500px){.veil-thermal{width:90px;padding:4px 6px}.veil-thermal small{display:none}.veil-thermal>i{margin-bottom:0}}@media(prefers-reduced-motion:reduce){.veil-thermal,.veil-thermal:after,.veil-thermal>i span{transition:none}}"
          css = replace_once(css, old, new, 'thermal CSS block')
          if ".veil-thermal[data-state=hot]>i span" in css or ".veil-thermal[data-state=cooling]>i span" in css:
              raise SystemExit('state-dependent OUTPUT tint survived')
          css_path.write_text(css)

          test_path = Path('tests/propulsion-hud-source.test.mjs')
          test = test_path.read_text()
          test = replace_once(test, "assert.doesNotMatch(ui,/run\\.heat\\/THERMAL\\.overheatThreshold/,'Exact heat no longer drives a primary quantitative bar');", "assert.match(ui,/heatRatio=Math\\.max\\(0,Math\\.min\\(1,run\\.heat\\/THERMAL\\.overheatThreshold\\)\\)/,'Thermal presentation follows continuous canonical heat load');\nassert.match(ui,/thermalHue=Math\\.round\\(190-185\\*heatRatio\\)/,'Thermal hue changes continuously with heat load');\nassert.match(ui,/thermal\\.style\\.setProperty\\('--thermal-hue',String\\(thermalHue\\)\\)/);\nassert.match(ui,/thermal\\.style\\.setProperty\\('--thermal-intensity',heatRatio\\.toFixed\\(3\\)\\)/);", 'continuous heat source contract')
          test = replace_once(test, "assert.match(ui,/thermalState==='cooling'.*thermalState==='hot'/,'Cooling and hot states tint the HUD box background');", "assert.doesNotMatch(ui,/thermal\\.style\\.background=thermalState/,'Thermal panel color must not jump between discrete state backgrounds');\nassert.match(veilCss,/\\.veil-thermal\\{--thermal-hue:190;--thermal-intensity:0/,'Thermal panel exposes continuous hue and intensity channels');\nassert.match(veilCss,/\\.veil-thermal:after\\{[^}]*scaleX\\(var\\(--thermal-intensity\\)\\)/,'Thermal edge fill grows continuously with heat');\nassert.match(veilCss,/\\.veil-thermal>i span\\{[^}]*background:#6ec7d1/,'OUTPUT bar keeps its own fixed propulsion color');\nassert.doesNotMatch(veilCss,/\\.veil-thermal\\[data-state=(?:cooling|hot)\\]>i span/,'Thermal states must not recolor the OUTPUT bar');", 'continuous thermal CSS contract')
          test = replace_once(test, "console.log('Propulsion HUD source contract passed: max PULSE dots, propulsion OUTPUT meter, thermal states, coolant feedback, DRIVE/BURST bindings, and responsive bounds.');", "console.log('Propulsion HUD source contract passed: max PULSE dots, propulsion OUTPUT meter, continuous thermal load, coolant feedback, DRIVE/BURST bindings, and responsive bounds.');", 'test summary')
          test_path.write_text(test)
          PY
      - name: Regenerate PWA artifacts
        run: node scripts/build-precache.mjs
      - name: Focused validation
        run: |
          node tests/propulsion-hud-source.test.mjs
          node tests/coolant-feedback.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/generic-propulsion.test.mjs
          node tests/source-contracts.test.mjs
          node tests/repository-hygiene.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit focused change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veil/ui.js veil.css tests/propulsion-hud-source.test.mjs precache-manifest.js sw.js
          git commit -m "Make FIELD thermal load continuous"
          git push origin HEAD:fix/thermal-visual-continuity
