name: MC-SR-01 acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Targeted tests
        run: node --test tests/reaction-progress.test.mjs tests/tnt-rewards.test.mjs tests/expedition-insights.test.mjs tests/insight-presentation.test.mjs tests/reaction-lab-discovery.test.mjs tests/tnt-eater-defeat.test.mjs
      - name: Browser 360px and desktop
        run: |
          GUIDE_WIDTH=360 node tests/tnt-rewards-browser.test.mjs
          GUIDE_WIDTH=1024 node tests/tnt-rewards-browser.test.mjs
