name: Temporary repository hygiene audit

on:
  push:
    branches:
      - chore/repository-hygiene-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Concise hygiene candidate report
        shell: bash
        run: |
          echo '=== CATALOG LITERALS ==='
          git grep -n -E '(^|[^0-9])(129|130|135)([^0-9]|$)' -- '*.js' '*.mjs' '*.json' '*.md' '*.yml' '*.yaml' | grep -v '^data/molecules.json:' | head -200 || true
          echo '=== LEGACY / COMPAT / FALLBACK IN SRC ==='
          git grep -n -Ei '\b(legacy|compat|fallback|obsolete|deprecated|warp)\b' -- src | head -240 || true
          echo '=== LAUNCH / FRONTIER DOM CONTRACT ==='
          git grep -n -E 'expedition-anchor|launch-veil|synthetic|\.click\(\)|dispatchEvent\(' -- src index.html tests | head -260 || true
          echo '=== RESONANCE OLD-NAMING CANDIDATES ==='
          git grep -n -E 'legacySharedBond|sharedBondCurves|distributedResonanceBondLines|resonance.*arc|arc.*resonance' -- src scripts tests | head -220 || true
          echo '=== LEARNING NOTE OUTSIDE DB ==='
          git grep -n 'learningNote' -- . ':(exclude)data/molecules.json' || true
          echo '=== TEMP / DEBUG PROD TERMS ==='
          git grep -n -Ei '\b(TODO|FIXME|TEMPORARY|DEBUG)\b|console\.log\(' -- src scripts .github | head -220 || true
      - name: Production data and asset authority summary
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const molecules=JSON.parse(fs.readFileSync('data/molecules.json','utf8'));
          const encyclopedia=JSON.parse(fs.readFileSync('data/encyclopedia.json','utf8'));
          const entries=encyclopedia.molecules??encyclopedia;
          console.log('catalog',molecules.length,'encyclopedia',Object.keys(entries).length,'learningNote',molecules.filter(x=>Object.hasOwn(x,'learningNote')).length);
          const models=fs.readdirSync('assets/models').filter(x=>/^molecule-.*\.svg$/.test(x));
          const expected=new Set(molecules.map(x=>`molecule-${x.id}.svg`));
          console.log('models',models.length,'orphan',models.filter(x=>!expected.has(x)),'missing',[...expected].filter(x=>!models.includes(x)));
          NODE
      - name: Existing hygiene and generated asset guardrails
        run: |
          node tests/repository-hygiene.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
