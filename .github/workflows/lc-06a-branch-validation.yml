name: LC-06A branch validation

on:
  push:
    branches: [legacy-cleanup-lc-06a]

permissions:
  contents: write

concurrency:
  group: lc-06a-branch-validation
  cancel-in-progress: false

jobs:
  cleanup-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legacy-cleanup-lc-06a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply audited production orphan cleanup
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const read=path=>fs.readFileSync(path,'utf8');
          const write=(path,text)=>fs.writeFileSync(path,text);
          const replaceOnce=(text,from,to,label)=>{
            const first=text.indexOf(from);
            if(first<0)throw new Error(`Missing expected ${label}`);
            if(text.indexOf(from,first+from.length)>=0)throw new Error(`Expected one ${label}, found multiple`);
            return text.slice(0,first)+to+text.slice(first+from.length);
          };

          let index=read('index.html');
          for(const [fragment,label] of [
            ['<p id="tank-use-guide" class="tank-affordability"></p>','tank-use-guide DOM'],
            ['<p id="tank-replacement" class="tank-replacement" hidden></p>','tank-replacement DOM'],
            ['<p id="tank-affordability" class="tank-affordability"></p>','tank-affordability DOM'],
            ['<p id="loaded-combustion-summary"></p>','loaded-combustion-summary DOM'],
          ]) index=replaceOnce(index,fragment,'',label);
          write('index.html',index);

          let supply=read('src/veil/supply.js');
          supply=replaceOnce(supply,"q('tank-use-guide').hidden=true;q('tank-use-guide').textContent='';",'', 'tank-use-guide no-op reset');
          supply=replaceOnce(supply,"q('tank-replacement').hidden=true;q('tank-replacement').textContent='';q('tank-replacement').removeAttribute('aria-label');q('tank-affordability').hidden=true;q('tank-affordability').textContent='';",'', 'obsolete loadout placeholder reset');
          supply=replaceOnce(supply,"const burnSummary=q('loaded-combustion-summary');if(burnSummary){burnSummary.hidden=true;burnSummary.textContent='';}",'', 'loaded combustion no-op reset');
          write('src/veil/supply.js',supply);

          let styles=read('styles.css');
          styles=replaceOnce(styles,'.model-toolbar{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px 10px}.model-toolbar button{min-width:44px;font-size:16px;padding:7px;background:#152c3fc7;border-color:#39596c}.model-zoom{font-size:11px;color:#91b2c4;min-width:40px;text-align:center}','', 'removed collection model toolbar CSS');
          write('styles.css',styles);

          let veil=read('veil.css');
          for(const [fragment,label] of [
            ['#supply-dialog .tank-affordability{margin-top:auto;color:#9ebac5;font-size:9px;line-height:1.45}','supply affordability CSS'],
            ['.tank-model #tank-model-host .model-toolbar{padding-bottom:7px}','tank model toolbar CSS'],
            ['.tank-replacement{padding:7px 9px;border-left:2px solid #d08b67;background:#2a1d19;color:#efb99d;font-size:10px}','tank replacement CSS'],
            ['#tank-use-guide{line-height:1.7}','tank use guide CSS'],
          ]) veil=replaceOnce(veil,fragment,'',label);
          write('veil.css',veil);

          fs.rmSync('src/craft-transfer-effects.js');

          let contracts=read('tests/source-contracts.test.mjs');
          contracts=replaceOnce(contracts,"const craftTransferEffects=await readFile(new URL('src/craft-transfer-effects.js',root),'utf8');\n",'', 'craft transfer effects source read');
          contracts=replaceOnce(contracts,"assert.doesNotMatch(craftTransferEffects,/chargeFromStock|tank-charge-stage/,'Transfer effects no longer special-case manual tank charging');","await assert.rejects(readFile(new URL('src/craft-transfer-effects.js',root),'utf8'),error=>error?.code==='ENOENT','Legacy craft transfer effects runtime module stays deleted');", 'craft transfer effects negative contract');
          const anchor="assert.doesNotMatch(styles,/craft-tank-actions|tank-charge-stage|charge-stage-(?:in|out)/,'Legacy manual tank-charge CSS stays removed');";
          const additions=`${anchor}\nassert.doesNotMatch(index,/id=\"(?:tank-use-guide|tank-replacement|tank-affordability|loaded-combustion-summary)\"/,'Inactive loadout guidance placeholders stay removed');\nassert.doesNotMatch(styles,/\\.model-toolbar\\b|\\.model-zoom\\b/,'Removed collection model toolbar CSS stays removed');\nassert.doesNotMatch(veilCss,/#supply-dialog \\.tank-affordability\\b|\\.tank-model #tank-model-host \\.model-toolbar\\b|\\.tank-replacement\\b|#tank-use-guide\\b/,'Removed loadout placeholder selectors stay removed');`;
          contracts=replaceOnce(contracts,anchor,additions,'LC-06A negative contracts anchor');
          write('tests/source-contracts.test.mjs',contracts);
          NODE
      - name: Rebuild generated PWA closure
        run: node scripts/build-precache.mjs
      - name: Install transient DOM test dependency
        run: npm install --prefix /tmp/lc06a --no-save jsdom@26.1.0
      - name: Run focused regressions
        run: |
          node tests/source-contracts.test.mjs
          node tests/craft-controls-ui.test.mjs
          node tests/craft-connections.test.mjs
          node tests/supply-tanks.test.mjs
          node tests/loadout-preview.test.mjs
          node tests/loadout-workstation.test.mjs
          node tests/launch-transition.test.mjs
          node tests/issue-122-launch-route.test.mjs
          node tests/veil-playthrough.test.mjs
          node tests/veil-ui-check.mjs /tmp/lc06a/node_modules/jsdom/lib/api.js
          node tests/mobile-ui-check.mjs /tmp/lc06a/node_modules/jsdom/lib/api.js
          node tests/pwa.test.mjs
      - name: Remove temporary workflow and run hygiene checks
        run: |
          rm .github/workflows/lc-06a-branch-validation.yml
          node tests/repository-hygiene.test.mjs
          git diff --check
          test ! -e src/craft-transfer-effects.js
          ! grep -Eq 'id="(tank-use-guide|tank-replacement|tank-affordability|loaded-combustion-summary)"' index.html
          ! grep -Eq '\.model-toolbar|\.model-zoom' styles.css
          ! grep -Eq '#supply-dialog \.tank-affordability|\.tank-model #tank-model-host \.model-toolbar|\.tank-replacement|#tank-use-guide' veil.css
          ! grep -q 'src/craft-transfer-effects.js' precache-manifest.js
      - name: Commit validated cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Legacy Cleanup LC-06A: remove production orphans"
          git push origin HEAD:legacy-cleanup-lc-06a
