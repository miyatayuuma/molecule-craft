name: Apply LOADOUT transfer task

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'work/loadout-element-transfer-visualization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply implementation
        run: python3 scripts/apply-loadout-transfer-task.py
      - name: Fix browser animation sampling harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/loadout-transfer-browser.test.mjs')
          text=path.read_text()
          old="  await evaluate(`window.__loadoutTransfer.promise=window.__loadoutTransfer.mod.animateLoadoutElementTransfer({cost:{H:8,O:2},root:document,reduced:false})`);await pause(55);"
          new="  await evaluate(`(()=>{window.__loadoutTransfer.promise=window.__loadoutTransfer.mod.animateLoadoutElementTransfer({cost:{H:8,O:2},root:document,reduced:false});return true;})()`);await pause(55);"
          if old not in text: raise SystemExit('browser sampling harness pattern not found')
          path.write_text(text.replace(old,new))
          PY
      - name: Regenerate PWA outputs
        run: node scripts/build-precache.mjs
      - name: LOADOUT focused tests
        run: |
          node tests/loadout-workstation.test.mjs
          node tests/launch-transaction.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/loadout-transfer-browser.test.mjs
      - name: Repository and PWA validation
        run: |
          node scripts/check-repository-hygiene.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Remove one-shot tooling and commit
        run: |
          rm .github/workflows/apply-loadout-transfer-task.yml scripts/apply-loadout-transfer-task.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish LOADOUT synthesis transfer visualization"
          git push origin HEAD:${{ github.head_ref }}
