name: verify-cleanup-head
on:
  push:
    branches: [cleanup/legacy-ui]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          test ! -e .github/workflows/audit-legacy-ui.yml
          test ! -e .github/workflows/audit-legacy-ui-trigger.yml
          test ! -e .github/workflows/apply-legacy-ui-cleanup.yml
          node --check src/veil/ui.js
          node --check tests/veil-ui-check.mjs
          node --check tests/oxygen-routes-browser-check.mjs
          node tests/source-contracts.test.mjs
          npm install --prefix /tmp/mc-jsdom jsdom@26 >/dev/null
          node tests/mobile-ui-check.mjs /tmp/mc-jsdom/node_modules/jsdom/lib/api.js
          node tests/pwa.test.mjs
          node scripts/check-repository-hygiene.mjs
