name: Refresh FIELD proposal artifact

on:
  push:
    branches:
      - field/nitrogen-v2-core-awakening

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate proposal and PWA
        run: |
          node scripts/export-field-expansion-proposal.mjs
          node tests/field-expansion-proposal.test.mjs
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maps/field-expansion-proposal.svg precache-manifest.js sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh FIELD proposal generated artifact"
          git push
