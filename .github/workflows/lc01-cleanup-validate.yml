name: LC-01 cleanup validation

on:
  push:
    branches:
      - legacy-cleanup/lc-01-manual-tank-charge

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legacy-cleanup/lc-01-manual-tank-charge
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove legacy manual tank-charge path
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,unlinkSync,existsSync,readdirSync,statSync} from 'node:fs';
          import {join} from 'node:path';

          const read=path=>readFileSync(path,'utf8');
          const write=(path,text)=>writeFileSync(path,text);
          const replaceOnce=(path,from,to)=>{
            const text=read(path);
            if(!text.includes(from))throw new Error(`Expected text missing in ${path}: ${from.slice(0,100)}`);
            write(path,text.replace(from,to));
          };
          const replaceRegex=(path,pattern,to)=>{
            const text=read(path);
            if(!pattern.test(text))throw new Error(`Expected pattern missing in ${path}: ${pattern}`);
            pattern.lastIndex=0;
            write(path,text.replace(pattern,to));
          };
          const walk=dir=>readdirSync(dir).flatMap(name=>{const path=join(dir,name);return statSync(path).isDirectory()?walk(path):[path];});
          const refs=(term,roots)=>roots.flatMap(root=>existsSync(root)?(statSync(root).isDirectory()?walk(root):[root]):[]).filter(path=>{try{return read(path).includes(term);}catch{return false;}});
          for(const term of ['tank-charge','craft-tank-actions','tank-charge-stage','chargeFromStock'])console.log(`before ${term}:`,refs(term,['src','tests','index.html','styles.css','docs/architecture.md','precache-manifest.js']).join(', ')||'(none)');

          replaceOnce('index.html',`        <div id="craft-tank-actions" class="craft-tank-actions" aria-label="完成分子のタンク操作" hidden></div>\n        <div id="tank-charge-stage" class="tank-charge-stage" role="status" aria-live="polite" hidden><canvas aria-hidden="true"></canvas><div><span id="tank-charge-icon" aria-hidden="true"></span><strong id="tank-charge-label"></strong><small id="tank-charge-result"></small></div></div>\n`,``);

          replaceOnce('src/craft-panel.js',`    tankActions:document.querySelector('#craft-tank-actions'),chargeStage:document.querySelector('#tank-charge-stage'),`,``);
          replaceOnce('src/craft-panel.js',`  let tankActionKey='',tankControls=[],clearTarget=()=>{},lastTargetKey='',lastTargetFilled={};`,`  let clearTarget=()=>{},lastTargetKey='',lastTargetFilled={};`);
          replaceRegex('src/craft-panel.js',/\n  function renderTankActions\(\)\{\n[\s\S]*?\n  \}\n\n/,`\n`);
          replaceOnce('src/craft-panel.js',`    renderTankActions(focus,veilUI);\n`,``);

          replaceRegex('src/craft-transfer-effects.js',/\n  function chargeFromStock\(record,to\)\{\n[\s\S]*?\n  \}\n/,`\n`);
          replaceOnce('src/craft-transfer-effects.js',`    const charging=root.querySelector?.('#tank-charge-stage'),part=pendingPart&&pendingPart.expires>=now()?pendingPart:null;\n    const suppressDepletion=!!part||!!(charging&&!charging.hidden);`,`    const part=pendingPart&&pendingPart.expires>=now()?pendingPart:null;\n    const suppressDepletion=!!part;`);
          replaceOnce('src/craft-transfer-effects.js',`  return{atomFromStock,atomToStock,chargeFromStock,partFromPalette,cancelAll,_activeCount:()=>active.size};`,`  return{atomFromStock,atomToStock,partFromPalette,cancelAll,_activeCount:()=>active.size};`);

          replaceOnce('src/game-shell.js',`    '#molecule-iupac','#tank-next-hint','.tank-explanation','#tank-affordability','#tank-charge-result','#oxygen-route-guide',`,`    '#molecule-iupac','#tank-next-hint','.tank-explanation','#tank-affordability','#oxygen-route-guide',`);

          let css=read('styles.css');
          const oldCss=css;
          css=css.replace(/\.craft-tank-actions[^\{]*\{[^{}]*\}/g,'');
          css=css.replace(/\.tank-charge-stage[^\{]*\{[^{}]*\}/g,'');
          css=css.replace(/@keyframes charge-stage-in\{from\{[^{}]*\}to\{[^{}]*\}\}/g,'');
          css=css.replace(/@keyframes charge-stage-out\{to\{[^{}]*\}\}/g,'');
          css=css.replace(/@media\(prefers-reduced-motion:reduce\)\{\}/g,'');
          if(css===oldCss)throw new Error('Legacy tank-charge CSS was not found');
          write('styles.css',css);

          replaceOnce('docs/architecture.md',`- \`src/tank-charge.js\`：固定時間の長押し充填、途中確定、入替廃棄の演出とキャンセル制御。\n`,``);
          replaceOnce('docs/architecture.md',`| タンク内容・直接充填・旧在庫移行・恒久強化 | \`src/veil/resources.js\`, \`tank-upgrades.js\` |`,`| タンク内容・ロードアウト自動錬成・旧在庫移行・恒久強化 | \`src/veil/resources.js\`, \`src/veil/supply.js\`, \`tank-upgrades.js\` |`);
          replaceOnce('docs/architecture.md',`| 分子名・式・選択情報・構造一覧・完成表示・対応タンク操作 | \`src/craft-panel.js\` |`,`| 分子名・式・選択情報・構造一覧・完成表示 | \`src/craft-panel.js\` |`);

          replaceOnce('tests/source-contracts.test.mjs',`const pubchemReference=await readFile(new URL('src/pubchem-reference.js',root),'utf8');`,`const pubchemReference=await readFile(new URL('src/pubchem-reference.js',root),'utf8');\nconst craftTransferEffects=await readFile(new URL('src/craft-transfer-effects.js',root),'utf8');\nconst styles=await readFile(new URL('styles.css',root),'utf8');`);
          replaceOnce('tests/source-contracts.test.mjs',`assert.match(index, /id="craft-tank-actions"/);`,`assert.doesNotMatch(index,/id="craft-tank-actions"|id="tank-charge-stage"/,'Legacy manual tank-charge DOM stays removed');\nassert.doesNotMatch(craftPanel,/craft-tank-actions|tank-charge-stage|tankActionKey|tankControls|renderTankActions/,'Craft panel no longer carries manual tank-charge state');\nassert.doesNotMatch(craftTransferEffects,/chargeFromStock|tank-charge-stage/,'Transfer effects no longer special-case manual tank charging');\nassert.doesNotMatch(styles,/craft-tank-actions|tank-charge-stage|charge-stage-(?:in|out)/,'Legacy manual tank-charge CSS stays removed');\nawait assert.rejects(readFile(new URL('src/tank-charge.js',root),'utf8'),error=>error?.code==='ENOENT','Legacy tank-charge runtime module stays deleted');`);

          replaceOnce('tests/veil-ui-check.mjs',`assert.equal(q('craft-tank-actions').hidden,true,'Discovered molecules no longer expose repeat-fill craft actions');assert.equal(q('craft-tank-actions').querySelector('[data-tank-use="propellant"]'),null);`,`assert.equal(q('craft-tank-actions'),null,'Legacy manual tank-charge actions stay removed');`);
          replaceOnce('tests/veil-ui-check.mjs',`assert.equal(q('craft-tank-actions').hidden,true);assert.equal(q('craft-tank-actions').querySelector('[data-tank-use="fuel"]'),null);`,`assert.equal(q('craft-tank-actions'),null);`);
          replaceOnce('tests/veil-ui-check.mjs',`assert.equal(q('craft-tank-actions').hidden,true);`,`assert.equal(q('craft-tank-actions'),null);`);

          for(const path of ['src/tank-charge.js','tests/tank-charge.test.mjs']){
            if(!existsSync(path))throw new Error(`Expected legacy file missing before cleanup: ${path}`);
            unlinkSync(path);
          }

          for(const term of ['tank-charge','craft-tank-actions','tank-charge-stage','chargeFromStock']){
            const runtime=refs(term,['src','index.html','styles.css']);
            if(runtime.length)throw new Error(`Legacy runtime ref remains for ${term}: ${runtime.join(', ')}`);
          }
          if(read('docs/architecture.md').includes('src/tank-charge.js'))throw new Error('Architecture still names removed tank-charge module');
          console.log('Legacy runtime references removed.');
          NODE
      - name: Run LOADOUT, supply, exploration, and craft regressions
        run: |
          node tests/source-contracts.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/supply-production.test.mjs
          node tests/supply-tanks.test.mjs
          node tests/issue-113-regression.test.mjs
          node tests/issue-122-launch-route.test.mjs
          node tests/expedition-core.test.mjs
          node tests/veil-playthrough.test.mjs
          node tests/craft-controls-ui.test.mjs
          node tests/craft-workspace.test.mjs
          npm install --no-save --package-lock=false jsdom@26
          node tests/veil-ui-check.mjs "$(node -p "require.resolve('jsdom')")"
      - name: Rebuild and verify PWA release
        run: |
          node scripts/build-precache.mjs
          node tests/pwa.test.mjs
      - name: Repository hygiene
        run: |
          node scripts/check-repository-hygiene.mjs
          node tests/repository-hygiene.test.mjs
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/lc01-cleanup-validate.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No cleanup changes produced"; exit 1; }
          git commit -m "Remove legacy manual tank charge"
          git push origin HEAD:legacy-cleanup/lc-01-manual-tank-charge
