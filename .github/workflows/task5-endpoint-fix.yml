name: Task 5 endpoint verification

on:
  pull_request:

permissions:
  contents: write

jobs:
  endpoint-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Preserve Deep sampled route endpoints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('src/veil/universe.js')
          text=source.read_text()
          old="const geometry=id===OXYGEN_VORTEX.id?OXYGEN_VORTEX_ROUTE:null,points=geometry?.points??sampleLine(knots,profile.spacing);"
          new="const geometry=id===OXYGEN_VORTEX.id?OXYGEN_VORTEX_ROUTE:null;\n    let points=geometry?.points??sampleLine(knots,profile.spacing);\n    if(deep&&!geometry){\n      const [endX,endY]=knots.at(-1),last=points.at(-1);\n      if(!last||Math.hypot(last.x-endX,last.y-endY)>.001)points=[...points,{x:endX,y:endY,angle:last?Math.atan2(endY-last.y,endX-last.x):-Math.PI/2}];\n    }"
          if old not in text: raise SystemExit('universe sampling target not found')
          source.write_text(text.replace(old,new))
          test=Path('tests/field-map-export.test.mjs')
          text=test.read_text().replace("distanceToRoute([120,-10800])<45", "distanceToRoute([120,-10800])<1").replace("distanceToRoute([100,-11830])<45", "distanceToRoute([100,-11830])<1")
          test.write_text(text)
          PY
      - name: Verify endpoint fix and regressions
        run: |
          node tests/field-map-export.test.mjs
          node tests/deep-oxygen-routes.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/expedition-core.test.mjs
          node scripts/export-field-expansion-proposal.mjs --check
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          git diff --check
          git diff --check origin/main...HEAD
      - name: Commit verified endpoint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veil/universe.js tests/field-map-export.test.mjs docs/maps/current-field.svg precache-manifest.js sw.js
          git commit -m "Preserve Deep route convergence endpoint"
          git push origin HEAD:${{ github.head_ref }}
