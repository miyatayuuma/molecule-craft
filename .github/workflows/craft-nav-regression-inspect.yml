name: CRAFT navigation regression inspect

on:
  push:
    branches: [fix/craft-navigation-regression]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          npm install --prefix /tmp/craft-browser playwright@1.55.0
          /tmp/craft-browser/node_modules/.bin/playwright install chromium
      - run: |
          python3 -m http.server 4173 >/tmp/craft-http.log 2>&1 &
          cat >/tmp/inspect.mjs <<'EOF'
          import {chromium} from '/tmp/craft-browser/node_modules/playwright/index.mjs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(2500);
          const rows=await page.evaluate(()=>[...document.querySelectorAll('button,a')].map((n,i)=>{const r=n.getBoundingClientRect(),s=getComputedStyle(n);return {i,tag:n.tagName,id:n.id,cls:n.className,text:n.textContent.trim(),aria:n.getAttribute('aria-label'),title:n.getAttribute('title'),hidden:n.hidden,display:s.display,visibility:s.visibility,rect:[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)],parent:n.parentElement?.className??n.parentElement?.id??''};}).filter(x=>x.display!=='none'&&x.visibility!=='hidden'&&x.rect[2]>0&&x.rect[3]>0));
          console.log(JSON.stringify(rows,null,2));
          await page.screenshot({path:'/tmp/craft.png',fullPage:true});
          await browser.close();
          EOF
          node /tmp/inspect.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: craft-nav-screenshot
          path: /tmp/craft.png
