name: Task 7 finalize generated artifacts

on:
  push:
    branches:
      - task7-hc-revisit-recovery

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: task7-hc-revisit-recovery
          fetch-depth: 0
      - name: Regenerate canonical FIELD and PWA artifacts
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: Commit generated artifacts if changed
        run: |
          if ! git diff --quiet -- docs/maps/current-field.svg precache-manifest.js sw.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/maps/current-field.svg precache-manifest.js sw.js
            git commit -m "FIELD Task 7: regenerate FIELD map and PWA artifacts"
            git push origin HEAD:task7-hc-revisit-recovery
          fi
