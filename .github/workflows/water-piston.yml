name: Water piston touch acceptance
on:
  pull_request:
    paths:
      - 'src/water-*.js'
      - 'src/collection-ui.js'
      - 'tests/water-piston-browser.py'
      - '.github/workflows/water-piston.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: pip install playwright==1.56.0
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: node --test tests/water-phase.test.mjs
      - run: python tests/water-piston-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-piston-screens
          path: shots/*.png
