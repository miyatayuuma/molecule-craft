name: Water piston touch acceptance
on:
  pull_request:
    paths:
      - 'src/water-*.js'
      - 'src/phase-*.js'
      - 'src/collection-ui.js'
      - 'tests/water-piston-browser.py'
      - 'tests/water-phase.test.mjs'
      - '.github/workflows/water-piston.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: pip install playwright==1.56.0
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: node --test tests/water-phase.test.mjs
      - run: python tests/water-piston-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-piston-screens
          path: shots/*.png
  phase-chambers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - run: pip install playwright==1.56.0
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Phone acceptance and performance
        env:
          PHASE_MOTION: shots/motion
        run: |
          PISTON_SUBSTANCE=carbon-dioxide python tests/water-piston-browser.py
          PISTON_SUBSTANCE=ethanol python tests/water-piston-browser.py
          for sample in co2 ethanol; do
            ffmpeg -hide_banner -loglevel error -framerate 6 -i "shots/motion/$sample/%04d.png" -c:v libx264 -pix_fmt yuv420p "shots/$sample.mp4"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-chamber-motion
          path: |
            shots/*.png
            shots/*.mp4
  comparison:
    if: startsWith(github.head_ref, 'work/water-piston-')
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - run: pip install playwright==1.56.0 pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Compare motion on the same mobile viewport
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/water-base" "$BASE_SHA"
          comparison="$PWD/tests/water-piston-browser.py"
          mkdir -p "$PWD/shots/motion"
          output="$PWD/shots/motion"
          (cd "$RUNNER_TEMP/water-base" && WATER_COMPARISON="$output/Base" python "$comparison")
          WATER_COMPARISON="$output/Updated" python "$comparison"
          PISTON_SUBSTANCE=methane WATER_COMPARISON="$output/Methane" python "$comparison"
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          root=Path('shots/motion')
          frames=[]
          for phase in ['liquid','freeze','melt']:
              for a in sorted((root/'Base').glob(f'{phase}-*.png')):
                  pair=Image.new('RGB',(780,459),'#153438')
                  draw=ImageDraw.Draw(pair)
                  for x,version in [(0,'Base'),(390,'Updated')]:
                      shot=Image.open(root/version/a.name)
                      pair.paste(shot.crop((0,410,390,844)),(x,25))
                      draw.text((x+12,5),f'{version}   {phase}',fill='white')
                  frames.append(pair)
          frames[29].save('shots/water-comparison.png')
          frames[0].save('shots/water-comparison.webp',save_all=True,append_images=frames[1:],duration=200,loop=0,lossless=True)
          methane=root/'Methane'
          shots=[Image.open(p).convert('RGB') for sequence in ['liquid','freeze','melt','gas'] for p in sorted(methane.glob(sequence+'-*.png'))]
          shots[0].save('shots/methane.webp',save_all=True,append_images=shots[1:],duration=200,loop=0,lossless=True)
          panel=Image.new('RGB',(1170,844))
          for i,k in enumerate([39,19,79]):panel.paste(shots[k],(390*i,0))
          panel.save('shots/methane.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: water-motion-comparison
          path: |
            shots/water-comparison.*
            shots/methane.*
            shots/motion/Methane/coexistence.png
