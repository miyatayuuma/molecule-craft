name: Task Oxygen thermal artifacts

on:
  push:
    branches: [field/oxygen-thermal-belt]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate FIELD map and PWA outputs
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: Commit generated outputs
        shell: bash
        run: |
          if git diff --quiet -- docs/maps/current-field.svg sw.js precache-manifest.js; then
            echo "Generated outputs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maps/current-field.svg sw.js precache-manifest.js
          git commit -m "Regenerate Oxygen thermal FIELD artifacts"
          git push
