          replace('src/veil/oxygen-routes.js',"import {createVortexFlybyRoute,routeFlowAt} from './route-kit.js';", "import {createVortexFlybyRoute,routeFlowAt} from './route-kit.js';\nimport {appendHazard,defineHazard,hazardSample,HAZARD_TYPES,organicCorridorInfluence} from './hazards.js';")
