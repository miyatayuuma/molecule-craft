          replace('src/veil/map.js',"import { VEIL } from './config.js';", "import { VEIL } from './config.js';\nimport {defineHazard,HAZARD_TYPES} from './hazards.js';")
          replace('src/veil/map.js',"current:Object.freeze({width:180,force:90}),", "current:Object.freeze({width:180,force:90,hazard:defineHazard('hydrogen-revisit-current',HAZARD_TYPES.MECHANICAL,'turbulence',{source:'route-current'})}),")
          replace('src/veil/map.js',"currents.push({id:'hydrogen-revisit-current',route:revisit,width:HYDROGEN_REVISIT_ROUTE.current.width,force:HYDROGEN_REVISIT_ROUTE.current.force,speed:-HYDROGEN_REVISIT_ROUTE.current.force});", "currents.push({id:'hydrogen-revisit-current',route:revisit,width:HYDROGEN_REVISIT_ROUTE.current.width,force:HYDROGEN_REVISIT_ROUTE.current.force,speed:-HYDROGEN_REVISIT_ROUTE.current.force,hazard:HYDROGEN_REVISIT_ROUTE.current.hazard});")
          replace('src/veil/map.js',"return {seed,routes,dust,depletion,currents,capabilities:{combustionDrive:revisitUnlocked},fields:[{x:470+(rng()-.5)*80,y:-1700+(rng()-.5)*100,radius:VEIL.fieldRadius,phase:rng()*4,angle:.15}],labels};", "return {seed,routes,dust,depletion,currents,capabilities:{combustionDrive:revisitUnlocked},fields:[{id:'veil-ambient-flow',x:470+(rng()-.5)*80,y:-1700+(rng()-.5)*100,radius:VEIL.fieldRadius,phase:rng()*4,angle:.15,kind:'ambient-turbulence',hazard:defineHazard('veil-ambient-flow',HAZARD_TYPES.MECHANICAL,'turbulence',{source:'map.fields'})}],labels};")

          # expedition-challenges.js: one seeded organic envelope shared by gameplay and visuals.
          replace('src/veil/expedition-challenges.js',"import {OXYGEN_VORTEX_ROUTE} from './oxygen-routes.js';", "import {OXYGEN_VORTEX_ROUTE} from './oxygen-routes.js';\nimport {appendHazard,defineHazard,HAZARD_TYPES,organicCorridorInfluence,organicCorridorProfile,softExtentInfluence} from './hazards.js';")
          replace('src/veil/expedition-challenges.js',"export const EXPEDITION_CHALLENGES=Object.freeze([", "const CHALLENGE_HAZARDS=Object.freeze({\n  pulse:Object.freeze({pressure:defineHazard('challenge-pulse-pressure',HAZARD_TYPES.MECHANICAL,'pressure',{source:'expedition-challenge'})}),\n  curve:Object.freeze({pressure:defineHazard('challenge-curve-pressure',HAZARD_TYPES.MECHANICAL,'pressure',{source:'expedition-challenge'}),shear:defineHazard('challenge-curve-shear',HAZARD_TYPES.MECHANICAL,'shear',{source:'expedition-challenge'})}),\n  thermal:Object.freeze({pressure:defineHazard('challenge-thermal-pressure',HAZARD_TYPES.MECHANICAL,'pressure',{source:'expedition-challenge'}),thermal:defineHazard('challenge-thermal-heat',HAZARD_TYPES.THERMAL,'hot-zone',{source:'expedition-challenge'})}),\n});\nexport const EXPEDITION_CHALLENGES=Object.freeze([")
          replace_between('src/veil/expedition-challenges.js',"export const challengeCenter=", "export function recordChallengePassage", """export const challengeCenter=(zone,y)=>zone.id==='curve'?zone.centerX+170*Math.sin((y-zone.bottom)/500*Math.PI):zone.centerX;
export const challengeWidthAt=(zone,y)=>{
  if(zone.id!=='curve')return zone.width;
  const taperStart=zone.top+200;
  if(y>=taperStart)return zone.width;
  const t=Math.max(0,Math.min(1,(taperStart-y)/(taperStart-zone.top)));
  return zone.width+(100-zone.width)*t;
};
export function challengeProfileAt(zone,y,seed=1){
  return organicCorridorProfile(seed,`challenge:${zone.id}`,y,challengeCenter(zone,y),challengeWidthAt(zone,y),{centerJitter:0,widthJitter:.09,scale:175});
}
export function challengeInfluenceAt(zone,p,seed=1){
  if(!zone||!Number.isFinite(p?.x)||!Number.isFinite(p?.y))return {center:zone?.centerX??0,halfWidth:zone?.width??1,nominalHalfWidth:zone?.width??1,lateral:0,longitudinal:0,intensity:0};
  return organicCorridorInfluence({seed,id:`challenge:${zone.id}`,x:p.x,y:p.y,centerX:challengeCenter(zone,p.y),centerY:(zone.top+zone.bottom)/2,halfWidth:challengeWidthAt(zone,p.y),halfLength:(zone.bottom-zone.top)/2,edgeFade:36,centerJitter:0,widthJitter:.09,scale:175});
}
export function challengeEnvironment(p,time,seed=1){
  let match=null;
  for(const zone of EXPEDITION_CHALLENGES){const envelope=challengeInfluenceAt(zone,p,seed);if(envelope.intensity>1e-5&&(!match||envelope.intensity>match.envelope.intensity))match={zone,envelope};}
  if(!match)return null;
  const z=match.zone,strength=match.envelope.intensity,pulse=(1+Math.sin(time*2*Math.PI/2.4))/2,pressureBase=z.id==='pulse'?130+280*pulse:z.id==='curve'?330:280,pressure=pressureBase*strength,flowX=z.id==='curve'?Math.cos((p.y-z.bottom)/500*Math.PI)*-65*strength:0,heat=z.id==='thermal'?48*strength:0,hazards=[],defs=CHALLENGE_HAZARDS[z.id];
  appendHazard(hazards,defs.pressure,pressure/600,{severity:pressure,vector:{x:0,y:pressure}});
  if(defs.shear)appendHazard(hazards,defs.shear,Math.abs(flowX)/65,{severity:Math.abs(flowX),vector:{x:flowX,y:0}});
  if(defs.thermal)appendHazard(hazards,defs.thermal,heat/48,{severity:heat,heat});
