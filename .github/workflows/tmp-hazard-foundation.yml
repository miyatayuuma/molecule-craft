  if(!route||!gate||!Number.isFinite(p?.x)||!Number.isFinite(p?.y))return {center:route?.x??0,halfWidth:(route?.width??1)/2,nominalHalfWidth:(route?.width??1)/2,lateral:0,longitudinal:0,intensity:0};
