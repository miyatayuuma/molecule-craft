name: Hazard foundation implementation

on:
  push:
    branches:
      - field/hazard-taxonomy-organic-boundary

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Recover and apply implementation patch
        run: |
          git show 0abac6a45603cbcab08c9dff69c21993d603804e:.github/workflows/tmp-hazard-foundation.yml \
            | sed -n "/python - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/apply-hazard-foundation.py
          python -c "from pathlib import Path; p=Path('/tmp/apply-hazard-foundation.py'); s=p.read_text(); s=s.replace(\"replace('src/veil/renderer.js',old_visual,new_visual)\", \"replace('src/veil/renderer.js',old_visual.replace('\\\\n','\\\\n          '),new_visual.replace('\\\\n','\\\\n          '))\"); p.write_text(s)"
          python /tmp/apply-hazard-foundation.py
          python -c "from pathlib import Path; p=Path('tests/field-hazard-taxonomy.test.mjs'); s=p.read_text(); old=\"const curve=EXPEDITION_CHALLENGES.find(item=>item.id==='curve'),curvePoint={x:challengeCenter(curve,curve.centerY),y:curve.centerY};\"; new=\"const curve=EXPEDITION_CHALLENGES.find(item=>item.id==='curve'),curveY=curve.bottom-125,curvePoint={x:challengeCenter(curve,curveY),y:curveY};\"; assert old in s; p.write_text(s.replace(old,new,1))"
          python -c "from pathlib import Path; p=Path('tests/field-map-export.test.mjs'); s=p.read_text(); s=s.replace('layer-hazards-dust-eater','layer-agents-dust-eater').replace('dynamic pursuit hazard \\\\/ no authored map position','dynamic pursuit agent \\\\/ no authored map position'); p.write_text(s)"
      - name: Regenerate FIELD developer map
        run: node scripts/export-field-map.mjs
      - name: Hazard taxonomy
        run: node tests/field-hazard-taxonomy.test.mjs
      - name: Expedition challenges
        run: node tests/expedition-challenges.test.mjs
      - name: Oxygen routes
        run: node tests/oxygen-routes.test.mjs
      - name: Oxygen FIELD integration
        run: node tests/oxygen-field-integration.test.mjs
      - name: Oxygen thermal progression
        run: node tests/oxygen-thermal-progression.test.mjs
      - name: Thermal coolant
        run: node tests/thermal-coolant.test.mjs
      - name: H C revisit routes
        run: node tests/hc-revisit-routes.test.mjs
      - name: CHO FIELD polish
        run: node tests/cho-field-polish.test.mjs
      - name: Nitrogen completion
        run: node tests/nitrogen-chapter-completion.test.mjs
      - name: Rare Survey
        run: node tests/rare-survey.test.mjs
      - name: FIELD map contract test
        run: node tests/field-map-export.test.mjs
      - name: FIELD map generated check
        run: node scripts/export-field-map.mjs --check
      - name: Refresh PWA artifacts
        run: node scripts/build-precache.mjs
      - name: Verify generated artifacts
        run: |
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veil/hazards.js src/veil/map.js src/veil/universe.js src/veil/expedition-challenges.js src/veil/oxygen-routes.js src/veil/nitrogen-routes.js src/veil/engine.js src/veil/renderer.js scripts/export-field-map.mjs docs/field-hazard-authority.md docs/maps/current-field.svg tests/field-hazard-taxonomy.test.mjs tests/field-map-export.test.mjs .github/workflows/repository-validation.yml sw.js precache-manifest.js
          git commit -m "Add FIELD hazard taxonomy and organic boundaries"
          git push
