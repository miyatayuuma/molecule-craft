name: Temporary category preview validation
on:
  push:
    branches: [refactor/category-specific-equipment-preview]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Equipment UX tests
        run: node --test tests/equipment-ux.test.mjs
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: Regenerate offline release
        run: node scripts/build-precache.mjs
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Commit generated release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate offline release for category previews"
            git push
          fi
