name: audit-legacy-ui
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit legacy UI references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== known legacy markers ==='
          rg -n "cho-completion|cho-continue|collector-shell\.png|supply-footer|expedition-anchor|launch-veil|legacyFooter|game-loop-hint|craft-resource-hint|craft-last-run" index.html src styles.css veil.css tests || true
          echo '=== HTML ids with no src/test references ==='
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('index.html').read_text()
          ids=sorted(set(re.findall(r'\bid="([^"]+)"',html)))
          texts=[]
          for root in ['src','tests']:
              for p in pathlib.Path(root).rglob('*'):
                  if p.is_file() and p.suffix in {'.js','.mjs','.css','.html'}:
                      try:texts.append((str(p),p.read_text()))
                      except UnicodeDecodeError:pass
          for name in ['styles.css','veil.css']:
              p=pathlib.Path(name)
              texts.append((name,p.read_text()))
          for id_ in ids:
              hits=[p for p,t in texts if id_ in t]
              if not hits:
                  print(id_)
          PY
# audit trigger
