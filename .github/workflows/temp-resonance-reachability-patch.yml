name: Temporary resonance reachability patch
on:
  push:
    branches:
      - fix/nitro-ozone-craft-resonance-reachability
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch CRAFT resonance reachability
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              actual=s.count(old)
              assert actual==count, f'{path}: expected {count} occurrences, found {actual}: {old[:100]!r}'
              p.write_text(s.replace(old,new,count))

          # Repair the preceding direct edit typo and keep supported resonance sites out of generic valence expansion.
          p=Path('src/bonding-model.js'); s=p.read_text()
          s=s.replace("return Math.max(2, Math.min(7, Math.round(energy / 165));", "return Math.max(2, Math.min(7, Math.round(energy / 165)));", 1)
          p.write_text(s)

          replace('src/app.js', "from './bonding-model.js?v=31';", "from './bonding-model.js?v=32';")
          replace('src/app.js',
          "  const state=stateFor(atom.id),singles=state.sites.length,dirs=freeDirections(atom.id),shell=valenceShellRadius(atom.element,cfg.radius*1.02),lonePairs=[];\n  for(let index=0;index<Math.min(singles,dirs.length);index++)renderUnpairedElectron(atom.id,index,dirs[index],shell,state.sites[index]);",
          "  const state=stateFor(atom.id),singles=state.sites.length,dirs=freeDirections(atom.id),shell=valenceShellRadius(atom.element,cfg.radius*1.02),lonePairs=[];\n  for(let index=0;index<singles;index++){\n    const rawSite=state.sites[index],kind=typeof rawSite==='string'?rawSite:(rawSite?.kind??'electron'),partnerId=typeof rawSite==='object'?rawSite?.partnerId??null:null;\n    const direction=kind==='resonance'&&partnerId!=null?pos(partnerId)?.clone().sub(pos(atom.id)).normalize():dirs[index];\n    if(direction)renderUnpairedElectron(atom.id,index,direction,shell,kind,partnerId);\n  }")
          replace('src/app.js', "function renderUnpairedElectron(atomId,index,dir,shell,kind='electron'){", "function renderUnpairedElectron(atomId,index,dir,shell,kind='electron',partnerId=null){")
          replace('src/app.js',
          "  for(const object of[visible,hit]){object.userData.electronAtomId=atomId;object.userData.electronIndex=index;moleculeGroup.add(object);}",
          "  for(const object of[visible,hit]){object.userData.electronAtomId=atomId;object.userData.electronIndex=index;object.userData.electronKind=kind;object.userData.electronPartnerId=partnerId;moleculeGroup.add(object);}")
          replace('src/app.js',
          "  electronVisuals.push({atomId,index,kind,dir:dir.clone(),shell,visible,hit,phase:(atomId*1.71+index*2.37)%6.28});",
          "  electronVisuals.push({atomId,index,kind,partnerId,dir:dir.clone(),shell,visible,hit,phase:(atomId*1.71+index*2.37)%6.28});")
          replace('src/app.js',
          "function electronHomePosition(atomId,index,now){\n  const atom=atomById(atomId),p=pos(atomId);if(!atom||!p)return new THREE.Vector3();const cfg=ELEMENTS[atom.element],dirs=freeDirections(atomId),dir=dirs[index]??dirs[0]??new THREE.Vector3(1,0,0),shell=valenceShellRadius(atom.element,cfg.radius*1.02),base=dir.clone().normalize(),t1=perpendicular(base),t2=new THREE.Vector3().crossVectors(base,t1).normalize(),phase=(atomId*1.71+index*2.37)%6.28,a=.13*shell,s=now*.0021+phase;",
          "function electronHomePosition(atomId,index,now){\n  const atom=atomById(atomId),p=pos(atomId);if(!atom||!p)return new THREE.Vector3();const cfg=ELEMENTS[atom.element],dirs=freeDirections(atomId),visual=electronVisuals.find(item=>item.atomId===atomId&&item.index===index),dir=visual?.dir??dirs[index]??dirs[0]??new THREE.Vector3(1,0,0),shell=valenceShellRadius(atom.element,cfg.radius*1.02),base=dir.clone().normalize(),t1=perpendicular(base),t2=new THREE.Vector3().crossVectors(base,t1).normalize(),phase=(atomId*1.71+index*2.37)%6.28,a=.13*shell,s=now*.0021+phase;")
          replace('src/app.js',
          "function findNearestCompatibleElectron(clientX,clientY,sourceAtomId,sourceIndex){\n  let best=null;for(const ev of electronVisuals){\n    if(ev.atomId===sourceAtomId||!canPairAtoms(sourceAtomId,ev.atomId))continue;",
          "function findNearestCompatibleElectron(clientX,clientY,sourceAtomId,sourceIndex){\n  let best=null;for(const ev of electronVisuals){\n    if(ev.atomId===sourceAtomId||!electronSitesCompatible(sourceAtomId,sourceIndex,ev))continue;")
          replace('src/app.js',
          "function canPairAtoms(a,b){return bondAddition(molecule,a,b).allowed;}",
          "function canPairAtoms(a,b){return bondAddition(molecule,a,b).allowed;}\nfunction electronSitesCompatible(sourceAtomId,sourceIndex,target){\n  const source=electronVisuals.find(item=>item.atomId===sourceAtomId&&item.index===sourceIndex);\n  if(source?.kind==='resonance'&&source.partnerId!==target.atomId)return false;\n  if(target?.kind==='resonance'&&target.partnerId!==sourceAtomId)return false;\n  return canPairAtoms(sourceAtomId,target.atomId);\n}")
          replace('src/app.js',
          "    const compatible=dragState?.mode==='electron'&&!dragged&&canPairAtoms(dragState.atomId,ev.atomId);",
          "    const compatible=dragState?.mode==='electron'&&!dragged&&electronSitesCompatible(dragState.atomId,dragState.index,ev);")
          replace('src/app.js',
          "message:addition.kind==='pair'?'電子対を共有しています':addition.kind==='extension'?'追加の結合を整えています':'形を整えています'",
          "message:addition.kind==='pair'?'電子対を共有しています':addition.kind==='resonance'?'共鳴結合を整えています':addition.kind==='extension'?'追加の結合を整えています':'形を整えています'")
          replace('src/app.js',
          "  selectionChip.textContent=donor?'電子対を共有しています':change.kindOfPair==='extension'?'追加接続点をつないでいます':'電子対をつくっています';",
          "  selectionChip.textContent=donor?'電子対を共有しています':change.kindOfPair==='resonance'?'共鳴接続点をつないでいます':change.kindOfPair==='extension'?'追加接続点をつないでいます':'電子対をつくっています';")

          replace('index.html', './src/app.js?v=53', './src/app.js?v=54')

          p=Path('tests/resonance-formal-charge.test.mjs'); s=p.read_text()
          s=s.replace("import {supportedResonanceGroups} from '../src/resonance-model.js?v=1';", "import {supportedResonanceGroups,supportedResonanceCompletionPartners} from '../src/resonance-model.js?v=2';")
          s=s.replace("from '../src/bonding-model.js?v=31';", "from '../src/bonding-model.js?v=32';")
          s=s.replace("{allowed:true,order:2,kind:'extension'}", "{allowed:true,order:2,kind:'resonance'}")
          marker="assert.deepEqual(bondAddition(builtOzonePre.molecule,builtOzonePre.ids[ozoneGroup.center],builtOzonePre.ids[ozoneGroup.ends[0]]),{allowed:true,order:2,kind:'resonance'},'Supported ozone completion may cross the ordinary O valence ceiling only for the recognized motif');"
          assert marker in s
          extra="""\nconst nitroSites=atomBondState(builtPre.molecule,nId).sites.filter(site=>site?.kind==='resonance');\nassert.equal(nitroSites.length,2,'Nitro all-single precursor exposes exactly two resonance completion handles on central N');\nassert.deepEqual(new Set(nitroSites.map(site=>site.partnerId)),new Set(nitroGroup.ends.map(index=>builtPre.ids[index])),'Nitro completion handles are restricted to the two terminal O atoms');\nassert.deepEqual(new Set(supportedResonanceCompletionPartners(builtPre.molecule,nId)),new Set(nitroGroup.ends.map(index=>builtPre.ids[index])),'Nitro precursor authority should expose only terminal O partners');\nconst ozoneCenter=builtOzonePre.ids[ozoneGroup.center],ozoneSites=atomBondState(builtOzonePre.molecule,ozoneCenter).sites.filter(site=>site?.kind==='resonance');\nassert.equal(ozoneSites.length,2,'Ozone all-single precursor exposes exactly two resonance completion handles on central O');\nassert.deepEqual(new Set(ozoneSites.map(site=>site.partnerId)),new Set(ozoneGroup.ends.map(index=>builtOzonePre.ids[index])),'Ozone completion handles are restricted to terminal O atoms');\nfor(const id of ['ammonia','water']){const record=byId(id),built=build(record),center=built.ids[record.atoms.findIndex(element=>element===('ammonia'===id?'N':'O'))];assert.equal(atomBondState(built.molecule,center).sites.some(site=>site?.kind==='resonance'),false,`${id}: ordinary N/O chemistry must not expose a resonance completion handle`);}\n"""
          s=s.replace(marker,marker+extra)
          p.write_text(s)
          PY
          node --check src/app.js
          node --check src/bonding-model.js
          node tests/resonance-formal-charge.test.mjs
          node tests/bond-state.test.mjs
          node tests/special-bonds-check.mjs
          node tests/aromatic-rendering-check.mjs
          node --test tests/craft-target-match.test.mjs
          node --test tests/craft-target-hint.test.mjs
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/resonance-model.js src/bonding-model.js src/app.js index.html tests/resonance-formal-charge.test.mjs precache-manifest.js
          git commit -m "Restore nitro and ozone CRAFT resonance completion"
          git push
