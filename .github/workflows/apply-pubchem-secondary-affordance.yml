name: apply-pubchem-secondary-affordance
on:
  push:
    branches: [fix/pubchem-secondary-affordance]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply PubChem secondary affordance refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/pubchem-reference.js'); s=p.read_text()
          marker="const BOND_SYMBOL=Object.freeze({1:'',2:'=',3:'#'});\n"
          addition="""const PUBCHEM_INTRO_STORAGE_KEY='molecule-craft.pubchem-intro.v1';

export function createPubchemIntroState(storage){
  let seen=false,activeSignature=null;
  try{seen=storage?.getItem(PUBCHEM_INTRO_STORAGE_KEY)==='1';}catch{}
  return Object.freeze({
    label(signature=null){
      if(!signature){activeSignature=null;return'↗';}
      if(activeSignature&&activeSignature!==signature)activeSignature=null;
      if(!seen){seen=true;activeSignature=signature;try{storage?.setItem(PUBCHEM_INTRO_STORAGE_KEY,'1');}catch{}}
      return activeSignature===signature?'PubChem ↗':'↗';
    },
  });
}

export {PUBCHEM_INTRO_STORAGE_KEY};
"""
          if 'createPubchemIntroState' not in s:
              if marker not in s: raise SystemExit('pubchem reference marker missing')
              s=s.replace(marker,marker+'\n'+addition,1)
          p.write_text(s)

          p=Path('src/craft-panel.js'); s=p.read_text()
          s=s.replace("import {pubchemReferenceFor} from './pubchem-reference.js';", "import {createPubchemIntroState,pubchemReferenceFor} from './pubchem-reference.js';",1)
          old="  const pubchemLink=document.createElement('a');pubchemLink.className='pubchem-link';pubchemLink.textContent='↗';pubchemLink.target='_blank';pubchemLink.rel='noopener noreferrer external';pubchemLink.hidden=true;pubchemLink.setAttribute('aria-label','PubChemでこの分子を調べる');nodes.pubchem=pubchemLink;\n  let tankActionKey='',tankControls=[],clearTarget=()=>{},lastTargetKey='',lastTargetFilled={};"
          new="  const pubchemLink=document.createElement('a');pubchemLink.className='pubchem-link';pubchemLink.textContent='↗';pubchemLink.target='_blank';pubchemLink.rel='noopener noreferrer external';pubchemLink.hidden=true;pubchemLink.setAttribute('aria-label','PubChemでこの分子を調べる');nodes.pubchem=pubchemLink;\n  let pubchemStorage=null;try{pubchemStorage=document.defaultView?.localStorage??null;}catch{}const pubchemIntro=createPubchemIntroState(pubchemStorage);\n  let tankActionKey='',tankControls=[],clearTarget=()=>{},lastTargetKey='',lastTargetFilled={};"
          if old not in s: raise SystemExit('craft panel pubchem setup marker missing')
          s=s.replace(old,new,1)
          old_render="const reference=focus?.complete&&!focus.record?pubchemReferenceFor(focus):null;nodes.pubchem.hidden=!reference;if(reference){nodes.pubchem.href=reference.url;nodes.pubchem.dataset.searchMode=reference.mode;nodes.pubchem.title=reference.mode==='structure'?'PubChemで構造検索':'PubChemで分子式検索';}else{nodes.pubchem.removeAttribute('href');delete nodes.pubchem.dataset.searchMode;nodes.pubchem.removeAttribute('title');}"
          new_render="const reference=focus?.complete&&!focus.record?pubchemReferenceFor(focus):null;nodes.pubchem.hidden=!reference;nodes.pubchem.textContent=pubchemIntro.label(reference?focus.signature:null);if(reference){nodes.pubchem.href=reference.url;nodes.pubchem.dataset.searchMode=reference.mode;}else{nodes.pubchem.removeAttribute('href');delete nodes.pubchem.dataset.searchMode;}"
          if old_render not in s: raise SystemExit('craft panel pubchem render marker missing')
          s=s.replace(old_render,new_render,1)
          p.write_text(s)

          p=Path('styles.css'); s=p.read_text()
          pattern=r"\n\.pubchem-link\{[^\n]*\}\.pubchem-link:hover\{[^\n]*\}\n?"
          replacement="\n#formula{display:flex;align-items:center;gap:8px;width:100%;min-width:0}.pubchem-link{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;margin-left:auto;padding:4px 5px 4px 10px;border-left:1px solid #334b5a;color:#7892a2!important;text-decoration:none;font-size:11px!important;font-weight:500;line-height:1;white-space:nowrap;opacity:.8}.pubchem-link:focus-visible{color:#a8bbc6!important;opacity:1}\n"
          updated,count=re.subn(pattern,replacement,s,count=1)
          if count!=1: raise SystemExit(f'pubchem style marker mismatch: {count}')
          p.write_text(updated)

          p=Path('tests/pubchem-reference.test.mjs'); s=p.read_text()
          s=s.replace("import {conservativeSmiles,pubchemReferenceFor} from '../src/pubchem-reference.js';", "import {PUBCHEM_INTRO_STORAGE_KEY,conservativeSmiles,createPubchemIntroState,pubchemReferenceFor} from '../src/pubchem-reference.js';",1)
          marker="assert.equal(pubchemReferenceFor({formula:'—',graph:{atoms:[],bonds:[]}}),null);\n"
          addition="""
let introValue=null,writes=0;
const introStorage={getItem:key=>key===PUBCHEM_INTRO_STORAGE_KEY?introValue:null,setItem:(key,value)=>{assert.equal(key,PUBCHEM_INTRO_STORAGE_KEY);introValue=value;writes++;}};
const intro=createPubchemIntroState(introStorage);
assert.equal(intro.label('first-signature'),'PubChem ↗','The first unregistered completion teaches the external reference once.');
assert.equal(intro.label('first-signature'),'PubChem ↗','Repeated renders of the same first completion keep the label stable.');
assert.equal(writes,1);
assert.equal(intro.label(null),'↗','Leaving the first unregistered completion ends the teaching state.');
assert.equal(intro.label('second-signature'),'↗','Later unregistered completions stay visually secondary.');
assert.equal(createPubchemIntroState(introStorage).label('after-reload'),'↗','The intro is remembered on the device.');
const deniedIntro=createPubchemIntroState({getItem(){throw Error('denied');},setItem(){throw Error('denied');}});
assert.equal(deniedIntro.label('fallback'),'PubChem ↗','Storage denial must not break the affordance.');
"""
          if 'first-signature' not in s:
              if marker not in s: raise SystemExit('pubchem test marker missing')
              s=s.replace(marker,marker+addition,1)
          p.write_text(s)

          p=Path('tests/source-contracts.test.mjs'); s=p.read_text()
          marker="assert.match(craftPanel,/className='pubchem-link'/);"
          additions="""
assert.match(craftPanel,/createPubchemIntroState/);
assert.doesNotMatch(craftPanel,/nodes\.pubchem\.title|PubChemで構造検索|PubChemで分子式検索/,'PubChem has no hover-only explanation');
assert.match(pubchemReference,/molecule-craft\.pubchem-intro\.v1/);
assert.match(pubchemReference,/PubChem ↗/);
"""
          if 'hover-only explanation' not in s:
              if marker not in s: raise SystemExit('source contract pubchem marker missing')
              s=s.replace(marker,marker+additions,1)
          p.write_text(s)
          PY
      - name: Validate focused changes
        shell: bash
        run: |
          set -euo pipefail
          node --check src/pubchem-reference.js
          node --check src/craft-panel.js
          node tests/pubchem-reference.test.mjs
          node tests/source-contracts.test.mjs
          npm install --prefix /tmp/mc-jsdom jsdom@26 >/dev/null
          node tests/mobile-ui-check.mjs /tmp/mc-jsdom/node_modules/jsdom/lib/api.js
          test -z "$(git diff --name-only -- data/)"
          node scripts/build-precache.mjs
          node tests/pwa.test.mjs
          node scripts/check-repository-hygiene.mjs
          git diff --check
      - name: Commit refinement
        shell: bash
        run: |
          rm .github/workflows/apply-pubchem-secondary-affordance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine PubChem as a secondary affordance"
          git push
