name: LC-03 final validation

on:
  push:
    branches: [lc-03-resources-persistence-boundary]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lc-03-resources-persistence-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate LC-03
        run: |
          node tests/resources-persistence.test.mjs
          node tests/veil.test.mjs
          node tests/supply-production.test.mjs
          node tests/supply-tanks.test.mjs
          node tests/tank-upgrades.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/issue-113-regression.test.mjs
          node tests/veil-reset.test.mjs
          node tests/pwa.test.mjs
          node scripts/check-repository-hygiene.mjs
          node scripts/build-precache.mjs
          git diff --exit-code -- sw.js precache-manifest.js
          git diff --check
      - name: Remove temporary validator
        shell: bash
        run: |
          rm .github/workflows/lc-03-final-validation.yml
          git config user.name "miyatayuuma"
          git config user.email "115095547+miyatayuuma@users.noreply.github.com"
          git add -A
          git commit -m "ci: clean LC-03 temporary validator"
          git push origin HEAD:lc-03-resources-persistence-boundary
