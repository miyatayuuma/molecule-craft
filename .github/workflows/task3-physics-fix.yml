name: Task 3 pressure traversal fix

on:
  push:
    branches: [field-map-expansion-task3-oxygen-network]

permissions:
  contents: write

jobs:
  patch-generate-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply scoped Oxygen Network pressure traversal patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if text.count(old)!=1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)}')
              p.write_text(text.replace(old,new,1))

          replace_once('src/veil/engine.js',
              "  const force={x:0,y:0};",
              "  const routePressure=environment?.traversableRoutePressure,movementEnvironment=Number.isFinite(routePressure)?{...environment,pressure:environment.pressure-routePressure}:environment;\n  const force={x:0,y:Number.isFinite(routePressure)?routePressure:0};")
          replace_once('src/veil/engine.js',
              "  moveFlight(p,input,dt,{config:c,assist:nearest,force,environment});",
              "  moveFlight(p,input,dt,{config:c,assist:nearest,force,environment:movementEnvironment});")
          replace_once('src/veil/universe.js',
              "  const challenge=challengeEnvironment(p,time),routePressure=challenge?.pressure??oxygenPressureAt(p),vortex=oxygenVortexFlowAt(p);\n  const basePressure=routePressure??outer*255+hot*310,baseFlowX=challenge?.flowX??(routePressure!==null?0:oxygen*(1-coolEddy)*Math.sin(time*1.7+p.y*.008)*48);\n  return {pressure:basePressure+vortex.y,flowX:baseFlowX+vortex.x,heat:Math.max(challenge?.heat??0,hot*32+oxygen*(1-hot)*(1-coolEddy)*3)*(quiet?.2:1),intensity:hot,eddy:coolEddy,vortex:vortex.intensity};",
              "  const challenge=challengeEnvironment(p,time),oxygenRoutePressure=oxygenPressureAt(p),routePressure=challenge?.pressure??oxygenRoutePressure,vortex=oxygenVortexFlowAt(p);\n  const basePressure=routePressure??outer*255+hot*310,baseFlowX=challenge?.flowX??(routePressure!==null?0:oxygen*(1-coolEddy)*Math.sin(time*1.7+p.y*.008)*48);\n  return {pressure:basePressure+vortex.y,flowX:baseFlowX+vortex.x,traversableRoutePressure:challenge?null:oxygenRoutePressure,heat:Math.max(challenge?.heat??0,hot*32+oxygen*(1-hot)*(1-coolEddy)*3)*(quiet?.2:1),intensity:hot,eddy:coolEddy,vortex:vortex.intensity};")
          replace_once('tests/field-map-export.test.mjs',
              "import {createFlight,moveFlight} from '../src/veil/engine.js';",
              "import {createFlight,createRun,moveFlight,stepRun} from '../src/veil/engine.js';")
          marker="test('Oxygen main recovery moves the existing harvest pocket without changing its amount or value',()=>{"
          test="""test('Oxygen Network route pressure stays traversable and propulsion keeps a material advantage',()=>{\n  const traverse=({x,y,targetY,burst=false,drive=false,maxSeconds=6})=>{\n    const config=flightConfig(),fuel=drive?{fuel:{molecule:'methane',amount:18,capacity:18},oxidizer:{molecule:'oxygen',amount:36,capacity:36}}:{},run=createRun(createUniverse(1,{H:0,C:0,O:0}),config,{fuel,predators:false});\n    Object.assign(run.player,{x,y,angle:-Math.PI/2,vx:0,vy:-config.speed,speed:config.speed});run.region='oxygen';\n    if(burst){run.player.drive=DRIVES.hydrogen;run.player.boost=DRIVES.hydrogen.boostSeconds;}\n    if(drive)run.driveHeld=true;\n    const systems=drive?{consumeCombustion:()=>true}:{},dt=1/60;\n    for(let frame=0;frame<maxSeconds/dt;frame++){\n      stepRun(run,{x:0,y:-1},dt,systems);\n      if(run.player.y<=targetY)return run.time;\n    }\n    return Infinity;\n  };\n  const shortcutNormal=traverse({x:-320,y:-9600,targetY:-9800,maxSeconds:4}),shortcutBurst=traverse({x:-320,y:-9600,targetY:-9800,burst:true,maxSeconds:4});\n  assert.ok(Number.isFinite(shortcutNormal),'normal thrust must cross the localized BURST chokepoint');\n  assert.ok(shortcutBurst<shortcutNormal*.7,`BURST must materially ease the chokepoint (${shortcutBurst.toFixed(2)}s vs ${shortcutNormal.toFixed(2)}s)`);\n  const mainNormal=traverse({x:300,y:-9000,targetY:-9400}),mainDrive=traverse({x:300,y:-9000,targetY:-9400,drive:true});\n  assert.ok(Number.isFinite(mainNormal),'normal thrust must traverse sustained DRIVE-route pressure');\n  assert.ok(mainDrive<mainNormal*.6,`COMBUSTION DRIVE must materially improve sustained traversal (${mainDrive.toFixed(2)}s vs ${mainNormal.toFixed(2)}s)`);\n});\n\n"""
          replace_once('tests/field-map-export.test.mjs',marker,test+marker)
          PY
      - name: Generate current FIELD map and PWA release
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: Validate Task 3 and repository contracts
        run: |
          node tests/field-map-export.test.mjs
          node tests/field-expansion-proposal.test.mjs
          node tests/repository-hygiene.test.mjs
          node tests/source-contracts.test.mjs
          node tests/persistence-boundary-source-contract.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit scoped source and generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veil/engine.js src/veil/universe.js tests/field-map-export.test.mjs docs/maps/current-field.svg precache-manifest.js sw.js
          git commit -m "Keep Oxygen Network pressure skill-traversable"
          git push
