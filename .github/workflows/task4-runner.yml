name: Task 4 branch runner

on:
  push:
    branches:
      - work/task4-oxygen-side-thermal

permissions:
  contents: write

jobs:
  apply-generate-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply Task 4 transforms
        id: apply
        shell: bash
        run: |
          if [[ ! -f .github/task4.py ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python .github/task4.py
          python .github/task4-fix.py
          rm -f .github/task4.py .github/task4-fix.py
          echo "applied=true" >> "$GITHUB_OUTPUT"
      - name: Regenerate developer map and PWA assets
        if: steps.apply.outputs.applied == 'true'
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: Focused Task 4 validation
        if: steps.apply.outputs.applied == 'true'
        run: |
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/oxygen-routes.test.mjs
          node tests/field-map-export.test.mjs
          node tests/oxygen-field-integration.test.mjs
          node tests/propulsion-differentiation.test.mjs
          node tests/deep-oxygen-routes.test.mjs
      - name: Freshness and hygiene
        if: steps.apply.outputs.applied == 'true'
        run: |
          node scripts/export-field-map.mjs --check
          node scripts/build-precache.mjs --check
          node scripts/check-repository-hygiene.mjs
          git diff --check
      - name: Commit implementation
        if: steps.apply.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extend Oxygen side sustained thermal exposure"
          git push
