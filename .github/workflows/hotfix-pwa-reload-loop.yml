name: hotfix-pwa-reload-loop
on:
  push:
    branches: [fix/pwa-reload-loop]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove reload-loop guard and restore conservative updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/pwa.js'); s=p.read_text()
          prefix="const EXPECTED_LOADER_REV='32',loaderRev=new URL(import.meta.url).searchParams.get('v')??'';\nif(loaderRev!==EXPECTED_LOADER_REV){location.reload();}else{\n"
          if not s.startswith(prefix): raise SystemExit('expected broken loader guard not found')
          s=s[len(prefix):]
          if not s.endswith('\n}\n'): raise SystemExit('expected loader guard closing brace not found')
          s=s[:-3]+'\n'
          old="  const hadController=!!navigator.serviceWorker.controller;\n  navigator.serviceWorker.addEventListener('controllerchange',()=>{activationRequested=false;if(hadController||reloadOnChange){location.reload();return;}requestRunningVersion();});"
          new="  navigator.serviceWorker.addEventListener('controllerchange',()=>{activationRequested=false;if(reloadOnChange){reloadOnChange=false;location.reload();return;}requestRunningVersion();});"
          if old not in s: raise SystemExit('unconditional controller reload not found')
          s=s.replace(old,new,1)
          s=s.replace('ready({auto:true})','ready({auto:false})')
          p.write_text(s.rstrip()+'\n')

          p=Path('index.html'); h=p.read_text()
          if 'src/pwa.js?v=32' not in h: raise SystemExit('pwa loader v32 not found')
          p.write_text(h.replace('src/pwa.js?v=32','src/pwa.js?v=33',1))

          p=Path('tests/source-contracts.test.mjs'); t=p.read_text().replace('src/pwa.js?v=32','src/pwa.js?v=33')
          p.write_text(t)

          p=Path('tests/pwa.test.mjs'); t=p.read_text()
          t=re.sub(r"^assert\.match\(pwaSource,/EXPECTED_LOADER_REV='32'/.*\n",'',t,flags=re.M)
          t=re.sub(r"^assert\.match\(pwaSource,/hadController\\\|\\\|reloadOnChange/.*\n",'',t,flags=re.M)
          t=re.sub(r"^assert\.match\(pwaSource,/ready\\\(\\\{auto:true\\\}\\\)/.*\n",'',t,flags=re.M)
          anchor="assert.match(pwaSource,/molecule-craft:prepare-update/,'Automatic activation must reuse the existing safe-save gate');\n"
          addition=(
            "assert.doesNotMatch(pwaSource,/EXPECTED_LOADER_REV|loaderRev!==EXPECTED_LOADER_REV/,'PWA must not reload based on module query identity');\n"
            "assert.doesNotMatch(pwaSource,/hadController\\|\\|reloadOnChange/,'Controller replacement must not unconditionally reload an already-controlled document');\n"
            "assert.doesNotMatch(pwaSource,/ready\\(\\{auto:true\\}\\)/,'Waiting releases must not auto-activate during hotfix stabilization');\n"
            "assert.match(pwaSource,/ready\\(\\{auto:false\\}\\)/,'Waiting releases should remain manual until update activation is stable');\n"
          )
          if anchor not in t: raise SystemExit('PWA test anchor not found')
          t=t.replace(anchor,anchor+addition,1)
          p.write_text(t)
          PY
      - name: Validate hotfix
        run: |
          node --check src/pwa.js
          npm install --prefix /tmp/mc-jsdom jsdom@26
          node tests/source-contracts.test.mjs
          node tests/mobile-ui-check.mjs /tmp/mc-jsdom/node_modules/jsdom/lib/api.js
          node tests/craft-target-display.test.mjs
          node scripts/build-precache.mjs
          node tests/pwa.test.mjs
          node scripts/check-repository-hygiene.mjs
          git diff --check
      - name: Commit hotfix
        run: |
          rm .github/workflows/hotfix-pwa-reload-loop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stop PWA reload loop"
          git push
