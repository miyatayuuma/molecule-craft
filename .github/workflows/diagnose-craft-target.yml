name: diagnose-craft-target
on:
  push:
    branches: [fix-craft-target-regression]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated jsdom
        run: npm install --prefix /tmp/mc-jsdom jsdom@26
      - name: Run production DOM integration
        run: node tests/mobile-ui-check.mjs /tmp/mc-jsdom/node_modules/jsdom/lib/api.js
