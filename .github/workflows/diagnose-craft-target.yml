name: diagnose-craft-target
on:
  push:
    branches: [fix-craft-target-regression]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply regression fix
        run: python scripts/tmp-fix-craft-target-regression.py
      - name: Install isolated jsdom
        run: npm install --prefix /tmp/mc-jsdom jsdom@26
      - name: Focused validation
        run: |
          node --check src/app.js
          node --check src/craft-panel.js
          node tests/craft-target-display.test.mjs
          node tests/craft-decomposition.test.mjs
          node tests/craft-workspace.test.mjs
          node tests/source-contracts.test.mjs
          node tests/mobile-ui-check.mjs /tmp/mc-jsdom/node_modules/jsdom/lib/api.js
      - name: Offline and hygiene validation
        run: |
          node scripts/build-precache.mjs
          node tests/pwa.test.mjs
          node scripts/check-repository-hygiene.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-craft-target.yml scripts/tmp-fix-craft-target-regression.py
          git add -A
          git commit -m "Fix craft target bar regression"
          git push origin HEAD:fix-craft-target-regression
