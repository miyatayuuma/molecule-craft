name: Task Chevron motion tuning
on:
  push:
    branches:
      - task/encyclopedia-chevron-motion-tuning
permissions:
  contents: write
jobs:
  tune:
    if: ${{ github.event.head_commit.message == 'Run Chevron motion tuning' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply tuning
        run: |
          node scripts/task-chevron-motion-tuning.mjs
          rm scripts/task-chevron-motion-tuning.mjs
          rm .github/workflows/task-chevron-motion-tuning.yml
      - name: Refresh generated PWA assets
        run: node scripts/build-precache.mjs
      - name: Validate focused behavior
        run: |
          node tests/encyclopedia-graph-ui.test.mjs
          node tests/encyclopedia-transition-browser.test.mjs
          node tests/encyclopedia-visible-transition-browser.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          git diff --check
      - name: Commit tuning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tune Encyclopedia Chevron motion [skip ci]"
          git push origin HEAD:task/encyclopedia-chevron-motion-tuning
