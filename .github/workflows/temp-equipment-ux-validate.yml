name: Temporary equipment UX validation
on:
  push:
    branches: [feat/equipment-behavior-ux]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@26
      - name: Equipment UX tests
        run: node --test tests/equipment-ux.test.mjs
      - name: Exploration UI checks
        id: veil-ui
        continue-on-error: true
        run: node tests/veil-ui-check.mjs node_modules/jsdom/lib/api.js > .tmp-veil-ui-output.txt 2>&1
      - name: Capture UI failure
        if: steps.veil-ui.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-veil-ui-output.txt
          if ! git diff --cached --quiet; then
            git commit -m "Capture UI validation failure"
            git push
          fi
      - name: Stop on UI failure
        if: steps.veil-ui.outcome == 'failure'
        run: exit 1
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: Regenerate offline release
        run: node scripts/build-precache.mjs
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Commit generated release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate offline release for equipment UX"
            git push
          fi
