name: Inventory depletion validation
on:
  push:
    branches:
      - feature/inventory-driven-depletion
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate offline manifest
        run: node scripts/build-precache.mjs
      - name: Run focused tests
        run: |
          node --test tests/inventory-depletion.test.mjs
          node --test tests/growth.test.mjs
          node --test tests/veil-playthrough.test.mjs
          node tests/pwa.test.mjs
          node scripts/check-repository-hygiene.mjs
      - name: Commit generated manifest
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- precache-manifest.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precache-manifest.js
          git commit -m "Regenerate precache manifest"
          git push
