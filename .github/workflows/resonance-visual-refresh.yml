name: Resonance visual refresh

on:
  push:
    branches:
      - work/nitro-ozone-resonance-visual-polish

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply browser-test migration
        run: node scripts/patch-resonance-visual-browser.mjs
      - name: Regenerate Encyclopedia thumbnails
        run: node scripts/build-collection-assets.mjs
      - name: Refresh PWA precache
        run: node scripts/build-precache.mjs
      - name: Focused validation
        run: |
          node tests/encyclopedia-chemistry-visuals.test.mjs
          node tests/special-bonds-check.mjs
          node tests/encyclopedia-chemistry-visual-browser.test.mjs
          node tests/resonance-formal-charge.test.mjs
          node tests/craft-target-satisfaction.test.mjs
          node --test tests/craft-target-hint.test.mjs
          node --test tests/craft-target-match.test.mjs
          node tests/resonance-craft-interaction-browser.test.mjs
          node tests/resonance-visual-browser.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
      - name: Commit generated and migrated artifacts
        run: |
          git rm scripts/patch-resonance-visual-browser.mjs .github/workflows/resonance-visual-refresh.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refresh resonance visual artifacts and tests"
          git push origin HEAD:work/nitro-ozone-resonance-visual-polish
