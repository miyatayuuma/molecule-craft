name: Task 3 generated artifacts

on:
  push:
    branches: [field-map-expansion-task3-oxygen-network]

permissions:
  contents: write

jobs:
  generate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate current FIELD map
        run: node scripts/export-field-map.mjs
      - name: Generate PWA release
        run: node scripts/build-precache.mjs
      - name: Focused FIELD validation
        run: |
          node tests/field-map-export.test.mjs
          node tests/field-expansion-proposal.test.mjs
      - name: Repository contracts
        run: |
          node tests/repository-hygiene.test.mjs
          node tests/source-contracts.test.mjs
          node tests/persistence-boundary-source-contract.test.mjs
      - name: PWA validation
        run: |
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit canonical generated outputs
        shell: bash
        run: |
          if git diff --quiet -- docs/maps/current-field.svg precache-manifest.js sw.js; then
            echo "Generated outputs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maps/current-field.svg precache-manifest.js sw.js
          git commit -m "Refresh FIELD map and PWA artifacts"
          git push
