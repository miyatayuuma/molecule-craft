name: Generate FIELD map once

on:
  push:
    branches:
      - current-field-developer-map

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate current FIELD map
        run: node scripts/export-field-map.mjs
      - name: Commit generated map
        run: |
          git add docs/maps/current-field.svg
          if git diff --cached --quiet; then
            echo "No generated map change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate current FIELD map"
          git push
