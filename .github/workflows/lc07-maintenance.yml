name: LC-07 maintenance

on:
  push:
    branches: [lc-07-repository-hygiene]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lc-07-repository-hygiene
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update current architecture map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/architecture.md')
          s=p.read_text()
          replacements={
            '`src/conformation-engine.js`, `src/torsion-model.js`, `src/structure-edit.js`, `src/workspace-view.js`':'`src/conformation-engine.js`, `src/torsion-model.js`, `src/workspace-view.js`',
            '| 分子用途の説明・搭載分比較・帰還助言 | `src/veil/propulsion-guide.js` |\n':'',
            '`src/torsion-model.js`, `src/structure-edit.js`':'`src/torsion-model.js`',
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing expected architecture text: {old}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Regenerate precache
        run: node scripts/build-precache.mjs
      - name: Commit generated/current-map updates
        run: |
          if git diff --quiet -- docs/architecture.md sw.js precache-manifest.js; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture.md sw.js precache-manifest.js
          git commit -m 'LC-07: refresh architecture map and precache'
          git push
