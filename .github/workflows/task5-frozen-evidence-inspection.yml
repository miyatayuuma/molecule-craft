name: Task5 local orientation readability pilot
on:
  push:
    branches: [diagnostics/task5-evidence-50c0]
permissions:
  contents: read
  actions: read
jobs:
  repair-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        route: [polyethylene-terephthalate-direct-polycondensation, polyisobutylene-cationic, polypropylene-coordination]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Japanese screenshot font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Single route actual browser raster pilot
        env:
          POLYMER_TASK5_DPR: '1'
          POLYMER_TASK5_VISUAL: '1'
          POLYMER_TASK5_MOTION: normal
          POLYMER_TASK5_VIEWPORT: '{"width":390,"height":844,"mobile":true}'
          POLYMER_SOURCE_SHA: ${{ github.sha }}
          POLYMER_FIT_DIAGNOSTIC_ROUTE: ${{ matrix.route }}
        run: node tests/reaction-lab-polymer-browser.test.mjs
      - name: Gate single route pilot
        env:
          POLYMER_TASK5_DPR: '1'
          POLYMER_SOURCE_SHA: ${{ github.sha }}
          POLYMER_FIT_DIAGNOSTIC_ROUTE: ${{ matrix.route }}
        run: node scripts/check-polymer-task5-visual.mjs > pilot-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task5-local-orientation-pilot-${{ matrix.route }}
          path: |
            test-results/reaction-lab-polymer-simplification
            pilot-gate.json
          if-no-files-found: error
          retention-days: 90
