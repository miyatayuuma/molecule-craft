name: LC-03 resources persistence validation

on:
  push:
    branches: [lc-03-resources-persistence-boundary]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lc-03-resources-persistence-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply LC-03 implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          persistence = r'''import { EXPEDITION } from './config.js';
          import { GROWTH,DRIVES,REGIONS,TANK_USES,tankCapacity } from './growth.js';
          import { performanceFor } from './molecule-roles.js';
          import { WORKSPACE_STORAGE_KEY,validateWorkspace } from '../workspace-save.js?v=30';

          export const RESOURCE_KEY='molecule-craft.resources.v1';
          export const SCHEMA_VERSION=7;
          const COLLECTION_KEY='molecule-craft.collection.v1',HELP_KEY='molecule-craft.help.v1';
          export const MANAGED_ELEMENTS=['H','C','O'];
          export const STOCKED_ELEMENTS=['H','C','N','O','F','P','S','Cl'];
          export const MAX_RESOURCE_VALUE=1e9;

          const emptyCollection=()=>({schemaVersion:2,discoveredMolecules:[],discoveredGroups:[],unlockedStructures:[],legacyElements:[],milestones:[]});
          export const createInitialProgress=()=>({bestChain:0,runs:0,cleared:false,craftPrompt:false,sound:true,foundElements:['H'],regions:['veil'],checkpoint:'veil',frontier:false,choCompleted:false,totalCollected:0,signalMisses:0,signalLast:{}});
          export const createInitialTanks=()=>Object.fromEntries(Object.keys(TANK_USES).map(use=>[use,{molecule:null,amount:0}]));
          export const createInitialSelectedLoadout=()=>Object.fromEntries(Object.keys(TANK_USES).map(use=>[use,null]));
          const emptyElementStock=()=>Object.fromEntries(STOCKED_ELEMENTS.map(element=>[element,0]));
          export const createInitialResourcesState=()=>({schemaVersion:SCHEMA_VERSION,upgrades:{oxygenTank:0},elements:emptyElementStock(),tanks:createInitialTanks(),recipes:[],hints:[],dust:{H:0,C:0,O:0},loadout:{drive:'hydrogen',cooling:true,tanks:createInitialSelectedLoadout()},progress:createInitialProgress(),workspace:null});
          export const isResourceInteger=x=>Number.isSafeInteger(x)&&x>=0&&x<=MAX_RESOURCE_VALUE;
          export const isValidResourceId=x=>typeof x==='string'&&/^[A-Za-z][A-Za-z0-9-]*$/.test(x)&&!['constructor','prototype','__proto__'].includes(x);

          const MANAGED=MANAGED_ELEMENTS,integer=isResourceInteger,validId=isValidResourceId;
          const ids=x=>Array.isArray(x)&&x.every(validId)&&new Set(x).size===x.length;
          const validSelectedLoadout=x=>x&&Object.keys(TANK_USES).every(use=>Object.hasOwn(x,use)&&(x[use]===null||validId(x[use])));

          export function finishPendingResourcesReset(storage,state){const p=state.pendingReset;if(!p)return;if(p.collection)storage.setItem(COLLECTION_KEY,JSON.stringify(emptyCollection()));if(p.legacy)storage.removeItem(WORKSPACE_STORAGE_KEY);if(p.help)storage.removeItem(HELP_KEY);const done={...state};delete done.pendingReset;storage.setItem(RESOURCE_KEY,JSON.stringify(done));delete state.pendingReset;}

          function validatePersistedState(s){
            if(!s||![1,2,3,4,5,6,7].includes(s.schemaVersion)||!s.elements||!ids(s.recipes)||!s.progress)throw Error('Invalid resources');
            for(const [key,n]of Object.entries(s.elements))if(!validId(key)||!integer(n))throw Error('Invalid inventory');
            if(s.schemaVersion<=5){if(!s.molecules)throw Error('Invalid inventory');for(const [key,n]of Object.entries(s.molecules))if(!validId(key)||!integer(n))throw Error('Invalid inventory');if(!integer(s.molecules.hydrogen))throw Error('Invalid inventory');}
            if(!integer(s.elements.H)||typeof s.progress.cleared!=='boolean'||!integer(s.progress.bestChain)||!integer(s.progress.runs))throw Error('Invalid progress');
            if(s.progress.choCompleted!==undefined&&typeof s.progress.choCompleted!=='boolean')throw Error('Invalid CHO completion');
            if(s.resetEpoch!==undefined&&!integer(s.resetEpoch))throw Error('Invalid reset epoch');
            if(s.pendingReset!==undefined&&(!s.pendingReset||['collection','legacy','help'].some(k=>typeof s.pendingReset[k]!=='boolean')))throw Error('Invalid reset journal');
            if(s.workspace!==null)validateWorkspace(s.workspace);
            if(s.schemaVersion===2){
              if(!ids(s.hints)||!s.dust||!s.loadout||!Object.hasOwn(DRIVES,s.loadout.drive)||typeof s.loadout.cooling!=='boolean')throw Error('Invalid systems');
              for(const el of MANAGED)if(!integer(s.elements[el])||!integer(s.dust[el])||s.dust[el]>=GROWTH.dustPerAtom[el])throw Error('Invalid atom balance');
              const p=s.progress;if(!Array.isArray(p.foundElements)||!p.foundElements.includes('H')||!p.foundElements.every(e=>MANAGED.includes(e))||!Array.isArray(p.regions)||!p.regions.includes('veil')||!p.regions.every(id=>Object.hasOwn(REGIONS,id))||!p.regions.includes(p.checkpoint)||typeof p.frontier!=='boolean'||!integer(p.totalCollected)||!integer(p.signalMisses)||!p.signalLast||Object.entries(p.signalLast).some(([id,n])=>!Object.hasOwn(REGIONS,id)||!integer(n)))throw Error('Invalid expedition');
            }
            if(s.schemaVersion===3){
              if(!ids(s.hints)||!s.dust||!s.loadout||!Object.hasOwn(DRIVES,s.loadout.drive)||typeof s.loadout.cooling!=='boolean'||!s.tanks)throw Error('Invalid systems');
              for(const [id,capacity]of Object.entries({hydrogen:EXPEDITION.hydrogenCapacity,methane:EXPEDITION.methaneCapacity,oxygen:EXPEDITION.oxygenCapacity}))if(!integer(s.tanks[id])||s.tanks[id]>capacity)throw Error('Invalid propulsion tank');
              for(const el of MANAGED)if(!integer(s.elements[el])||!integer(s.dust[el])||s.dust[el]>=GROWTH.dustPerAtom[el])throw Error('Invalid atom balance');
              const p=s.progress;if(!Array.isArray(p.foundElements)||!p.foundElements.includes('H')||!p.foundElements.every(e=>MANAGED.includes(e))||!Array.isArray(p.regions)||!p.regions.includes('veil')||!p.regions.every(id=>Object.hasOwn(REGIONS,id))||!p.regions.includes(p.checkpoint)||typeof p.frontier!=='boolean'||!integer(p.totalCollected)||!integer(p.signalMisses)||!p.signalLast||Object.entries(p.signalLast).some(([id,n])=>!Object.hasOwn(REGIONS,id)||!integer(n)))throw Error('Invalid expedition');
            }
            if(s.schemaVersion===4){
              if(!ids(s.hints)||!s.dust||!s.loadout||!Object.hasOwn(DRIVES,s.loadout.drive)||typeof s.loadout.cooling!=='boolean'||!s.tanks)throw Error('Invalid systems');
              for(const [use,capacity]of Object.entries({propellant:3,fuel:18,oxidizer:36,coolant:12})){const tank=s.tanks[use];if(!tank||tank.molecule!==null&&!validId(tank.molecule)||!integer(tank.amount)||tank.amount>capacity||tank.amount>0&&!tank.molecule)throw Error('Invalid tank');}
              for(const el of MANAGED)if(!integer(s.elements[el])||!integer(s.dust[el])||s.dust[el]>=GROWTH.dustPerAtom[el])throw Error('Invalid atom balance');
              const p=s.progress;if(!Array.isArray(p.foundElements)||!p.foundElements.includes('H')||!p.foundElements.every(e=>MANAGED.includes(e))||!Array.isArray(p.regions)||!p.regions.includes('veil')||!p.regions.every(id=>Object.hasOwn(REGIONS,id))||!p.regions.includes(p.checkpoint)||typeof p.frontier!=='boolean'||!integer(p.totalCollected)||!integer(p.signalMisses)||!p.signalLast||Object.entries(p.signalLast).some(([id,n])=>!Object.hasOwn(REGIONS,id)||!integer(n)))throw Error('Invalid expedition');
            }
            if(s.schemaVersion===5){
              if(!ids(s.hints)||!s.dust||!s.loadout||!Object.hasOwn(DRIVES,s.loadout.drive)||typeof s.loadout.cooling!=='boolean'||!s.tanks)throw Error('Invalid systems');
              for(const use of Object.keys(TANK_USES)){const tank=s.tanks[use];if(!tank||tank.molecule!==null&&!validId(tank.molecule)||!integer(tank.amount)||tank.amount>0&&!tank.molecule)throw Error('Invalid tank');const capacity=tank.molecule?tankCapacity(use,tank.molecule):0;if(tank.molecule&&capacity===null||tank.amount>(capacity??0))throw Error('Invalid tank capacity');}
              for(const el of MANAGED)if(!integer(s.elements[el])||!integer(s.dust[el])||s.dust[el]>=GROWTH.dustPerAtom[el])throw Error('Invalid atom balance');
              const p=s.progress;if(!Array.isArray(p.foundElements)||!p.foundElements.includes('H')||!p.foundElements.every(e=>MANAGED.includes(e))||!Array.isArray(p.regions)||!p.regions.includes('veil')||!p.regions.every(id=>Object.hasOwn(REGIONS,id))||!p.regions.includes(p.checkpoint)||typeof p.frontier!=='boolean'||!integer(p.totalCollected)||!integer(p.signalMisses)||!p.signalLast||Object.entries(p.signalLast).some(([id,n])=>!Object.hasOwn(REGIONS,id)||!integer(n)))throw Error('Invalid expedition');
            }
            if(s.schemaVersion===7&&(!s.upgrades||![0,1,2].includes(s.upgrades.oxygenTank)))throw Error('Invalid tank upgrades');
            if(s.schemaVersion>=6){
              if(!ids(s.hints)||!s.dust||!s.loadout||!Object.hasOwn(DRIVES,s.loadout.drive)||typeof s.loadout.cooling!=='boolean'||s.loadout.tanks!==undefined&&!validSelectedLoadout(s.loadout.tanks)||!s.tanks||Object.hasOwn(s,'molecules'))throw Error('Invalid systems');
              for(const use of Object.keys(TANK_USES)){const tank=s.tanks[use];if(!tank||tank.molecule!==null&&!validId(tank.molecule)||!integer(tank.amount)||tank.amount>0&&!tank.molecule)throw Error('Invalid tank');const capacity=tank.molecule?tankCapacity(use,tank.molecule,s.schemaVersion===7?s.upgrades:{}):0;if(tank.molecule&&capacity===null||tank.amount>(capacity??0))throw Error('Invalid tank capacity');}
              for(const el of MANAGED)if(!integer(s.elements[el])||!integer(s.dust[el])||s.dust[el]>=GROWTH.dustPerAtom[el])throw Error('Invalid atom balance');
              const p=s.progress;if(!Array.isArray(p.foundElements)||!p.foundElements.includes('H')||!p.foundElements.every(e=>MANAGED.includes(e))||!Array.isArray(p.regions)||!p.regions.includes('veil')||!p.regions.every(id=>Object.hasOwn(REGIONS,id))||!p.regions.includes(p.checkpoint)||typeof p.frontier!=='boolean'||!integer(p.totalCollected)||!integer(p.signalMisses)||!p.signalLast||Object.entries(p.signalLast).some(([id,n])=>!Object.hasOwn(REGIONS,id)||!integer(n)))throw Error('Invalid expedition');
            }
            return s;
          }

          function migrate(old){
            if(old.schemaVersion>=6){const tanks={...createInitialTanks(),...old.tanks},fallback=Object.fromEntries(Object.keys(TANK_USES).map(use=>[use,tanks[use]?.molecule??null])),selected=validSelectedLoadout(old.loadout?.tanks)?{...fallback,...old.loadout.tanks}:fallback;return {...old,schemaVersion:SCHEMA_VERSION,upgrades:old.schemaVersion===SCHEMA_VERSION?old.upgrades:{oxygenTank:0},progress:{...createInitialProgress(),...old.progress},elements:{...emptyElementStock(),...old.elements},tanks,loadout:{drive:old.loadout?.drive??'hydrogen',cooling:old.loadout?.cooling??true,tanks:selected}};}
            const {molecules:discardedMoleculeInventory,...oldWithoutMolecules}=old;
            const next={...createInitialResourcesState(),...oldWithoutMolecules,schemaVersion:SCHEMA_VERSION,upgrades:{oxygenTank:0}};next.elements={...emptyElementStock(),...old.elements};next.tanks=createInitialTanks();next.progress={...createInitialProgress(),...old.progress};
            const load=(use,id,amount,{legacyBurstUnits=false}={})=>{const capacity=tankCapacity(use,id)??0,value=Math.min(capacity,(amount??0)*(legacyBurstUnits?performanceFor(id,'propellant')?.moleculesPerBurst??1:1));if(value>0)next.tanks[use]={molecule:id,amount:value};};
            if(old.schemaVersion===5){for(const use of Object.keys(TANK_USES)){const tank=old.tanks?.[use];if(tank?.molecule)load(use,tank.molecule,tank.amount);}}
            else if(old.schemaVersion===4){for(const use of Object.keys(TANK_USES)){const tank=old.tanks?.[use];if(tank?.molecule)load(use,tank.molecule,tank.amount,{legacyBurstUnits:use==='propellant'&&tank.molecule==='hydrogen'});}}
            else if(old.schemaVersion===3){load('propellant','hydrogen',old.tanks.hydrogen,{legacyBurstUnits:true});load('fuel','methane',old.tanks.methane);load('oxidizer','oxygen',old.tanks.oxygen);}
            next.loadout={drive:next.loadout?.drive??'hydrogen',cooling:next.loadout?.cooling??true,tanks:Object.fromEntries(Object.keys(TANK_USES).map(use=>[use,next.tanks[use]?.molecule??null]))};
            if(old.schemaVersion===1)next.migrateDiscoveries=true;for(const a of next.workspace?.atoms??[])if(MANAGED.includes(a.element)&&!next.progress.foundElements.includes(a.element))next.progress.foundElements.push(a.element);return next;
          }

          function parsePersistedResources(raw){if(typeof raw!=='string'||raw.length>3e6)throw Error('Invalid resources');return validatePersistedState(JSON.parse(raw));}
          export function migrateResourcesSave(raw){return validatePersistedState(migrate(parsePersistedResources(raw)));}
          export function loadPersistedResources(storage){let previous=storage?.getItem(RESOURCE_KEY)??null;if(!previous)return {state:null,previous:null};let persisted=parsePersistedResources(previous);if(persisted.pendingReset){finishPendingResourcesReset(storage,persisted);previous=storage.getItem(RESOURCE_KEY);}return {state:validatePersistedState(migrate(persisted)),previous};}
          export function serializeResourcesState(state){if(state?.schemaVersion!==SCHEMA_VERSION)throw Error('Invalid resources schema');return JSON.stringify(validatePersistedState(state));}
          '''
          Path('src/veil/resources-persistence.js').write_text(persistence, encoding='utf-8')

          resources_path=Path('src/veil/resources.js')
          resources=resources_path.read_text(encoding='utf-8')
          marker='export function createResources({storage,onStatus=()=>{}}={}){'
          if marker not in resources:
              raise SystemExit('resources.js createResources marker not found')
          body=resources[resources.index(marker):]
          prefix=r'''import { nextOxygenUpgrade } from './tank-upgrades.js';
          import { EXPEDITION } from './config.js';
          import { GROWTH,MOLECULE_USES,DRIVES,REGIONS,TANK_USES,tankCapacity,tankUsesFor } from './growth.js';
          import { combustionPacketFor,performanceFor } from './molecule-roles.js';
          import { WORKSPACE_STORAGE_KEY,validateWorkspace } from '../workspace-save.js?v=30';
          import { RESOURCE_KEY,MAX_RESOURCE_VALUE,MANAGED_ELEMENTS,STOCKED_ELEMENTS,createInitialProgress,createInitialTanks,createInitialSelectedLoadout,createInitialResourcesState,isResourceInteger,isValidResourceId,loadPersistedResources,serializeResourcesState,finishPendingResourcesReset } from './resources-persistence.js';
          export { RESOURCE_KEY };
          const COLLECTION_KEY='molecule-craft.collection.v1',MANAGED=MANAGED_ELEMENTS,STOCKED=STOCKED_ELEMENTS,MAX=MAX_RESOURCE_VALUE;
          export const RESET_CATEGORIES=Object.freeze(['collection','recipes','elements','tanks','exploration','records','workspace']);
          const initialProgress=createInitialProgress,initialTanks=createInitialTanks,initialSelectedLoadout=createInitialSelectedLoadout,initialState=createInitialResourcesState;
          const copy=x=>JSON.parse(JSON.stringify(x)),integer=isResourceInteger,validId=isValidResourceId;
          function expeditionLoss(units,rate){
            const exact=MANAGED.map((el,index)=>({el,index,value:(units[el]??0)*rate})),lost=Object.fromEntries(exact.map(({el,value})=>[el,Math.floor(value)]));
            let remaining=Math.floor(MANAGED.reduce((sum,el)=>sum+(units[el]??0),0)*rate)-MANAGED.reduce((sum,el)=>sum+lost[el],0);
            for(const item of exact.sort((a,b)=>(b.value-Math.floor(b.value))-(a.value-Math.floor(a.value))||a.index-b.index)){if(remaining<=0)break;if(lost[item.el]<(units[item.el]??0)){lost[item.el]++;remaining--;}}
            return lost;
          }
          '''
          resources=prefix+body
          old_load="try{previous=storage?.getItem(RESOURCE_KEY)??null;if(previous){if(previous.length>3e6)throw Error();state=validate(JSON.parse(previous));if(state.pendingReset){finishReset(storage,state);previous=storage.getItem(RESOURCE_KEY);}state=migrate(state);}else{const legacy=storage?.getItem(WORKSPACE_STORAGE_KEY);if(legacy)state.workspace=validateWorkspace(JSON.parse(legacy));if(legacy||storage?.getItem(COLLECTION_KEY))state.migrateDiscoveries=true;for(const a of state.workspace?.atoms??[])if(MANAGED.includes(a.element)&&!state.progress.foundElements.includes(a.element))state.progress.foundElements.push(a.element);}}catch{blocked=true;report('資源または制作の保存を復元できません。元の保存を保護しています。');}"
          new_load="try{const loaded=loadPersistedResources(storage);previous=loaded.previous;if(loaded.state)state=loaded.state;else{const legacy=storage?.getItem(WORKSPACE_STORAGE_KEY);if(legacy)state.workspace=validateWorkspace(JSON.parse(legacy));if(legacy||storage?.getItem(COLLECTION_KEY))state.migrateDiscoveries=true;for(const a of state.workspace?.atoms??[])if(MANAGED.includes(a.element)&&!state.progress.foundElements.includes(a.element))state.progress.foundElements.push(a.element);}}catch{blocked=true;report('資源または制作の保存を復元できません。元の保存を保護しています。');}"
          if old_load not in resources:
              raise SystemExit('resources.js persistence load block not found')
          resources=resources.replace(old_load,new_load,1)
          resources=resources.replace('JSON.stringify(validate(state))','serializeResourcesState(state)')
          resources=resources.replace('JSON.stringify(validate(next))','serializeResourcesState(next)')
          resources=resources.replace('finishReset(storage,state)','finishPendingResourcesReset(storage,state)')
          if 'function validate(' in resources or 'function migrate(' in resources or 'schemaVersion===3' in resources:
              raise SystemExit('legacy schema logic still present in runtime resources.js')
          resources_path.write_text(resources,encoding='utf-8')

          tests=r'''import assert from 'node:assert/strict';
          import {createResources,RESOURCE_KEY} from '../src/veil/resources.js';
          import {SCHEMA_VERSION,migrateResourcesSave,serializeResourcesState} from '../src/veil/resources-persistence.js';

          const progress={bestChain:7,runs:3,cleared:false,foundElements:['H','C','O'],regions:['veil'],checkpoint:'veil',frontier:false,totalCollected:19,signalMisses:1,signalLast:{veil:4}};
          const elements={H:11,C:4,O:6,N:2};
          const molecules={hydrogen:9,methane:3};
          const recipes=['hydrogen','methane','oxygen'];
          const systems={hints:['water'],dust:{H:0,C:0,O:0},loadout:{drive:'hydrogen',cooling:true}};
          const emptyTanks=()=>({propellant:{molecule:null,amount:0},fuel:{molecule:null,amount:0},oxidizer:{molecule:null,amount:0},coolant:{molecule:null,amount:0}});
          const tanks=(propellant=0)=>({propellant:{molecule:propellant?'hydrogen':null,amount:propellant},fuel:{molecule:'methane',amount:3},oxidizer:{molecule:'oxygen',amount:4},coolant:{molecule:null,amount:0}});
          const selected=(withTanks=false)=>({drive:'hydrogen',cooling:true,tanks:withTanks?{propellant:'hydrogen',fuel:'methane',oxidizer:'oxygen',coolant:null}:{propellant:null,fuel:null,oxidizer:null,coolant:null}});
          const currentProgress={bestChain:7,runs:3,cleared:false,craftPrompt:false,sound:true,foundElements:['H','C','O'],regions:['veil'],checkpoint:'veil',frontier:false,choCompleted:false,totalCollected:19,signalMisses:1,signalLast:{veil:4}};
          const currentElements={H:11,C:4,N:2,O:6,F:0,P:0,S:0,Cl:0};
          function expected({hints=[],dust={H:0,C:0,O:0},tankState=emptyTanks(),loadout=selected(false),upgrade=0,migrateDiscoveries=false}={}){const result={schemaVersion:7,upgrades:{oxygenTank:upgrade},elements:currentElements,tanks:tankState,recipes,hints,dust,loadout,progress:currentProgress,workspace:null};if(migrateDiscoveries)result.migrateDiscoveries=true;return result;}

          const fixtures=[
            {version:1,raw:{schemaVersion:1,elements,molecules,recipes,progress,workspace:null},want:expected({migrateDiscoveries:true})},
            {version:2,raw:{schemaVersion:2,elements,molecules,recipes,progress,workspace:null,...systems},want:expected({hints:systems.hints,dust:systems.dust})},
            {version:3,raw:{schemaVersion:3,elements,molecules,recipes,progress,workspace:null,...systems,tanks:{hydrogen:2,methane:3,oxygen:4}},want:expected({hints:systems.hints,dust:systems.dust,tankState:tanks(80),loadout:selected(true)})},
            {version:4,raw:{schemaVersion:4,elements,molecules,recipes,progress,workspace:null,...systems,tanks:{propellant:{molecule:'hydrogen',amount:2},fuel:{molecule:'methane',amount:3},oxidizer:{molecule:'oxygen',amount:4},coolant:{molecule:null,amount:0}}},want:expected({hints:systems.hints,dust:systems.dust,tankState:tanks(80),loadout:selected(true)})},
            {version:5,raw:{schemaVersion:5,elements,molecules,recipes,progress,workspace:null,...systems,tanks:tanks(40)},want:expected({hints:systems.hints,dust:systems.dust,tankState:tanks(40),loadout:selected(true)})},
            {version:6,raw:{schemaVersion:6,elements,recipes,progress,workspace:null,...systems,tanks:tanks(40)},want:expected({hints:systems.hints,dust:systems.dust,tankState:tanks(40),loadout:selected(true)})},
            {version:7,raw:{schemaVersion:7,upgrades:{oxygenTank:1},elements,recipes,progress,workspace:null,...systems,tanks:tanks(40)},want:expected({hints:systems.hints,dust:systems.dust,tankState:tanks(40),loadout:selected(true),upgrade:1})},
          ];

          assert.equal(SCHEMA_VERSION,7);
          for(const fixture of fixtures){const migrated=migrateResourcesSave(JSON.stringify(fixture.raw));assert.deepEqual(migrated,fixture.want,`v${fixture.version} -> v7 golden migration`);assert.equal(migrated.schemaVersion,7);assert.equal(Object.hasOwn(migrated,'molecules'),false,`v${fixture.version} must not expose legacy molecule inventory`);if(fixture.version<=6)assert.equal(migrated.upgrades.oxygenTank,0,`v${fixture.version} gets pre-upgrade default`);}

          const normalizedV7=migrateResourcesSave(JSON.stringify(fixtures.at(-1).raw));assert.deepEqual(JSON.parse(serializeResourcesState(normalizedV7)),normalizedV7,'egress writes current canonical state only');assert.throws(()=>serializeResourcesState(fixtures[5].raw),/schema/i,'egress must reject legacy schema states');

          const malformed=[
            '{broken',
            JSON.stringify({...fixtures[6].raw,schemaVersion:99}),
            JSON.stringify({...fixtures[2].raw,tanks:{...fixtures[2].raw.tanks,hydrogen:'2'}}),
            JSON.stringify({...fixtures[6].raw,upgrades:{oxygenTank:3}}),
          ];
          const memory=()=>{const data=new Map();return {getItem:key=>data.get(key)??null,setItem:(key,value)=>data.set(key,value),removeItem:key=>data.delete(key)};};
          for(const raw of malformed){assert.throws(()=>migrateResourcesSave(raw));const storage=memory();storage.setItem(RESOURCE_KEY,raw);const resources=createResources({storage});assert.equal(resources.blocked,true,'invalid persisted state must block writes');assert.equal(resources.save(),false);assert.equal(storage.getItem(RESOURCE_KEY),raw,'invalid persisted state must remain untouched');}

          console.log('Resources persistence migration passed: v1-v7 goldens, old inventory/tanks, pre-upgrade defaults, current-only egress, and malformed-save protection.');
          '''
          Path('tests/resources-persistence.test.mjs').write_text(tests,encoding='utf-8')

          architecture=Path('docs/architecture.md').read_text(encoding='utf-8')
          old='移行と破損・未来版・競合保護は `src/veil/resources.js`。'
          new='runtimeの資源・タンク・LOADOUT状態管理は `src/veil/resources.js`、resources schema v1〜v7のvalidation / migrationと破損・未来版保護、current-schema書き出しは `src/veil/resources-persistence.js`。'
          if old not in architecture:
              raise SystemExit('architecture persistence ownership text not found')
          Path('docs/architecture.md').write_text(architecture.replace(old,new,1),encoding='utf-8')
          PY
      - name: Regenerate offline asset inventory
        run: node scripts/build-precache.mjs
      - name: Validate LC-03
        run: |
          node tests/resources-persistence.test.mjs
          node tests/veil.test.mjs
          node tests/supply-production.test.mjs
          node tests/supply-tanks.test.mjs
