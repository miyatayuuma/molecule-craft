name: Temporary hygiene cleanup runner

on:
  push:
    branches:
      - chore/repository-hygiene-audit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cleanup and regenerate canonical outputs
        run: |
          set +e
          node scripts/apply-repository-hygiene-cleanup-v2.mjs >/tmp/hygiene-v2.out 2>/tmp/hygiene-v2.err
          status=$?
          set -e
          cat /tmp/hygiene-v2.out
          cat /tmp/hygiene-v2.err >&2
          if [ "$status" -ne 0 ] && ! grep -q "tests/critical-insight-freeze-browser.test.mjs: retired launch fixture remains" /tmp/hygiene-v2.err; then
            exit "$status"
          fi
          node scripts/resume-repository-hygiene-cleanup.mjs
          node scripts/build-molecule-db.mjs
          node scripts/build-precache.mjs
      - name: Targeted cleanup regressions
        run: |
          node tests/encyclopedia-content-architecture.test.mjs
          node tests/collection-expansion.test.mjs
          node tests/molecule-graph.test.mjs
          node tests/pending-craft.test.mjs
          node tests/issue-122-launch-route.test.mjs
          node tests/launch-selector.test.mjs
          node tests/launch-pointer-lifecycle.test.mjs
          node tests/special-bonds-check.mjs
          node tests/veil-ui-check.mjs
          node tests/repository-hygiene.test.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
      - name: Commit cleanup result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clean stale repository contracts"
          git push origin HEAD:chore/repository-hygiene-audit
