name: Temporary Encyclopedia transition fix v2

on:
  push:
    branches: [fix/encyclopedia-spatial-transition-regression]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/encyclopedia-spatial-transition-regression
      - name: Apply original patch with settled current-molecule checks
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/temp-encyclopedia-spatial-transition-fix.yml').read_text()
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY\n          node scripts/build-precache.mjs",start)
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines())
          exec(compile(body,'encyclopedia-transition-patch','exec'),{})

          path=Path('tests/encyclopedia-transition-browser.test.mjs')
          text=path.read_text()
          old="await new Promise(r=>setTimeout(r,60));assert.equal(await evaluate(`document.body.dataset.encyclopediaMoleculeId`),currentAfterNav);const preparedCurrentReturn=await evaluate(`(()=>{const node=document.querySelector('.graph-node.focus');return{id:node?.dataset.graphId,motion:node?[...node.getAnimations()].filter(a=>(a.effect?.getTiming?.().duration??0)>0&&a.playState!=='finished').length:-1};})()`);assert.equal(preparedCurrentReturn.id,currentAfterNav);assert.equal(preparedCurrentReturn.motion,0,'prev/next Detail return must prepare the current molecule directly at final Graph focus geometry');"
          new="await new Promise(r=>setTimeout(r,60));assert.equal(await evaluate(`document.body.dataset.encyclopediaMoleculeId`),currentAfterNav);let preparedCurrentReturn=null;for(let i=0;i<30;i++){preparedCurrentReturn=await evaluate(`(()=>{const node=document.querySelector('.graph-node.focus');return{id:node?.dataset.graphId,motion:node?[...node.getAnimations()].filter(a=>(a.effect?.getTiming?.().duration??0)>0&&a.playState!=='finished').length:-1};})()`);if(preparedCurrentReturn.id===currentAfterNav)break;await new Promise(r=>setTimeout(r,30));}assert.equal(preparedCurrentReturn.id,currentAfterNav);assert.equal(preparedCurrentReturn.motion,0,'prev/next Detail return must prepare the current molecule directly at final Graph focus geometry');"
          if old not in text: raise SystemExit('generated prev/next assertion pattern missing')
          text=text.replace(old,new,1)
          old="await new Promise(r=>setTimeout(r,60));const preparedIsomerReturn=await evaluate(`(()=>{const node=document.querySelector('.graph-node.focus');return{id:node?.dataset.graphId,motion:node?[...node.getAnimations()].filter(a=>(a.effect?.getTiming?.().duration??0)>0&&a.playState!=='finished').length:-1};})()`);assert.equal(preparedIsomerReturn.id,isomerId);assert.equal(preparedIsomerReturn.motion,0,'isomer Detail return must prepare the current isomer directly at final Graph focus geometry');"
          new="let preparedIsomerReturn=null;for(let i=0;i<30;i++){preparedIsomerReturn=await evaluate(`(()=>{const node=document.querySelector('.graph-node.focus');return{id:node?.dataset.graphId,motion:node?[...node.getAnimations()].filter(a=>(a.effect?.getTiming?.().duration??0)>0&&a.playState!=='finished').length:-1};})()`);if(preparedIsomerReturn.id===isomerId)break;await new Promise(r=>setTimeout(r,30));}assert.equal(preparedIsomerReturn.id,isomerId);assert.equal(preparedIsomerReturn.motion,0,'isomer Detail return must prepare the current isomer directly at final Graph focus geometry');"
          if old not in text: raise SystemExit('generated isomer assertion pattern missing')
          path.write_text(text.replace(old,new,1))
          PY
          node scripts/build-precache.mjs
      - name: Run targeted transition regressions
        env:
          ENCYCLOPEDIA_CAPTURE: '1'
        run: |
          node --test tests/encyclopedia-molecule-transition.test.mjs
          node tests/encyclopedia-graph-ui.test.mjs
          node tests/encyclopedia-transition-browser.test.mjs
          node tests/encyclopedia-visible-transition-browser.test.mjs
          node scripts/build-precache.mjs --check
      - name: Commit fix and generated PWA outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/encyclopedia-molecule-transition.js src/encyclopedia-graph-view.js src/collection-ui.js src/craft-connections.js tests/encyclopedia-molecule-transition.test.mjs tests/encyclopedia-transition-browser.test.mjs tests/encyclopedia-visible-transition-browser.test.mjs sw.js precache-manifest.js
          git commit -m "Fix Encyclopedia spatial transition regressions"
          git push
