name: PR190 finalize

on:
  push:
    branches:
      - work/graph-frontier-craft-ui-fixes

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix current-detail continuity contract
        run: |
          python - <<'PY'
          from pathlib import Path

          collection=Path('src/collection-ui.js')
          text=collection.read_text()
          old="host.classList.add('molecule-detail-return');host.tabIndex=0;host.setAttribute('role','button');host.setAttribute('aria-label',`${name}からグラフへ戻る`);let press=null;"
          new="host.classList.add('molecule-detail-return');host.dataset.moleculeId=record.id;host.tabIndex=0;host.setAttribute('role','button');host.setAttribute('aria-label',`${name}からグラフへ戻る`);let press=null;"
          if old not in text: raise SystemExit('collection-ui continuity anchor not found')
          collection.write_text(text.replace(old,new,1))

          graph=Path('src/encyclopedia-graph-view.js')
          text=graph.read_text()
          anchor="const detailVisualRect=host=>{const rect=rectOf(host);if(!rect)return null;const width=Math.min(240,Math.max(140,rect.width*.58)),height=width*78/96;return {left:rect.left+(rect.width-width)/2,top:rect.top+(rect.height-height)/2,width,height};};"
          replacement=anchor+"\nconst detailMoleculeId=(host,fallback)=>host?.dataset?.moleculeId||fallback;"
          if anchor not in text: raise SystemExit('graph detail helper anchor not found')
          text=text.replace(anchor,replacement,1)
          old="document.addEventListener('pointerup',event=>{const press=state.press;state.press=null;if(!press||press.pointerId!==event.pointerId||Date.now()-press.at>650||Math.hypot(event.clientX-press.x,event.clientY-press.y)>8||!state.focusId)return;const from=detailVisualRect(press.host);animateContinuity(document,state,state.focusId,from,()=>{const node=document.querySelector(`[data-graph-id=\"${state.focusId}\"]`),visual=node?.querySelector?.('.graph-focus-thumbnail')??node;return rectOf(visual);},{duration:520,waitMs:1300,win});},true);"
          new="document.addEventListener('pointerup',event=>{const press=state.press;state.press=null;if(!press||press.pointerId!==event.pointerId||Date.now()-press.at>650||Math.hypot(event.clientX-press.x,event.clientY-press.y)>8)return;const id=detailMoleculeId(press.host,state.focusId);if(!id)return;const from=detailVisualRect(press.host);animateContinuity(document,state,id,from,()=>{const node=document.querySelector(`[data-graph-id=\"${id}\"]`),visual=node?.querySelector?.('.graph-focus-thumbnail')??node;return rectOf(visual);},{duration:520,waitMs:1300,win});},true);"
          if old not in text: raise SystemExit('graph pointerup continuity anchor not found')
          text=text.replace(old,new,1)
          old="document.addEventListener('keydown',event=>{if(event.key!=='Enter'&&event.key!==' ')return;const host=event.target?.closest?.('.molecule-detail-return');if(!host||!state.focusId)return;animateContinuity(document,state,state.focusId,detailVisualRect(host),()=>{const node=document.querySelector(`[data-graph-id=\"${state.focusId}\"]`),visual=node?.querySelector?.('.graph-focus-thumbnail')??node;return rectOf(visual);},{duration:520,waitMs:1300,win});},true);"
          new="document.addEventListener('keydown',event=>{if(event.key!=='Enter'&&event.key!==' ')return;const host=event.target?.closest?.('.molecule-detail-return');if(!host)return;const id=detailMoleculeId(host,state.focusId);if(!id)return;animateContinuity(document,state,id,detailVisualRect(host),()=>{const node=document.querySelector(`[data-graph-id=\"${id}\"]`),visual=node?.querySelector?.('.graph-focus-thumbnail')??node;return rectOf(visual);},{duration:520,waitMs:1300,win});},true);"
          if old not in text: raise SystemExit('graph keydown continuity anchor not found')
          graph.write_text(text.replace(old,new,1))

          test=Path('tests/encyclopedia-graph-ui.test.mjs')
          text=test.read_text()
          anchor="assert.match(graphViewSource,/document\\.addEventListener\\('pointerup'[\\s\\S]*animateContinuity/,'Detail return must create its continuity visual from the still-visible Detail surface');"
          addition=anchor+"\nassert.match(collectionUISource,/host\\.dataset\\.moleculeId=record\\.id/,'Detail return surface must expose the currently rendered molecule ID');\nassert.match(graphViewSource,/const id=detailMoleculeId\\(press\\.host,state\\.focusId\\)/,'pre-switch bridge must follow Detail navigation instead of stale Graph focus');"
          if anchor not in text: raise SystemExit('encyclopedia continuity test anchor not found')
          test.write_text(text.replace(anchor,addition,1))
          PY
      - name: Focused regressions
        run: |
          node tests/encyclopedia-graph-ui.test.mjs
          node tests/signal-eligibility.test.mjs
          node tests/expedition-challenges.test.mjs
          node tests/oxygen-field-integration.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
      - name: Refresh PWA artifacts
        run: node scripts/build-precache.mjs
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/pr190-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/collection-ui.js src/encyclopedia-graph-view.js tests/encyclopedia-graph-ui.test.mjs precache-manifest.js sw.js .github/workflows/pr190-finalize.yml
          git diff --cached --check
          git commit -m "Finalize molecule continuity and refresh PWA"
          git push
