name: Task 2 PR fix runner

on:
  push:
    branches:
      - work/task2-ho-economy

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply stale contract fix
        id: apply
        shell: bash
        run: |
          if [[ ! -f .github/task2-pr-fix.py ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python .github/task2-pr-fix.py
          rm -f .github/task2-pr-fix.py
          echo "applied=true" >> "$GITHUB_OUTPUT"
      - name: Validate Oxygen and thermal regressions
        if: steps.apply.outputs.applied == 'true'
        run: |
          node tests/oxygen-field-integration.test.mjs
          node tests/propulsion-differentiation.test.mjs
          node tests/deep-oxygen-routes.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/expedition-core.test.mjs
          node scripts/export-field-map.mjs --check
          node scripts/build-precache.mjs --check
          node scripts/check-repository-hygiene.mjs
          git diff --check
      - name: Commit fix
        if: steps.apply.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Oxygen side economy integration contract"
          git push
