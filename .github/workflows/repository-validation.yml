name: Repository validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  aromatic-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shared aromatic geometry and Graph assets
        run: |
          node scripts/build-collection-assets.mjs
          git diff --exit-code -- assets/models/molecule-benzene.svg assets/models/molecule-pyridine.svg assets/models/molecule-furan.svg assets/models/molecule-tetrahydrofuran.svg
          node tests/aromatic-heterocycle-geometry.test.mjs
          node tests/aromatic-rendering-check.mjs vendor/three/three.module.min.js
          node scripts/build-precache.mjs
          git diff --exit-code -- sw.js precache-manifest.js

  six-member-conformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Six-member ring conformation and shared assets
        run: |
          node tests/six-member-ring-conformation.test.mjs
          node scripts/build-collection-assets.mjs
          git diff --exit-code -- assets/models/molecule-cyclohexane.svg assets/models/molecule-methylcyclohexane.svg assets/models/molecule-cyclohexanol.svg assets/models/molecule-cyclohexene.svg assets/models/molecule-cyclohexanone.svg assets/models/molecule-benzene.svg assets/models/molecule-pyridine.svg assets/models/molecule-furan.svg assets/models/molecule-tetrahydrofuran.svg assets/models/molecule-cyclopentane.svg assets/models/molecule-cyclobutane.svg
          node scripts/build-precache.mjs
          git diff --exit-code -- sw.js precache-manifest.js

  ring-visual-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ring geometry and visual calibration
        run: |
          node tests/ring-visual-calibration.test.mjs

  repository-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repository hygiene
        run: node tests/repository-hygiene.test.mjs
      - name: H / C revisit routes and H economy
        run: |
          node tests/hc-revisit-routes.test.mjs
          node tests/h-economy-balance.test.mjs
      - name: CHO FIELD integrated production baseline
        run: node tests/cho-field-polish.test.mjs
      - name: Current FIELD developer map
        run: |
          node tests/field-map-export.test.mjs
          node tests/nitrogen-field-map.test.mjs
      - name: FIELD hazard authority
        run: |
          node tests/field-hazard-taxonomy.test.mjs
          node tests/electrical-hazard.test.mjs
          node tests/electrical-hazard-browser.test.mjs
      - name: FIELD runtime allowlist
        run: node tests/field-runtime-allowlist.test.mjs
      - name: Post-Core Rare ecology and hazard treatments
        run: |
          node tests/rare-ecology.test.mjs
          node tests/rare-ecology-browser.test.mjs
          node tests/hazard-treatments.test.mjs
          node tests/abrasive-hazard.test.mjs
          node tests/hazard-treatments-browser.test.mjs
      - name: FIELD expansion proposal map
        run: node tests/field-expansion-proposal.test.mjs
      - name: Molecule graph / frontier
        run: |
          node scripts/build-molecule-db.mjs
          git diff --exit-code -- data/molecules.json
          node tests/ctfe-electrical-treatment.test.mjs
          node tests/molecule-graph.test.mjs
          node tests/molecule-frontier.test.mjs
          node tests/field-frontier-insight.test.mjs
          node tests/expedition-challenges.test.mjs
          node scripts/export-molecule-graph.mjs --check
      - name: Source contracts
        run: |
          node tests/source-contracts.test.mjs
          node tests/persistence-boundary-source-contract.test.mjs
      - name: Encyclopedia registration reveal
        run: |
          node tests/registration-reveal.test.mjs
          node tests/collection.test.mjs
          node tests/collection-expansion.test.mjs
          node tests/capability-unlock.test.mjs
      - name: Encyclopedia graph UI
        run: |
          node tests/encyclopedia-content-architecture.test.mjs
          node tests/encyclopedia-content-browser.test.mjs
          node tests/encyclopedia-chemistry-visuals.test.mjs
          node tests/encyclopedia-chemistry-visual-browser.test.mjs
          node tests/encyclopedia-graph-ui.test.mjs
          node tests/encyclopedia-graph-thumbnail-label.test.mjs
          node tests/encyclopedia-graph-thumbnail-label-browser.test.mjs
          node --test tests/encyclopedia-molecule-transition.test.mjs
          node tests/encyclopedia-transition-browser.test.mjs
      - name: Upload Encyclopedia chemistry visual frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-chemistry-visuals
          path: test-results/encyclopedia-chemistry-visuals
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Encyclopedia Graph thumbnail frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-graph-thumbnail-label
          path: test-results/encyclopedia-graph-thumbnail-label
          if-no-files-found: ignore
          retention-days: 7
      - name: Encyclopedia visible transition frames
        env:
          ENCYCLOPEDIA_CAPTURE: '1'
        run: node tests/encyclopedia-visible-transition-browser.test.mjs
      - name: Upload Encyclopedia transition frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-transition-frames
          path: test-results/encyclopedia-transition
          if-no-files-found: ignore
          retention-days: 7
      - name: Browser startup
        run: node tests/browser-startup.test.mjs
      - name: Molecule DB v2 persistence
        run: |
          node tests/collection-persistence.test.mjs
          node tests/resources-persistence.test.mjs
          node tests/tank-upgrades.test.mjs
      - name: Element authority / nitrogen chapter and FIELD
        run: |
          node tests/element-authority-n-foundation.test.mjs
          node tests/nitrogen-chapter-progression.test.mjs
          node tests/nitrogen-field-integration.test.mjs
          node tests/nitrogen-chapter-completion.test.mjs
          node tests/nitrogen-world-awakening.test.mjs
          node tests/nitrogen-chapter-browser.test.mjs
          node tests/nitrogen-loadout-balance.test.mjs
          node tests/nitrogen-visual-identity.test.mjs
          node tests/nitrogen-field-pickup-browser.test.mjs
          node tests/inventory-depletion.test.mjs
      - name: CRAFT input recovery
        run: |
          node tests/craft-controls-ui.test.mjs
          node tests/craft-history.test.mjs
          node tests/craft-tearoff.test.mjs
          node --test tests/craft-detached-drag.test.mjs
          node tests/craft-input-recovery.test.mjs
          node tests/game-shell-recovery.test.mjs
          node tests/craft-target-colors.test.mjs
          node tests/craft-target-satisfaction.test.mjs
          node --test tests/craft-target-hint.test.mjs
          node --test tests/craft-target-match.test.mjs
          node tests/craft-target-hint-browser.test.mjs
          node tests/resonance-formal-charge.test.mjs
          node tests/bond-state.test.mjs
          node tests/resonance-craft-interaction-browser.test.mjs
          node tests/resonance-visual-browser.test.mjs
          node tests/special-bonds-check.mjs
          node tests/aromatic-rendering-check.mjs vendor/three/three.module.min.js
      - name: Expedition insights
        run: |
          node tests/expedition-insights.test.mjs
          node tests/signal-eligibility.test.mjs
          node --test tests/critical-insight-freeze.test.mjs
          node tests/critical-insight-freeze-browser.test.mjs
      - name: Thermal and expedition regressions
        run: |
          node tests/propulsion-differentiation.test.mjs
          node tests/oxygen-routes.test.mjs
          node tests/oxygen-field-integration.test.mjs
          node tests/deep-oxygen-routes.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/expedition-core.test.mjs
          node tests/veil-loss-particles.test.mjs
          node tests/veil-return-effects.test.mjs
          node tests/dust-eater-forced-return.test.mjs
          node tests/dust-eater-forced-return-browser.test.mjs
          node tests/dust-eater-forced-return-ui-browser.test.mjs
      - name: Upload Dust Eater forced-return frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dust-eater-forced-return
          path: test-results/forced-return-presentation
          if-no-files-found: ignore
          retention-days: 7
      - name: Insight taxonomy and presentation
        run: |
          node tests/insight-category.test.mjs
          node tests/molecule-roles.test.mjs
          node tests/insight-presentation.test.mjs
          node tests/pending-craft.test.mjs
          node tests/veil-audio.test.mjs
      - name: Propulsion HUD regressions
        run: |
          node tests/loadout-preview.test.mjs
          node tests/shock-unit.test.mjs
          node tests/nitrogen-loadout-balance-browser.test.mjs
          node tests/loadout-card-order.test.mjs
          node tests/generic-propulsion.test.mjs
          node --test tests/combustion-residual-consumption.test.mjs
          node tests/combustion-residual-browser.test.mjs
          node tests/coolant-feedback.test.mjs
          node tests/propulsion-hud-source.test.mjs
      - name: UI de-explanation regressions
        run: |
          node tests/loadout-shortage-confirmation.test.mjs
          node tests/loadout-workstation.test.mjs
          node tests/loadout-transfer-browser.test.mjs
          node tests/loadout-mobile-fit-toggle-browser.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/issue-122-launch-route.test.mjs
          node tests/launch-request.test.mjs
          node tests/launch-transaction.test.mjs
          node tests/launch-selector.test.mjs
          node tests/launch-pointer-lifecycle.test.mjs
          node tests/ui-symbols.test.mjs
      - name: Generated PWA freshness
        run: node scripts/build-precache.mjs --check
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Whitespace errors in pull request diff
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
