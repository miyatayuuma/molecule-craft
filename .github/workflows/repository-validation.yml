name: Repository validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-precache-on-task-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Rebuild verified PWA release
        run: node scripts/build-precache.mjs
      - name: Commit generated release
        shell: bash
        run: |
          if git diff --quiet -- sw.js precache-manifest.js; then
            echo "Precache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git commit -m "Refresh PWA precache manifest"
          git push origin HEAD:${{ github.head_ref }}
