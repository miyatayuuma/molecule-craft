name: Repository validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  repository-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Align stale frontier element-access regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/field-frontier-insight.test.mjs')
          source=path.read_text()
          old="""// Graph visibility is broader than FIELD insight eligibility. A direct
          // neighbor that requires an element not yet unlocked by registered-molecule
          // progression stays visible in the Encyclopedia but cannot be selected as a
          // FIELD idea until that element unlocks. Regression: CH3F must wait for F.
          {
            const value=make({discoverRoots:false});
            value.setCatalog([{id:'fluoromethane',formula:'CH3F',atoms:['C','H','H','H','F']}]);
            value.state.progress.foundElements=['H','C','O'];
            value.state.recipes=['methane'];
            value.state.hints=graph.nodes.map(node=>node.id).filter(id=>id!=='fluoromethane');
            value.prepareExpedition({region:'veil',rng:()=>0});
            let diag=value.frontierInsightDiagnostics();assert.equal(diag.selectedCandidateId,null);assert.equal(diag.reason,'element-locked','F-containing frontier stays ineligible before the 15-registration F unlock');
            const fillers=graph.nodes.map(node=>node.id).filter(id=>id!=='methane'&&id!=='fluoromethane').slice(0,14);
            value.state.recipes=['methane',...fillers];
            value.prepareExpedition({region:'veil',rng:()=>0});
            diag=value.frontierInsightDiagnostics();assert.equal(diag.selectedCandidateId,'fluoromethane','the same graph frontier becomes eligible once F is unlocked');
          }
          """
          new="""// Graph visibility is broader than FIELD insight eligibility. A direct
          // neighbor that requires a gameplay-locked element stays visible in the
          // Encyclopedia but cannot be selected as a FIELD idea. Registered-molecule
          // counts are no longer an element-unlock authority. Regression: CH3F stays
          // locked until a future explicit F progression policy is connected.
          {
            const value=make({discoverRoots:false});
            value.setCatalog([{id:'fluoromethane',formula:'CH3F',atoms:['C','H','H','H','F']}]);
            value.state.progress.foundElements=['H','C','O'];
            value.state.recipes=['methane'];
            value.state.hints=graph.nodes.map(node=>node.id).filter(id=>id!=='fluoromethane');
            value.prepareExpedition({region:'veil',rng:()=>0});
            let diag=value.frontierInsightDiagnostics();assert.equal(diag.selectedCandidateId,null);assert.equal(diag.reason,'element-locked','F-containing frontier stays ineligible while F is gameplay-locked');
            const fillers=graph.nodes.map(node=>node.id).filter(id=>id!=='methane'&&id!=='fluoromethane').slice(0,14);
            value.state.recipes=['methane',...fillers];
            value.prepareExpedition({region:'veil',rng:()=>0});
            diag=value.frontierInsightDiagnostics();assert.equal(diag.selectedCandidateId,null,'discovery count cannot unlock F-containing frontier candidates');assert.equal(diag.reason,'element-locked');assert.equal(value.canUseElement('F'),false);
          }
          """
          if old not in source:
              raise SystemExit('stale frontier block not found')
          path.write_text(source.replace(old,new))
          PY
          git diff --check
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tests/field-frontier-insight.test.mjs
            git commit -m "Align frontier test with canonical element authority"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Repository hygiene
        run: node tests/repository-hygiene.test.mjs
      - name: H / C revisit routes and H economy
        run: |
          node tests/hc-revisit-routes.test.mjs
          node tests/h-economy-balance.test.mjs
      - name: CHO FIELD integrated production baseline
        run: node tests/cho-field-polish.test.mjs
      - name: Current FIELD developer map
        run: node tests/field-map-export.test.mjs
      - name: FIELD expansion proposal map
        run: node tests/field-expansion-proposal.test.mjs
      - name: Molecule graph / frontier
        run: |
          node tests/molecule-graph.test.mjs
          node tests/molecule-frontier.test.mjs
          node tests/field-frontier-insight.test.mjs
          node tests/expedition-challenges.test.mjs
          node scripts/export-molecule-graph.mjs --check
      - name: Source contracts
        run: |
          node tests/source-contracts.test.mjs
          node tests/persistence-boundary-source-contract.test.mjs
      - name: Encyclopedia registration reveal
        run: |
          node tests/registration-reveal.test.mjs
          node tests/collection.test.mjs
          node tests/collection-expansion.test.mjs
          node tests/capability-unlock.test.mjs
      - name: Encyclopedia graph UI
        run: node tests/encyclopedia-graph-ui.test.mjs
      - name: Browser startup
        run: node tests/browser-startup.test.mjs
      - name: Molecule DB v2 persistence
        run: |
          node tests/collection-persistence.test.mjs
          node tests/resources-persistence.test.mjs
      - name: Element authority / nitrogen resource foundation
        run: |
          node tests/element-authority-n-foundation.test.mjs
          node tests/inventory-depletion.test.mjs
      - name: CRAFT input recovery
        run: |
          node tests/craft-controls-ui.test.mjs
          node tests/craft-history.test.mjs
          node tests/craft-input-recovery.test.mjs
          node tests/game-shell-recovery.test.mjs
          node tests/craft-target-colors.test.mjs
          node tests/craft-target-satisfaction.test.mjs
      - name: Expedition insights
        run: |
          node tests/expedition-insights.test.mjs
          node tests/signal-eligibility.test.mjs
      - name: Thermal and expedition regressions
        run: |
          node tests/propulsion-differentiation.test.mjs
          node tests/oxygen-routes.test.mjs
          node tests/oxygen-field-integration.test.mjs
          node tests/deep-oxygen-routes.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/expedition-core.test.mjs
      - name: Insight taxonomy and presentation
        run: |
          node tests/insight-category.test.mjs
          node tests/molecule-roles.test.mjs
          node tests/insight-presentation.test.mjs
          node tests/pending-craft.test.mjs
          node tests/veil-audio.test.mjs
      - name: Propulsion HUD regressions
        run: |
          node tests/loadout-preview.test.mjs
          node tests/loadout-card-order.test.mjs
          node tests/generic-propulsion.test.mjs
          node tests/coolant-feedback.test.mjs
          node tests/propulsion-hud-source.test.mjs
      - name: UI de-explanation regressions
        run: |
          node tests/loadout-shortage-confirmation.test.mjs
          node tests/loadout-workstation.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/issue-122-launch-route.test.mjs
          node tests/launch-request.test.mjs
          node tests/launch-transaction.test.mjs
          node tests/launch-selector.test.mjs
          node tests/launch-pointer-lifecycle.test.mjs
          node tests/ui-symbols.test.mjs
      - name: Generated PWA freshness
        run: node scripts/build-precache.mjs --check
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Whitespace errors in pull request diff
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
