name: Repository validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Regenerate PWA artifacts
        run: node scripts/build-precache.mjs
      - name: Commit regenerated artifacts
        run: |
          if git diff --quiet -- sw.js precache-manifest.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js precache-manifest.js
          git commit -m "Refresh PWA release artifacts"
          git push origin HEAD:${{ github.head_ref }}
