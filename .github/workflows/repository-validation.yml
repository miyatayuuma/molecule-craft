name: Repository validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  aromatic-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shared aromatic geometry and Graph assets
        run: |
          node scripts/build-collection-assets.mjs
          git diff --exit-code -- assets/models/molecule-benzene.svg assets/models/molecule-pyridine.svg assets/models/molecule-furan.svg assets/models/molecule-tetrahydrofuran.svg
          node tests/aromatic-heterocycle-geometry.test.mjs
          node --test tests/aromatic-ring-closure-order.test.mjs tests/incomplete-carbon-geometry.test.mjs
          node tests/aromatic-rendering-check.mjs vendor/three/three.module.min.js
          node scripts/build-precache.mjs
          git diff --exit-code -- sw.js precache-manifest.js

  six-member-conformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Six-member ring conformation and shared assets
        run: |
          node tests/six-member-ring-conformation.test.mjs
          node scripts/build-collection-assets.mjs
          git diff --exit-code -- assets/models/molecule-cyclohexane.svg assets/models/molecule-methylcyclohexane.svg assets/models/molecule-cyclohexanol.svg assets/models/molecule-cyclohexene.svg assets/models/molecule-cyclohexanone.svg assets/models/molecule-benzene.svg assets/models/molecule-pyridine.svg assets/models/molecule-furan.svg assets/models/molecule-tetrahydrofuran.svg assets/models/molecule-cyclopentane.svg assets/models/molecule-cyclobutane.svg
          node scripts/build-precache.mjs
          git diff --exit-code -- sw.js precache-manifest.js

  ring-visual-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ring geometry and visual calibration
        run: |
          node tests/ring-visual-calibration.test.mjs
          node scripts/build-collection-assets.mjs
          git diff --exit-code -- assets/models/molecule-cyclopentane.svg assets/models/molecule-tetrahydrofuran.svg assets/models/molecule-cyclobutane.svg assets/models/molecule-cyclohexane.svg assets/models/molecule-benzene.svg assets/models/molecule-pyridine.svg assets/models/molecule-furan.svg
          node tests/ring-visual-calibration-browser.test.mjs
          node scripts/build-precache.mjs
          git diff --exit-code -- sw.js precache-manifest.js
      - name: Upload ring visual calibration frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ring-visual-calibration
          path: test-results/ring-visual-calibration
          if-no-files-found: ignore
          retention-days: 7

  repository-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repository hygiene
        run: |
          node scripts/check-repository-hygiene.mjs
          node tests/repository-hygiene.test.mjs
          node --test tests/reaction-lab-coverage-audit.test.mjs
          node --test tests/reaction-lab-core.test.mjs tests/reaction-lab-complete-catalog.test.mjs tests/reaction-lab-catalog-migration.test.mjs
          node --test tests/reaction-lab-discovery.test.mjs tests/reaction-lab-discovery-collection.test.mjs
          node --test tests/reaction-lab-generic-fixtures.test.mjs tests/reaction-lab-calibration.test.mjs
          node --test tests/reaction-lab-viewer-reservation.test.mjs
          node --test tests/reaction-lab-batch.test.mjs
          node --test tests/reaction-lab-manipulation.test.mjs
          node --test tests/reaction-lab-stage-a.test.mjs
          node --test tests/reaction-lab-stage-a-audit.test.mjs
          node scripts/audit-reaction-lab-stage-a.mjs --check
          node --test tests/reaction-lab-stage-b.test.mjs tests/reaction-lab-stage-b-audit.test.mjs tests/reaction-lab-stage-b-complete-calibration.test.mjs
          node scripts/audit-reaction-lab-stage-b.mjs --check
          node --test tests/reaction-lab-stage-b-gate.test.mjs
          node scripts/audit-reaction-lab-stage-b-gate.mjs --check
          node tests/reaction-lab-nonbonded.test.mjs
          python3 scripts/generate-reaction-lab-nonbonded.py --mode check
      - name: H / C revisit routes and H economy
        run: |
          node tests/hc-revisit-routes.test.mjs
          node tests/h-economy-balance.test.mjs
      - name: CHO FIELD integrated production baseline
        run: node tests/cho-field-polish.test.mjs
      - name: Current FIELD developer map
        run: |
          node tests/field-map-export.test.mjs
          node tests/nitrogen-field-map.test.mjs
      - name: FIELD hazard authority
        run: |
          node tests/field-hazard-taxonomy.test.mjs
          node tests/electrical-hazard.test.mjs
          node tests/electrical-hazard-browser.test.mjs
          node --test tests/shock-utility.test.mjs
          node tests/shock-utility-browser.test.mjs
      - name: FIELD runtime allowlist
        run: node tests/field-runtime-allowlist.test.mjs
      - name: Post-Core Rare ecology and hazard authority
        run: |
          node tests/rare-ecology.test.mjs
          node tests/rare-ecology-browser.test.mjs
          node tests/abrasive-hazard.test.mjs
          node tests/legacy-dock-retirement.test.mjs
          node tests/post-awakening-economy.test.mjs
      - name: FIELD expansion proposal map
        run: node tests/field-expansion-proposal.test.mjs
      - name: Molecule graph / frontier
        run: |
          node scripts/build-molecule-db.mjs
          git diff --exit-code -- data/molecules.json
          node tests/molecule-graph.test.mjs
          node tests/molecule-frontier.test.mjs
          node tests/field-frontier-insight.test.mjs
          node tests/expedition-challenges.test.mjs
          node scripts/export-molecule-graph.mjs --check
      - name: Source contracts
        run: |
          node tests/source-contracts.test.mjs
          node tests/persistence-boundary-source-contract.test.mjs
      - name: Encyclopedia registration reveal
        run: |
          node tests/registration-reveal.test.mjs
          node tests/collection.test.mjs
          node tests/collection-expansion.test.mjs
          node tests/collection-motifs.test.mjs
          node tests/part-presentation.test.mjs
          node tests/capability-unlock.test.mjs
      - name: Polymer catalog foundation
        run: node tests/polymer-catalog.test.mjs
      - name: Polymerization gameplay closure
        run: |
          node --test tests/polymerization-routes.test.mjs tests/reaction-graph-edits.test.mjs tests/reaction-lab-polymerization.test.mjs tests/reaction-lab-polymerization-fixtures.test.mjs tests/polymer-collection-persistence.test.mjs tests/polymer-collection.test.mjs tests/reaction-lab-polymer-discovery.test.mjs
          node tests/resources-persistence.test.mjs
          node scripts/build-collection-assets.mjs
          git diff --exit-code -- assets/models/molecule-*.svg assets/models/part-*.svg assets/models/polymer-*.svg
          node tests/collection-polymer-browser.test.mjs
          node tests/reaction-lab-polymer-browser.test.mjs
      - name: Encyclopedia graph UI
        run: |
          node tests/encyclopedia-content-architecture.test.mjs
          node tests/encyclopedia-content-browser.test.mjs
          node --test tests/encyclopedia-stereo-comparison.test.mjs
          node tests/encyclopedia-stereo-comparison-browser.test.mjs
          node tests/encyclopedia-chemistry-visuals.test.mjs
          node tests/encyclopedia-chemistry-visual-browser.test.mjs
          node tests/collection-motifs-parts-browser.test.mjs
          node tests/encyclopedia-graph-ui.test.mjs
          node tests/encyclopedia-graph-thumbnail-label.test.mjs
          node tests/encyclopedia-graph-thumbnail-label-browser.test.mjs
          node --test tests/encyclopedia-molecule-transition.test.mjs
          node tests/encyclopedia-transition-browser.test.mjs
      - name: Upload Encyclopedia stereo comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-stereo-comparison
          path: test-results/encyclopedia-stereo-comparison
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Encyclopedia chemistry visual frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-chemistry-visuals
          path: test-results/encyclopedia-chemistry-visuals
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Encyclopedia Graph thumbnail frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-graph-thumbnail-label
          path: test-results/encyclopedia-graph-thumbnail-label
          if-no-files-found: ignore
          retention-days: 7
      - name: Encyclopedia visible transition frames
        env:
          ENCYCLOPEDIA_CAPTURE: '1'
        run: node tests/encyclopedia-visible-transition-browser.test.mjs
      - name: Upload Encyclopedia transition frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedia-transition-frames
          path: test-results/encyclopedia-transition
          if-no-files-found: ignore
          retention-days: 7
      - name: Browser startup
        run: node tests/browser-startup.test.mjs
      - name: Molecule DB v2 persistence
        run: |
          node tests/collection-persistence.test.mjs
          node tests/resources-persistence.test.mjs
      - name: Element authority / nitrogen chapter and FIELD
        run: |
          node tests/element-authority-n-foundation.test.mjs
          node tests/nitrogen-chapter-progression.test.mjs
          node tests/nitrogen-field-integration.test.mjs
          node tests/nitrogen-chapter-completion.test.mjs
          node tests/nitrogen-world-awakening.test.mjs
          node tests/nitrogen-chapter-browser.test.mjs
          node tests/nitrogen-loadout-balance.test.mjs
          node tests/nitrogen-visual-identity.test.mjs
          node tests/nitrogen-field-pickup-browser.test.mjs
          node tests/inventory-depletion.test.mjs
      - name: CRAFT input recovery
        run: |
          node tests/craft-controls-ui.test.mjs
          node tests/craft-history.test.mjs
          node tests/craft-tearoff.test.mjs
          node --test tests/craft-detached-drag.test.mjs
          node tests/craft-input-recovery.test.mjs
          node tests/game-shell-recovery.test.mjs
          node tests/craft-target-colors.test.mjs
          node tests/craft-target-satisfaction.test.mjs
          node --test tests/craft-target-hint.test.mjs
          node --test tests/craft-target-match.test.mjs
          node tests/recognition.test.mjs
          node --test tests/alkene-relative-side.test.mjs
          node --test tests/craft-stereo-observation.test.mjs
          node tests/craft-stereo-observation-browser.test.mjs
          node tests/craft-target-hint-browser.test.mjs
          node tests/craft-target-order-browser.test.mjs
          node tests/resonance-formal-charge.test.mjs
          node tests/bond-state.test.mjs
          node tests/resonance-craft-interaction-browser.test.mjs
          node tests/resonance-visual-browser.test.mjs
          node tests/special-bonds-check.mjs
          node tests/aromatic-rendering-check.mjs vendor/three/three.module.min.js
      - name: Upload CRAFT stereo observation frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craft-stereo-observation
          path: test-results/craft-stereo-observation
          if-no-files-found: ignore
          retention-days: 7
      - name: Expedition insights
        run: |
          node tests/expedition-insights.test.mjs
          node tests/signal-eligibility.test.mjs
          node --test tests/critical-insight-freeze.test.mjs
          node tests/critical-insight-freeze-browser.test.mjs
      - name: Thermal and expedition regressions
        run: |
          node tests/propulsion-differentiation.test.mjs
          node tests/oxygen-routes.test.mjs
          node tests/oxygen-field-integration.test.mjs
          node tests/deep-oxygen-routes.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/veil-loss-particles.test.mjs
      - name: Upload Dust Eater forced-return frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dust-eater-forced-return
          path: test-results/forced-return-presentation
          if-no-files-found: ignore
          retention-days: 7
      - name: Insight taxonomy and presentation
        run: |
          node tests/insight-category.test.mjs
          node tests/molecule-roles.test.mjs
          node tests/insight-presentation.test.mjs
          node tests/pending-craft.test.mjs
          node tests/veil-audio.test.mjs
      - name: Propulsion HUD regressions
        run: |
          node tests/loadout-preview.test.mjs
          node tests/shock-unit.test.mjs
          node tests/nitrogen-loadout-balance-browser.test.mjs
          node tests/loadout-card-order.test.mjs
          node tests/generic-propulsion.test.mjs
          node --test tests/combustion-residual-consumption.test.mjs
          node tests/combustion-residual-browser.test.mjs
          node tests/coolant-feedback.test.mjs
          node tests/propulsion-hud-source.test.mjs
      - name: UI de-explanation regressions
        run: |
          node tests/loadout-shortage-confirmation.test.mjs
          node tests/loadout-workstation.test.mjs
          node tests/loadout-transfer-browser.test.mjs
          node tests/loadout-mobile-fit-toggle-browser.test.mjs
          node tests/reaction-lab-browser.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/issue-122-launch-route.test.mjs
          node tests/launch-request.test.mjs
          node tests/launch-transaction.test.mjs
          node tests/launch-selector.test.mjs
          node tests/launch-pointer-lifecycle.test.mjs
          node tests/ui-symbols.test.mjs
      - name: Generated PWA freshness
        run: node scripts/build-precache.mjs --check
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Whitespace errors in pull request diff
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

  loadout-optical-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: LOADOUT geometry authority
        run: node tests/loadout-schematic.test.mjs
      - name: LOADOUT 390x844 optical acceptance
        env:
          LOADOUT_CAPTURE: '1'
        run: node tests/loadout-optical-alignment-browser.test.mjs
      - name: LOADOUT reduced-motion acceptance
        env:
          LOADOUT_REDUCED_MOTION: '1'
        run: node tests/loadout-optical-alignment-browser.test.mjs
      - name: Upload LOADOUT optical acceptance frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadout-optical-alignment
          path: test-results/loadout-optical-alignment
          if-no-files-found: ignore
          retention-days: 7

  field-return-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FIELD return lifecycle and PWA regressions
        run: |
          node --test tests/expedition-loop-integration.test.mjs
          node tests/expedition-core.test.mjs
          node tests/cho-campaign.test.mjs
          node tests/safe-extraction-site.test.mjs
          node tests/return-ux-contract.test.mjs
          node tests/safe-extraction-browser.test.mjs
          node tests/veil-return-effects.test.mjs
          node tests/dust-eater-forced-return.test.mjs
          node tests/dust-eater-forced-return-browser.test.mjs
          node tests/dust-eater-forced-return-ui-browser.test.mjs
          node tests/pwa.test.mjs
          node scripts/build-precache.mjs --check

  field-particle-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHROME_BIN: /tmp/field-p5-chrome/chrome-linux64/chrome
      FIELD_CHROME_ARGS: '["--use-gl=angle","--use-angle=swiftshader","--enable-unsafe-swiftshader","--disable-dev-shm-usage"]'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fixed P1-P4 Chromium version
        run: |
          mkdir -p /tmp/field-p5-chrome
          curl --fail --retry 3 -L https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.0/linux64/chrome-linux64.zip -o /tmp/field-p5-chrome/chrome.zip
          unzip -q /tmp/field-p5-chrome/chrome.zip -d /tmp/field-p5-chrome
      - name: FIELD deterministic gameplay and Canvas counter authority
        run: node --test tests/field-particle-performance.test.mjs tests/field-particle-render-counters.test.mjs tests/dust-spatial-index.test.mjs tests/dynamic-dust-registry.test.mjs tests/renderer-spatial-query.test.mjs tests/field-renderer-profile.test.mjs tests/field-profile-authority.test.mjs
      - name: FIELD mobile work and descriptive timing benchmark
        run: |
          node scripts/benchmark-field-particles.mjs
          node scripts/check-field-visual-baseline.mjs
      - name: FIELD integrated profile and stable raw authority
        run: |
          FIELD_PROFILE_MODE=coarse FIELD_PROFILE_OUTPUT=test-results/field-particle-p5/coarse node scripts/profile-field-particles.mjs
          node scripts/summarize-field-profile.mjs test-results/field-particle-p5/coarse/raw.json.gz test-results/field-particle-p5/coarse/aggregate.json
          FIELD_PROFILE_MODE=components FIELD_PROFILE_OUTPUT=test-results/field-particle-p5/components node scripts/profile-field-particles.mjs
          node scripts/summarize-field-profile.mjs test-results/field-particle-p5/components/raw.json.gz test-results/field-particle-p5/components/aggregate.json
      - name: FIELD historical comparison in the same browser session
        run: |
          git fetch origin da356db2d1f86f1d6b2e0533e07a4af7cad36030 a331c09c52a9579a8f4d7016402aa57028af9b42 53ddf5c0fa766fd0cdf35375a2f7e0679612753f eda186afb36a485f9f4becf472c4faa9a95ede9c
          git worktree add --detach /tmp/field-p5-p1 da356db2d1f86f1d6b2e0533e07a4af7cad36030
          git worktree add --detach /tmp/field-p5-p2 a331c09c52a9579a8f4d7016402aa57028af9b42
          git worktree add --detach /tmp/field-p5-p3 53ddf5c0fa766fd0cdf35375a2f7e0679612753f
          git worktree add --detach /tmp/field-p5-p4 eda186afb36a485f9f4becf472c4faa9a95ede9c
          FIELD_PROFILE_MODE=history FIELD_PROFILE_ROOTS='{"p1":"/tmp/field-p5-p1","p2":"/tmp/field-p5-p2","p3":"/tmp/field-p5-p3","p4":"/tmp/field-p5-p4"}' FIELD_PROFILE_OUTPUT=test-results/field-particle-p5/history node scripts/profile-field-particles.mjs
          node scripts/summarize-field-profile.mjs test-results/field-particle-p5/history/raw.json.gz test-results/field-particle-p5/history/aggregate.json
      - name: Upload FIELD measurements and comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-particle-performance
          path: |
            test-results/field-particle-p1
            test-results/field-particle-p5
          if-no-files-found: error
          retention-days: 14
