name: Repository validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  repository-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Refresh challenge-derived sources
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/export-field-map.mjs')
          text=path.read_text()
          text=text.replace("import {EXPEDITION_CHALLENGES,challengeCenter} from '../src/veil/expedition-challenges.js';", "import {EXPEDITION_CHALLENGES,challengeCenter,challengeWidthAt} from '../src/veil/expedition-challenges.js';")
          text=text.replace("const left=ys.map(y=>({x:challengeCenter(zone,y)-zone.width,y}));", "const left=ys.map(y=>({x:challengeCenter(zone,y)-challengeWidthAt(zone,y),y}));")
          text=text.replace("const right=[...ys].reverse().map(y=>({x:challengeCenter(zone,y)+zone.width,y}));", "const right=[...ys].reverse().map(y=>({x:challengeCenter(zone,y)+challengeWidthAt(zone,y),y}));")
          path.write_text(text)
          PY
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
          if ! git diff --quiet -- scripts/export-field-map.mjs docs/maps/current-field.svg precache-manifest.js sw.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/export-field-map.mjs docs/maps/current-field.svg precache-manifest.js sw.js
            git commit -m "Follow tapered challenge geometry in FIELD map"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Repository hygiene
        run: node tests/repository-hygiene.test.mjs
      - name: Current FIELD developer map
        run: node tests/field-map-export.test.mjs
      - name: FIELD expansion proposal map
        run: node tests/field-expansion-proposal.test.mjs
      - name: Source contracts
        run: |
          node tests/source-contracts.test.mjs
          node tests/persistence-boundary-source-contract.test.mjs
      - name: Encyclopedia registration reveal
        run: |
          node tests/registration-reveal.test.mjs
          node tests/collection.test.mjs
          node tests/collection-expansion.test.mjs
          node tests/capability-unlock.test.mjs
      - name: CRAFT input recovery
        run: |
          node tests/craft-controls-ui.test.mjs
          node tests/craft-history.test.mjs
          node tests/craft-input-recovery.test.mjs
          node tests/game-shell-recovery.test.mjs
          node tests/craft-target-colors.test.mjs
      - name: Expedition insights
        run: |
          node tests/expedition-insights.test.mjs
          node tests/signal-eligibility.test.mjs
      - name: Thermal and expedition regressions
        run: |
          node tests/oxygen-field-integration.test.mjs
          node tests/deep-oxygen-routes.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/thermal-coolant.test.mjs
          node tests/expedition-core.test.mjs
      - name: Insight taxonomy and presentation
        run: |
          node tests/insight-category.test.mjs
          node tests/molecule-roles.test.mjs
          node tests/insight-presentation.test.mjs
          node tests/pending-craft.test.mjs
          node tests/veil-audio.test.mjs
      - name: Propulsion HUD regressions
        run: |
          node tests/loadout-preview.test.mjs
          node tests/loadout-card-order.test.mjs
          node tests/generic-propulsion.test.mjs
          node tests/coolant-feedback.test.mjs
          node tests/propulsion-hud-source.test.mjs
      - name: Generated PWA freshness
        run: node scripts/build-precache.mjs --check
      - name: PWA integrity
        run: node tests/pwa.test.mjs
      - name: Whitespace errors in pull request diff
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
