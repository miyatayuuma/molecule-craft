name: Oxygen Entry generated assets

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.head_ref == 'field-map-oxygen-entry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Regenerate tracked assets
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: FIELD map contracts
        run: |
          node tests/field-map-export.test.mjs
          node scripts/export-field-map.mjs --check
      - name: Proposal freshness
        run: node scripts/export-field-expansion-proposal.mjs --check
      - name: Vortex contracts
        run: node tests/vortex-route.test.mjs
      - name: Capture Oxygen Network diagnostics
        run: node tests/oxygen-routes.test.mjs > oxygen-routes-ci.log 2>&1 || true
      - name: Commit diagnostic snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/maps/current-field.svg precache-manifest.js oxygen-routes-ci.log
          git commit -m "Capture Oxygen Entry generated assets and diagnostics"
          git push origin HEAD:${{ github.head_ref }}
