name: Oxygen Entry generated assets

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.head_ref == 'field-map-oxygen-entry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Capture Growth diagnostics
        run: node tests/growth.test.mjs > growth-ci.log 2>&1 || true
      - name: Commit diagnostic snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth-ci.log
          git commit -m "Capture Growth diagnostics"
          git push origin HEAD:${{ github.head_ref }}
