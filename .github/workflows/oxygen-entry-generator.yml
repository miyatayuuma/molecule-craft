name: Oxygen Entry generated assets

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.head_ref == 'field-map-oxygen-entry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Regenerate tracked assets
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: FIELD map contracts
        run: |
          node tests/field-map-export.test.mjs
          node scripts/export-field-map.mjs --check
      - name: Proposal freshness
        run: node scripts/export-field-expansion-proposal.mjs --check
      - name: Vortex contracts
        run: node tests/vortex-route.test.mjs
      - name: Oxygen Network regressions
        run: node tests/oxygen-routes.test.mjs
      - name: Growth regressions
        run: node tests/growth.test.mjs
      - name: Spawn layout regressions
        run: node tests/spawn-layout.test.mjs
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: PWA freshness
        run: node scripts/build-precache.mjs --check
      - name: Whitespace check
        run: git diff --check
      - name: Commit generated assets and remove temporary diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oxygen-entry-generator.yml oxygen-routes-ci.log
          git add -A
          git commit -m "Finalize Oxygen Entry generated assets"
          git push origin HEAD:${{ github.head_ref }}
