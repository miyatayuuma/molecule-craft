name: Oxygen Entry baseline diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline-diagnostics:
    if: github.head_ref == 'field-map-oxygen-entry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d861ebab6b155460cad0a7ee55436e6602e49f4a
          path: baseline
      - name: Confirm pre-existing Growth stale assertion
        shell: bash
        run: |
          set +e
          (cd baseline && node tests/growth.test.mjs) > /tmp/growth-base.log 2>&1
          status=$?
          set -e
          cat /tmp/growth-base.log
          test "$status" -ne 0
          grep -F "assert.ok(resources.state.hints.includes('hydrogen'))" /tmp/growth-base.log
      - name: Confirm pre-existing Oxygen routes stale import
        shell: bash
        run: |
          set +e
          (cd baseline && node tests/oxygen-routes.test.mjs) > /tmp/oxygen-base.log 2>&1
          status=$?
          set -e
          cat /tmp/oxygen-base.log
          test "$status" -ne 0
          grep -F "src/veil/propulsion-guide.js" /tmp/oxygen-base.log
          grep -F "ERR_MODULE_NOT_FOUND" /tmp/oxygen-base.log
