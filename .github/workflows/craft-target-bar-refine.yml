name: craft-target-bar-refine
on:
  push:
    branches:
      - craft-target-bar-refine
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: craft-target-bar-refine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply target bar patch
        run: python scripts/tmp-craft-target-bar-refine.py
      - name: Focused validation
        run: |
          node --check src/app.js
          node --check src/craft-panel.js
          node tests/craft-target-display.test.mjs
          node tests/craft-decomposition.test.mjs
          node tests/craft-workspace.test.mjs
          node tests/source-contracts.test.mjs
      - name: Offline and hygiene validation
        run: |
          node scripts/build-precache.mjs
          node tests/pwa.test.mjs
          node scripts/check-repository-hygiene.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/craft-target-bar-refine.yml scripts/tmp-craft-target-bar-refine.py
          git add -A
          git commit -m "Refine craft target material bar"
          git push origin HEAD:craft-target-bar-refine