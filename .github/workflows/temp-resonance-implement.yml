name: Temporary resonance implementation
on:
  push:
    branches: [feature/resonance-formal-charge-nitro-ozone]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Implement supported resonance foundation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text: raise SystemExit(f'pattern missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          Path('src/resonance-model.js').write_text(r'''// Minimal formal-charge/resonance authority for explicitly supported motifs.
// This is intentionally not a general ionic-chemistry or formal-charge solver.
const pairKey=(a,b)=>String(a)<String(b)?`${a}:${b}`:`${b}:${a}`;

function graphOf(source){
  const atoms=(source?.atoms??[]).map((atom,index)=>({id:typeof atom==='string'?index:(atom?.id??index),element:typeof atom==='string'?atom:atom?.element}));
  const byIndex=atoms,byId=new Map(atoms.map(atom=>[atom.id,atom])),adjacency=new Map(atoms.map(atom=>[atom.id,[]])),bonds=[];
  for(const raw of source?.bonds??[]){
    let a,b,order;if(Array.isArray(raw)){a=byIndex[raw[0]]?.id;b=byIndex[raw[1]]?.id;order=raw[2];}else{a=raw?.a;b=raw?.b;order=raw?.order;}
    if(!byId.has(a)||!byId.has(b)||a===b||![1,2,3].includes(order))continue;
    bonds.push({a,b,order});adjacency.get(a).push({id:b,order});adjacency.get(b).push({id:a,order});
  }
  return{atoms,byId,adjacency,bonds};
}
const terminalO=(graph,id)=>graph.byId.get(id)?.element==='O'&&(graph.adjacency.get(id)?.length??0)===1;

export function supportedResonanceGroups(source){
  const graph=graphOf(source),groups=[];
  for(const center of graph.atoms){
    const ns=graph.adjacency.get(center.id)??[];
    if(center.element==='N'&&ns.length===3){
      const oxo=ns.filter(n=>terminalO(graph,n.id)),other=ns.filter(n=>!oxo.includes(n));
      const orders=oxo.map(n=>n.order).sort((a,b)=>a-b);
      if(oxo.length===2&&other.length===1&&graph.byId.get(other[0].id)?.element==='C'&&other[0].order===1&&orders[0]===1&&orders[1]===2){
        const negative=oxo.find(n=>n.order===1).id;
        groups.push({kind:'nitro',center:center.id,ends:oxo.map(n=>n.id),negative,charges:new Map([[center.id,1],[negative,-1]])});
      }
    }
    if(center.element==='O'&&ns.length===2&&ns.every(n=>terminalO(graph,n.id))){
      const orders=ns.map(n=>n.order).sort((a,b)=>a-b);
      if(orders[0]===1&&orders[1]===2){
        const negative=ns.find(n=>n.order===1).id;
        groups.push({kind:'ozone',center:center.id,ends:ns.map(n=>n.id),negative,charges:new Map([[center.id,1],[negative,-1]])});
      }
    }
  }
  return groups;
}

export function supportedAtomState(source,id){
  for(const group of supportedResonanceGroups(source)){
    if(group.center===id)return group.kind==='ozone'?{charge:1,singles:0,pairs:1,kind:group.kind}:{charge:1,singles:0,pairs:0,kind:group.kind};
    if(group.negative===id)return{charge:-1,singles:0,pairs:3,kind:group.kind};
  }
  return null;
}

export function supportsResonanceBondUpgrade(source,a,b){
  const graph=graphOf(source),key=pairKey(a,b),bond=graph.bonds.find(item=>pairKey(item.a,item.b)===key);
  if(!bond||bond.order!==1)return false;
  const projected={atoms:graph.atoms,bonds:graph.bonds.map(item=>({a:item.a,b:item.b,order:item===bond?2:item.order}))};
  return supportedResonanceGroups(projected).some(group=>group.center===a&&group.ends.includes(b)||group.center===b&&group.ends.includes(a));
}
''')

          # Reuse the established sulfur shared-bond renderer for supported nitro/ozone motifs.
          p=Path('src/special-bonds.js'); text=p.read_text()
          marker='export const specialEdgeKeys = groups => new Set(groups.flatMap(g => g.ends.map(id => `${Math.min(g.center,id)}:${Math.max(g.center,id)}`)));'
          pos=text.index(marker)
          suffix=text[pos+len(marker):]
          head=r'''import {supportedResonanceGroups} from './resonance-model.js?v=1';

// Qualitative resonance notation, not an electron trajectory or orbital density.
// Existing sulfur oxo groups keep their visual contract; nitro and ozone share
// the same display primitive while formal charges are derived separately.
function sulfurOxoGroups(molecule) {
  return molecule.atoms.filter(a => a.element === 'S').flatMap(atom => {
    const ns = molecule.neighbors(atom.id), used = molecule.bondOrderForAtom(atom.id);
    if (![4,6].includes(used)) return [];
    const ends = ns.filter(n => n.order === 2 && molecule.atoms.find(a => a.id === n.atomId)?.element === 'O' && molecule.neighbors(n.atomId).length === 1).map(n => n.atomId);
    return ends.length >= 2 ? [{ kind:'sulfur-oxo', center: atom.id, ends }] : [];
  });
}
export function sharedOxoGroups(molecule) { return [...sulfurOxoGroups(molecule),...supportedResonanceGroups(molecule)]; }
export const specialEdgeKeys = groups => new Set(groups.flatMap(g => g.ends.map(id => `${Math.min(g.center,id)}:${Math.max(g.center,id)}`)));'''
          p.write_text(head+suffix)

          # Validation accepts only complete supported charged motifs, never a global N/O valence expansion.
          replace_once('src/chemistry.js','export const ELEMENTS = {',"import {supportedAtomState} from './resonance-model.js?v=1';\n\nexport const ELEMENTS = {")
          replace_once('src/chemistry.js','if (used > max && !isCarbonMonoxideException(this, used)) {','if (used > max && !isCarbonMonoxideException(this, used) && !supportedAtomState(this, atom.id)) {')
          replace_once('src/chemistry.js','return !ELEMENTS[atom.element].valences.includes(used) && !isCarbonMonoxideException(this, used);','return !ELEMENTS[atom.element].valences.includes(used) && !isCarbonMonoxideException(this, used) && !supportedAtomState(this, atom.id);')

          # Bonding can finish the one extra bond that creates a supported motif;
          # completed charged atoms expose chemically appropriate lone-pair/charge state.
          replace_once('src/bonding-model.js','export const ATOMIC_MODEL = {',"import {supportedAtomState,supportsResonanceBondUpgrade} from './resonance-model.js?v=1';\n\nexport const ATOMIC_MODEL = {")
          replace_once('src/bonding-model.js',"  if (carbonMonoxidePartner(molecule, id)) return { singles: 0, pairs: 1, charge: atom.element === 'C' ? -1 : 1, sites: [] };\n  const singles = unpairedElectronCount(atom.element, used), pairs = lonePairCount(atom.element, used);",
            "  if (carbonMonoxidePartner(molecule, id)) return { singles: 0, pairs: 1, charge: atom.element === 'C' ? -1 : 1, sites: [] };\n  const supported=supportedAtomState(molecule,id);if(supported)return{singles:supported.singles,pairs:supported.pairs,charge:supported.charge,sites:[]};\n  const singles = unpairedElectronCount(atom.element, used), pairs = lonePairCount(atom.element, used);")
          replace_once('src/bonding-model.js',"  const donor = carbonMonoxidePartner(molecule, a, 2)?.id === b;\n  if (donor) return { allowed: true, order: 3, kind: 'pair', donorId: left.element === 'O' ? a : b };",
            "  const donor = carbonMonoxidePartner(molecule, a, 2)?.id === b;\n  if (donor) return { allowed: true, order: 3, kind: 'pair', donorId: left.element === 'O' ? a : b };\n  if(order===1&&supportsResonanceBondUpgrade(molecule,a,b))return{allowed:true,order:2,kind:'extension'};")
          replace_once('src/bonding-model.js',"    const allowed = ATOMIC_MODEL[atom.element]?.preferredValences ?? [1];\n    const nearest = Math.min(...allowed.map(v => Math.abs(v - used)));\n    const excess = Math.max(0, used - Math.max(...allowed));\n    penalty += nearest * nearest * 6 + excess * excess * 40;",
            "    const allowed = ATOMIC_MODEL[atom.element]?.preferredValences ?? [1],supported=supportedAtomState(molecule,atom.id);\n    const nearest = supported?0:Math.min(...allowed.map(v => Math.abs(v - used)));\n    const excess = supported?0:Math.max(0, used - Math.max(...allowed));\n    penalty += nearest * nearest * 6 + excess * excess * 40;")

          # Molecule generator: keep the canonical Lewis form explicit in DB metadata.
          replace_once('scripts/build-molecule-db.mjs',
            'function add({ id, nameJa, nameEn, aliases = [], category, atoms, bonds, valences = {}, iupacNameEn, learningNote, stereochemistry }) {',
            'function add({ id, nameJa, nameEn, aliases = [], category, atoms, bonds, valences = {}, formalCharges = null, resonanceGroups = null, iupacNameEn, learningNote, stereochemistry }) {')
          replace_once('scripts/build-molecule-db.mjs',
            "  molecules.push({ id, nameJa, nameEn, ...(aliases.length ? { aliases } : {}), atoms: expandedAtoms, bonds: expandedBonds, formula: formulaFor(expandedAtoms), category, ...(iupacNameEn?{iupacNameEn,commonNameJa:nameJa,commonNameEn:nameEn}:{}), ...(learningNote?{learningNote}:{}), ...(stereochemistry?{stereochemistry}:{}) });",
            "  molecules.push({ id, nameJa, nameEn, ...(aliases.length ? { aliases } : {}), atoms: expandedAtoms, bonds: expandedBonds, formula: formulaFor(expandedAtoms), category, ...(formalCharges?{formalCharges}:{}), ...(resonanceGroups?.length?{resonanceGroups}:{}), ...(iupacNameEn?{iupacNameEn,commonNameJa:nameJa,commonNameEn:nameEn}:{}), ...(learningNote?{learningNote}:{}), ...(stereochemistry?{stereochemistry}:{}) });")

          additions=r'''
// Supported formal-charge / resonance molecules. Canonical DB forms use one
// valid Lewis contributor; runtime recognition accepts the equivalent placement.
add({ id:'ozone', nameJa:'オゾン', nameEn:'Ozone', aliases:['trioxygen'], atoms:['O','O','O'], bonds:[[0,1,2],[1,2,1]], valences:{0:2,1:3,2:1}, formalCharges:{1:1,2:-1}, resonanceGroups:[{kind:'ozone',center:1,ends:[0,2]}], category:'basic-inorganic', iupacNameEn:'Trioxygen', learningNote:'3個の酸素原子からなる分子。2本のO–O結合は等価な共鳴として表せ、中央Oと末端Oに形式電荷を持つLewis構造で扱う。' });
add({ id:'nitromethane', nameJa:'ニトロメタン', nameEn:'Nitromethane', atoms:['C','N','O','O'], bonds:[[0,1,1],[1,2,2],[1,3,1]], valences:{1:4,3:1}, formalCharges:{1:1,3:-1}, resonanceGroups:[{kind:'nitro',center:1,ends:[2,3]}], category:'nitrogen-compounds', iupacNameEn:'Nitromethane', learningNote:'最小のニトロ化合物。N⁺とO⁻を含む2つの等価なLewis構造でニトロ基の共鳴を比べられる。' });

function nitroAromatic(nitroPositions,{methyl=false}={}){
  const graph=aromatic(),valences={},formalCharges={},resonanceGroups=[];
  if(methyl){const methylIndex=graph.atoms.length;graph.atoms.push('C');graph.bonds.push([0,methylIndex,1]);}
  for(const ringIndex of nitroPositions){const n=graph.atoms.length;graph.atoms.push('N','O','O');graph.bonds.push([ringIndex,n,1],[n,n+1,2],[n,n+2,1]);valences[n]=4;valences[n+2]=1;formalCharges[n]=1;formalCharges[n+2]=-1;resonanceGroups.push({kind:'nitro',center:n,ends:[n+1,n+2]});}
  return{...graph,valences,formalCharges,resonanceGroups};
}
add({ id:'nitrobenzene', nameJa:'ニトロベンゼン', nameEn:'Nitrobenzene', ...nitroAromatic([0]), category:'nitrogen-compounds', iupacNameEn:'Nitrobenzene', learningNote:'ベンゼン環にニトロ基が1つ結合した芳香族化合物。芳香環の共鳴とニトロ基内部の共鳴を同じ構造上で観察できる。' });
add({ id:'2-nitrotoluene', nameJa:'2-ニトロトルエン', nameEn:'2-Nitrotoluene', aliases:['o-nitrotoluene'], ...nitroAromatic([1],{methyl:true}), category:'nitrogen-compounds', iupacNameEn:'1-Methyl-2-nitrobenzene', learningNote:'トルエンのメチル基に隣接してニトロ基を持つ。ニトロ置換を1段ずつ増やす系列の入口。' });
add({ id:'2-4-dinitrotoluene', nameJa:'2,4-ジニトロトルエン', nameEn:'2,4-Dinitrotoluene', aliases:['2,4-DNT'], ...nitroAromatic([1,3],{methyl:true}), category:'nitrogen-compounds', iupacNameEn:'1-Methyl-2,4-dinitrobenzene', learningNote:'トルエン環にニトロ基が2つ入った化合物。各ニトロ基はそれぞれ等価な2つの共鳴Lewis構造を持つ。' });
add({ id:'2-4-6-trinitrotoluene', nameJa:'2,4,6-トリニトロトルエン', nameEn:'2,4,6-Trinitrotoluene', aliases:['TNT'], ...nitroAromatic([1,3,5],{methyl:true}), category:'nitrogen-compounds', iupacNameEn:'1-Methyl-2,4,6-trinitrobenzene', learningNote:'TNTとして知られる芳香族ニトロ化合物。この図鑑では用途ではなく、段階的なニトロ置換と複数ニトロ基の共鳴構造を扱う。' });
'''
          replace_once('scripts/build-molecule-db.mjs','if (molecules.length !== 129) throw new Error(`Production molecule inventory drifted: ${molecules.length}`);',additions+'\nif (molecules.length !== 135) throw new Error(`Production molecule inventory drifted: ${molecules.length}`);')

          # recognition.test imports the real module now that chemistry has a local dependency.
          p=Path('tests/recognition.test.mjs'); text=p.read_text()
          text=text.replace("const source = await readFile(new URL('../src/chemistry.js', import.meta.url), 'utf8');\nconst chemistry = await import(`data:text/javascript;base64,${Buffer.from(source).toString('base64')}`);","const chemistry = await import(new URL('../src/chemistry.js?recognition-test=1', import.meta.url));")
          p.write_text(text)
          PY

          node scripts/build-molecule-db.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const graph=JSON.parse(fs.readFileSync('data/molecule-graph.json','utf8'));
          const nodeIndex=new Map(graph.nodes.map((row,index)=>[row[0],index]));
          const newNodes=[
            ['ozone',1,'B',1,1,4,'O1',[5],[]],
            ['nitromethane',16,'B',1,1,1,'F.7,C.5',[7],[]],
            ['nitrobenzene',16,'B',9,4,8,'D1,F.6',[7,1],[]],
            ['2-nitrotoluene',16,'B',9,4,7,'D1,F.7',[7,1],[]],
            ['2-4-dinitrotoluene',16,'B',10,5,7,'D1,F.8',[7,1],[]],
            ['2-4-6-trinitrotoluene',16,'L',11,5,7,'D1,F.9',[7,1],[]],
          ];
          for(const row of newNodes)if(!nodeIndex.has(row[0])){nodeIndex.set(row[0],graph.nodes.length);graph.nodes.push(row);}
          const specs=[['oxygen','ozone',2],['methane','nitromethane',7],['benzene','nitrobenzene',7],['toluene','2-nitrotoluene',7],['2-nitrotoluene','2-4-dinitrotoluene',7],['2-4-dinitrotoluene','2-4-6-trinitrotoluene',7]];
          const edgeKey=(a,b,r)=>`${Math.min(a,b)}:${Math.max(a,b)}:${r}`;
          const existing=new Set(graph.edges.map(([a,b,r])=>edgeKey(a,b,r)));
          for(const[from,to,relation]of specs){const a=nodeIndex.get(from),b=nodeIndex.get(to),key=edgeKey(a,b,relation);if(!existing.has(key)){graph.edges.push([a,b,relation]);existing.add(key);}}
          const connectionColumn=graph.nodeColumns.indexOf('connectionEdgeIndexes');for(const row of graph.nodes)row[connectionColumn]=[];
          graph.edges.forEach(([a,b],index)=>{graph.nodes[a][connectionColumn].push(index);graph.nodes[b][connectionColumn].push(index);});
          fs.writeFileSync('data/molecule-graph.json',JSON.stringify(graph,null,2)+'\n');

          const enc=JSON.parse(fs.readFileSync('data/encyclopedia.json','utf8'));
          const additions={
            ozone:{number:130,description:'3個の酸素原子からなる分子。中央と末端に形式電荷を持つ2つの等価なLewis構造で表せ、結合は共鳴によって平均化している。'},
            nitromethane:{number:131,description:'最小のニトロ化合物。N⁺とO⁻を持つ2つの等価なLewis構造があり、どちらのOを二重結合として描いても同じ分子。'},
            nitrobenzene:{number:132,description:'ベンゼン環にニトロ基が1つ付いた分子。芳香環とニトロ基という2種類の共鳴表現を同時に観察できる。'},
            '2-nitrotoluene':{number:133,description:'トルエンのメチル基の隣にニトロ基が1つ付いた分子。ニトロ置換を段階的に増やす系列の出発点。'},
            '2-4-dinitrotoluene':{number:134,description:'トルエン環の2位と4位にニトロ基を持つ。2つのニトロ基それぞれでN⁺/O⁻と等価な共鳴結合を確認できる。'},
            '2-4-6-trinitrotoluene':{number:135,description:'TNTとして知られる2,4,6-トリニトロトルエン。ここでは用途ではなく、3段階のニトロ置換と各ニトロ基の共鳴構造を扱う。'},
          };
          Object.assign(enc.molecules,additions);fs.writeFileSync('data/encyclopedia.json',JSON.stringify(enc,null,2)+'\n');
          NODE

          cat > tests/resonance-formal-charge.test.mjs <<'TEST'
          import assert from 'node:assert/strict';
          import {readFile,access} from 'node:fs/promises';
          import {performance} from 'node:perf_hooks';
          import {Molecule,setMoleculeDatabase} from '../src/chemistry.js?resonance-test=1';
          import {supportedAtomState,supportedResonanceGroups} from '../src/resonance-model.js?v=1';
          import {bondAddition,atomBondState} from '../src/bonding-model.js?v=31';
          import {evaluateCraftTargetMatch} from '../src/craft-target-match.js';
          import {nextCraftBondHint} from '../src/craft-target-hint.js?v=1';
          import {createMoleculeGraph} from '../src/molecule-graph.js';

          const root=new URL('../',import.meta.url),records=JSON.parse(await readFile(new URL('data/molecules.json',root),'utf8'));setMoleculeDatabase(records);
          assert.equal(records.length,135);
          const byId=id=>records.find(record=>record.id===id);
          const build=(record)=>{const m=new Molecule(),ids=record.atoms.map(el=>m.addAtom(el).id);for(const[a,b,o]of record.bonds)m.setBond(ids[a],ids[b],o);return{m,ids};};
          const alternate=record=>{const copy=structuredClone(record);for(const group of copy.resonanceGroups??[]){const edges=copy.bonds.filter(b=>b[0]===group.center&&group.ends.includes(b[1])||b[1]===group.center&&group.ends.includes(b[0]));assert.equal(edges.length,2);[edges[0][2],edges[1][2]]=[edges[1][2],edges[0][2]];}return copy;};
          const precursor=record=>{const copy=structuredClone(record);for(const group of copy.resonanceGroups??[])for(const bond of copy.bonds)if((bond[0]===group.center&&group.ends.includes(bond[1]))||(bond[1]===group.center&&group.ends.includes(bond[0])))bond[2]=1;return copy;};

          for(const id of ['ozone','nitromethane']){
            const record=byId(id),other=alternate(record),built=build(other);
            assert.equal(built.m.recognizedMolecule()?.id,id,`${id} alternate resonance recognition`);
            assert.equal(built.m.validation().level,'ok',`${id} charged resonance validation`);
            assert.equal(evaluateCraftTargetMatch(record,other)?.percent,100,`${id} resonance Target Match`);
            const groups=supportedResonanceGroups(built.m);assert.ok(groups.length>=1,`${id} supported resonance group`);
            const group=groups[0],center=atomBondState(built.m,group.center),negative=atomBondState(built.m,group.negative);
            assert.equal(center.charge,1);assert.equal(negative.charge,-1);assert.equal(negative.pairs,3);
            const pre=precursor(record),hint=nextCraftBondHint(record,pre,{stats:{}});assert.ok(hint,`${id} resonance completion hint`);assert.equal(hint.nextOrder,2);
            const [left,right]=hint.workspaceIndices.map(index=>pre.atoms[index]);assert.ok([left,right].every(el=>el==='O')||[left,right].sort().join('')==='NO',`${id} hint must target resonance bond`);
          }

          const nitro=byId('nitromethane'),pre=precursor(nitro),builtPre=build(pre),group=nitro.resonanceGroups[0],nId=builtPre.ids[group.center],oId=builtPre.ids[group.ends[0]];
          assert.deepEqual(bondAddition(builtPre.m,nId,oId),{allowed:true,order:2,kind:'extension'},'nitro precursor may complete supported resonance without widening N valence globally');

          const nitrobenzene=byId('nitrobenzene');assert.equal(build(nitrobenzene).m.recognizedMolecule()?.id,'nitrobenzene');assert.equal(build(alternate(nitrobenzene)).m.recognizedMolecule()?.id,'nitrobenzene');
          for(const record of records.slice(0,129))assert.equal(build(record).m.recognizedMolecule()?.id,record.id,`legacy recognition changed: ${record.id}`);

          const tnt=byId('2-4-6-trinitrotoluene'),tntPre=precursor(tnt),stats={},started=performance.now(),tntHint=nextCraftBondHint(tnt,tntPre,{stats}),elapsed=performance.now()-started;
          assert.ok(tntHint,'TNT precursor should produce a next-bond hint');assert.ok(elapsed<1000,`TNT hint took ${elapsed.toFixed(1)}ms`);assert.ok((stats.recursiveVisits??0)<200000,`TNT hint search exploded: ${JSON.stringify(stats)}`);
          console.log('TNT_HINT_PROFILE',JSON.stringify({elapsedMs:Number(elapsed.toFixed(2)),...stats}));

          const rawGraph=JSON.parse(await readFile(new URL('data/molecule-graph.json',root),'utf8')),graph=createMoleculeGraph(rawGraph);assert.equal(graph.nodes.length,135);
          const relation=(a,b)=>graph.edges.find(e=>e.from===a&&e.to===b||e.from===b&&e.to===a);
          for(const[a,b]of [['oxygen','ozone'],['methane','nitromethane'],['benzene','nitrobenzene'],['toluene','2-nitrotoluene'],['2-nitrotoluene','2-4-dinitrotoluene'],['2-4-dinitrotoluene','2-4-6-trinitrotoluene']])assert.ok(relation(a,b),`missing Graph edge ${a} -> ${b}`);
          assert.equal(graph.relationCodes[relation('oxygen','ozone').relationCode],'oxygenation');
          for(const[a,b]of [['methane','nitromethane'],['benzene','nitrobenzene'],['toluene','2-nitrotoluene'],['2-nitrotoluene','2-4-dinitrotoluene'],['2-4-dinitrotoluene','2-4-6-trinitrotoluene']])assert.equal(graph.relationCodes[relation(a,b).relationCode],'substitution');
          assert.equal(relation('toluene','2-4-6-trinitrotoluene'),undefined,'TNT must not shortcut directly from toluene');
          const seen=new Set(graph.roots),queue=[...graph.roots];while(queue.length){for(const next of graph.getNeighbors(queue.shift()))if(!seen.has(next)){seen.add(next);queue.push(next);}}assert.equal(seen.size,graph.nodes.length,'all Graph nodes must remain reachable');
          for(const id of ['ozone','nitromethane','nitrobenzene','2-nitrotoluene','2-4-dinitrotoluene','2-4-6-trinitrotoluene']){const svg=await readFile(new URL(`assets/models/molecule-${id}.svg`,root),'utf8');assert.match(svg,/[+−]/,`${id} asset must show formal charge`);}
          console.log('Resonance/formal-charge foundation passed: equivalence, validation, Target Match/hint, Graph reachability and charged assets.');
          TEST

          node scripts/build-collection-assets.mjs
          node scripts/export-molecule-graph.mjs
          node scripts/build-precache.mjs
      - name: Run targeted regressions
        run: |
          node tests/resonance-formal-charge.test.mjs
          node tests/recognition.test.mjs
