name: Apply SHOCK unit foundation

on:
  push:
    branches: [work/shock-unit-charge-foundation]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply production and regression changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              actual=text.count(old)
              if actual!=count:
                  raise SystemExit(f'{path}: expected {count} matches, got {actual}: {old[:100]!r}')
              p.write_text(text.replace(old,new,count))

          # Molecule-role authority: only Nitromethane and TNT are SHOCK materials.
          patch('src/veil/molecule-roles.js','export const ROLE_BALANCE_VERSION=3;','export const ROLE_BALANCE_VERSION=4;')
          patch('src/veil/molecule-roles.js',"  oxygen:profile(['oxidizer'],{\n    oxidizer:Object.freeze({capacity:36,oxidizingPower:1.00}),\n  }),", "  nitromethane:profile(['shock'],{\n    shock:Object.freeze({capacity:3,radiusScale:1.00,knockbackScale:1.00,interruptScale:1.00}),\n  }),\n  '2-4-6-trinitrotoluene':profile(['shock'],{\n    shock:Object.freeze({capacity:2,radiusScale:1.45,knockbackScale:1.60,interruptScale:1.45}),\n  }),\n  oxygen:profile(['oxidizer'],{\n    oxidizer:Object.freeze({capacity:36,oxidizingPower:1.00}),\n  }),")
          patch('src/veil/molecule-roles.js',"export const ACTIVE_TANK_ROLES=Object.freeze(['propellant','fuel','oxidizer','coolant']);","export const ACTIVE_TANK_ROLES=Object.freeze(['propellant','fuel','oxidizer','coolant','shock']);")

          # Existing carried-resource / auto-synthesis architecture owns SHOCK too.
          patch('src/veil/growth.js',"  coolant:{label:'冷却剤'},\n});","  coolant:{label:'冷却剤'},\n  shock:{label:'SHOCK'},\n});")

          # Current schema-v8 saves predate SHOCK. Add only the missing role slots;
          # do not weaken validation or cross the existing pre-v8 hard boundary.
          patch('src/veil/resources-persistence.js',"const validSelectedLoadout=x=>x&&Object.keys(TANK_USES).every(use=>Object.hasOwn(x,use)&&(x[use]===null||validId(x[use])));", "const validSelectedLoadout=x=>x&&Object.keys(TANK_USES).every(use=>Object.hasOwn(x,use)&&(x[use]===null||validId(x[use])));\nexport function normalizeCurrentTankRoles(state){\n  if(!state||state.schemaVersion!==SCHEMA_VERSION||!state.tanks||typeof state.tanks!=='object')return false;let changed=false;\n  for(const [use,tank] of Object.entries(createInitialTanks()))if(!Object.hasOwn(state.tanks,use)){state.tanks[use]=tank;changed=true;}\n  if(state.loadout?.tanks&&typeof state.loadout.tanks==='object')for(const use of Object.keys(TANK_USES))if(!Object.hasOwn(state.loadout.tanks,use)){state.loadout.tanks[use]=null;changed=true;}\n  return changed;\n}")
          patch('src/veil/resources-persistence.js',"function parsePersistedResources(raw){return validatePersistedState(parseResourceEnvelope(raw));}","function parsePersistedResources(raw){const state=parseResourceEnvelope(raw);normalizeCurrentTankRoles(state);return validatePersistedState(state);}")
          patch('src/veil/resources-persistence.js',"export function migrateResourcesSave(raw){try{const persisted=parseResourceEnvelope(raw);if(persisted.schemaVersion!==SCHEMA_VERSION)return createInitialResourcesState();const state=validatePersistedState(persisted);normalizeLegacyExpeditionDestination(state);return state;}catch{return createInitialResourcesState();}}", "export function migrateResourcesSave(raw){try{const persisted=parseResourceEnvelope(raw);if(persisted.schemaVersion!==SCHEMA_VERSION)return createInitialResourcesState();normalizeCurrentTankRoles(persisted);const state=validatePersistedState(persisted);normalizeLegacyExpeditionDestination(state);return state;}catch{return createInitialResourcesState();}}")
          patch('src/veil/resources-persistence.js',"let persisted=validatePersistedState(envelope);if(persisted.pendingReset)","const normalizedRoles=normalizeCurrentTankRoles(envelope);let persisted=validatePersistedState(envelope);if(persisted.pendingReset)")
          patch('src/veil/resources-persistence.js',"if(normalizeLegacyExpeditionDestination(persisted)){const normalized=serializeResourcesState(persisted);", "if(normalizedRoles||normalizeLegacyExpeditionDestination(persisted)){const normalized=serializeResourcesState(persisted);")

          # Sanitize stale/unsupported selected roles at the application authority and
          # carry the committed SHOCK slot into expedition preparation.
          patch('src/veil/resources.js',"  function selectedLoadout(){return {...initialSelectedLoadout(),...(state.loadout?.tanks??{})};}", "  function selectedLoadout(){const selected={...initialSelectedLoadout(),...(state.loadout?.tanks??{})};for(const use of Object.keys(TANK_USES)){const id=selected[use];if(id!==null&&(!state.recipes.includes(id)||!fitsTank(id,use)))selected[use]=null;}return selected;}")
          patch('src/veil/resources.js',"return {propellant:entry('propellant'),fuel:entry('fuel'),oxidizer:entry('oxidizer'),coolant:entry('coolant')};},", "return {propellant:entry('propellant'),fuel:entry('fuel'),oxidizer:entry('oxidizer'),coolant:entry('coolant'),shock:entry('shock')};},")

          # Stable SHOCK contract for FIELD today and Core later.
          Path('src/veil/shock.js').write_text("""import {performanceFor} from './molecule-roles.js';

export const SHOCK_MATERIAL_IDS=Object.freeze(['nitromethane','2-4-6-trinitrotoluene']);
export const SHOCK_BASE_IMPULSE=Object.freeze({radius:260,knockback:270,interruptSeconds:.75});

export function shockProfileFor(id){
  const performance=performanceFor(id,'shock');if(!performance)return null;
  return Object.freeze({
    material:id,capacity:performance.capacity,
    radiusScale:performance.radiusScale,knockbackScale:performance.knockbackScale,interruptScale:performance.interruptScale,
    radius:SHOCK_BASE_IMPULSE.radius*performance.radiusScale,
    knockback:SHOCK_BASE_IMPULSE.knockback*performance.knockbackScale,
    interruptSeconds:SHOCK_BASE_IMPULSE.interruptSeconds*performance.interruptScale,
  });
}
export const shockMaterial=run=>run?.fuel?.shock?.molecule??null;
export const shockCharges=run=>Math.max(0,Number(run?.fuel?.shock?.amount)||0);
export const shockStrength=run=>shockProfileFor(shockMaterial(run));
export const canShock=run=>!!run&&!run.captured&&!!shockStrength(run)&&shockCharges(run)>=1;
export function consumeShockCharge(run,consume=()=>true){
  if(!canShock(run))return false;const slot=run.fuel.shock,material=slot.molecule,strength=shockProfileFor(material);
  if(typeof consume==='function'&&consume(material,1)===false)return false;
  slot.amount-=1;return Object.freeze({material,remaining:slot.amount,capacity:strength.capacity,strength});
}
""")

          # Engine: independent run-local charge, radial pressure wave, Dust Eater
          # repel/interrupt only. No HP, damage, kill or hazard taxonomy coupling.
          patch('src/veil/engine.js',"import { combustionChargeFor,performanceFor } from './molecule-roles.js';", "import { combustionChargeFor,performanceFor } from './molecule-roles.js';\nimport {consumeShockCharge,shockStrength} from './shock.js';")
          patch('src/veil/engine.js',"export function setCombustionHeld(run,held){if(!run||run.captured)return false;run.driveHeld=!!held;if(!held)run.player.combustion=false;return run.driveHeld;}", "export function beginShock(run,consume){\n  const spent=consumeShockCharge(run,consume);if(!spent)return false;const {material,remaining,strength}=spent,p=run.player;let affected=0;\n  for(const eater of run.eaters??[]){const dx=eater.x-p.x,dy=eater.y-p.y,distance=Math.hypot(dx,dy);if(distance>strength.radius)continue;const angle=distance>1e-6?Math.atan2(dy,dx):(eater.phase??0),falloff=.55+.45*(1-Math.min(1,distance/strength.radius)),nx=Math.cos(angle),ny=Math.sin(angle),impulse=strength.knockback*falloff;eater.vx=(eater.vx??0)+nx*impulse;eater.vy=(eater.vy??0)+ny*impulse;eater.x+=nx*impulse*.12;eater.y+=ny*impulse*.12;eater.interrupt=Math.max(eater.interrupt??0,strength.interruptSeconds*falloff);affected++;}\n  run.shockWaves.push({x:p.x,y:p.y,life:0,duration:.44,radius:strength.radius,material,strength});if(run.telemetry){run.telemetry.shockUses=(run.telemetry.shockUses??0)+1;recordFuelUse(run.telemetry,'shock',material,1);}\n  const event={type:'shock',material,remaining,affected,radius:strength.radius,knockback:strength.knockback,interruptSeconds:strength.interruptSeconds};run.events.push(event);return event;\n}\n\nexport function setCombustionHeld(run,held){if(!run||run.captured)return false;run.driveHeld=!!held;if(!held)run.player.combustion=false;return run.driveHeld;}")
          patch('src/veil/engine.js',"const loadout={propellant:entry('propellant','hydrogen'),fuel:entry('fuel','methane'),oxidizer:entry('oxidizer','oxygen'),coolant:entry('coolant',null)};", "const loadout={propellant:entry('propellant','hydrogen'),fuel:entry('fuel','methane'),oxidizer:entry('oxidizer','oxygen'),coolant:entry('coolant',null),shock:entry('shock',null)};")
          patch('src/veil/engine.js',"region:'veil',effects:[],events:[],denseUntil:0", "region:'veil',effects:[],shockWaves:[],events:[],denseUntil:0")
          patch('src/veil/engine.js',"  for(const eater of run.eaters){\n    let sx=0,sy=0;", "  for(const eater of run.eaters){\n    if((eater.interrupt??0)>0){eater.interrupt=Math.max(0,eater.interrupt-dt);const drag=Math.exp(-dt*1.15),margin=EXPEDITION.eaterSpawnDistance+100;eater.vx=(eater.vx??0)*drag;eater.vy=(eater.vy??0)*drag;eater.x=clamp(eater.x+eater.vx*dt,run.config.bounds.left-margin,run.config.bounds.right+margin);eater.y=clamp(eater.y+eater.vy*dt,run.config.bounds.top-margin,run.config.bounds.bottom+margin);eater.trail.push({x:eater.x,y:eater.y});if(eater.trail.length>20)eater.trail.shift();continue;}\n    let sx=0,sy=0;")
          patch('src/veil/engine.js',"  run.effects=run.effects.filter(e=>e.life<e.duration);p.trail.push({x:p.x,y:p.y});if(p.trail.length>28)p.trail.shift();updateEaters(run,dt);recordExpeditionFrame(run,dt);return run.events;", "  run.effects=run.effects.filter(e=>e.life<e.duration);for(const wave of run.shockWaves)wave.life+=dt;run.shockWaves=run.shockWaves.filter(wave=>wave.life<wave.duration);p.trail.push({x:p.x,y:p.y});if(p.trail.length>28)p.trail.shift();updateEaters(run,dt);recordExpeditionFrame(run,dt);return run.events;")

          patch('src/veil/expedition-run.js',"export {beginBurst,setCombustionHeld} from './engine.js';", "export {beginBurst,beginShock,setCombustionHeld} from './engine.js';")

          # Telemetry sees SHOCK as an independent carried slot.
          patch('src/veil/telemetry.js',"const slots=Object.fromEntries(['propellant','fuel','oxidizer','coolant'].map", "const slots=Object.fromEntries(['propellant','fuel','oxidizer','coolant','shock'].map")
          patch('src/veil/telemetry.js',"burstUses:0,combustionSeconds:0", "burstUses:0,shockUses:0,combustionSeconds:0")
          patch('src/veil/telemetry.js',"fuelUsed:{...t.fuelUsed},burstUses:t.burstUses,combustionSeconds", "fuelUsed:{...t.fuelUsed},burstUses:t.burstUses,shockUses:t.shockUses,combustionSeconds")

          # LOADOUT comparison keeps the existing visual language: charge pips plus
          # compact range/repel/interrupt bars and one safe chemistry role cue.
          patch('src/veil/loadout-preview.js',"export function coolantPreviewValues(id){const coolant=performanceFor(id,'coolant');if(!coolant)return null;return Object.freeze({cooling:clamp01(coolant.coolingPower/1.9),endurance:clamp01(coolant.durationFactor/3.2),thermalMargin:clamp01(coolant.environmentTolerance/1.75),coolingPower:coolant.coolingPower,durationFactor:coolant.durationFactor,environmentTolerance:coolant.environmentTolerance});}\nexport function loadoutPreviewValues(use,id,context={}){if(use==='propellant')return propellantPreviewValues(id,{amount:context.amount});if(use==='fuel')return fuelPreviewValues(id,{fuelAmount:context.amount,oxygenAmount:context.oxygenAmount,coolantId:context.coolantId});if(use==='oxidizer')return oxidizerPreviewValues(id);if(use==='coolant')return coolantPreviewValues(id);return null;}", "export function coolantPreviewValues(id){const coolant=performanceFor(id,'coolant');if(!coolant)return null;return Object.freeze({cooling:clamp01(coolant.coolingPower/1.9),endurance:clamp01(coolant.durationFactor/3.2),thermalMargin:clamp01(coolant.environmentTolerance/1.75),coolingPower:coolant.coolingPower,durationFactor:coolant.durationFactor,environmentTolerance:coolant.environmentTolerance});}\nexport function shockPreviewValues(id){const shock=performanceFor(id,'shock');if(!shock)return null;return Object.freeze({charges:shock.capacity,range:clamp01(shock.radiusScale/1.45),repel:clamp01(shock.knockbackScale/1.6),interrupt:clamp01(shock.interruptScale/1.45),radiusScale:shock.radiusScale,knockbackScale:shock.knockbackScale,interruptScale:shock.interruptScale});}\nexport function loadoutPreviewValues(use,id,context={}){if(use==='propellant')return propellantPreviewValues(id,{amount:context.amount});if(use==='fuel')return fuelPreviewValues(id,{fuelAmount:context.amount,oxygenAmount:context.oxygenAmount,coolantId:context.coolantId});if(use==='oxidizer')return oxidizerPreviewValues(id);if(use==='coolant')return coolantPreviewValues(id);if(use==='shock')return shockPreviewValues(id);return null;}")
          patch('src/veil/loadout-preview.js',"function renderCoolant(host,candidate,current){const stats=document.createElement('div');stats.append(statRow('冷却',candidate.cooling,current?.cooling),statRow('持続',candidate.endurance,current?.endurance),statRow('熱余裕',candidate.thermalMargin,current?.thermalMargin));host.append(stats);}", "function renderCoolant(host,candidate,current){const stats=document.createElement('div');stats.append(statRow('冷却',candidate.cooling,current?.cooling),statRow('持続',candidate.endurance,current?.endurance),statRow('熱余裕',candidate.thermalMargin,current?.thermalMargin));host.append(stats);}\nfunction renderShock(host,candidate,current){const stats=document.createElement('div');stats.append(statRow('範囲',candidate.range,current?.range),statRow('反発',candidate.repel,current?.repel),statRow('中断',candidate.interrupt,current?.interrupt));const charges=document.createElement('div');charges.append(chargeRow(candidate.charges,{label:'CHARGE'}));const cue=document.createElement('p');cue.className='loadout-role-cue';cue.textContent='急速分解 → PRESSURE PULSE';host.append(stats,charges,cue);}")
          patch('src/veil/loadout-preview.js',"else if(use==='coolant')renderCoolant(host,candidate,current);return {candidate,current};}", "else if(use==='coolant')renderCoolant(host,candidate,current);else if(use==='shock')renderShock(host,candidate,current);return {candidate,current};}")

          patch('src/veil/supply.js',"export function tankMeterSegments(use,moleculeId){\n  if(use!=='propellant')return 0;const performance=performanceFor(moleculeId,'propellant');return performance?.moleculesPerBurst?Math.floor(performance.capacity/performance.moleculesPerBurst):0;\n}", "export function tankMeterSegments(use,moleculeId){\n  if(use==='shock')return performanceFor(moleculeId,'shock')?.capacity??0;if(use!=='propellant')return 0;const performance=performanceFor(moleculeId,'propellant');return performance?.moleculesPerBurst?Math.floor(performance.capacity/performance.moleculesPerBurst):0;\n}")

          # Independent one-cell SHOCK module in the collector shell schematic.
          patch('src/veil/loadout-workstation.js',"const SLOT_USES=['propellant','fuel','oxidizer','coolant'];", "const SLOT_USES=['propellant','shock','fuel','oxidizer','coolant'];")
          patch('src/veil/loadout-workstation.js',"const PULSE_SLOT_FRAME=Object.freeze({width:10.9,top:38.5,height:27.0});\nconst DRIVE_SLOT_FRAME", "const PULSE_SLOT_FRAME=Object.freeze({width:10.9,top:38.5,height:27.0});\nconst SHOCK_SLOT_FRAME=Object.freeze({width:15.0,top:11.0,height:18.0});\nconst DRIVE_SLOT_FRAME")
          patch('src/veil/loadout-workstation.js',"export const LOADOUT_LABELS=Object.freeze({propellant:'PULSE',fuel:'FUEL',oxidizer:'O₂',coolant:'COOLANT'});", "export const LOADOUT_LABELS=Object.freeze({propellant:'PULSE',shock:'SHOCK',fuel:'FUEL',oxidizer:'O₂',coolant:'COOLANT'});")
          patch('src/veil/loadout-workstation.js',"  propellant:slotGeometry(16.05,PULSE_SLOT_FRAME),\n  fuel:", "  propellant:slotGeometry(16.05,PULSE_SLOT_FRAME),\n  shock:slotGeometry(39.00,SHOCK_SLOT_FRAME),\n  fuel:")
          patch('src/veil/loadout-workstation.js',"const fuelX=Math.round(centerX('fuel')*10),oxidizerX=Math.round(centerX('oxidizer')*10),coolantX=Math.round(centerX('coolant')*10),pulseX=Math.round(centerX('propellant')*10);", "const fuelX=Math.round(centerX('fuel')*10),oxidizerX=Math.round(centerX('oxidizer')*10),coolantX=Math.round(centerX('coolant')*10),pulseX=Math.round(centerX('propellant')*10),shockX=Math.round(centerX('shock')*10);")
          patch('src/veil/loadout-workstation.js',"  const drive=svgElement('path',{class:'loadout-schematic-path',d:`M455 104 H493 V54 H${coolantX}`});\n  const branches", "  const drive=svgElement('path',{class:'loadout-schematic-path',d:`M455 104 H493 V54 H${coolantX}`});\n  const shock=svgElement('path',{class:'loadout-schematic-path',d:`M390 74 V58`});\n  const branches")
          patch('src/veil/loadout-workstation.js',"  svg.append(pulse,drive,branches);", "  svg.append(pulse,drive,shock,branches);")
          patch('src/veil/loadout-workstation.js',"[[325,104],[pulseX,73],[455,104],[493,54],[fuelX,73],[oxidizerX,73],[coolantX,73]]", "[[325,104],[pulseX,73],[390,74],[shockX,58],[455,104],[493,54],[fuelX,73],[oxidizerX,73],[coolantX,73]]")
          patch('src/veil/loadout-workstation.js',"    ['loadout-callout-label loadout-pulse-label','PULSE'],\n    ['loadout-callout-label loadout-drive-label','DRIVE'],", "    ['loadout-callout-label loadout-pulse-label','PULSE'],\n    ['loadout-callout-label loadout-shock-label','SHOCK'],\n    ['loadout-callout-label loadout-drive-label','DRIVE'],")
          patch('src/veil/loadout-workstation.js',"for(const [use,className] of [['propellant','loadout-pulse-label'],['fuel'", "for(const [use,className] of [['propellant','loadout-pulse-label'],['shock','loadout-shock-label'],['fuel'")
          patch('src/veil/loadout-workstation.js',"#supply-dialog .collector-shell-map:has(#shell-propellant[data-active=true]) .loadout-slot-path[data-use='propellant'],#supply-dialog .collector-shell-map:has(#shell-fuel", "#supply-dialog .collector-shell-map:has(#shell-propellant[data-active=true]) .loadout-slot-path[data-use='propellant'],#supply-dialog .collector-shell-map:has(#shell-shock[data-active=true]) .loadout-slot-path[data-use='shock'],#supply-dialog .collector-shell-map:has(#shell-fuel")
          patch('src/veil/loadout-workstation.js',"#supply-dialog .loadout-pulse-label{left:var(--slot-label-x,15.05%);top:22px;transform:translateX(-50%)}\n#supply-dialog .loadout-drive-label", "#supply-dialog .loadout-pulse-label{left:var(--slot-label-x,15.05%);top:22px;transform:translateX(-50%)}\n#supply-dialog .loadout-shock-label{left:var(--slot-label-x,39%);top:3px;transform:translateX(-50%);font-size:10px;letter-spacing:.12em}\n#supply-dialog .loadout-drive-label")
          patch('src/veil/loadout-workstation.js',"#supply-dialog .shell-port .tank-scale{display:none!important}\n#supply-dialog .loadout-molecule-pod", "#supply-dialog .shell-port .tank-scale{display:none!important}\n#supply-dialog #shell-shock{border:1px solid #75cbd6a8!important;border-radius:50%!important;background:radial-gradient(circle,#28586655 0 28%,#112b3888 31% 55%,transparent 58%)!important;box-shadow:0 0 10px #66dce42c!important}\n#supply-dialog #shell-shock:before,#supply-dialog #shell-shock:after{content:'';position:absolute;border:1px solid #8de5eb75;border-radius:50%;pointer-events:none}#supply-dialog #shell-shock:before{inset:16%}#supply-dialog #shell-shock:after{inset:31%;border-color:#c9f5f7aa}\n#supply-dialog #shell-shock>.loadout-molecule-pod{top:50%;width:76%;height:34px;transform:translate(-50%,-50%)}\n#supply-dialog .loadout-molecule-pod")
          patch('src/veil/loadout-workstation.js',"#supply-dialog .tank-comparison .loadout-charges i{", "#supply-dialog .tank-comparison .loadout-role-cue{margin:5px 0 0;color:#79aab8;font-size:9px;letter-spacing:.06em}\n#supply-dialog .tank-comparison .loadout-charges i{")

          # HTML: one SHOCK cell in LOADOUT and one independent FIELD input.
          patch('index.html',"      <button id=\"shell-propellant\" class=\"shell-port port-propellant\" data-tank-role=\"propellant\" type=\"button\" aria-pressed=\"true\"><i aria-hidden=\"true\"></i><span>噴射剤</span><small>—</small></button>\n      <button id=\"shell-fuel\"", "      <button id=\"shell-propellant\" class=\"shell-port port-propellant\" data-tank-role=\"propellant\" type=\"button\" aria-pressed=\"true\"><i aria-hidden=\"true\"></i><span>噴射剤</span><small>—</small></button>\n      <button id=\"shell-shock\" class=\"shell-port port-shock\" data-tank-role=\"shock\" type=\"button\" aria-pressed=\"false\"><i aria-hidden=\"true\"></i><span>SHOCK</span><small>—</small></button>\n      <button id=\"shell-fuel\"")
          patch('index.html',"<div class=\"veil-drive-control\"><div id=\"veil-thermal\"", "<div class=\"veil-drive-control\"><button id=\"veil-shock\" type=\"button\" aria-label=\"SHOCK UNIT。自機中心のpressure pulse。キーボードはE\" hidden><strong>—</strong><small>SHOCK <span id=\"veil-shock-count\">0 / 0</span></small></button><div id=\"veil-thermal\"")

          # FIELD HUD: compact independent one-hand SHOCK button.
          patch('veil.css',".veil-drive-control{display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}", ".veil-drive-control{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}")
          patch('veil.css',"#veil-combustion{width:132px;min-height:64px;", "#veil-shock{position:absolute;right:0;bottom:calc(100% + 10px);width:76px;min-height:58px;border:1px solid #72c9d58c;border-radius:18px;color:#d8f7f8;background:radial-gradient(circle at 50% 42%,#315e6970,#102735dd 68%);pointer-events:auto;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 0 20px #5ed6df24}#veil-shock strong{font-size:11px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#veil-shock small{font-size:8px;letter-spacing:.5px;color:#8fd3db;white-space:nowrap}#veil-shock[aria-disabled=true]{opacity:.42;box-shadow:none}#veil-shock.shocking{border-color:#d4fbff;box-shadow:0 0 30px #91f5ff66}\n#veil-combustion{width:132px;min-height:64px;")
          patch('veil.css',"@media(max-width:370px){.veil-chain-block{display:none}", "@media(max-width:370px){#veil-shock{width:68px;min-height:54px;bottom:calc(100% + 7px)}.veil-chain-block{display:none}")
          patch('veil.css',"@media(max-height:500px){#veil-combustion", "@media(max-height:500px){#veil-shock{right:calc(100% + 7px);bottom:0;width:66px;min-height:50px}#veil-combustion")

          # FIELD UI wires SHOCK to its own authority and input. It does not touch
          # PULSE, DRIVE, O2 or coolant resources.
