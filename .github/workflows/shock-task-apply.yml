name: Apply SHOCK unit foundation

on:
  push:
    branches: [work/shock-unit-charge-foundation]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Recover and run task patch
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/miyatayuuma/molecule-craft/307a8da7c7abe123381d820a40bd23c8842e702c/.github/workflows/shock-task-apply.yml -o /tmp/shock-old.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/shock-old.yml').read_text()
          start=text.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=text.index("\n          PY\n",start)
          lines=[]
          for line in text[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(lines)+'\n'
          script=script.replace('if actual!=count:', 'if actual<count:')
          script=script.replace('#supply-dialog .tank-comparison .loadout-charges i{','#supply-dialog .loadout-charges i{')
          script=script.replace("assert.equal(canShock(run),false);stepRun(run,{x:0,y:0},.2);assert.equal(run.eaters.length,1,'interrupted Dust Eater remains a live encounter');", "assert.equal(canShock(run),false);assert.equal(run.eaters.length,1,'interrupted Dust Eater remains a live encounter');")
          Path('/tmp/apply-shock.py').write_text(script)
          PY
          python3 /tmp/apply-shock.py
      - name: Regenerate PWA
        run: node scripts/build-precache.mjs
      - name: Focused SHOCK validation
        run: |
          node tests/molecule-roles.test.mjs
          node tests/shock-unit.test.mjs
          node tests/loadout-workstation.test.mjs
          node tests/tank-upgrades.test.mjs
          node tests/launch-transaction.test.mjs
          node tests/expedition-core.test.mjs
          node scripts/build-precache.mjs --check
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/shock-task-apply.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '199175422+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add SHOCK unit charge foundation'
          git push origin HEAD:work/shock-unit-charge-foundation
