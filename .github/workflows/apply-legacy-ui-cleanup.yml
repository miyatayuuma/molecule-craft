name: apply-legacy-ui-cleanup
on:
  push:
    branches: [cleanup/legacy-ui]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply legacy UI cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html'); s=p.read_text()
          s=s.replace('<div class="resource-bar"><button id="open-supply" class="collector-access" type="button" aria-label="収集殻とタンクを開く"><img src="./assets/collector-shell.png" alt="" aria-hidden="true"><span>収集殻</span></button></div>', '<div class="resource-bar"><button id="open-supply" class="collector-access" type="button" aria-label="収集殻とタンクを開く"><span>収集殻</span></button></div>')
          s=s.replace('    <section id="cho-completion" class="cho-completion" aria-labelledby="cho-completion-title" hidden><h2 id="cho-completion-title">CHO探索クリア</h2><button id="cho-continue" type="button">↗ 探索</button></section>\n','')
          s=s.replace('<small id="discovery-learning" hidden></small>','')
          s=s.replace('./src/app.js?v=49','./src/app.js?v=50',1)
          p.write_text(s)

          p=Path('src/veil/ui.js'); s=p.read_text()
          s=s.replace("    updatePrompt();q('cho-completion').hidden=!resources.state.progress.choCompleted;",'    updatePrompt();')
          s=s.replace("  q('cho-continue').addEventListener('click',()=>q('open-supply').click());\n",'')
          s=s.replace("q('cho-continue')?.addEventListener('click',()=>{q('launch-veil').click();});",'')
          s=s.replace("q('cho-continue')?.addEventListener('click',()=>q('launch-veil').click());",'')
          p.write_text(s)

          p=Path('veil.css'); s=p.read_text()
          s=re.sub(r'\.cho-completion(?:\s+[^{,]+)?\{[^}]*\}','',s)
          s=s.replace('.cho-completion[hidden],.cho-goal-action[hidden]{display:none}','.cho-goal-action[hidden]{display:none}')
          p.write_text(s)

          p=Path('tests/source-contracts.test.mjs'); s=p.read_text()
          s=s.replace('src/app.js?v=49','src/app.js?v=50')
          s=s.replace(r'app\.js\?v=49',r'app\.js\?v=50')
          marker='assert.match(index, /data-molecule-craft-shell="2"/);'
          add='\nassert.doesNotMatch(index, /id="cho-completion"|id="cho-continue"|CHO探索クリア/);\nassert.doesNotMatch(index, /<button id="open-supply"[^>]*>\\s*<img[^>]+collector-shell\\.png/);\nassert.doesNotMatch(index, /id="discovery-learning"/);\nassert.doesNotMatch(app, /cho-completion|cho-continue/);'
          if add.strip() not in s:
              if marker not in s: raise SystemExit('source contract marker missing')
              s=s.replace(marker,marker+add,1)
          p.write_text(s)

          p=Path('tests/veil-ui-check.mjs'); s=p.read_text()
          old=("q('veil-return').click();finishReturn();assert.equal(game.run('resources.state.progress.choCompleted'),true);assert.equal(q('cho-completion').hidden,false);assert.match(q('craft-last-run').textContent,/CHO ✓/);\n" +
               "const completedRaw=game.window.localStorage.getItem('molecule-craft.resources.v1');\n" +
               "game=await setup(null,0,completedRaw);assert.equal(q('cho-completion').hidden,false);assert.equal(q('craft-resource-hint').textContent,'');\n" +
               "q('cho-continue').click();assert.equal(q('supply-dialog').open,true);\n" +
               "console.log('CHO production UI passed: physical final arrival, stable return ending, persisted completion and free exploration CTA.');")
          new=("q('veil-return').click();finishReturn();assert.equal(game.run('resources.state.progress.choCompleted'),true);assert.equal(q('cho-completion'),null);assert.match(q('craft-last-run').textContent,/CHO ✓/);\n" +
               "const completedRaw=game.window.localStorage.getItem('molecule-craft.resources.v1');\n" +
               "game=await setup(null,0,completedRaw);assert.equal(q('cho-completion'),null);assert.equal(q('craft-resource-hint').textContent,'');\n" +
               "q('open-supply').click();assert.equal(q('supply-dialog').open,true);\n" +
               "console.log('CHO completion persists without the obsolete completion CTA; the standard exploration entry remains available.');")
          if old not in s: raise SystemExit('veil UI CHO block missing')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/oxygen-routes-browser-check.mjs'); s=p.read_text()
          s=s.replace("  assert.equal(await page.locator('#cho-completion').isVisible(),false);", "  assert.equal(await page.locator('#cho-completion').count(),0);")
          old=("  await page.locator('#veil-return').click();await page.waitForSelector('#cho-completion:not([hidden])');\n" +
               "  assert.match(await page.locator('#craft-last-run').innerText(),/CHO ✓/);\n" +
               "  await page.screenshot({path:'/tmp/molecule-craft-cho-ending.png'});\n" +
               "  await page.reload();await page.waitForSelector('#cho-completion:not([hidden])');\n" +
               "  await page.locator('#cho-continue').click();await page.waitForSelector('#supply-dialog[open]');")
          new=("  await page.locator('#veil-return').click();await page.waitForSelector('#veil-view',{state:'hidden'});\n" +
               "  assert.match(await page.locator('#craft-last-run').innerText(),/CHO ✓/);\n" +
               "  assert.equal(await page.locator('#cho-completion').count(),0);\n" +
               "  await page.screenshot({path:'/tmp/molecule-craft-cho-ending.png'});\n" +
               "  await page.reload();await page.waitForSelector('#open-supply');\n" +
               "  assert.equal(await page.evaluate(()=>JSON.parse(localStorage.getItem('molecule-craft.resources.v1')).progress.choCompleted),true);\n" +
               "  await page.locator('#open-supply').click();await page.waitForSelector('#supply-dialog[open]');")
          if old not in s: raise SystemExit('oxygen browser CHO block missing')
          p.write_text(s.replace(old,new,1))

          for name in ['.github/workflows/audit-legacy-ui.yml','.github/workflows/audit-legacy-ui-trigger.yml']:
              Path(name).unlink(missing_ok=True)
          PY
      - name: Audit remaining dead UI and validate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'id="cho-completion"|id="cho-continue"|CHO探索クリア|id="discovery-learning"' index.html; then exit 1; fi
          if grep -nE "cho-completion|cho-continue" src/veil/ui.js; then exit 1; fi
          if grep -nE '\.cho-completion' veil.css; then exit 1; fi
          if grep -nE '<button id="open-supply"[^>]*><img[^>]+collector-shell\.png' index.html; then exit 1; fi
          node --check src/veil/ui.js
          node tests/source-contracts.test.mjs
          npm install --prefix /tmp/mc-jsdom jsdom@26 >/dev/null
          node tests/mobile-ui-check.mjs /tmp/mc-jsdom/node_modules/jsdom/lib/api.js
          node tests/veil-ui-check.mjs /tmp/mc-jsdom/node_modules/jsdom/lib/api.js
          node scripts/build-precache.mjs
          node tests/pwa.test.mjs
          node scripts/check-repository-hygiene.mjs
          git diff --check
      - name: Commit cleanup
        run: |
          rm .github/workflows/apply-legacy-ui-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete craft and expedition UI remnants"
          git push
