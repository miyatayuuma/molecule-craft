name: Task 5F regenerate molecule assets

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'task-5f-ctfe-electrical-treatment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Audit stale 135-molecule guards
        run: |
          grep -R -n --exclude='precache-manifest.js' --exclude-dir='.git' '135' index.html src tests scripts data .github || true
      - name: Regenerate molecule and graph assets
        run: |
          node scripts/build-collection-assets.mjs
          node scripts/export-molecule-graph.mjs
          node scripts/build-precache.mjs
      - name: Commit generated assets
        run: |
          if git diff --quiet -- assets/models docs/maps/molecule-graph.svg sw.js precache-manifest.js; then
            echo "Generated assets already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models docs/maps/molecule-graph.svg sw.js precache-manifest.js
          git commit -m "Regenerate CTFE molecule assets"
          git push origin HEAD:${{ github.head_ref }}
