name: Frontier element unlock fix

on:
  push:
    branches:
      - fix/frontier-element-unlock-eligibility

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add frontier element unlock patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/frontier-element-unlock-eligibility
          fetch-depth: 0
      - name: Patch frontier eligibility and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          resources=Path('src/veil/resources.js')
          source=resources.read_text()
          old="import { getFrontierCandidates,loadMoleculeGraph,scoreFrontierCandidates,selectFrontierCandidate } from '../molecule-graph.js';\n"
          new=old+"import { availableElements } from '../element-progression.js?v=37';\n"
          if old not in source or "availableElements } from '../element-progression.js?v=37'" in source:
              raise SystemExit('resources import anchor missing or already patched')
          source=source.replace(old,new,1)
          old_line="    const discoveredIds=[...state.recipes],knownRecipeIds=[...new Set([...state.hints,...FRONTIER_RESERVED_IDS])],candidates=getFrontierCandidates(frontierGraph,{discoveredIds,knownRecipeIds});\n    if(!candidates.length){base.reason='no-candidate';return;}\n"
          new_line="    const discoveredIds=[...state.recipes],knownRecipeIds=[...new Set([...state.hints,...FRONTIER_RESERVED_IDS])],graphCandidates=getFrontierCandidates(frontierGraph,{discoveredIds,knownRecipeIds}),unlockedElements=new Set(availableElements(state.recipes.length)),candidates=graphCandidates.filter(candidate=>{const record=records.get(candidate.id);return !!record&&Array.isArray(record.atoms)&&record.atoms.length>0&&record.atoms.every(el=>unlockedElements.has(el)&&(!MANAGED.includes(el)||state.progress.foundElements.includes(el)));});\n    if(!candidates.length){base.reason=graphCandidates.length?'element-locked':'no-candidate';return;}\n"
          if old_line not in source:
              raise SystemExit('frontier candidate anchor missing')
          resources.write_text(source.replace(old_line,new_line,1))

          test=Path('tests/field-frontier-insight.test.mjs')
          source=test.read_text()
          anchor="// Empty frontier is a normal FIELD run: no DB-wide or legacy regional recipe\n"
          if anchor not in source:
              raise SystemExit('field frontier test anchor missing')
          block="""// Graph visibility is broader than FIELD insight eligibility. A direct\n// neighbor that requires an element not yet unlocked by registered-molecule\n// progression stays visible in the Encyclopedia but cannot be selected as a\n// FIELD idea until that element unlocks. Regression: CH3F must wait for F.\n{\n  const value=make({discoverRoots:false});\n  value.setCatalog([{id:'fluoromethane',formula:'CH3F',atoms:['C','H','H','H','F']}]);\n  value.state.progress.foundElements=['H','C','O'];\n  value.state.recipes=['methane'];\n  value.state.hints=graph.nodes.map(node=>node.id).filter(id=>id!=='fluoromethane');\n  value.prepareExpedition({region:'veil',rng:()=>0});\n  let diag=value.frontierInsightDiagnostics();assert.equal(diag.selectedCandidateId,null);assert.equal(diag.reason,'element-locked','F-containing frontier stays ineligible before the 15-registration F unlock');\n  const fillers=graph.nodes.map(node=>node.id).filter(id=>id!=='methane'&&id!=='fluoromethane').slice(0,14);\n  value.state.recipes=['methane',...fillers];\n  value.prepareExpedition({region:'veil',rng:()=>0});\n  diag=value.frontierInsightDiagnostics();assert.equal(diag.selectedCandidateId,'fluoromethane','the same graph frontier becomes eligible once F is unlocked');\n}\n\n"""
          if 'CH3F must wait for F' in source:
              raise SystemExit('regression block already patched')
          test.write_text(source.replace(anchor,block+anchor,1))
          PY
      - name: Focused validation and PWA refresh
        run: |
          node tests/field-frontier-insight.test.mjs
          node tests/molecule-frontier.test.mjs
          node tests/collection.test.mjs
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
          node tests/pwa.test.mjs
          node tests/repository-hygiene.test.mjs
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/veil/resources.js tests/field-frontier-insight.test.mjs precache-manifest.js sw.js
          git commit -m 'Gate frontier ideas by unlocked elements'
          git push origin HEAD:fix/frontier-element-unlock-eligibility
