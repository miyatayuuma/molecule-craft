name: Task 3 Nitrogen finalize generated artifacts

on:
  push:
    branches:
      - task/nitrogen-field-geometry

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: task/nitrogen-field-geometry
          fetch-depth: 0
      - name: Validate focused Nitrogen contracts
        run: |
          node tests/nitrogen-field-integration.test.mjs
          node tests/signal-eligibility.test.mjs
          node tests/nitrogen-field-map.test.mjs
      - name: Regenerate canonical FIELD and PWA artifacts
        run: |
          node scripts/export-field-map.mjs
          node scripts/build-precache.mjs
      - name: Commit generated artifacts if changed
        run: |
          if ! git diff --quiet -- docs/maps/current-field.svg precache-manifest.js sw.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/maps/current-field.svg precache-manifest.js sw.js
            git commit -m "Task 3: regenerate Nitrogen FIELD and PWA artifacts"
            git push origin HEAD:task/nitrogen-field-geometry
          fi
