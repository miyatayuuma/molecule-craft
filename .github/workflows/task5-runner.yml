name: Task 5 branch runner

on:
  push:
    branches:
      - work/task5-cho-field-polish-lock

permissions:
  contents: write

jobs:
  integrated-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply Task 5 cleanup
        id: apply
        shell: bash
        run: |
          if [[ ! -f .github/task5.py ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python .github/task5.py
          rm -f .github/task5.py
          echo "applied=true" >> "$GITHUB_OUTPUT"
      - name: Regenerate developer map
        if: steps.apply.outputs.applied == 'true'
        run: node scripts/export-field-map.mjs
      - name: Integrated CHO FIELD polish regression
        if: steps.apply.outputs.applied == 'true'
        run: |
          node tests/cho-field-polish.test.mjs
          node tests/cho-campaign.test.mjs
          node tests/hc-revisit-routes.test.mjs
          node tests/h-economy-balance.test.mjs
          node tests/oxygen-routes.test.mjs
          node tests/oxygen-thermal-progression.test.mjs
          node tests/deep-oxygen-routes.test.mjs
          node tests/oxygen-field-integration.test.mjs
          node tests/propulsion-differentiation.test.mjs
          node tests/field-frontier-insight.test.mjs
          node tests/expedition-challenges.test.mjs
          node tests/signal-eligibility.test.mjs
          node tests/launch-transaction.test.mjs
          node tests/loadout-launch-regression.test.mjs
          node tests/expedition-core.test.mjs
          node tests/resources-persistence.test.mjs
          node tests/field-map-export.test.mjs
          node tests/pwa.test.mjs
      - name: Freshness and hygiene
        if: steps.apply.outputs.applied == 'true'
        run: |
          node scripts/export-field-map.mjs --check
          node scripts/build-precache.mjs --check
          node scripts/check-repository-hygiene.mjs
          git diff --check
      - name: Commit Task 5 implementation
        if: steps.apply.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lock CHO FIELD polish production baseline"
          git push
