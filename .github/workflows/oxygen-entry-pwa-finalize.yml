name: Oxygen Entry PWA finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-pwa:
    if: github.head_ref == 'field-map-oxygen-entry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Regenerate canonical PWA assets
        run: |
          node scripts/build-precache.mjs
          node scripts/build-precache.mjs --check
      - name: Commit both PWA generated files and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oxygen-entry-pwa-finalize.yml
          git add sw.js precache-manifest.js
          git diff --check
          git commit -m "Refresh Oxygen Entry PWA assets"
          git push origin HEAD:${{ github.head_ref }}
