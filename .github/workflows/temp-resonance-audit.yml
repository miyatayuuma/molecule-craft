name: Temporary resonance audit
on:
  push:
    branches: [feature/resonance-formal-charge-nitro-ozone]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decode graph and generator contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createMoleculeGraph} from './src/molecule-graph.js';
          const raw=JSON.parse(fs.readFileSync('data/molecule-graph.json','utf8')),g=createMoleculeGraph(raw);
          console.log('COUNTS',JSON.stringify({nodes:g.nodes.length,edges:g.edges.length,db:JSON.parse(fs.readFileSync('data/molecules.json')).length}));
          console.log('EDGE_COLUMNS',raw.edgeColumns);
          console.log('RELATIONS',g.relationCodes);
          for(const id of ['oxygen','methane','benzene','toluene','nitrogen','ammonia']){
            console.log('NODE',id,JSON.stringify(g.nodeById(id)));
            console.log('EDGES',id,JSON.stringify(g.edges.filter(e=>e.from===id||e.to===id)));
          }
          console.log('ENC_LAST',Object.entries(JSON.parse(fs.readFileSync('data/encyclopedia.json')).molecules).slice(-5));
          NODE
          sed -n '1,90p' scripts/build-molecule-db.mjs
          sed -n '1,120p' tests/recognition.test.mjs
          sed -n '1,150p' tests/special-bonds-check.mjs
