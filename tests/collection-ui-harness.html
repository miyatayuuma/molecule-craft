<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Collection UI integration test</title><link rel="stylesheet" href="../styles.css?v=20"></head>
<body><main class="app-shell">
  <h1>図鑑UI検証</h1><p>検証用グラフを使う統合テスト。3D操作の実機試験ではありません。本番の保存データは変更しません。</p>
  <div class="game-bar"><div><p id="game-loop-hint"></p><small id="game-save-status"></small></div><button id="open-collection" type="button">図鑑</button></div>
  <section class="panel">
    <div class="palette-tabs" role="tablist" aria-label="クラフト素材"><button type="button" role="tab" data-palette-tab="atoms" aria-selected="true">原子</button><button type="button" role="tab" data-palette-tab="structures" aria-selected="false" tabindex="-1">構造 <small id="craft-count"></small></button></div>
    <div id="element-panel"><p>検証操作：ボタンで既知の正しいグラフを用意します。</p><button id="test-methanol" type="button">メタノールを発見</button><button id="test-skeleton" type="button">C₂H₅骨格を用意</button><button id="test-connect" type="button">OHと骨格を接続</button><button id="test-isomer" type="button">ジメチルエーテルを発見</button></div>
    <div id="craft-panel" hidden><div id="craft-palette" class="craft-palette"></div><p id="craft-empty">未解禁</p></div>
    <p id="test-result" role="status">LOADING</p><p id="test-field"></p>
  </section>
</main>
<dialog id="collection-dialog" aria-labelledby="collection-title"><div class="book-shell">
  <header class="book-header"><div><h2 id="collection-title">分子と構造の図鑑</h2><p id="collection-progress"></p></div><button id="close-collection" type="button">閉じる</button></header>
  <p id="collection-storage" hidden></p><div class="book-tabs" role="tablist"><button type="button" role="tab" data-book-tab="molecules" aria-selected="true">分子</button><button type="button" role="tab" data-book-tab="groups" aria-selected="false" tabindex="-1">官能基・構造</button></div>
  <div id="collection-controls" class="book-controls"><label id="collection-category-label">カテゴリ<select id="collection-category"></select></label><label>表示<select id="collection-filter"><option value="all">すべて</option><option value="found">発見済み</option><option value="missing">未発見</option></select></label></div>
  <div id="collection-list" class="collection-grid"></div><section id="collection-detail" hidden></section><footer class="book-footer"><div id="collection-milestones"></div></footer>
</div></dialog>
<script type="module">
  import {Molecule,setMoleculeDatabase} from '../src/chemistry.js?v=20';
  import {connectedStructures} from '../src/workspace-model.js?v=20';
  import {createCollectionUI} from '../src/collection-ui.js?v=20';
  import {expandCraftStructure} from '../src/craft-structures.js';
  const records=await fetch('../data/molecules.json').then(response=>response.json());setMoleculeDatabase(records);
  const model=new Molecule();let saved=null,carbon=null,port=null;
  const q=id=>document.getElementById(id);
  const storage={getItem:()=>saved,setItem:(_,value)=>{saved=value;}};
  const game=await createCollectionUI({records,storage,onPlace:template=>{
    const result=expandCraftStructure(model,template);port=result.attachments[0].atomId;
    q('test-result').textContent=`配置: ${template.nameJa} · 接続前`;
    q('test-field').textContent=`連結構造 ${connectedStructures(model).length}個（自動接続なし）`;return true;
  }});
  function observe(){
    const result=game.observeStructures(connectedStructures(model));
    q('test-result').textContent=result.events.map(event=>`${event.isNew?'NEW':'REPEAT'} ${event.record.nameEn} ${game.describeEvent(event)}`).join(' / ');
    q('test-field').textContent=`発見 ${game.state.discoveredCount}件 · 部品 ${game.state.unlockedCount}個 · 連結構造 ${connectedStructures(model).length}個`;
  }
  function discover(id){model.clear();const entry=records.find(record=>record.id===id),ids=entry.atoms.map(element=>model.addAtom(element).id);entry.bonds.forEach(([a,b,order])=>model.setBond(ids[a],ids[b],order));observe();}
  q('test-methanol').onclick=()=>discover('methanol');q('test-isomer').onclick=()=>discover('dimethyl-ether');
  q('test-skeleton').onclick=()=>{model.clear();const ids=['C','C','H','H','H','H','H'].map(element=>model.addAtom(element).id);[[0,1],[0,2],[0,3],[0,4],[1,5],[1,6]].forEach(([a,b])=>model.setBond(ids[a],ids[b],1));carbon=ids[1];port=null;q('test-result').textContent='C₂H₅骨格を用意しました。構造タブからOHを配置してください。';};
  q('test-connect').onclick=()=>{if(!carbon||!port){q('test-result').textContent='骨格とOHが必要です';return;}model.setBond(carbon,port,1);observe();};
  q('test-result').textContent='READY · 原子からの発見を検証できます';
</script></body></html>
